services:
  database:
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d postgres"]
      interval: 3s
      timeout: 5s
      retries: 30

  app:
    build:
      context: ..
      dockerfile: docker/Dockerfile
      target: development
    env_file:
      - ../.env
    environment:
      APP_ORIGIN: http://localhost:${REMIX_APP_PORT:-3030}
      ARTIFACTS_OBJECT_STORE_ACCESS_KEY_ID: minioadmin
      ARTIFACTS_OBJECT_STORE_BASE_URL: http://minio:9000
      ARTIFACTS_OBJECT_STORE_BUCKET: packets
      ARTIFACTS_OBJECT_STORE_REGION: us-east-1
      ARTIFACTS_OBJECT_STORE_SECRET_ACCESS_KEY: minioadmin
      CLICKHOUSE_URL: http://default:password@clickhouse:8123
      DATABASE_URL: postgresql://postgres:postgres@database:5432/postgres?schema=public
      DIRECT_URL: postgresql://postgres:postgres@database:5432/postgres?schema=public
      ELECTRIC_ORIGIN: http://electric:3000
      FLOWCORDIA_STUDIO_ENABLED: "1"
      LOGIN_ORIGIN: http://localhost:${REMIX_APP_PORT:-3030}
      PORT: "3030"
      REALTIME_STREAMS_S2_ENDPOINT: http://s2/v1
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      REMIX_APP_PORT: "3030"
    ports:
      - "${REMIX_APP_PORT:-3030}:3030"
      - "8002:8002"
    volumes:
      - ../apps/webapp/app:/triggerdotdev/apps/webapp/app
    depends_on:
      database:
        condition: service_healthy
      redis:
        condition: service_started
      electric:
        condition: service_started
      clickhouse_migrator:
        condition: service_completed_successfully
    command:
      - /bin/sh
      - -c
      - pnpm --filter @trigger.dev/database db:migrate:deploy && pnpm --filter webapp build:server && pnpm --filter webapp build:sentry && exec pnpm --filter webapp dev
    networks:
      - app_network
    restart: unless-stopped
