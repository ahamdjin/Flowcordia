services:
  database:
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d postgres"]
      interval: 3s
      timeout: 5s
      retries: 30

  app:
    build:
      context: ..
      dockerfile: docker/Dockerfile
      target: development
    env_file:
      - ../.env
    environment:
      APP_ORIGIN: http://localhost:${REMIX_APP_PORT:-3030}
      ARTIFACTS_OBJECT_STORE_ACCESS_KEY_ID: minioadmin
      ARTIFACTS_OBJECT_STORE_BASE_URL: http://minio:9000
      ARTIFACTS_OBJECT_STORE_BUCKET: packets
      ARTIFACTS_OBJECT_STORE_REGION: us-east-1
      ARTIFACTS_OBJECT_STORE_SECRET_ACCESS_KEY: minioadmin
      CLICKHOUSE_URL: http://default:password@clickhouse:8123
      DATABASE_URL: postgresql://postgres:postgres@database:5432/postgres?schema=public
      DIRECT_URL: postgresql://postgres:postgres@database:5432/postgres?schema=public
      ELECTRIC_ORIGIN: http://electric:3000
      FLOWCORDIA_STUDIO_ENABLED: "1"
      LOGIN_ORIGIN: http://localhost:${REMIX_APP_PORT:-3030}
      PORT: "3030"
      REALTIME_STREAMS_S2_ENDPOINT: http://s2/v1
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      REMIX_APP_PORT: "3030"
    ports:
      - "${REMIX_APP_PORT:-3030}:3030"
      - "8002:8002"
    volumes:
      - ../apps/webapp/app:/triggerdotdev/apps/webapp/app
    depends_on:
      database:
        condition: service_healthy
      redis:
        condition: service_started
      electric:
        condition: service_started
      clickhouse_migrator:
        condition: service_completed_successfully
    command:
      - /bin/sh
      - -c
      - pnpm --filter @trigger.dev/database db:migrate:deploy && pnpm --filter webapp build:server && pnpm --filter webapp build:sentry && exec pnpm --filter webapp dev
    networks:
      - app_network
    restart: unless-stopped

  studio-builder:
    build:
      context: ..
      dockerfile: docker/Dockerfile
      target: development
    environment:
      ARTIFACTS_OBJECT_STORE_ACCESS_KEY_ID: minioadmin
      ARTIFACTS_OBJECT_STORE_BASE_URL: http://minio:9000
      ARTIFACTS_OBJECT_STORE_BUCKET: packets
      ARTIFACTS_OBJECT_STORE_REGION: us-east-1
      ARTIFACTS_OBJECT_STORE_SECRET_ACCESS_KEY: minioadmin
      DATABASE_URL: postgresql://postgres:postgres@database:5432/postgres?schema=public
      DEPLOY_REGISTRY_HOST: ${DEPLOY_REGISTRY_HOST:-localhost:5000}
      DEPLOY_REGISTRY_PASSWORD: ${DEPLOY_REGISTRY_PASSWORD:-password}
      DEPLOY_REGISTRY_USERNAME: ${DEPLOY_REGISTRY_USERNAME:-flowcordia}
      DOCKER_HOST: unix:///var/run/docker.sock
      FLOWCORDIA_STUDIO_BUILD_API_URL: http://host.docker.internal:3030
      FLOWCORDIA_STUDIO_BUILD_ADD_HOST: host.docker.internal:host-gateway
      FLOWCORDIA_STUDIO_BUILD_NETWORK: ${COMPOSE_PROJECT_NAME:-triggerdotdev-docker}_app_network
      TRIGGER_API_URL: http://app:3030
      TRIGGER_BUILD_SKIP_REWRITE_TIMESTAMP: "1"
    entrypoint:
      - node
      - /triggerdotdev/packages/flowcordia-studio-builder/dist/src/index.js
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - studio-builder-work:/var/lib/flowcordia/studio-builder
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      app:
        condition: service_started
      database:
        condition: service_healthy
      minio:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    networks:
      - app_network
    restart: unless-stopped
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - fetch('http://127.0.0.1:8090/health').then((response)=>process.exit(response.ok?0:1)).catch(()=>process.exit(1))
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

volumes:
  studio-builder-work:
