name: Fix Studio V2 Activepieces bridge

on:
  push:
    branches:
      - agent/studio-v2-activepieces-frontend
    paths:
      - .github/workflows/studio-v2-activepieces-bridge-fix.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/studio-v2-activepieces-frontend
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.2
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Fix router typing and verify
        shell: bash
        run: |
          set -euo pipefail
          python <<'PY'
          from pathlib import Path

          path = Path('apps/flowcordia-studio-activepieces/src/flowcordia-activepieces-bridge.ts')
          text = path.read_text()
          text = text.replace(
              '  BranchExecutionType,\n',
              '  BranchExecutionType,\n  BranchOperator,\n',
              1,
          )
          text = text.replace(
              '  const operator = configuration.operator === "equals" ? "TEXT_EXACTLY_MATCHES" : "TEXT_EXACTLY_MATCHES";\n',
              '  const operator = BranchOperator.TEXT_EXACTLY_MATCHES;\n',
          )
          text = text.replace(
              '    const condition = step.settings.branches[0]?.conditions?.[0]?.[0];\n',
              '    const branchDefinition = step.settings.branches[0];\n    const condition =\n      branchDefinition?.branchType === BranchExecutionType.CONDITION\n        ? branchDefinition.conditions?.[0]?.[0]\n        : undefined;\n',
          )
          path.write_text(text)
          PY

          pnpm install --no-frozen-lockfile --config.minimum-release-age=0
          pnpm --filter @flowcordia/studio-activepieces typecheck
          pnpm --filter @flowcordia/studio-activepieces test
          pnpm --filter @flowcordia/studio-activepieces build

          git config user.name "Flowcordia Studio Agent"
          git config user.email "actions@users.noreply.github.com"
          printf 'status: passed\n' > .flowcordia/automation/studio-v2-activepieces-bridge.txt
          git add apps/flowcordia-studio-activepieces/src/flowcordia-activepieces-bridge.ts pnpm-lock.yaml .flowcordia/automation/studio-v2-activepieces-bridge.txt
          git commit -m "Verify reversible Flowcordia Activepieces bridge"
          git pull --rebase origin agent/studio-v2-activepieces-frontend
          git push origin HEAD:agent/studio-v2-activepieces-frontend
