permissions: {}

concurrency:
  group: flowcordia-canvas-editing-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: read
    steps:
      - name: Checkout exact revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 1

      - name: Setup pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 10.33.2

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 20.20.2
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run portable edge, creation, and selection contracts
        run: |
          pnpm --filter @flowcordia/workflow exec vitest run \
            test/edge-editing.test.ts \
            src/editor.fast-create.test.ts \
            src/editor.selection.test.ts

      - name: Build workflow package for webapp contracts
        run: pnpm exec turbo run build --filter=@flowcordia/workflow

      - name: Run canvas, contextual creation, selection, layout, history, and evidence contracts
        run: |
          pnpm --filter webapp exec vitest run \
            app/features/flowcordia/workflows/drafts/fast-create-command-contract.test.ts \
            app/features/flowcordia/workflows/drafts/history-command-contract.test.ts \
            app/features/flowcordia/workflows/drafts/history-persistence-contract.test.ts \
            app/features/flowcordia/workflows/drafts/history.test.ts \
            app/features/flowcordia/workflows/drafts/selection-command-contract.test.ts \
            app/features/flowcordia/workflows/studio/canvas-layout.test.ts \
            app/features/flowcordia/workflows/studio/canvas-selection.test.ts \
            app/features/flowcordia/workflows/studio/history-shortcuts.test.ts \
            app/features/flowcordia/workflows/studio/quick-node-creator.test.ts \
            app/features/flowcordia/workflows/studio/canvas-react-flow.test.ts \
            app/features/flowcordia/workflows/studio/WorkflowStudioCanvas.layout-contract.test.ts \
            app/features/flowcordia/workflows/studio/WorkflowStudioCanvas.react-flow-contract.test.ts \
            test/flowcordia/canvasManualAcceptance.test.ts \
            test/flowcordia/workflowDraftPresentation.test.ts \
            test/flowcordia/workflowStudioEditingCapabilityEvidence.test.ts \
            test/flowcordia/workflowStudioCanvasConnections.test.ts \
            test/flowcordia/workflowStudioCanvasEdges.test.ts \
            test/flowcordia/workflowStudioCanvasNavigation.test.ts \
            test/flowcordia/workflowStudioNodeCatalogDiscovery.test.ts

      - name: Check exact changed-source formatting
        run: |
          pnpm exec oxfmt --check \
            apps/webapp/app/features/flowcordia/workflows/drafts/commands.server.ts \
            apps/webapp/app/features/flowcordia/workflows/drafts/fast-create-command-contract.test.ts \
            apps/webapp/app/features/flowcordia/workflows/drafts/fast-create-command-contract.ts \
            apps/webapp/app/features/flowcordia/workflows/drafts/history-command-contract.test.ts \
            apps/webapp/app/features/flowcordia/workflows/drafts/history-command-contract.ts \
            apps/webapp/app/features/flowcordia/workflows/drafts/history-persistence-contract.test.ts \
            apps/webapp/app/features/flowcordia/workflows/drafts/history.test.ts \
            apps/webapp/app/features/flowcordia/workflows/drafts/history.ts \
            apps/webapp/app/features/flowcordia/workflows/drafts/repository.server.ts \
            apps/webapp/app/features/flowcordia/workflows/drafts/service.server.ts \
            apps/webapp/app/features/flowcordia/workflows/drafts/selection-command-contract.test.ts \
            apps/webapp/app/features/flowcordia/workflows/drafts/selection-command-contract.ts \
            apps/webapp/app/features/flowcordia/workflows/drafts/types.ts \
            apps/webapp/app/features/flowcordia/workflows/studio/WorkflowStudio.tsx \
            apps/webapp/app/features/flowcordia/workflows/studio/WorkflowStudioCanvas.layout-contract.test.ts \
            apps/webapp/app/features/flowcordia/workflows/studio/WorkflowStudioCanvas.react-flow-contract.test.ts \
            apps/webapp/app/features/flowcordia/workflows/studio/WorkflowStudioCanvas.tsx \
            apps/webapp/app/features/flowcordia/workflows/studio/WorkflowStudioEdgeInspector.tsx \
            apps/webapp/app/features/flowcordia/workflows/studio/WorkflowStudioHeader.tsx \
            apps/webapp/app/features/flowcordia/workflows/studio/WorkflowStudioQuickNodeCreator.tsx \
            apps/webapp/app/features/flowcordia/workflows/studio/canvas-edges.ts \
            apps/webapp/app/features/flowcordia/workflows/studio/canvas-layout.test.ts \
            apps/webapp/app/features/flowcordia/workflows/studio/canvas-layout.ts \
            apps/webapp/app/features/flowcordia/workflows/studio/canvas-navigation.ts \
            apps/webapp/app/features/flowcordia/workflows/studio/canvas-react-flow.test.ts \
            apps/webapp/app/features/flowcordia/workflows/studio/canvas-selection.test.ts \
            apps/webapp/app/features/flowcordia/workflows/studio/canvas-selection.ts \
            apps/webapp/app/features/flowcordia/workflows/studio/history-shortcuts.test.ts \
            apps/webapp/app/features/flowcordia/workflows/studio/history-shortcuts.ts \
            apps/webapp/app/features/flowcordia/workflows/studio/presentation.ts \
            apps/webapp/app/features/flowcordia/workflows/studio/quick-node-creator.test.ts \
            apps/webapp/app/features/flowcordia/workflows/studio/quick-node-creator.ts \
            apps/webapp/test/flowcordia/canvasManualAcceptance.test.ts \
            apps/webapp/test/flowcordia/workflowDraftPresentation.test.ts \
            apps/webapp/test/flowcordia/workflowStudioEditingCapabilityEvidence.test.ts \
            apps/webapp/test/flowcordia/workflowStudioCanvasConnections.test.ts \
            apps/webapp/test/flowcordia/workflowStudioCanvasEdges.test.ts \
            apps/webapp/test/flowcordia/workflowStudioCanvasNavigation.test.ts \
            apps/webapp/test/flowcordia/workflowStudioNodeCatalogDiscovery.test.ts \
            packages/flowcordia-workflow/src/editor.fast-create.test.ts \
