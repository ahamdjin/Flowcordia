name: Flowcordia canvas navigation

on:
  pull_request:
    paths:
      - ".github/workflows/flowcordia-canvas-navigation.yml"
      - "apps/webapp/app/features/flowcordia/workflows/studio/WorkflowStudioCanvas.tsx"
      - "apps/webapp/app/features/flowcordia/workflows/studio/canvas-navigation.ts"
      - "apps/webapp/app/features/flowcordia/workflows/studio/README.md"
      - "apps/webapp/test/flowcordia/workflowStudioCanvasConnections.test.ts"
      - "apps/webapp/test/flowcordia/workflowStudioCanvasNavigation.test.ts"
      - "flowcordia/README.md"
      - "flowcordia/product/capability-matrix.md"
      - "flowcordia/runbooks/canvas-accessibility-acceptance.md"
  push:
    branches:
      - "agent/flowcordia-accessible-canvas-navigation"
    paths:
      - ".github/workflows/flowcordia-canvas-navigation.yml"
      - "apps/webapp/app/features/flowcordia/workflows/studio/WorkflowStudioCanvas.tsx"
      - "apps/webapp/app/features/flowcordia/workflows/studio/canvas-navigation.ts"
      - "apps/webapp/test/flowcordia/workflowStudioCanvasNavigation.test.ts"

permissions: {}

concurrency:
  group: flowcordia-canvas-navigation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: write
    steps:
      - name: Checkout exact revision
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.sha }}
          persist-credentials: ${{ github.event_name == 'push' }}
          fetch-depth: 1

      - name: Setup pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5.0.0
        with:
          version: 10.33.2

      - name: Setup Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 20.20.2
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run canvas contracts
        run: |
          pnpm --filter webapp exec vitest run \
            test/flowcordia/workflowStudioCanvasConnections.test.ts \
            test/flowcordia/workflowStudioCanvasNavigation.test.ts

      - name: Apply exact changed-source formatting
        id: format
        shell: bash
        run: |
          files=(
            apps/webapp/app/features/flowcordia/workflows/studio/WorkflowStudioCanvas.tsx
            apps/webapp/app/features/flowcordia/workflows/studio/canvas-navigation.ts
            apps/webapp/test/flowcordia/workflowStudioCanvasNavigation.test.ts
          )
          pnpm exec oxfmt "${files[@]}"
          if git diff --quiet -- "${files[@]}"; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            git diff --check -- "${files[@]}"
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit exact formatter output
        if: github.event_name == 'push' && github.ref == 'refs/heads/agent/flowcordia-accessible-canvas-navigation' && steps.format.outputs.changed == 'true'
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- \
            apps/webapp/app/features/flowcordia/workflows/studio/WorkflowStudioCanvas.tsx \
            apps/webapp/app/features/flowcordia/workflows/studio/canvas-navigation.ts \
            apps/webapp/test/flowcordia/workflowStudioCanvasNavigation.test.ts
          git commit -m "Format accessible canvas sources"
          git push origin HEAD:refs/heads/agent/flowcordia-accessible-canvas-navigation

      - name: Fail pull request on formatting drift
        if: github.event_name == 'pull_request' && steps.format.outputs.changed == 'true'
        run: exit 1
