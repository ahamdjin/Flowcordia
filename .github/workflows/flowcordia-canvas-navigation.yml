name: Flowcordia canvas navigation

on:
  pull_request:
    paths:
      - ".github/workflows/flowcordia-canvas-navigation.yml"
      - "apps/webapp/app/features/flowcordia/workflows/studio/WorkflowStudioCanvas.tsx"
      - "apps/webapp/app/features/flowcordia/workflows/studio/canvas-navigation.ts"
      - "apps/webapp/app/features/flowcordia/workflows/studio/README.md"
      - "apps/webapp/test/flowcordia/workflowStudioCanvasConnections.test.ts"
      - "apps/webapp/test/flowcordia/workflowStudioCanvasNavigation.test.ts"
      - "flowcordia/README.md"
      - "flowcordia/product/capability-matrix.md"
      - "flowcordia/runbooks/canvas-accessibility-acceptance.md"
  push:
    paths:
      - ".github/workflows/flowcordia-canvas-navigation.yml"
      - "apps/webapp/app/features/flowcordia/workflows/studio/WorkflowStudioCanvas.tsx"
      - "apps/webapp/app/features/flowcordia/workflows/studio/canvas-navigation.ts"
      - "apps/webapp/app/features/flowcordia/workflows/studio/README.md"
      - "apps/webapp/test/flowcordia/workflowStudioCanvasConnections.test.ts"
      - "apps/webapp/test/flowcordia/workflowStudioCanvasNavigation.test.ts"
      - "flowcordia/README.md"
      - "flowcordia/product/capability-matrix.md"
      - "flowcordia/runbooks/canvas-accessibility-acceptance.md"

permissions: {}

concurrency:
  group: flowcordia-canvas-navigation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: read
    steps:
      - name: Checkout exact revision
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 1

      - name: Setup pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5.0.0
        with:
          version: 10.33.2

      - name: Setup Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 20.20.2
          cache: pnpm

      - name: Install and generate
        run: |
          pnpm install --frozen-lockfile
          pnpm --filter @trigger.dev/database generate

      - name: Run canvas contracts
        run: |
          pnpm --filter webapp exec vitest run \
            test/flowcordia/workflowStudioCanvasConnections.test.ts \
            test/flowcordia/workflowStudioCanvasNavigation.test.ts

      - name: Typecheck web application
        id: typecheck
        shell: bash
        run: |
          set +e
          pnpm --filter webapp typecheck > canvas-typecheck.log 2>&1
          status=$?
          tail -n 200 canvas-typecheck.log
          echo "status=${status}" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Preserve bounded typecheck diagnostics
        if: steps.typecheck.outputs.status != '0'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: flowcordia-canvas-typecheck-${{ github.run_id }}
          path: canvas-typecheck.log
          if-no-files-found: error
          retention-days: 1

      - name: Fail on typecheck diagnostics
        if: steps.typecheck.outputs.status != '0'
        run: exit 1

      - name: Check exact changed-source formatting
        run: |
          pnpm exec oxfmt --check \
            apps/webapp/app/features/flowcordia/workflows/studio/WorkflowStudioCanvas.tsx \
            apps/webapp/app/features/flowcordia/workflows/studio/canvas-navigation.ts \
            apps/webapp/test/flowcordia/workflowStudioCanvasNavigation.test.ts
