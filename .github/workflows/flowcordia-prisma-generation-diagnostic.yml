name: Flowcordia temporary Prisma generation diagnostic

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/flowcordia-prisma-generation-diagnostic.yml"

permissions: {}

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Checkout exact revision
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5.0.0
        with:
          version: 10.33.2

      - name: Setup Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 20.20.2
          cache: pnpm

      - name: Install exact graph
        run: pnpm install --frozen-lockfile

      - name: Capture generation result
        shell: bash
        run: |
          set +e
          output="$RUNNER_TEMP/prisma-generation"
          mkdir -p "$output"
          pnpm generate > "$output/generate.log" 2>&1
          echo "$?" > "$output/generate.status"
          pnpm why prisma > "$output/why-prisma.log" 2>&1
          pnpm why @prisma/client > "$output/why-client.log" 2>&1
          pnpm why fast-glob > "$output/why-fast-glob.log" 2>&1
          pnpm why glob > "$output/why-glob.log" 2>&1
          exit 0

      - name: Upload generation diagnostic
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: flowcordia-prisma-generation-${{ github.run_id }}
          path: ${{ runner.temp }}/prisma-generation
          if-no-files-found: error
          retention-days: 2
          include-hidden-files: false
