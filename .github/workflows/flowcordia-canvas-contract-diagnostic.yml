name: Flowcordia canvas contract diagnostic

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened

permissions:
  contents: read

concurrency:
  group: flowcordia-canvas-contract-diagnostic
  cancel-in-progress: true

jobs:
  diagnose:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: studio/fast-node-creation
          persist-credentials: false
      - name: Setup pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320
        with:
          version: 10.33.2
      - name: Setup Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: 20.20.2
          cache: pnpm
      - name: Locate permanent canvas workflow
        shell: bash
        run: |
          workflow_file="$(grep -RIl '^name: Flowcordia canvas editing$' .github/workflows | head -n 1)"
          if [ -z "$workflow_file" ]; then
            echo "Permanent canvas workflow was not found." >&2
            exit 1
          fi
          printf '%s\n' "$workflow_file" > flowcordia-canvas-workflow-path.txt
          cp "$workflow_file" flowcordia-canvas-workflow.yml
      - name: Install dependencies
        run: pnpm install --frozen-lockfile >/dev/null
      - name: Build workflow package
        run: pnpm exec turbo run build --filter=@flowcordia/workflow >/dev/null
      - name: Inventory canvas contracts
        shell: bash
        run: |
          find apps/webapp -type f \( -iname '*canvas*.test.ts' -o -iname '*canvas*.test.tsx' \) -print | sort > flowcordia-canvas-test-inventory.txt
          cat flowcordia-canvas-test-inventory.txt
      - name: Run every canvas contract
        id: contracts
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          mapfile -t files < <(sed 's#^apps/webapp/##' flowcordia-canvas-test-inventory.txt)
          pnpm --filter webapp exec vitest --run "${files[@]}" 2>&1 | tee flowcordia-canvas-contracts.log
      - name: Keep bounded output
        if: always()
        shell: bash
        run: tail -n 360 flowcordia-canvas-contracts.log > flowcordia-canvas-contracts-tail.log
      - name: Upload workflow, inventory, and output
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: flowcordia-canvas-contract-diagnostic
          path: |
            flowcordia-canvas-workflow-path.txt
            flowcordia-canvas-workflow.yml
            flowcordia-canvas-test-inventory.txt
            flowcordia-canvas-contracts-tail.log
          retention-days: 1
      - name: Fail on contract errors
        if: steps.contracts.outcome == 'failure'
        run: exit 1
