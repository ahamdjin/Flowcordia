name: Flowcordia canvas manual acceptance checks

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/flowcordia-canvas-manual-acceptance.yml"
      - ".github/workflows/flowcordia-canvas-manual-acceptance-checks.yml"
      - "apps/webapp/app/features/flowcordia/acceptance/canvas-manual-acceptance.ts"
      - "apps/webapp/test/flowcordia/canvasManualAcceptance.test.ts"
      - "scripts/flowcordia-canvas-manual-evidence.ts"
      - "flowcordia/testing/canvas-manual-evidence.md"
  push:
    branches: [main]
    paths:
      - ".github/workflows/flowcordia-canvas-manual-acceptance.yml"
      - "apps/webapp/app/features/flowcordia/acceptance/canvas-manual-acceptance.ts"

permissions: {}

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Checkout exact revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 10.33.2

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 20.20.2
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run canvas manual evidence contracts
        run: pnpm --filter webapp exec vitest run test/flowcordia/canvasManualAcceptance.test.ts

      - name: Validate protected workflow and evidence boundaries
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require("node:fs");
          const workflow = fs.readFileSync(".github/workflows/flowcordia-canvas-manual-acceptance.yml", "utf8");
          const contract = fs.readFileSync("apps/webapp/app/features/flowcordia/acceptance/canvas-manual-acceptance.ts", "utf8");
          const requiredWorkflow = [
            "workflow_dispatch:",
            "if: github.ref == 'refs/heads/main'",
            "environment: flowcordia-acceptance",
            "PRESERVE-CANVAS-MANUAL-ACCEPTANCE",
            "record_base64",
            "retention-days: 90",
            "rm -rf \"${FLOWCORDIA_CANVAS_PRIVATE_DIR:-}\"",
          ];
          for (const marker of requiredWorkflow) {
            if (!workflow.includes(marker)) throw new Error(`Missing protected workflow boundary: ${marker}`);
          }
          if (/\bpull_request\s*:/.test(workflow)) {
            throw new Error("Manual evidence preservation must not run for pull requests.");
          }
          for (const marker of [
            "nvda_chrome_windows",
            "nvda_firefox_windows",
            "voiceover_safari_macos",
            "desktop_1280x720",
            "tablet_landscape_1024x768",
            "tablet_portrait_768x1024",
            "phone_390x844",
            "production_70",
            "stress_300",
            "zoom_200_percent",
            "evidenceSha256",
          ]) {
            if (!contract.includes(marker)) throw new Error(`Missing manual evidence boundary: ${marker}`);
          }
          for (const forbidden of ["payload:", "secret:", "browserStorage:", "credential:"]) {
            if (contract.includes(forbidden)) throw new Error(`Forbidden evidence field: ${forbidden}`);
          }
          NODE
          git diff --check

      - name: Check exact changed-source formatting
        run: |
          pnpm exec oxfmt --check \
            apps/webapp/app/features/flowcordia/acceptance/canvas-manual-acceptance.ts \
            apps/webapp/test/flowcordia/canvasManualAcceptance.test.ts \
            scripts/flowcordia-canvas-manual-evidence.ts
