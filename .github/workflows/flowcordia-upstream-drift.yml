name: Flowcordia upstream drift

on:
  workflow_dispatch:
  schedule:
    - cron: "17 6 * * 1"

permissions:
  contents: read

jobs:
  trigger-upstream:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Fetch Trigger.dev upstream
        run: git fetch --no-tags https://github.com/triggerdotdev/trigger.dev.git main:refs/remotes/upstream-trigger/main
      - name: Report owned and adapter drift
        run: pnpm flowcordia:upstream:report --base upstream-trigger/main --head HEAD --json > flowcordia-upstream-drift.json
      - name: Upload drift report
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: flowcordia-trigger-upstream-drift
          path: flowcordia-upstream-drift.json
          retention-days: 14
