name: Studio V2 runtime parity patch

on:
  push:
    branches:
      - agent/studio-v2-runtime-parity

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: agent/studio-v2-runtime-parity
          fetch-depth: 0
      - name: Apply runtime capability and durable wait semantics
        shell: python
        run: |
          from pathlib import Path

          activepieces = Path("packages/flowcordia-runtime/src/activepieces.ts")
          text = activepieces.read_text()
          if 'awaitWaitpoint?(waitpointId: string): Promise<unknown>;' not in text:
            old = '''  serverApiUrl?: string;
  serverPublicUrl?: string;
  store?: FlowcordiaActivepiecesStoreService;'''
            new = '''  serverApiUrl?: string;
  serverPublicUrl?: string;
  executionType?: "BEGIN" | "RESUME";
  resumePayload?: unknown;
  awaitWaitpoint?(waitpointId: string): Promise<unknown>;
  store?: FlowcordiaActivepiecesStoreService;'''
            assert old in text
            text = text.replace(old, new, 1)
          if 'export class FlowcordiaActivepiecesWaitpointRequested' not in text:
            marker = '''export interface FlowcordiaActivepiecesPropertyInteraction {'''
            addition = '''export class FlowcordiaActivepiecesWaitpointRequested extends Error {
  constructor(readonly waitpointId: string) {
    super(`Activepieces requested waitpoint ${waitpointId}.`);
    this.name = "FlowcordiaActivepiecesWaitpointRequested";
  }
}

'''
            assert marker in text
            text = text.replace(marker, addition + marker, 1)
          old = '''    waitForWaitpoint: (waitpointId: string) => {
      if (!services.waitForWaitpoint) return unsupportedCapability("context.run.waitForWaitpoint");
      return services.waitForWaitpoint(waitpointId);
    },'''
          new = '''    waitForWaitpoint: (waitpointId: string) => {
      if (services.waitForWaitpoint) return services.waitForWaitpoint(waitpointId);
      throw new FlowcordiaActivepiecesWaitpointRequested(waitpointId);
    },'''
          if old in text:
            text = text.replace(old, new, 1)
          old = '''}) {
  return {
    executionType: "BEGIN",
    propsValue: input.propsValue,'''
          new = '''}) {
  const executionType = input.services.executionType ?? "BEGIN";
  return {
    executionType,
    ...(executionType === "RESUME" ? { resumePayload: input.services.resumePayload ?? {} } : {}),
    propsValue: input.propsValue,'''
          if old in text:
            text = text.replace(old, new, 1)
          activepieces.write_text(text)

          runtime = Path("packages/flowcordia-runtime/src/runtime.ts")
          text = runtime.read_text()
          old = 'import { executeFlowcordiaActivepiecesAction } from "./activepieces.js";'
          new = '''import {
  FlowcordiaActivepiecesWaitpointRequested,
  executeFlowcordiaActivepiecesAction,
} from "./activepieces.js";'''
          if old in text:
            text = text.replace(old, new, 1)
          old = '''      return executeFlowcordiaActivepiecesAction({
        node,
        configuration,
        workflowInput,
        outputs,
        services: {
          loadPiece: options.loadActivepiecesPiece,
          resolveConnection: options.resolveActivepiecesConnection,
          formulaEvaluator: options.activepiecesFormulaEvaluator,
          projectId: options.activepiecesProjectId,
          projectExternalId: options.activepiecesProjectExternalId,
          runId: options.activepiecesRunId,
          serverApiUrl: options.activepiecesServerApiUrl,
          serverPublicUrl: options.activepiecesServerPublicUrl,
        },
      });'''
          new = '''      let executionType = options.activepiecesRuntimeServices?.executionType ?? "BEGIN";
      let resumePayload = options.activepiecesRuntimeServices?.resumePayload;
      while (true) {
        try {
          return await executeFlowcordiaActivepiecesAction({
            node,
            configuration,
            workflowInput,
            outputs,
            services: {
              ...options.activepiecesRuntimeServices,
              loadPiece: options.loadActivepiecesPiece,
              resolveConnection: options.resolveActivepiecesConnection,
              formulaEvaluator: options.activepiecesFormulaEvaluator,
              projectId: options.activepiecesProjectId,
              projectExternalId: options.activepiecesProjectExternalId,
              runId: options.activepiecesRunId,
              serverApiUrl: options.activepiecesServerApiUrl,
              serverPublicUrl: options.activepiecesServerPublicUrl,
              executionType,
              resumePayload,
            },
          });
        } catch (error) {
          if (!(error instanceof FlowcordiaActivepiecesWaitpointRequested)) throw error;
          const awaitWaitpoint = options.activepiecesRuntimeServices?.awaitWaitpoint;
          if (!awaitWaitpoint) {
            throw new Error(
              `Activepieces requested waitpoint ${error.waitpointId}, but this Trigger.dev runtime has no durable waitpoint adapter.`
            );
          }
          resumePayload = await awaitWaitpoint(error.waitpointId);
          executionType = "RESUME";
        }
      }'''
          assert old in text
          text = text.replace(old, new, 1)
          runtime.write_text(text)

          test = Path("packages/flowcordia-runtime/src/activepieces.test.ts")
          text = test.read_text()
          if 'parseFlowcordiaActivepiecesPieceConfiguration' not in text:
            old = '''  collectFlowcordiaActivepiecesPieceDependencies,
  exactFlowcordiaActivepiecesPieceVersion,'''
            new = '''  collectFlowcordiaActivepiecesPieceDependencies,
  exactFlowcordiaActivepiecesPieceVersion,
  parseFlowcordiaActivepiecesPieceConfiguration,'''
            assert old in text
            text = text.replace(old, new, 1)
          old = 'import { createPreviewRuntimeAdapters, executeFlowcordiaWorkflow } from "./runtime.js";'
          if old in text:
            text = text.replace(old, '''import {
  createPreviewRuntimeAdapters,
  createTriggerRuntimeAdapters,
  executeFlowcordiaWorkflow,
} from "./runtime.js";''', 1)
          marker = '''  it("treats generic Activepieces actions as supported workflow nodes", async () => {'''
          if 'forwards optional Activepieces runtime services without allowing identity overrides' not in text:
            addition = '''  it("forwards optional Activepieces runtime services without allowing identity overrides", async () => {
    const parsed = parseFlowcordiaActivepiecesPieceConfiguration(genericAction);
    expect(parsed.success).toBe(true);
    if (!parsed.success) return;

    const values = new Map<string, unknown>();
    const adapters = createTriggerRuntimeAdapters({
      wait: async () => undefined,
      authorizeHttp: () => true,
      async loadActivepiecesPiece(packageName) {
        return {
          slack: {
            name: packageName,
            actions: {
              send_channel_message: {
                async run(context: Record<string, any>) {
                  await context.store.put("shared", context.auth, "PROJECT");
                  return { auth: context.auth, stored: await context.store.get("shared", "PROJECT") };
                },
              },
            },
            triggers: {},
          },
        };
      },
      async resolveActivepiecesConnection() {
        return { kind: "activepieces_connection", value: { type: "SECRET_TEXT", secret_text: "live-secret" } };
      },
      activepiecesRuntimeServices: {
        loadPiece: async () => { throw new Error("must not override exact piece loading"); },
        resolveConnection: async () => { throw new Error("must not override connection resolution"); },
        store: {
          async put(key, value) { values.set(key, value); return value; },
          async get(key) { return values.get(key) ?? null; },
          async delete(key) { values.delete(key); },
        },
      },
    });

    const result = await adapters.activepieces({
      node: genericAction,
      configuration: parsed.configuration,
      workflowInput: null,
      outputs: {},
    });
    expect(result).toEqual({
      auth: { type: "SECRET_TEXT", secret_text: "live-secret" },
      stored: { type: "SECRET_TEXT", secret_text: "live-secret" },
    });
  });

  it("re-enters exact Activepieces actions with RESUME after a durable waitpoint", async () => {
    const parsed = parseFlowcordiaActivepiecesPieceConfiguration(genericAction);
    expect(parsed.success).toBe(true);
    if (!parsed.success) return;

    let reachedAfterWait = false;
    const adapters = createTriggerRuntimeAdapters({
      wait: async () => undefined,
      authorizeHttp: () => true,
      async loadActivepiecesPiece(packageName) {
        return {
          slack: {
            name: packageName,
            actions: {
              send_channel_message: {
                async run(context: Record<string, any>) {
                  if (context.executionType === "BEGIN") {
                    const waitpoint = await context.run.createWaitpoint({ type: "WEBHOOK" });
                    context.run.waitForWaitpoint(waitpoint.id);
                    reachedAfterWait = true;
                    return { wrong: true };
                  }
                  return {
                    executionType: context.executionType,
                    resumePayload: context.resumePayload,
                  };
                },
              },
            },
            triggers: {},
          },
        };
      },
      resolveActivepiecesConnection: async () => null,
      activepiecesRuntimeServices: {
        createWaitpoint: async () => ({
          id: "waitpoint_123",
          resumeUrl: "https://example.test/waitpoint_123",
          buildResumeUrl: ({ queryParams }) =>
            `https://example.test/waitpoint_123?${new URLSearchParams(queryParams).toString()}`,
        }),
        awaitWaitpoint: async (waitpointId) => {
          expect(waitpointId).toBe("waitpoint_123");
          return {
            body: { approved: true },
            headers: { "content-type": "application/json" },
            queryParams: { action: "approve" },
          };
        },
      },
    });

    const result = await adapters.activepieces({
      node: genericAction,
      configuration: parsed.configuration,
      workflowInput: null,
      outputs: {},
    });
    expect(reachedAfterWait).toBe(false);
    expect(result).toEqual({
      executionType: "RESUME",
      resumePayload: {
        body: { approved: true },
        headers: { "content-type": "application/json" },
        queryParams: { action: "approve" },
      },
    });
  });

'''
            assert marker in text
            text = text.replace(marker, addition + marker, 1)
          test.write_text(text)
      - name: Verify patch
        run: git diff --check
      - name: Commit product changes and remove temporary files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/studio-v2-runtime-parity-patch.yml
          git rm -f .studio-v2-runtime-parity-kick || true
          git add packages/flowcordia-runtime/src/activepieces.ts packages/flowcordia-runtime/src/runtime.ts packages/flowcordia-runtime/src/activepieces.test.ts packages/flowcordia-runtime/src/types.ts
          git commit -m "feat(studio-v2): add durable Activepieces action resume semantics"
          git push origin HEAD:agent/studio-v2-runtime-parity
