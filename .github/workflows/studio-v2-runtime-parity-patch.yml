name: Studio V2 runtime parity patch

on:
  push:
    branches:
      - agent/studio-v2-runtime-parity
  pull_request:
    branches:
      - main
    types:
      - synchronize

permissions:
  contents: write

jobs:
  apply:
    if: github.event_name == 'push' || github.event.pull_request.head.ref == 'agent/studio-v2-runtime-parity'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: agent/studio-v2-runtime-parity
          fetch-depth: 0
      - name: Forward Activepieces runtime capabilities
        shell: python
        run: |
          from pathlib import Path

          runtime = Path("packages/flowcordia-runtime/src/runtime.ts")
          text = runtime.read_text()
          old = '''        services: {
          loadPiece: options.loadActivepiecesPiece,
          resolveConnection: options.resolveActivepiecesConnection,
          formulaEvaluator: options.activepiecesFormulaEvaluator,'''
          new = '''        services: {
          ...options.activepiecesRuntimeServices,
          loadPiece: options.loadActivepiecesPiece,
          resolveConnection: options.resolveActivepiecesConnection,
          formulaEvaluator: options.activepiecesFormulaEvaluator,'''
          assert old in text
          runtime.write_text(text.replace(old, new, 1))

          test = Path("packages/flowcordia-runtime/src/activepieces.test.ts")
          text = test.read_text()
          old = '''  FLOWCORDIA_ACTIVEPIECES_ACTION_OPERATION,
  collectFlowcordiaActivepiecesPieceDependencies,
  exactFlowcordiaActivepiecesPieceVersion,'''
          new = '''  FLOWCORDIA_ACTIVEPIECES_ACTION_OPERATION,
  collectFlowcordiaActivepiecesPieceDependencies,
  exactFlowcordiaActivepiecesPieceVersion,
  parseFlowcordiaActivepiecesPieceConfiguration,'''
          assert old in text
          text = text.replace(old, new, 1)
          old = '''import { createPreviewRuntimeAdapters, executeFlowcordiaWorkflow } from "./runtime.js";'''
          new = '''import {
  createPreviewRuntimeAdapters,
  createTriggerRuntimeAdapters,
  executeFlowcordiaWorkflow,
} from "./runtime.js";'''
          assert old in text
          text = text.replace(old, new, 1)
          marker = '''  it("treats generic Activepieces actions as supported workflow nodes", async () => {'''
          assert marker in text
          addition = '''  it("forwards optional Activepieces runtime services without allowing identity overrides", async () => {
    const parsed = parseFlowcordiaActivepiecesPieceConfiguration(genericAction);
    expect(parsed.success).toBe(true);
    if (!parsed.success) return;

    const values = new Map<string, unknown>();
    const adapters = createTriggerRuntimeAdapters({
      wait: async () => undefined,
      authorizeHttp: () => true,
      async loadActivepiecesPiece(packageName) {
        expect(packageName).toBe("@activepieces/piece-slack");
        return {
          slack: {
            name: packageName,
            actions: {
              send_channel_message: {
                async run(context: Record<string, any>) {
                  await context.store.put("shared", context.auth, "PROJECT");
                  return {
                    auth: context.auth,
                    stored: await context.store.get("shared", "PROJECT"),
                  };
                },
              },
            },
            triggers: {},
          },
        };
      },
      async resolveActivepiecesConnection(externalId) {
        expect(externalId).toBe("slack-main");
        return {
          kind: "activepieces_connection",
          value: { type: "SECRET_TEXT", secret_text: "live-secret" },
        };
      },
      activepiecesRuntimeServices: {
        loadPiece: async () => {
          throw new Error("optional runtime services must not override exact piece loading");
        },
        resolveConnection: async () => {
          throw new Error("optional runtime services must not override connection resolution");
        },
        store: {
          async put(key, value) {
            values.set(key, value);
            return value;
          },
          async get(key) {
            return values.get(key) ?? null;
          },
          async delete(key) {
            values.delete(key);
          },
        },
      },
    });

    const result = await adapters.activepieces({
      node: genericAction,
      configuration: parsed.configuration,
      workflowInput: null,
      outputs: {},
    });

    expect(result).toEqual({
      auth: { type: "SECRET_TEXT", secret_text: "live-secret" },
      stored: { type: "SECRET_TEXT", secret_text: "live-secret" },
    });
  });

'''
          test.write_text(text.replace(marker, addition + marker, 1))
      - name: Format and test runtime
        run: |
          pnpm exec oxfmt packages/flowcordia-runtime/src/runtime.ts packages/flowcordia-runtime/src/activepieces.test.ts packages/flowcordia-runtime/src/types.ts
          pnpm --filter @flowcordia/runtime test -- --run activepieces.test.ts
          pnpm --filter @flowcordia/runtime typecheck
          git diff --check
      - name: Commit product change and remove helper
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/studio-v2-runtime-parity-patch.yml
          git add packages/flowcordia-runtime/src/runtime.ts packages/flowcordia-runtime/src/activepieces.test.ts packages/flowcordia-runtime/src/types.ts
          git commit -m "feat(studio-v2): forward Activepieces runtime capabilities"
          git push origin HEAD:agent/studio-v2-runtime-parity
