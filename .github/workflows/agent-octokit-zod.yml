name: Zod Octokit response migration

on:
  pull_request:
    branches: [agent/node-package-ajv-clean]
    types: [opened, reopened, synchronize]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout exact pull request head
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Apply staged Octokit response migration
        run: |
          set -o pipefail
          echo "1b59d934a1d7a073e9d74d6f17931af17e441eb29047f0d08e483c46de1101fc  .agent/octokit-zod.part0" | sha256sum --check
          echo "a26ee21acbd899b443fe047c321dd0988dbd0b4b5d38a32663e5fec3c85fa6c1  .agent/octokit-zod.part1" | sha256sum --check
          echo "eaf526157416cbbcf3d42fd1eea3acd715b1de26205c1480167753e12b6eb069  .agent/octokit-zod.part2" | sha256sum --check
          echo "1c716c4384965be4524911eda18073d40141d039e00717ece52378f5b6a673e3  .agent/octokit-zod.part3" | sha256sum --check
          cat .agent/octokit-zod.part0 .agent/octokit-zod.part1 .agent/octokit-zod.part2 .agent/octokit-zod.part3 > /tmp/octokit-zod.patch.gz.b64
          echo "1770c37910056b4764efa1907c78baff57a4926afcd4891b0719f9714f9fc2e2  /tmp/octokit-zod.patch.gz.b64" | sha256sum --check
          base64 --decode /tmp/octokit-zod.patch.gz.b64 | gunzip > /tmp/octokit-zod.patch
          echo "a6739f4a42c24b98ba8e2617532c8477494bd69c64aa307ee222758ad64a2edb  /tmp/octokit-zod.patch" | sha256sum --check
          git apply --check --verbose /tmp/octokit-zod.patch
          git apply /tmp/octokit-zod.patch

      - name: Normalize GitHub user IDs at the adapter boundary
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("packages/flowcordia-github-proposals/src/transport/octokit-adapter.ts")
          source = path.read_text()
          replacements = {
              "authorId: parsed.user.id,": "authorId: String(parsed.user.id),",
              "reviewerId: parsed.user.id,": "reviewerId: String(parsed.user.id),",
          }
          for before, after in replacements.items():
              if source.count(before) != 1:
                  raise SystemExit(f"Expected exactly one occurrence of {before!r}")
              source = source.replace(before, after)
          path.write_text(source)
          PY

      - name: Declare direct foundation dependency in validation checkout
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path

          path = Path("packages/flowcordia-github-proposals/package.json")
          package = json.loads(path.read_text())
          package["dependencies"]["@flowcordia/foundation"] = "workspace:*"
          package["dependencies"] = dict(sorted(package["dependencies"].items()))
          path.write_text(json.dumps(package, indent=2) + "\n")
          PY

      - name: Setup pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5.0.0
        with:
          version: 10.33.2

      - name: Setup Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 20.20.2
          cache: pnpm

      - name: Install validation dependency graph
        run: pnpm install --no-frozen-lockfile

      - name: Format migration boundary
        run: |
          pnpm exec oxfmt \
            packages/flowcordia-github-proposals/package.json \
            packages/flowcordia-github-proposals/src/transport/octokit-adapter.ts \
            packages/flowcordia-github-proposals/test/octokit-adapter.test.ts

      - name: Typecheck proposal transport package
        run: |
          set -o pipefail
          pnpm --filter @flowcordia/github-proposals typecheck 2>&1 | tee /tmp/octokit-zod-typecheck.log

      - name: Test proposal transport dependency graph
        run: |
          set -o pipefail
          pnpm exec turbo run test \
            --concurrency=1 \
            --filter=@flowcordia/github-proposals \
            -- --run 2>&1 | tee /tmp/octokit-zod-tests.log

      - name: Upload validated Octokit response files
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: octokit-zod-validated-${{ github.run_id }}
          path: |
            packages/flowcordia-github-proposals/package.json
            packages/flowcordia-github-proposals/src/transport/octokit-adapter.ts
            packages/flowcordia-github-proposals/test/octokit-adapter.test.ts
          retention-days: 1

      - name: Upload migration diagnostics
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: octokit-zod-diagnostics-${{ github.run_id }}
          path: |
            /tmp/octokit-zod-typecheck.log
            /tmp/octokit-zod-tests.log
            packages/flowcordia-github-proposals/package.json
            packages/flowcordia-github-proposals/src/transport/octokit-adapter.ts
          if-no-files-found: ignore
          retention-days: 1
