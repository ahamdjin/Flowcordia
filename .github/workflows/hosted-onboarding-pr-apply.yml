name: Hosted onboarding PR apply

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  apply-and-validate:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact pull request head
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320

      - name: Setup Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Materialize exact product patch
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git checkout origin/main -- \
            'apps/webapp/app/routes/_app.orgs.$organizationSlug.settings.flowcordia-setup/route.tsx' \
            'apps/webapp/app/routes/_app.orgs.$organizationSlug_.projects.new/route.tsx' \
            apps/webapp/app/routes/_app.orgs.new/route.tsx \
            apps/webapp/app/routes/setup.github/route.tsx
          rm -f \
            apps/webapp/app/features/flowcordia/setup/hostedCustomerOnboarding.ts \
            apps/webapp/test/hostedOnboardingSimplification.test.ts \
            flowcordia/testing/hosted-onboarding-simplification.md
          awk '/base64 -d > \/tmp\/hosted.patch.gz/{capture=1; next} capture && /^PATCH$/{exit} capture{print}' \
            .github/workflows/hosted-onboarding-simplification-patch.yml > /tmp/hosted.patch.b64
          base64 -d /tmp/hosted.patch.b64 > /tmp/hosted.patch.gz
          gzip -dc /tmp/hosted.patch.gz > /tmp/hosted.patch
          git apply --check /tmp/hosted.patch
          git apply /tmp/hosted.patch

      - name: Install dependency-aware workspace
        run: pnpm install --frozen-lockfile

      - name: Format exact hosted onboarding files
        run: |
          pnpm exec oxfmt --write \
            apps/webapp/app/features/flowcordia/setup/hostedCustomerOnboarding.ts \
            'apps/webapp/app/routes/_app.orgs.$organizationSlug.settings.flowcordia-setup/route.tsx' \
            'apps/webapp/app/routes/_app.orgs.$organizationSlug_.projects.new/route.tsx' \
            apps/webapp/app/routes/_app.orgs.new/route.tsx \
            apps/webapp/app/routes/setup.github/route.tsx \
            apps/webapp/test/hostedOnboardingSimplification.test.ts

      - name: Test hosted onboarding contract
        run: pnpm --filter webapp exec vitest run test/hostedOnboardingSimplification.test.ts

      - name: Typecheck webapp
        run: pnpm --filter webapp typecheck

      - name: Commit validated hosted onboarding
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          rm -f \
            .github/workflows/hosted-onboarding-source-export.yml \
            .github/workflows/hosted-onboarding-simplification-patch.yml \
            .github/workflows/hosted-onboarding-pr-apply.yml \
            .agent/hosted-onboarding-simplification-trigger
          git diff --check
          git config user.name flowcordia-onboarding-bot
          git config user.email flowcordia-onboarding-bot@users.noreply.github.com
          git add -A
          git commit -m 'Simplify hosted customer onboarding'
          git remote set-url origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push origin HEAD:agent/simplify-hosted-onboarding
