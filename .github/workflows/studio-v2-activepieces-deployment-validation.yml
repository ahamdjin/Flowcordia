name: Studio V2 exact-branch validation

on:
  push:
    branches:
      - agent/studio-v2-activepieces-deployment
    paths:
      - .github/workflows/studio-v2-activepieces-deployment-validation.yml
      - apps/flowcordia-studio-activepieces/**
      - apps/webapp/app/features/flowcordia/workflows/studio-v2/**
      - apps/webapp/app/routes/**flowcordia.studio-v2/**
      - apps/webapp/test/flowcordia/studioV2*.test.ts
      - apps/webapp/package.json
      - packages/flowcordia-workflow/**
      - internal-packages/database/prisma/migrations/20260731200000_flowcordia_studio_v2_immutable_release/**
      - package.json
      - pnpm-lock.yaml
      - pnpm-workspace.yaml

concurrency:
  group: studio-v2-exact-branch-validation
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout exact branch head
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5.0.0
        with:
          version: 10.33.2

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 20.20.2
          cache: pnpm

      - name: Finalize Studio contracts and React type boundary
        shell: python
        run: |
          import json
          from pathlib import Path

          root_path = Path("package.json")
          root = json.loads(root_path.read_text())
          overrides = root.setdefault("pnpm", {}).setdefault("overrides", {})
          overrides["@types/react"] = "18.2.69"
          overrides["@types/react-dom"] = "18.2.7"
          root_path.write_text(json.dumps(root, indent=2) + "\n")

          catalog_path = Path("packages/flowcordia-workflow/src/studio-v2.ts")
          catalog = catalog_path.read_text()
          before = '''    availability: "adapter_required",
              availableInStudio: false,
              importedSource: "packages/core/execution and Windmill TypeScript editor reference",'''
          after = '''    availability: "native",
              availableInStudio: true,
              importedSource: "Activepieces Code editor and Flowcordia Secure Exec runtime",'''
          if before in catalog:
              catalog = catalog.replace(before, after, 1)
          elif after not in catalog:
              raise SystemExit("Studio Source catalog block no longer matches the expected boundary")
          catalog_path.write_text(catalog)

          test_path = Path("packages/flowcordia-workflow/src/studio-v2.test.ts")
          test = test_path.read_text()
          before_test = '''    expect(adapterRequired.map((entry) => entry.id)).toEqual([
                  "source",
                  "loop",'''
          after_test = '''    expect(adapterRequired.map((entry) => entry.id)).toEqual([
                  "loop",'''
          if before_test in test:
              test = test.replace(before_test, after_test, 1)
          elif after_test not in test:
              raise SystemExit("Studio Source catalog test no longer matches the expected boundary")
          test_path.write_text(test)

      - name: Regenerate the exact workspace lockfile
        run: pnpm install --no-frozen-lockfile

      - name: Generate database clients
        run: pnpm run generate

      - name: Install Chromium for Studio acceptance
        run: pnpm --filter @flowcordia/studio-activepieces exec playwright install chromium --with-deps

      - name: Normalize owned Studio files
        run: |
          pnpm exec oxfmt \
            apps/flowcordia-studio-activepieces \
            apps/webapp/app/features/flowcordia/workflows/studio-v2 \
            "apps/webapp/app/routes/_app.orgs.\$organizationSlug.projects.\$projectParam.env.\$envParam.flowcordia.studio-v2/route.tsx" \
            apps/webapp/test/flowcordia/studioV2PreviewRoute.test.ts \
            apps/webapp/test/flowcordia/studioV2ImmutableReleasePersistence.test.ts \
            packages/flowcordia-workflow/src/definition.ts \
            packages/flowcordia-workflow/src/index.ts \
            packages/flowcordia-workflow/src/studio-v2.ts \
            packages/flowcordia-workflow/src/studio-v2.test.ts \
            package.json

      - name: Validate cumulative Studio and deployment integration
        id: validation
        shell: bash
        run: |
          set +e
          report="/tmp/studio-v2-deployment-validation.md"
          log_dir="/tmp/studio-v2-deployment-validation"
          mkdir -p "$log_dir"
          failed=0

          cat > "$report" <<'EOF'
          # Studio V2 Deployment Validation

          Exact validation of the Activepieces Studio and Trigger.dev native deployment path.

          | Check | Result |
          | --- | --- |
          EOF

          run_check() {
            name="$1"
            shift
            slug=$(printf '%s' "$name" | tr '[:upper:] ' '[:lower:]-' | tr -cd 'a-z0-9_-')
            "$@" >"$log_dir/$slug.log" 2>&1
            status=$?
            if [ "$status" -eq 0 ]; then
              printf '| %s | PASS |\n' "$name" >> "$report"
            else
              printf '| %s | FAIL (%s) |\n' "$name" "$status" >> "$report"
              failed=1
              {
                printf '\n## %s failure\n\n```text\n' "$name"
                tail -n 240 "$log_dir/$slug.log"
                printf '\n```\n'
              } >> "$report"
            fi
          }

          run_check "Formatting" pnpm exec oxfmt --check \
            apps/flowcordia-studio-activepieces \
            apps/webapp/app/features/flowcordia/workflows/studio-v2 \
            "apps/webapp/app/routes/_app.orgs.\$organizationSlug.projects.\$projectParam.env.\$envParam.flowcordia.studio-v2/route.tsx" \
            apps/webapp/test/flowcordia/studioV2PreviewRoute.test.ts \
            apps/webapp/test/flowcordia/studioV2ImmutableReleasePersistence.test.ts \
            packages/flowcordia-workflow/src/definition.ts \
            packages/flowcordia-workflow/src/index.ts \
            packages/flowcordia-workflow/src/studio-v2.ts \
            packages/flowcordia-workflow/src/studio-v2.test.ts \
            package.json
          run_check "Activepieces adapter typecheck" pnpm --filter @flowcordia/studio-activepieces typecheck
          run_check "Activepieces adapter unit tests" pnpm --filter @flowcordia/studio-activepieces test:unit
          run_check "Workflow contract typecheck" pnpm --filter @flowcordia/workflow typecheck
          run_check "Workflow contract tests" pnpm --filter @flowcordia/workflow test -- --run
          run_check "Activepieces production build" pnpm --filter @flowcordia/studio-activepieces build
          run_check "Studio browser acceptance" pnpm --filter @flowcordia/studio-activepieces test:browser
          run_check "Deployment focused tests" pnpm --filter webapp exec vitest run \
            app/features/flowcordia/workflows/studio-v2/workspace-http.test.ts \
            app/features/flowcordia/workflows/studio-v2/deployment-context.test.ts \
            test/flowcordia/studioV2PreviewRoute.test.ts \
            test/flowcordia/studioV2ImmutableReleasePersistence.test.ts
          run_check "Webapp typecheck" pnpm --filter webapp typecheck
          run_check "Webapp production build" pnpm --filter webapp build

          cat "$report"
          if [ "$failed" -eq 0 ]; then
            echo "passed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "passed=false" >> "$GITHUB_OUTPUT"
          exit 1

      - name: Commit exact validated Studio state
        if: steps.validation.outputs.passed == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          rm -f .github/workflows/studio-v2-activepieces-deployment-validation.yml
          git add -A
          if git diff --cached --quiet; then
            echo "Studio branch already contains the exact validated state."
            exit 0
          fi

          git config user.name "Flowcordia Studio Agent"
          git config user.email "flowcordia-studio-agent@users.noreply.github.com"
          git commit -m "Finalize and validate Studio V2"

          auth_header=$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic ${auth_header}" \
            push origin HEAD:refs/heads/agent/studio-v2-activepieces-deployment
