name: Studio V2 exact-branch validation

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - .github/workflows/studio-v2-activepieces-deployment-validation.yml
      - apps/flowcordia-studio-activepieces/**
      - apps/webapp/app/features/flowcordia/workflows/studio-v2/**
      - apps/webapp/app/routes/**flowcordia.studio-v2/**
      - apps/webapp/test/flowcordia/studioV2*.test.ts
      - apps/webapp/package.json
      - packages/flowcordia-workflow/**
      - internal-packages/database/prisma/migrations/20260731200000_flowcordia_studio_v2_immutable_release/**
      - package.json
      - pnpm-lock.yaml
      - pnpm-workspace.yaml

concurrency:
  group: studio-v2-exact-branch-validation-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  validate:
    if: github.event.pull_request.head.ref == 'agent/studio-v2-activepieces-deployment'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout exact branch head
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5.0.0
        with:
          version: 10.33.2

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 20.20.2
          cache: pnpm

      - name: Finalize Studio contracts and workspace boundary
        shell: python
        run: |
          import json
          import re
          from pathlib import Path

          root_path = Path("package.json")
          root = json.loads(root_path.read_text())
          overrides = root.get("pnpm", {}).get("overrides", {})
          overrides.pop("@types/react", None)
          overrides.pop("@types/react-dom", None)
          root_path.write_text(json.dumps(root, indent=2) + "\n")

          app_path = Path("apps/flowcordia-studio-activepieces/package.json")
          app = json.loads(app_path.read_text())
          app["devDependencies"]["@types/react"] = "19"
          app["devDependencies"]["@types/react-dom"] = "19"
          app_path.write_text(json.dumps(app, indent=2) + "\n")

          workspace_path = Path("pnpm-workspace.yaml")
          workspace = workspace_path.read_text()
          workspace = workspace.replace('  - "studio-v2/activepieces-web"\n', "")
          old_scope = '  - "studio-v2/activepieces-core-nodes/packages/**"\n'
          new_scope = '''  - "studio-v2/activepieces-core-nodes/packages/core/execution"
          - "studio-v2/activepieces-core-nodes/packages/core/formula"
          - "studio-v2/activepieces-core-nodes/packages/core/piece-types"
          - "studio-v2/activepieces-core-nodes/packages/core/shared"
          - "studio-v2/activepieces-core-nodes/packages/core/utils"
          - "studio-v2/activepieces-core-nodes/packages/pieces/framework"
          '''
          if old_scope in workspace:
              workspace = workspace.replace(old_scope, new_scope, 1)
          elif new_scope not in workspace:
              raise SystemExit("Activepieces workspace scope no longer matches the expected boundary")
          workspace_path.write_text(workspace)

          catalog_path = Path("packages/flowcordia-workflow/src/studio-v2.ts")
          catalog = catalog_path.read_text()
          old_catalog = '''    availability: "adapter_required",
              availableInStudio: false,
              importedSource: "packages/core/execution and Windmill TypeScript editor reference",'''
          new_catalog = '''    availability: "native",
              availableInStudio: true,
              importedSource: "Activepieces Code editor and Flowcordia Secure Exec runtime",'''
          if old_catalog in catalog:
              catalog = catalog.replace(old_catalog, new_catalog, 1)
          elif new_catalog not in catalog:
              raise SystemExit("Studio Source catalog block no longer matches the expected boundary")
          catalog_path.write_text(catalog)

          test_path = Path("packages/flowcordia-workflow/src/studio-v2.test.ts")
          test = test_path.read_text()
          test, replacements = re.subn(
              r'(expect\(adapterRequired\.map\(\(entry\) => entry\.id\)\)\.toEqual\(\[\s*)"source",\s*',
              r'\1',
              test,
              count=1,
          )
          if replacements == 0 and '"source",\n      "loop",' in test:
              raise SystemExit("Studio Source catalog test still exposes Source as adapter-required")
          test_path.write_text(test)

      - name: Regenerate exact workspace lockfile
        run: pnpm install --no-frozen-lockfile

      - name: Generate database clients
        run: pnpm run generate

      - name: Install Chromium for Studio acceptance
        run: pnpm --filter @flowcordia/studio-activepieces exec playwright install chromium --with-deps

      - name: Normalize owned Studio files
        run: |
          pnpm exec oxfmt \
            apps/flowcordia-studio-activepieces \
            apps/webapp/app/features/flowcordia/workflows/studio-v2 \
            "apps/webapp/app/routes/_app.orgs.\$organizationSlug.projects.\$projectParam.env.\$envParam.flowcordia.studio-v2/route.tsx" \
            apps/webapp/test/flowcordia/studioV2PreviewRoute.test.ts \
            apps/webapp/test/flowcordia/studioV2ImmutableReleasePersistence.test.ts \
            packages/flowcordia-workflow/src/definition.ts \
            packages/flowcordia-workflow/src/index.ts \
            packages/flowcordia-workflow/src/studio-v2.ts \
            packages/flowcordia-workflow/src/studio-v2.test.ts \
            package.json \
            pnpm-workspace.yaml

      - name: Check formatting
        run: |
          pnpm exec oxfmt --check \
            apps/flowcordia-studio-activepieces \
            apps/webapp/app/features/flowcordia/workflows/studio-v2 \
            "apps/webapp/app/routes/_app.orgs.\$organizationSlug.projects.\$projectParam.env.\$envParam.flowcordia.studio-v2/route.tsx" \
            apps/webapp/test/flowcordia/studioV2PreviewRoute.test.ts \
            apps/webapp/test/flowcordia/studioV2ImmutableReleasePersistence.test.ts \
            packages/flowcordia-workflow/src/definition.ts \
            packages/flowcordia-workflow/src/index.ts \
            packages/flowcordia-workflow/src/studio-v2.ts \
            packages/flowcordia-workflow/src/studio-v2.test.ts \
            package.json \
            pnpm-workspace.yaml

      - name: Typecheck Activepieces Studio
        run: pnpm --filter @flowcordia/studio-activepieces typecheck

      - name: Test Activepieces Studio adapter
        run: pnpm --filter @flowcordia/studio-activepieces test

      - name: Typecheck workflow contracts
        run: pnpm --filter @flowcordia/workflow typecheck

      - name: Test workflow contracts
        run: pnpm --filter @flowcordia/workflow test -- --run

      - name: Build Activepieces Studio
        run: pnpm --filter @flowcordia/studio-activepieces build

      - name: Run Studio browser acceptance
        run: pnpm --filter @flowcordia/studio-activepieces test:e2e

      - name: Run focused deployment tests
        run: |
          pnpm --filter webapp exec vitest run \
            app/features/flowcordia/workflows/studio-v2/workspace-http.test.ts \
            app/features/flowcordia/workflows/studio-v2/deployment-context.test.ts \
            test/flowcordia/studioV2PreviewRoute.test.ts \
            test/flowcordia/studioV2ImmutableReleasePersistence.test.ts

      - name: Typecheck webapp
        run: pnpm --filter webapp typecheck

      - name: Build webapp
        run: pnpm --filter webapp build

      - name: Commit exact validated Studio state
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          rm -f .github/workflows/studio-v2-activepieces-deployment-validation.yml
          git add -A
          if git diff --cached --quiet; then
            echo "Studio branch already contains the exact validated state."
            exit 0
          fi

          git config user.name "Flowcordia Studio Agent"
          git config user.email "flowcordia-studio-agent@users.noreply.github.com"
          git commit -m "Finalize and validate Studio V2"

          auth_header=$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic ${auth_header}" \
            push origin HEAD:refs/heads/agent/studio-v2-activepieces-deployment
