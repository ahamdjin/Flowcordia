name: Flowcordia Private Beta dossier temporary formatter

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/flowcordia-private-beta-dossier-format.yml"

permissions: {}

jobs:
  format:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Checkout exact revision
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5.0.0
        with:
          version: 10.33.2

      - name: Setup Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 20.20.2
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Format exact dossier sources
        run: |
          pnpm exec oxfmt --write \
            apps/webapp/app/features/flowcordia/acceptance/private-beta-dossier.ts \
            apps/webapp/test/flowcordia/privateBetaDossier.test.ts \
            scripts/flowcordia-private-beta-dossier.ts
          mkdir -p "$RUNNER_TEMP/formatted/apps/webapp/app/features/flowcordia/acceptance"
          mkdir -p "$RUNNER_TEMP/formatted/apps/webapp/test/flowcordia"
          mkdir -p "$RUNNER_TEMP/formatted/scripts"
          cp apps/webapp/app/features/flowcordia/acceptance/private-beta-dossier.ts "$RUNNER_TEMP/formatted/apps/webapp/app/features/flowcordia/acceptance/"
          cp apps/webapp/test/flowcordia/privateBetaDossier.test.ts "$RUNNER_TEMP/formatted/apps/webapp/test/flowcordia/"
          cp scripts/flowcordia-private-beta-dossier.ts "$RUNNER_TEMP/formatted/scripts/"

      - name: Upload canonical files
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: flowcordia-private-beta-dossier-formatted-${{ github.run_id }}
          path: ${{ runner.temp }}/formatted
          if-no-files-found: error
          retention-days: 1
          include-hidden-files: false
