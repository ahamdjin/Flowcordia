name: Flowcordia Beta promotion recovery checks

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/flowcordia-beta-promotion-recovery.yml"
      - ".github/workflows/flowcordia-beta-promotion-recovery-checks.yml"
      - "apps/webapp/app/features/flowcordia/acceptance/beta-promotion-recovery.ts"
      - "apps/webapp/test/flowcordia/betaPromotionRecovery.test.ts"
      - "scripts/flowcordia-beta-promotion-recovery.ts"
      - "flowcordia/testing/beta-promotion-recovery.md"
  push:
    branches: [main]
    paths:
      - ".github/workflows/flowcordia-beta-promotion-recovery.yml"
      - "apps/webapp/app/features/flowcordia/acceptance/beta-promotion-recovery.ts"
      - "scripts/flowcordia-beta-promotion-recovery.ts"

permissions: {}

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Checkout exact revision
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5.0.0
        with:
          version: 10.33.2

      - name: Setup Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 20.20.2
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run recovery-chain contracts
        run: pnpm --filter webapp exec vitest run test/flowcordia/betaPromotionRecovery.test.ts

      - name: Validate protected workflow and evidence boundaries
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('node:fs');
          const workflow = fs.readFileSync('.github/workflows/flowcordia-beta-promotion-recovery.yml', 'utf8');
          const contract = fs.readFileSync('apps/webapp/app/features/flowcordia/acceptance/beta-promotion-recovery.ts', 'utf8');
          const requiredWorkflow = [
            'workflow_dispatch:',
            "if: github.ref == 'refs/heads/main'",
            'environment: flowcordia-release-evidence',
            'actions: read',
            'flowcordia-self-host-lifecycle.yml',
            'flowcordia-production-acceptance.yml',
            'retention-days: 90',
            'rm -rf "$FLOWCORDIA_BETA_PRIVATE_DIR"',
          ];
          for (const marker of requiredWorkflow) {
            if (!workflow.includes(marker)) throw new Error(`Missing protected workflow boundary: ${marker}`);
          }
          if (/\bpull_request\s*:/.test(workflow)) {
            throw new Error('Destructive recovery assembly must not run for pull requests.');
          }
          for (const marker of [
            'backupManifestSha256',
            'restoreEvidenceSha256',
            'rollbackMode',
            'reused_rollback_identity',
            'invalid_chronology',
            'artifactArchiveSha256',
          ]) {
            if (!contract.includes(marker)) throw new Error(`Missing recovery contract boundary: ${marker}`);
          }
          for (const forbidden of ['payload', 'credential', 'browserState', 'providerResponse']) {
            if (contract.includes(forbidden)) throw new Error(`Forbidden evidence field: ${forbidden}`);
          }
          NODE
          git diff --check

      - name: Check exact changed-source formatting
        run: |
          pnpm exec oxfmt --check \
            apps/webapp/app/features/flowcordia/acceptance/beta-promotion-recovery.ts \
            apps/webapp/test/flowcordia/betaPromotionRecovery.test.ts \
            scripts/flowcordia-beta-promotion-recovery.ts
