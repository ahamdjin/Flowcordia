name: Flowcordia Beta failure temporary formatter

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/flowcordia-beta-failure-formatter.yml"

permissions: {}

jobs:
  format:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Checkout exact revision
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5.0.0
        with:
          version: 10.33.2

      - name: Setup Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 20.20.2
          cache: pnpm

      - name: Format exact source set
        run: |
          pnpm install --frozen-lockfile
          pnpm exec oxfmt --write \
            apps/webapp/app/features/flowcordia/acceptance/beta-failure-contract.ts \
            apps/webapp/scripts/flowcordia-beta-failure-delivery.ts \
            apps/webapp/scripts/flowcordia-bundled-reference-bootstrap.ts \
            apps/webapp/test/flowcordia/betaFailureAcceptance.test.ts \
            scripts/flowcordia-beta-failure-evidence.ts \
            scripts/flowcordia-beta-load-client.ts
          tar -czf "$RUNNER_TEMP/flowcordia-beta-formatted.tar.gz" \
            apps/webapp/app/features/flowcordia/acceptance/beta-failure-contract.ts \
            apps/webapp/scripts/flowcordia-beta-failure-delivery.ts \
            apps/webapp/scripts/flowcordia-bundled-reference-bootstrap.ts \
            apps/webapp/test/flowcordia/betaFailureAcceptance.test.ts \
            scripts/flowcordia-beta-failure-evidence.ts \
            scripts/flowcordia-beta-load-client.ts

      - name: Upload canonical formatted sources
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: flowcordia-beta-formatted-${{ github.run_id }}
          path: ${{ runner.temp }}/flowcordia-beta-formatted.tar.gz
          if-no-files-found: error
          retention-days: 1
          include-hidden-files: false
