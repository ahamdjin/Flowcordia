name: Flowcordia Beta failure temporary formatter

on:
  push:
    branches:
      - agent/flowcordia-beta-failure-campaign
    paths:
      - ".github/workflows/flowcordia-beta-failure-formatter.yml"

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout branch
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: agent/flowcordia-beta-failure-campaign
          fetch-depth: 1

      - name: Setup pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5.0.0
        with:
          version: 10.33.2

      - name: Setup Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 20.20.2
          cache: pnpm

      - name: Format exact source set and remove formatter
        shell: bash
        run: |
          set -euo pipefail
          pnpm install --frozen-lockfile
          pnpm exec oxfmt --write \
            apps/webapp/app/features/flowcordia/acceptance/beta-failure-contract.ts \
            apps/webapp/scripts/flowcordia-beta-failure-delivery.ts \
            apps/webapp/scripts/flowcordia-bundled-reference-bootstrap.ts \
            apps/webapp/test/flowcordia/betaFailureAcceptance.test.ts \
            scripts/flowcordia-beta-failure-evidence.ts \
            scripts/flowcordia-beta-load-client.ts
          rm .github/workflows/flowcordia-beta-failure-formatter.yml
          git config user.name "flowcordia-ci"
          git config user.email "flowcordia-ci@users.noreply.github.com"
          git add \
            .github/workflows/flowcordia-beta-failure-formatter.yml \
            apps/webapp/app/features/flowcordia/acceptance/beta-failure-contract.ts \
            apps/webapp/scripts/flowcordia-beta-failure-delivery.ts \
            apps/webapp/scripts/flowcordia-bundled-reference-bootstrap.ts \
            apps/webapp/test/flowcordia/betaFailureAcceptance.test.ts \
            scripts/flowcordia-beta-failure-evidence.ts \
            scripts/flowcordia-beta-load-client.ts
          git commit -m "Format Beta failure acceptance sources"
          git push origin HEAD:agent/flowcordia-beta-failure-campaign
