name: Clean-install onboarding source export

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  export:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.head_ref == 'agent/clean-install-onboarding-acceptance'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false

      - name: Capture first-run acceptance sources
        shell: bash
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/clean-install-onboarding-source"
          mkdir -p "$root"
          {
            find apps/webapp/app/routes -type f \
              | grep -Ei 'setup|orgs|projects|invite|invitation|member|deploy|flowcordia|github|login' || true
            find apps/webapp/app/features/flowcordia -type f \
              | grep -Ei 'setup|acceptance|deployment|workflow|github' || true
            find apps/webapp/app/services apps/webapp/app/models -type f \
              | grep -Ei 'invite|invitation|member|project|organization|github|deploy|session|password' || true
            find tests -type f | grep -Ei 'org|project|invite|deploy|login|setup' || true
            printf '%s\n' \
              playwright.config.ts \
              tests/global.setup.ts \
              docker/flowcordia-self-host.yml \
              docker/flowcordia-bundled.example \
              docker/flowcordia-bundled.secrets.example \
              scripts/flowcordia-self-host-lifecycle-run.sh \
              .github/workflows/flowcordia-self-host-lifecycle.yml
          } | sort -u > "$root/files.txt"

          while IFS= read -r file; do
            [[ -f "$file" ]] || continue
            mkdir -p "$root/$(dirname "$file")"
            cp "$file" "$root/$file"
          done < "$root/files.txt"

      - name: Upload source snapshot
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: clean-install-onboarding-source
          path: ${{ runner.temp }}/clean-install-onboarding-source
          retention-days: 1
