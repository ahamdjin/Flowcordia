name: Final Flowcordia CLI parseArgs migration

on:
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout exact pull request head
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5.0.0
        with:
          version: 10.33.2

      - name: Setup Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 20.20.2
          cache: pnpm

      - name: Validate exact final CLI migration
        run: bash .agent/validate-final-cli.sh

      - name: Upload validated final CLI files
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: operations-cli-final-validated-${{ github.run_id }}
          path: |
            apps/webapp/scripts/flowcordia-alert-preflight.ts
            apps/webapp/scripts/flowcordia-provider-preflight.ts
            docker/scripts/flowcordia-doctor.mjs
            scripts/flowcordia-release-image-evidence.ts
            scripts/flowcordia-self-host-artifact-preflight.ts
            scripts/flowcordia-self-host-clean-dependencies.ts
            scripts/flowcordia-self-host-exec.ts
            scripts/flowcordia-self-host-lifecycle-evidence.ts
            scripts/flowcordia-self-host-validate.ts
            scripts/flowcordia-upstream-drift.mjs
          retention-days: 1

      - name: Upload migration diagnostics
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: operations-cli-final-diagnostics-${{ github.run_id }}
          path: |
            /tmp/operations-cli-final-typecheck.log
            /tmp/cli-output.log
            apps/webapp/scripts/flowcordia-alert-preflight.ts
            apps/webapp/scripts/flowcordia-provider-preflight.ts
            docker/scripts/flowcordia-doctor.mjs
            scripts/flowcordia-release-image-evidence.ts
            scripts/flowcordia-self-host-artifact-preflight.ts
            scripts/flowcordia-self-host-clean-dependencies.ts
            scripts/flowcordia-self-host-exec.ts
            scripts/flowcordia-self-host-lifecycle-evidence.ts
            scripts/flowcordia-self-host-validate.ts
            scripts/flowcordia-upstream-drift.mjs
          if-no-files-found: ignore
          retention-days: 1
