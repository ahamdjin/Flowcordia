name: Apply validated Flowcordia Turbo 2 migration

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/flowcordia-turbo2-migration-apply.yml"
      - ".github/scripts/flowcordia-turbo2-migration.py"

permissions: {}

concurrency:
  group: flowcordia-turbo2-migration-apply-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  apply:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'agent/flowcordia-turbo2-migration'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: write
    steps:
      - name: Checkout exact guarded pull request head
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5.0.0
        with:
          version: 10.33.2

      - name: Setup Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 20.20.2
          cache: pnpm

      - name: Apply the reviewed source and policy migration
        run: python .github/scripts/flowcordia-turbo2-migration.py

      - name: Regenerate and install the exact dependency graph
        run: |
          pnpm install --lockfile-only
          pnpm install --frozen-lockfile

      - name: Reprove Turbo 2 and repository compatibility
        shell: bash
        run: |
          set -euo pipefail
          test "$(pnpm exec turbo --version)" = "2.10.6"
          pnpm exec turbo run build --dry=json > /tmp/flowcordia-turbo2-build-graph.json
          test -s /tmp/flowcordia-turbo2-build-graph.json
          pnpm generate
          git diff --check

      - name: Reprove the exception-aware OSV result
        uses: google/osv-scanner-action/osv-scanner-action@9a498708959aeaef5ef730655706c5a1df1edbc2 # v2.3.8
        with:
          scan-args: |-
            --config=osv-scanner.toml
            --format=json
            --output=osv-turbo2-results.json
            --lockfile=pnpm-lock.yaml

      - name: Validate the generated migration path boundary
        shell: bash
        run: |
          set -euo pipefail
          expected=$'.github/workflows/flowcordia-dependency-remediation-checks.yml\nflowcordia/security/dependency-remediation.md\nosv-scanner.toml\npackage.json\npnpm-lock.yaml\nturbo.json'
          actual="$(git diff --name-only | sort)"
          printf '%s\n' "$actual" | tee migration-paths.log
          if [ "$actual" != "$expected" ]; then
            echo "Generated migration path boundary changed." >&2
            exit 1
          fi

      - name: Create the validated graph commit
        shell: bash
        run: |
          set -euo pipefail
          git checkout -- .github/workflows/flowcordia-dependency-remediation-checks.yml
          git config user.name "flowcordia-release-bot"
          git config user.email "flowcordia-release-bot@users.noreply.github.com"
          git add package.json pnpm-lock.yaml turbo.json osv-scanner.toml \
            flowcordia/security/dependency-remediation.md
          git diff --cached --check
          git commit -m "Migrate repository orchestration to Turbo 2" 2>&1 | tee migration-commit.log

      - name: Push the validated graph commit
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          auth="$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          git -c http.https://github.com/.extraheader="AUTHORIZATION: basic $auth" \
            push origin HEAD:agent/flowcordia-turbo2-migration 2>&1 | tee migration-push.log

      - name: Preserve transaction diagnostics
        if: always() && !cancelled()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: flowcordia-turbo2-transaction-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            migration-paths.log
            migration-commit.log
            migration-push.log
          if-no-files-found: warn
          retention-days: 7
