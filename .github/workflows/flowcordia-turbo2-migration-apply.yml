name: Prepare validated Flowcordia Turbo 2 migration

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/flowcordia-turbo2-migration-apply.yml"
      - ".github/scripts/flowcordia-turbo2-migration.py"

permissions: {}

jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
    steps:
      - name: Checkout exact pull request head
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5.0.0
        with:
          version: 10.33.2

      - name: Setup Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 20.20.2
          cache: pnpm

      - name: Apply the bounded source and policy migration
        run: python .github/scripts/flowcordia-turbo2-migration.py

      - name: Regenerate the exact pnpm lockfile
        run: pnpm install --lockfile-only

      - name: Install the regenerated graph
        run: pnpm install --frozen-lockfile

      - name: Validate the exact Turbo 2 version
        shell: bash
        run: |
          set -euo pipefail
          pnpm exec turbo --version | tee turbo2-version.log
          test "$(cat turbo2-version.log)" = "2.10.6"

      - name: Validate the Turbo 2 build graph
        shell: bash
        run: |
          set -euo pipefail
          pnpm exec turbo run build --dry=json 2>&1 | tee turbo2-build-graph.log
          test -s turbo2-build-graph.log

      - name: Execute repository generation through Turbo 2
        shell: bash
        run: |
          set -euo pipefail
          pnpm generate 2>&1 | tee turbo2-generate.log
          git diff --check

      - name: Scan the migrated lockfile without Turbo exceptions
        uses: google/osv-scanner-action/osv-scanner-action@9a498708959aeaef5ef730655706c5a1df1edbc2 # v2.3.8
        with:
          scan-args: |-
            --config=osv-scanner.toml
            --format=json
            --output=osv-turbo2-results.json
            --lockfile=pnpm-lock.yaml

      - name: Stage the exact validated migration
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p turbo2-migration/.github/workflows
          mkdir -p turbo2-migration/flowcordia/security
          cp package.json turbo2-migration/package.json
          cp pnpm-lock.yaml turbo2-migration/pnpm-lock.yaml
          cp turbo.json turbo2-migration/turbo.json
          cp osv-scanner.toml turbo2-migration/osv-scanner.toml
          cp .github/workflows/flowcordia-dependency-remediation-checks.yml \
            turbo2-migration/.github/workflows/flowcordia-dependency-remediation-checks.yml
          cp flowcordia/security/dependency-remediation.md \
            turbo2-migration/flowcordia/security/dependency-remediation.md
          cp osv-turbo2-results.json turbo2-migration/osv-turbo2-results.json

      - name: Preserve the validated migration artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: flowcordia-turbo2-migration-${{ github.run_id }}-${{ github.run_attempt }}
          path: turbo2-migration
          if-no-files-found: error
          retention-days: 7
          include-hidden-files: true

      - name: Preserve Turbo 2 diagnostics
        if: always() && !cancelled()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: flowcordia-turbo2-diagnostics-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            turbo2-version.log
            turbo2-build-graph.log
            turbo2-generate.log
          if-no-files-found: warn
          retention-days: 7
          include-hidden-files: false
