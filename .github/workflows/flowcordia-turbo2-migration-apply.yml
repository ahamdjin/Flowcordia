name: Apply validated Flowcordia Turbo 2 migration

on:
  push:
    branches:
      - "agent/flowcordia-turbo2-migration"
    paths:
      - ".github/workflows/flowcordia-turbo2-migration-apply.yml"
      - ".github/scripts/flowcordia-turbo2-migration.py"

permissions: {}

concurrency:
  group: flowcordia-turbo2-migration-apply
  cancel-in-progress: false

jobs:
  migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: write
    steps:
      - name: Checkout migration branch without persisted credentials
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: agent/flowcordia-turbo2-migration
          fetch-depth: 0
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5.0.0
        with:
          version: 10.33.2

      - name: Setup Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 20.20.2
          cache: pnpm

      - name: Apply the bounded source and policy migration
        run: python .github/scripts/flowcordia-turbo2-migration.py

      - name: Regenerate the exact pnpm lockfile
        run: pnpm install --lockfile-only

      - name: Install the regenerated graph
        run: pnpm install --frozen-lockfile

      - name: Validate Turbo 2 configuration and repository generation
        shell: bash
        run: |
          set -euo pipefail
          test "$(pnpm exec turbo --version)" = "2.10.6"
          pnpm exec turbo run build --dry=json > /tmp/flowcordia-turbo2-build-graph.json
          test -s /tmp/flowcordia-turbo2-build-graph.json
          pnpm generate
          git diff --check

      - name: Scan the migrated lockfile without Turbo exceptions
        uses: google/osv-scanner-action/osv-scanner-action@9a498708959aeaef5ef730655706c5a1df1edbc2 # v2.3.8
        with:
          scan-args: |-
            --config=osv-scanner.toml
            --format=json
            --output=osv-turbo2-results.json
            --lockfile=pnpm-lock.yaml

      - name: Commit the validated migration and remove temporary machinery
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          rm .github/workflows/flowcordia-turbo2-migration-apply.yml
          rm .github/scripts/flowcordia-turbo2-migration.py
          git config user.name "flowcordia-release-bot"
          git config user.email "flowcordia-release-bot@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Migrate repository orchestration to Turbo 2"
          auth="$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          git -c http.https://github.com/.extraheader="AUTHORIZATION: basic $auth" \
            push origin HEAD:agent/flowcordia-turbo2-migration
