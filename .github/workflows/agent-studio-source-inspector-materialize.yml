name: Materialize verified Studio source and inspector redesign

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/agent-studio-source-inspector-materialize.yml"

permissions: {}

concurrency:
  group: studio-source-inspector-materialize-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  materialize:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - name: Checkout exact pull request head
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Setup pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5.0.0
        with:
          version: 10.33.2

      - name: Setup Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 20.20.2
          cache: pnpm

      - name: Reconstruct exact verified product files
        shell: bash
        run: |
          set -euo pipefail
          printf '%s  %s\n' \
            '5043529078180c12b35e989a88ca1ddffb7ce4de3cb80899c67df5cb02b870cb' '.agent/studio-source-inspector.part0' \
            'a92e203ae39f4cf585b70835d42c9b6a964ca2bd2c792a22d72737a6fe8b5bad' '.agent/studio-source-inspector.part1' | sha256sum --check --strict
          cat .agent/studio-source-inspector.part0 .agent/studio-source-inspector.part1 > /tmp/studio-source-inspector.patch.gz.b64
          printf '%s  %s\n' '5f2003fc803efda2b4668553dac7f9299a2c0f2a006cef5e8c16f7df7603769e' '/tmp/studio-source-inspector.patch.gz.b64' | sha256sum --check --strict
          base64 --decode /tmp/studio-source-inspector.patch.gz.b64 | gzip --decompress > /tmp/studio-source-inspector.patch
          printf '%s  %s\n' '005bafedd5f04cfc526a2806f670471593dc6c67d50ff871e4ef25a9f273d366' '/tmp/studio-source-inspector.patch' | sha256sum --check --strict
          git apply --check /tmp/studio-source-inspector.patch
          git apply /tmp/studio-source-inspector.patch
          python <<'PY'
          from pathlib import Path
          import re

          source = Path('apps/webapp/app/features/flowcordia/workflows/studio/WorkflowSourceWorkspace.tsx')
          source.write_text(source.read_text().replace('LockKeyholeIcon', 'LockIcon'))

          credentials = Path('apps/webapp/app/features/flowcordia/workflows/studio/WorkflowStudioCredentialReferencesEditor.tsx')
          credential_text = credentials.read_text().replace('KeyRoundIcon', 'KeyIcon').replace('LockKeyholeIcon', 'LockIcon')
          credential_text = credential_text.replace(
              'Secret-safe names resolved only by the deployed runtime.',
              'Studio stores reference names only and never reads the secret value. Secrets resolve only in the deployed runtime.',
          )
          credential_text = credential_text.replace(
              'Add a reference name. Studio never requests the secret value.',
              'Add a reference name. Studio never requests or displays secret values.',
          )
          credentials.write_text(credential_text)

          edge = Path('apps/webapp/app/features/flowcordia/workflows/studio/WorkflowStudioEdgeInspector.tsx')
          edge_text = edge.read_text().replace('import { Button } from "~/components/primitives/Buttons";\n', '')
          replacement = '''          <button
            type="button"
            data-testid="flowcordia-save-edge"
            className="inline-flex h-8 items-center justify-center gap-1.5 rounded-md border border-indigo-400/25 bg-indigo-500 px-2.5 text-xxs font-medium text-white transition hover:bg-indigo-400 focus-custom disabled:cursor-not-allowed disabled:opacity-50"
            disabled={busy || !changed || !result.success}
            onClick={() => result.success && onCommand(result.command)}
          >
            <SaveIcon className="size-3.5" />
            Save connection
          </button>'''
          edge_text, replaced = re.subn(
              r'(?ms)^\s{10}<Button\s+data-testid="flowcordia-save-edge".*?^\s{10}</Button>',
              replacement,
              edge_text,
              count=1,
          )
          if replaced != 1:
              raise SystemExit(f'Expected one edge save control, replaced {replaced}')
          edge.write_text(edge_text)
          PY

      - name: Install exact formatter
        run: pnpm install --frozen-lockfile

      - name: Format exact product boundary
        run: |
          pnpm exec oxfmt \
            apps/webapp/app/features/flowcordia/workflows/studio/WorkflowSourceWorkspace.tsx \
            apps/webapp/app/features/flowcordia/workflows/studio/WorkflowStudioNodeConfigurationEditor.tsx \
            apps/webapp/app/features/flowcordia/workflows/studio/WorkflowStudioEdgeInspector.tsx \
            apps/webapp/app/features/flowcordia/workflows/studio/WorkflowStudioExecutionPolicyEditor.tsx \
            apps/webapp/app/features/flowcordia/workflows/studio/WorkflowStudioCredentialReferencesEditor.tsx
          git diff --check -- \
            apps/webapp/app/features/flowcordia/workflows/studio/WorkflowSourceWorkspace.tsx \
            apps/webapp/app/features/flowcordia/workflows/studio/WorkflowStudioNodeConfigurationEditor.tsx \
            apps/webapp/app/features/flowcordia/workflows/studio/WorkflowStudioEdgeInspector.tsx \
            apps/webapp/app/features/flowcordia/workflows/studio/WorkflowStudioExecutionPolicyEditor.tsx \
            apps/webapp/app/features/flowcordia/workflows/studio/WorkflowStudioCredentialReferencesEditor.tsx

      - name: Stage and verify exact commit boundary
        shell: bash
        run: |
          set -euo pipefail
          rm -f \
            .agent/studio-source-inspector.part0 \
            .agent/studio-source-inspector.part1 \
            .github/workflows/agent-studio-source-inspector-export.yml \
            .github/workflows/agent-studio-source-inspector-materialize.yml
          rmdir .agent 2>/dev/null || true
          git add \
            apps/webapp/app/features/flowcordia/workflows/studio/WorkflowSourceWorkspace.tsx \
            apps/webapp/app/features/flowcordia/workflows/studio/WorkflowStudioNodeConfigurationEditor.tsx \
            apps/webapp/app/features/flowcordia/workflows/studio/WorkflowStudioEdgeInspector.tsx \
            apps/webapp/app/features/flowcordia/workflows/studio/WorkflowStudioExecutionPolicyEditor.tsx \
            apps/webapp/app/features/flowcordia/workflows/studio/WorkflowStudioCredentialReferencesEditor.tsx \
            .agent/studio-source-inspector.part0 \
            .agent/studio-source-inspector.part1 \
            .github/workflows/agent-studio-source-inspector-export.yml \
            .github/workflows/agent-studio-source-inspector-materialize.yml
          mapfile -t staged < <(git diff --cached --name-only | sort)
          expected=(
            .agent/studio-source-inspector.part0
            .agent/studio-source-inspector.part1
            .github/workflows/agent-studio-source-inspector-export.yml
            .github/workflows/agent-studio-source-inspector-materialize.yml
            apps/webapp/app/features/flowcordia/workflows/studio/WorkflowSourceWorkspace.tsx
            apps/webapp/app/features/flowcordia/workflows/studio/WorkflowStudioCredentialReferencesEditor.tsx
            apps/webapp/app/features/flowcordia/workflows/studio/WorkflowStudioEdgeInspector.tsx
            apps/webapp/app/features/flowcordia/workflows/studio/WorkflowStudioExecutionPolicyEditor.tsx
            apps/webapp/app/features/flowcordia/workflows/studio/WorkflowStudioNodeConfigurationEditor.tsx
          )
          mapfile -t expected < <(printf '%s\n' "${expected[@]}" | sort)
          diff -u <(printf '%s\n' "${expected[@]}") <(printf '%s\n' "${staged[@]}")

      - name: Commit verified Studio redesign
        shell: bash
        env:
          HEAD_BRANCH: ${{ github.event.pull_request.head.ref }}
        run: |
          set -euo pipefail
          git config user.name 'Flowcordia Studio migration'
          git config user.email 'actions@users.noreply.github.com'
          git commit -m 'Redesign Studio source and inspector workbench'
          git push origin "HEAD:${HEAD_BRANCH}"
