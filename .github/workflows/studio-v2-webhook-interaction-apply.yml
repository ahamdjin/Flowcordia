name: Studio V2 webhook interaction apply

on:
  pull_request:
    branches: [main]
    paths:
      - ".studio-v2-webhook-interaction-kick"

permissions:
  contents: write

jobs:
  apply:
    if: github.event.pull_request.head.ref == 'agent/studio-v2-activepieces-webhook-parity'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: agent/studio-v2-activepieces-webhook-parity
          fetch-depth: 1
          persist-credentials: true
      - name: Extend Trigger.dev interaction task with webhook hooks
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          context_path = Path("apps/webapp/app/features/flowcordia/workflows/studio-v2/activepieces-interaction-context.server.ts")
          text = context_path.read_text()

          old = (
              '  executeFlowcordiaActivepiecesTriggerDisable,\n'
              '  executeFlowcordiaActivepiecesTriggerEnable,\n'
              '  executeFlowcordiaActivepiecesTriggerRun,\n'
              '  executeFlowcordiaActivepiecesTriggerTest,\n'
              '} from "@flowcordia/runtime";'
          )
          new = (
              '  executeFlowcordiaActivepiecesTriggerDisable,\n'
              '  executeFlowcordiaActivepiecesTriggerEnable,\n'
              '  executeFlowcordiaActivepiecesTriggerHandshake,\n'
              '  executeFlowcordiaActivepiecesTriggerRenew,\n'
              '  executeFlowcordiaActivepiecesTriggerRun,\n'
              '  executeFlowcordiaActivepiecesTriggerTest,\n'
              '  inspectFlowcordiaActivepiecesWebhookTrigger,\n'
              '} from "@flowcordia/runtime";'
          )
          if old not in text:
              raise SystemExit("interaction import anchor not found")
          text = text.replace(old, new, 1)

          old = (
              '  | {\n'
              '      requestId: string;\n'
              '      kind: "trigger_test";\n'
              '      interaction: FlowcordiaActivepiecesTriggerInteraction;\n'
              '    }\n'
              '  | {\n'
              '      requestId: string;\n'
              '      kind: "trigger_simulation";'
          )
          new = (
              '  | {\n'
              '      requestId: string;\n'
              '      kind: "trigger_test";\n'
              '      interaction: FlowcordiaActivepiecesTriggerInteraction;\n'
              '    }\n'
              '  | {\n'
              '      requestId: string;\n'
              '      kind: "trigger_webhook_inspect";\n'
              '      interaction: FlowcordiaActivepiecesTriggerInteraction;\n'
              '    }\n'
              '  | {\n'
              '      requestId: string;\n'
              '      kind: "trigger_handshake";\n'
              '      interaction: FlowcordiaActivepiecesTriggerInteraction;\n'
              '    }\n'
              '  | {\n'
              '      requestId: string;\n'
              '      kind: "trigger_renew";\n'
              '      interaction: FlowcordiaActivepiecesTriggerInteraction;\n'
              '    }\n'
              '  | {\n'
              '      requestId: string;\n'
              '      kind: "trigger_simulation";'
          )
          if old not in text:
              raise SystemExit("interaction payload anchor not found")
          text = text.replace(old, new, 1)

          old = (
              '        case "trigger_test":\n'
              '          result = await executeFlowcordiaActivepiecesTriggerTest({ interaction: payload.interaction, services });\n'
              '          break;\n'
              '        case "trigger_simulation": {'
          )
          new = (
              '        case "trigger_test":\n'
              '          result = await executeFlowcordiaActivepiecesTriggerTest({ interaction: payload.interaction, services });\n'
              '          break;\n'
              '        case "trigger_webhook_inspect":\n'
              '          result = JSON.parse(JSON.stringify(await inspectFlowcordiaActivepiecesWebhookTrigger({ interaction: payload.interaction, services }))) as JsonValue;\n'
              '          break;\n'
              '        case "trigger_handshake":\n'
              '          result = JSON.parse(JSON.stringify(await executeFlowcordiaActivepiecesTriggerHandshake({ interaction: payload.interaction, services }))) as JsonValue;\n'
              '          break;\n'
              '        case "trigger_renew":\n'
              '          await executeFlowcordiaActivepiecesTriggerRenew({ interaction: payload.interaction, services });\n'
              '          result = null;\n'
              '          break;\n'
              '        case "trigger_simulation": {'
          )
          if old not in text:
              raise SystemExit("interaction switch anchor not found")
          context_path.write_text(text.replace(old, new, 1))

          server_path = Path("apps/webapp/app/features/flowcordia/workflows/studio-v2/activepieces-interaction.server.ts")
          text = server_path.read_text()
          old = (
              '  | {\n'
              '      requestId?: string;\n'
              '      kind: "trigger_test";\n'
              '      interaction: {\n'
              '        pieceName: string;\n'
              '        triggerName: string;\n'
              '        input: Record<string, unknown>;\n'
              '        sampleData?: Record<string, unknown>;\n'
              '        webhookUrl?: string;\n'
              '        payload?: unknown;\n'
              '      };\n'
              '    }\n'
              '  | {\n'
              '      requestId?: string;\n'
              '      kind: "trigger_simulation";'
          )
          new = (
              '  | {\n'
              '      requestId?: string;\n'
              '      kind: "trigger_test";\n'
              '      interaction: {\n'
              '        pieceName: string;\n'
              '        triggerName: string;\n'
              '        input: Record<string, unknown>;\n'
              '        sampleData?: Record<string, unknown>;\n'
              '        webhookUrl?: string;\n'
              '        payload?: unknown;\n'
              '      };\n'
              '    }\n'
              '  | {\n'
              '      requestId?: string;\n'
              '      kind: "trigger_webhook_inspect" | "trigger_handshake" | "trigger_renew";\n'
              '      interaction: {\n'
              '        pieceName: string;\n'
              '        triggerName: string;\n'
              '        input: Record<string, unknown>;\n'
              '        sampleData?: Record<string, unknown>;\n'
              '        webhookUrl?: string;\n'
              '        payload?: unknown;\n'
              '      };\n'
              '    }\n'
              '  | {\n'
              '      requestId?: string;\n'
              '      kind: "trigger_simulation";'
          )
          if old not in text:
              raise SystemExit("server payload anchor not found")
          server_path.write_text(text.replace(old, new, 1))
          PY
      - name: Commit product patch and remove helper
        shell: bash
        run: |
          rm -f .github/workflows/studio-v2-webhook-interaction-apply.yml .studio-v2-webhook-interaction-kick
          git config user.name "flowcordia-studio-v2-bot"
          git config user.email "flowcordia-studio-v2-bot@users.noreply.github.com"
          git add -A
          git commit -m "feat(studio-v2): route Activepieces webhook hooks through Trigger.dev"
          git push origin HEAD:agent/studio-v2-activepieces-webhook-parity
