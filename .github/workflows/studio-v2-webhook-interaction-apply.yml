name: Studio V2 webhook interaction apply

on:
  pull_request:
    branches: [main]
    paths:
      - ".studio-v2-webhook-interaction-kick"

permissions:
  contents: write

jobs:
  apply:
    if: github.event.pull_request.head.ref == 'agent/studio-v2-activepieces-webhook-parity'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: agent/studio-v2-activepieces-webhook-parity
          fetch-depth: 1
          persist-credentials: true
      - name: Extend Trigger.dev interaction task with webhook hooks
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          context_path = Path("apps/webapp/app/features/flowcordia/workflows/studio-v2/activepieces-interaction-context.server.ts")
          text = context_path.read_text()
          old = '''  executeFlowcordiaActivepiecesTriggerDisable,
            executeFlowcordiaActivepiecesTriggerEnable,
            executeFlowcordiaActivepiecesTriggerRun,
            executeFlowcordiaActivepiecesTriggerTest,
          } from "@flowcordia/runtime";'''
          new = '''  executeFlowcordiaActivepiecesTriggerDisable,
            executeFlowcordiaActivepiecesTriggerEnable,
            executeFlowcordiaActivepiecesTriggerHandshake,
            executeFlowcordiaActivepiecesTriggerRenew,
            executeFlowcordiaActivepiecesTriggerRun,
            executeFlowcordiaActivepiecesTriggerTest,
            inspectFlowcordiaActivepiecesWebhookTrigger,
          } from "@flowcordia/runtime";'''
          if old not in text:
              raise SystemExit("interaction import anchor not found")
          text = text.replace(old, new, 1)

          old = '''  | {
              requestId: string;
              kind: "trigger_test";
              interaction: FlowcordiaActivepiecesTriggerInteraction;
            }
            | {
              requestId: string;
              kind: "trigger_simulation";'''
          new = '''  | {
              requestId: string;
              kind: "trigger_test";
              interaction: FlowcordiaActivepiecesTriggerInteraction;
            }
            | {
              requestId: string;
              kind: "trigger_webhook_inspect";
              interaction: FlowcordiaActivepiecesTriggerInteraction;
            }
            | {
              requestId: string;
              kind: "trigger_handshake";
              interaction: FlowcordiaActivepiecesTriggerInteraction;
            }
            | {
              requestId: string;
              kind: "trigger_renew";
              interaction: FlowcordiaActivepiecesTriggerInteraction;
            }
            | {
              requestId: string;
              kind: "trigger_simulation";'''
          if old not in text:
              raise SystemExit("interaction payload anchor not found")
          text = text.replace(old, new, 1)

          old = '''        case "trigger_test":
                  result = await executeFlowcordiaActivepiecesTriggerTest({ interaction: payload.interaction, services });
                  break;
                case "trigger_simulation": {'''
          new = '''        case "trigger_test":
                  result = await executeFlowcordiaActivepiecesTriggerTest({ interaction: payload.interaction, services });
                  break;
                case "trigger_webhook_inspect":
                  result = JSON.parse(
                    JSON.stringify(
                      await inspectFlowcordiaActivepiecesWebhookTrigger({
                        interaction: payload.interaction,
                        services,
                      })
                    )
                  ) as JsonValue;
                  break;
                case "trigger_handshake":
                  result = JSON.parse(
                    JSON.stringify(
                      await executeFlowcordiaActivepiecesTriggerHandshake({
                        interaction: payload.interaction,
                        services,
                      })
                    )
                  ) as JsonValue;
                  break;
                case "trigger_renew":
                  await executeFlowcordiaActivepiecesTriggerRenew({
                    interaction: payload.interaction,
                    services,
                  });
                  result = null;
                  break;
                case "trigger_simulation": {'''
          if old not in text:
              raise SystemExit("interaction switch anchor not found")
          text = text.replace(old, new, 1)
          context_path.write_text(text)

          server_path = Path("apps/webapp/app/features/flowcordia/workflows/studio-v2/activepieces-interaction.server.ts")
          text = server_path.read_text()
          old = '''  | {
              requestId?: string;
              kind: "trigger_test";
              interaction: {
                pieceName: string;
                triggerName: string;
                input: Record<string, unknown>;
                sampleData?: Record<string, unknown>;
                webhookUrl?: string;
                payload?: unknown;
              };
            }
            | {
              requestId?: string;
              kind: "trigger_simulation";'''
          hook_variant = '''  | {
              requestId?: string;
              kind: "trigger_test";
              interaction: {
                pieceName: string;
                triggerName: string;
                input: Record<string, unknown>;
                sampleData?: Record<string, unknown>;
                webhookUrl?: string;
                payload?: unknown;
              };
            }
            | {
              requestId?: string;
              kind: "trigger_webhook_inspect" | "trigger_handshake" | "trigger_renew";
              interaction: {
                pieceName: string;
                triggerName: string;
                input: Record<string, unknown>;
                sampleData?: Record<string, unknown>;
                webhookUrl?: string;
                payload?: unknown;
              };
            }
            | {
              requestId?: string;
              kind: "trigger_simulation";'''
          if old not in text:
              raise SystemExit("server payload anchor not found")
          server_path.write_text(text.replace(old, hook_variant, 1))
          PY
      - name: Commit product patch and remove helper
        shell: bash
        run: |
          rm -f .github/workflows/studio-v2-webhook-interaction-apply.yml .studio-v2-webhook-interaction-kick
          git config user.name "flowcordia-studio-v2-bot"
          git config user.email "flowcordia-studio-v2-bot@users.noreply.github.com"
          git add -A
          git commit -m "feat(studio-v2): route Activepieces webhook hooks through Trigger.dev"
          git push origin HEAD:agent/studio-v2-activepieces-webhook-parity
