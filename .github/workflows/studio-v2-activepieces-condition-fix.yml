name: Fix Studio V2 Activepieces condition bridge

on:
  push:
    branches:
      - agent/studio-v2-activepieces-frontend
    paths:
      - .github/workflows/studio-v2-activepieces-condition-fix.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/studio-v2-activepieces-frontend
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.2
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Apply condition narrowing and verify adapter
        shell: bash
        run: |
          set +e
          set -o pipefail
          {
            set -euo pipefail
            python <<'PY'
          from pathlib import Path

          path = Path('apps/flowcordia-studio-activepieces/src/flowcordia-activepieces-bridge.ts')
          text = path.read_text()
          old = '''    const rawPath = condition?.firstValue;
              const path = typeof rawPath === "string" ? rawPath.replace(/^{{|}}$/g, "") : "";
              const originalValue = original?.configuration.value;
          '''
          # tolerate normal formatting after previous automated patch
          if old not in text:
              old = '''    const rawPath = condition?.firstValue;
              const path = typeof rawPath === "string" ? rawPath.replace(/^{{|}}$/g, "") : "";
              const originalValue = original?.configuration.value;
          '''
          marker = '    const rawPath = condition?.firstValue;\n'
          if '    const secondValue =\n' not in text:
              text = text.replace(
                  marker,
                  marker + '    const secondValue = condition && "secondValue" in condition ? condition.secondValue : undefined;\n',
                  1,
              )
          text = text.replace('condition?.secondValue !== undefined', 'secondValue !== undefined')
          text = text.replace('Number(condition.secondValue)', 'Number(secondValue)')
          text = text.replace('(condition?.secondValue as JsonValue | undefined) ?? null', '(secondValue as JsonValue | undefined) ?? null')
          path.write_text(text)
          PY

            pnpm install --no-frozen-lockfile --config.minimum-release-age=0
            pnpm --filter @flowcordia/studio-activepieces typecheck
            pnpm --filter @flowcordia/studio-activepieces test
            pnpm --filter @flowcordia/studio-activepieces build
          } 2>&1 | tee /tmp/studio-v2-activepieces-condition.log
          status=${PIPESTATUS[0]}

          git config user.name "Flowcordia Studio Agent"
          git config user.email "actions@users.noreply.github.com"
          mkdir -p .flowcordia/automation
          if [ "$status" -eq 0 ]; then
            printf 'status: passed\n' > .flowcordia/automation/studio-v2-activepieces-adapter.txt
            git add apps/flowcordia-studio-activepieces/src/flowcordia-activepieces-bridge.ts pnpm-lock.yaml .flowcordia/automation/studio-v2-activepieces-adapter.txt
            git commit -m "Complete the reversible Activepieces workflow bridge"
          else
            { printf 'status: failed\n\n'; tail -n 360 /tmp/studio-v2-activepieces-condition.log; } > .flowcordia/automation/studio-v2-activepieces-adapter.txt
            git add .flowcordia/automation/studio-v2-activepieces-adapter.txt
            git commit -m "Record Activepieces condition bridge failure" || true
          fi
          git pull --rebase origin agent/studio-v2-activepieces-frontend
          git push origin HEAD:agent/studio-v2-activepieces-frontend
          exit "$status"
