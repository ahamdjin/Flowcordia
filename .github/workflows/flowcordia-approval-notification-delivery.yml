name: Flowcordia approval notification delivery

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/flowcordia-approval-notification-delivery.yml"
      - "apps/webapp/app/features/flowcordia/workflows/approval/notification-clock.ts"
      - "apps/webapp/app/features/flowcordia/workflows/approval/notification-processing.server.ts"
      - "apps/webapp/app/features/flowcordia/workflows/approval/notification.ts"
      - "apps/webapp/app/features/flowcordia/workflows/approval/notification.server.ts"
      - "apps/webapp/app/v3/alertsWorker.server.ts"
      - "apps/webapp/test/flowcordia/approvalNotificationClock.test.ts"
      - "apps/webapp/test/flowcordia/approvalNotificationDelivery.test.ts"
      - "internal-packages/database/prisma/schema.prisma"
      - "internal-packages/database/prisma/migrations/20260726011500_flowcordia_approval_notification_delivery/**"
      - "flowcordia/testing/approval-notification-delivery.md"
  push:
    branches: [main]
    paths:
      - ".github/workflows/flowcordia-approval-notification-delivery.yml"
      - "apps/webapp/app/features/flowcordia/workflows/approval/notification-clock.ts"
      - "apps/webapp/app/features/flowcordia/workflows/approval/notification-processing.server.ts"
      - "apps/webapp/app/features/flowcordia/workflows/approval/notification.ts"
      - "apps/webapp/app/features/flowcordia/workflows/approval/notification.server.ts"
      - "apps/webapp/app/v3/alertsWorker.server.ts"
      - "apps/webapp/test/flowcordia/approvalNotificationClock.test.ts"
      - "apps/webapp/test/flowcordia/approvalNotificationDelivery.test.ts"
      - "internal-packages/database/prisma/schema.prisma"

permissions: {}

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    permissions:
      contents: read
    steps:
      - name: Checkout exact revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          version: 10.33.2

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 20.20.2
          cache: pnpm

      - name: Install dependencies and generate database client
        run: |
          pnpm install --frozen-lockfile
          pnpm run generate

      - name: Run approval delivery contracts
        run: |
          pnpm --filter webapp exec vitest run \
            test/flowcordia/approvalNotificationDelivery.test.ts \
            test/flowcordia/approvalNotificationClock.test.ts

      - name: Validate durable ownership boundaries
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('node:fs');
          const required = [
            ['internal-packages/database/prisma/schema.prisma', 'model FlowcordiaApprovalNotificationDelivery'],
            ['internal-packages/database/prisma/migrations/20260726011500_flowcordia_approval_notification_delivery/migration.sql', 'FlowcordiaApprovalNotificationDelivery_scope_key'],
            ['apps/webapp/app/v3/alertsWorker.server.ts', 'v3.flowcordiaApprovalNotifications'],
            ['apps/webapp/app/v3/alertsWorker.server.ts', 'ProcessFlowcordiaApprovalNotificationsWithLiveClockService'],
            ['apps/webapp/app/features/flowcordia/workflows/approval/notification-clock.ts', 'Math.max(scheduled, observed)'],
            ['apps/webapp/app/features/flowcordia/workflows/approval/notification-processing.server.ts', 'for (const candidate of candidates)'],
            ['apps/webapp/app/features/flowcordia/workflows/approval/notification-processing.server.ts', 'flowcordiaApprovalNotificationProcessingTime'],
            ['apps/webapp/app/features/flowcordia/workflows/approval/notification.server.ts', 'leaseExpiresAt'],
            ['apps/webapp/app/features/flowcordia/workflows/approval/notification.server.ts', 'deliverAlertWebhook'],
            ['apps/webapp/app/features/flowcordia/workflows/approval/notification.server.ts', 'postAlertSlackMessage'],
            ['apps/webapp/app/features/flowcordia/workflows/approval/notification.server.ts', 'sendAlertPlainTextEmail'],
            ['apps/webapp/app/features/flowcordia/workflows/approval/notification.ts', 'Delivery ID:'],
          ];
          for (const [path, marker] of required) {
            const source = fs.readFileSync(path, 'utf8');
            if (!source.includes(marker)) throw new Error(`Missing ${marker} in ${path}`);
          }
          const server = fs.readFileSync(
            'apps/webapp/app/features/flowcordia/workflows/approval/notification.server.ts',
            'utf8'
          );
          for (const forbidden of ['payloadHash', 'providerResponse', 'decryptedCredential']) {
            if (server.includes(forbidden)) throw new Error(`Forbidden persisted delivery field: ${forbidden}`);
          }
          NODE

      - name: Check exact changed-source formatting
        run: |
          pnpm exec oxfmt --check \
            apps/webapp/app/features/flowcordia/workflows/approval/notification-clock.ts \
            apps/webapp/app/features/flowcordia/workflows/approval/notification-processing.server.ts \
            apps/webapp/app/features/flowcordia/workflows/approval/notification.ts \
            apps/webapp/app/features/flowcordia/workflows/approval/notification.server.ts \
            apps/webapp/app/v3/alertsWorker.server.ts \
            apps/webapp/test/flowcordia/approvalNotificationClock.test.ts \
            apps/webapp/test/flowcordia/approvalNotificationDelivery.test.ts
