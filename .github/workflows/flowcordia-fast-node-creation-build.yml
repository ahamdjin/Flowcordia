name: Flowcordia fast node creation build

on:
  push:
    branches:
      - studio/fast-node-creation
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened

permissions:
  contents: write

concurrency:
  group: flowcordia-fast-node-creation-build
  cancel-in-progress: true

jobs:
  verify-and-commit:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout isolated Studio branch
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: studio/fast-node-creation
          fetch-depth: 0
      - name: Setup pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320
        with:
          version: 10.33.2
      - name: Setup Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: 20.20.2
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile >/dev/null
      - name: Build and verify fast node creation
        id: verify
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          : > .flowcordia-fast-node-creation-build.log
          {
            node <<'NODE'
            const fs = require("node:fs");
            const path = "scripts/flowcordia-fast-node-creation-build.mjs";
            let source = fs.readFileSync(path, "utf8");
            const fixes = [
              [
                'type CanvasEdge = Edge<CanvasEdgeData, "flowcordia">;\\n\\nfunction nodeTone(`,',
                'type CanvasEdge = Edge<CanvasEdgeData, "flowcordia">;\\n\\n`,'
              ],
              [
                '}\\n\\nconst nodeTypes =`,\n  "canvas edge creator"',
                '}\\n\\n`,\n  "canvas edge creator"'
              ]
            ];
            for (const [before, after] of fixes) {
              if (!source.includes(before)) throw new Error(`Missing transformation repair: ${before}`);
              source = source.replace(before, after);
            }
            fs.writeFileSync(path, source);
            NODE
            node scripts/flowcordia-fast-node-creation-build.mjs
            pnpm exec oxfmt \
              packages/flowcordia-workflow/src/editor.ts \
              packages/flowcordia-workflow/src/editor.fast-create.test.ts \
              apps/webapp/app/features/flowcordia/workflows/drafts/types.ts \
              apps/webapp/app/features/flowcordia/workflows/studio/WorkflowStudio.tsx \
              apps/webapp/app/features/flowcordia/workflows/studio/WorkflowStudioCanvas.tsx \
              apps/webapp/app/features/flowcordia/workflows/studio/WorkflowStudioQuickNodeCreator.tsx \
              apps/webapp/app/features/flowcordia/workflows/studio/quick-node-creator.ts \
              apps/webapp/app/features/flowcordia/workflows/studio/quick-node-creator.test.ts
            pnpm --filter @flowcordia/workflow exec vitest --run src/editor.fast-create.test.ts
            pnpm --filter webapp exec vitest --run app/features/flowcordia/workflows/studio/quick-node-creator.test.ts
            pnpm exec oxlint -c .oxlintrc.json \
              packages/flowcordia-workflow/src/editor.ts \
              packages/flowcordia-workflow/src/editor.fast-create.test.ts \
              apps/webapp/app/features/flowcordia/workflows/drafts/types.ts \
              apps/webapp/app/features/flowcordia/workflows/studio/WorkflowStudio.tsx \
              apps/webapp/app/features/flowcordia/workflows/studio/WorkflowStudioCanvas.tsx \
              apps/webapp/app/features/flowcordia/workflows/studio/WorkflowStudioQuickNodeCreator.tsx \
              apps/webapp/app/features/flowcordia/workflows/studio/quick-node-creator.ts \
              apps/webapp/app/features/flowcordia/workflows/studio/quick-node-creator.test.ts
          } 2>&1 | tee .flowcordia-fast-node-creation-build.log
      - name: Upload verification failure
        if: steps.verify.outcome == 'failure'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: flowcordia-fast-node-creation-failure
          path: .flowcordia-fast-node-creation-build.log
          include-hidden-files: true
          retention-days: 1
      - name: Commit verified product diff
        if: steps.verify.outcome == 'success'
        shell: bash
        run: |
          rm .flowcordia-fast-node-creation-build.log
          rm scripts/flowcordia-fast-node-creation-build.mjs
          rm .github/workflows/flowcordia-fast-node-creation-build.yml
          git config user.name "Flowcordia Studio Bot"
          git config user.email "actions@users.noreply.github.com"
          git add \
            packages/flowcordia-workflow/src/editor.ts \
            packages/flowcordia-workflow/src/editor.fast-create.test.ts \
            apps/webapp/app/features/flowcordia/workflows/drafts/types.ts \
            apps/webapp/app/features/flowcordia/workflows/studio/WorkflowStudio.tsx \
            apps/webapp/app/features/flowcordia/workflows/studio/WorkflowStudioCanvas.tsx \
            apps/webapp/app/features/flowcordia/workflows/studio/WorkflowStudioQuickNodeCreator.tsx \
            apps/webapp/app/features/flowcordia/workflows/studio/quick-node-creator.ts \
            apps/webapp/app/features/flowcordia/workflows/studio/quick-node-creator.test.ts \
            scripts/flowcordia-fast-node-creation-build.mjs \
            .github/workflows/flowcordia-fast-node-creation-build.yml \
            .flowcordia-fast-node-creation-build.log
          git commit -m "Add fast contextual Studio node creation"
          git push origin HEAD:studio/fast-node-creation
      - name: Fail unverified build
        if: steps.verify.outcome == 'failure'
        run: exit 1
