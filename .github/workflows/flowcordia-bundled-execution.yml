name: Flowcordia bundled execution

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/flowcordia-bundled-execution.yml"
      - ".github/workflows/flowcordia-bundled-execution-acceptance.yml"
      - "apps/webapp/app/features/flowcordia/acceptance/bundled-execution-contract.ts"
      - "apps/webapp/scripts/flowcordia-bundled-reference-bootstrap.ts"
      - "apps/webapp/test/flowcordia/bundledExecutionAcceptance.test.ts"
      - "packages/trigger-sdk/test/flowcordia-beta-reference/**"
      - "scripts/flowcordia-bundled-execution-evidence.ts"
      - "scripts/flowcordia-bundled-execution-run.sh"
      - "scripts/flowcordia-bundled-reference-client.ts"
      - "flowcordia/testing/bundled-execution-acceptance.md"
      - "flowcordia/runbooks/bundled-self-host-deployment.md"
  push:
    branches: [main]
    paths:
      - ".github/workflows/flowcordia-bundled-execution.yml"
      - ".github/workflows/flowcordia-bundled-execution-acceptance.yml"
      - "apps/webapp/app/features/flowcordia/acceptance/bundled-execution-contract.ts"
      - "apps/webapp/scripts/flowcordia-bundled-reference-bootstrap.ts"
      - "apps/webapp/test/flowcordia/bundledExecutionAcceptance.test.ts"
      - "packages/trigger-sdk/test/flowcordia-beta-reference/**"
      - "scripts/flowcordia-bundled-execution-evidence.ts"
      - "scripts/flowcordia-bundled-execution-run.sh"
      - "scripts/flowcordia-bundled-reference-client.ts"

permissions: {}

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - name: Checkout exact revision
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5.0.0
        with:
          version: 10.33.2

      - name: Setup Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 20.20.2
          cache: pnpm

      - name: Install and generate dependency-aware workspace
        run: |
          pnpm install --frozen-lockfile
          pnpm run generate

      - name: Test bundled evidence contract
        run: pnpm --filter webapp exec vitest run test/flowcordia/bundledExecutionAcceptance.test.ts

      - name: Build reference SDK dependency closure
        run: pnpm --filter @trigger.dev/sdk... build

      - name: Load deterministic reference configuration
        run: pnpm --filter @trigger.dev/sdk exec tsx test/flowcordia-beta-reference/trigger.config.ts

      - name: Load deterministic reference task
        run: pnpm --filter @trigger.dev/sdk exec tsx test/flowcordia-beta-reference/src/tasks.ts

      - name: Validate shell and protected workflow boundaries
        shell: bash
        run: |
          set -euo pipefail
          bash -n scripts/flowcordia-bundled-execution-run.sh
          node <<'NODE'
          const fs = require("node:fs");
          const workflow = fs.readFileSync(".github/workflows/flowcordia-bundled-execution-acceptance.yml", "utf8");
          const runner = fs.readFileSync("scripts/flowcordia-bundled-execution-run.sh", "utf8");
          for (const required of [
            "workflow_dispatch:",
            "environment: flowcordia-bundled-execution-acceptance",
            "flowcordia-release",
            "--deny-self-hosted-runners",
            "retention-days: 90",
          ]) {
            if (!workflow.includes(required)) throw new Error(`Missing protected workflow boundary: ${required}`);
          }
          if (/\bpull_request\s*:/.test(workflow)) throw new Error("Protected acceptance must never run for pull requests.");
          for (const required of [
            "compose up -d --wait",
            "packages/trigger-sdk/test/flowcordia-beta-reference",
            "docker events",
            "S2 durable state did not change",
            "down --remove-orphans --volumes",
          ]) {
            if (!runner.includes(required)) throw new Error(`Missing execution boundary: ${required}`);
          }
          NODE

      - name: Check exact changed-source formatting
        run: |
          pnpm exec oxfmt --check \
            apps/webapp/app/features/flowcordia/acceptance/bundled-execution-contract.ts \
            apps/webapp/scripts/flowcordia-bundled-reference-bootstrap.ts \
            apps/webapp/test/flowcordia/bundledExecutionAcceptance.test.ts \
            packages/trigger-sdk/test/flowcordia-beta-reference/trigger.config.ts \
            packages/trigger-sdk/test/flowcordia-beta-reference/src/tasks.ts \
            scripts/flowcordia-bundled-execution-evidence.ts \
            scripts/flowcordia-bundled-reference-client.ts
