name: Studio V2 Activepieces validation

on:
  push:
    branches:
      - agent/studio-v2-activepieces-frontend
    paths:
      - .github/workflows/studio-v2-activepieces-validation.yml
      - apps/flowcordia-studio-activepieces/**
      - apps/webapp/app/features/flowcordia/workflows/studio-v2/**
      - apps/webapp/app/routes/**flowcordia.studio-v2/**
      - apps/webapp/package.json
      - packages/flowcordia-workflow/**
      - package.json
      - pnpm-lock.yaml
      - pnpm-workspace.yaml

concurrency:
  group: studio-v2-activepieces-validation
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/studio-v2-activepieces-frontend
          fetch-depth: 0

      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.2

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Align completed Studio dependencies and catalog
        shell: python
        run: |
          import json
          from pathlib import Path

          root_path = Path("package.json")
          root = json.loads(root_path.read_text())
          root.setdefault("pnpm", {}).setdefault("overrides", {})["@types/react"] = "18.2.69"
          root["pnpm"]["overrides"]["@types/react-dom"] = "18.2.7"
          root_path.write_text(json.dumps(root, indent=2) + "\n")

          catalog_path = Path("packages/flowcordia-workflow/src/studio-v2.ts")
          catalog = catalog_path.read_text()
          before = '''    availability: "adapter_required",
              availableInStudio: false,
              importedSource: "packages/core/execution and Windmill TypeScript editor reference",'''
          after = '''    availability: "native",
              availableInStudio: true,
              importedSource: "Activepieces Code editor and Flowcordia Secure Exec runtime",'''
          if before not in catalog:
              raise SystemExit("Studio Source catalog block no longer matches the expected boundary")
          catalog_path.write_text(catalog.replace(before, after, 1))

          test_path = Path("packages/flowcordia-workflow/src/studio-v2.test.ts")
          test = test_path.read_text()
          test = test.replace(
              '''    expect(adapterRequired.map((entry) => entry.id)).toEqual([
                  "source",
                  "loop",''',
              '''    expect(adapterRequired.map((entry) => entry.id)).toEqual([
                  "loop",''',
              1,
          )
          test_path.write_text(test)

      - name: Install exact workspace and refresh lockfile
        run: pnpm install --no-frozen-lockfile

      - name: Normalize owned integration files
        run: |
          pnpm exec oxfmt \
            apps/flowcordia-studio-activepieces \
            apps/webapp/app/features/flowcordia/workflows/studio-v2/StudioV2ActivepiecesHost.tsx \
            apps/webapp/app/features/flowcordia/workflows/studio-v2/StudioV2Surface.tsx \
            'apps/webapp/app/routes/_app.orgs.$organizationSlug.projects.$projectParam.env.$envParam.flowcordia.studio-v2/route.tsx' \
            apps/webapp/test/flowcordia/studioV2PreviewRoute.test.ts \
            packages/flowcordia-workflow/src/studio-v2.ts \
            packages/flowcordia-workflow/src/studio-v2.test.ts \
            package.json

      - name: Validate integration and record evidence
        id: validation
        shell: bash
        run: |
          set +e
          report="apps/flowcordia-studio-activepieces/VALIDATION.md"
          log_dir="/tmp/studio-v2-validation"
          mkdir -p "$log_dir"
          failed=0

          cat > "$report" <<'EOF'
          # Studio V2 Activepieces Validation

          Exact validation of the Flowcordia adapter around the vendored Activepieces frontend.

          | Check | Result |
          | --- | --- |
          EOF

          run_check() {
            name="$1"
            shift
            slug=$(printf '%s' "$name" | tr '[:upper:] ' '[:lower:]-' | tr -cd 'a-z0-9_-')
            "$@" >"$log_dir/$slug.log" 2>&1
            status=$?
            if [ "$status" -eq 0 ]; then
              printf '| %s | PASS |\n' "$name" >> "$report"
            else
              printf '| %s | FAIL (%s) |\n' "$name" "$status" >> "$report"
              failed=1
              {
                printf '\n## %s failure\n\n```text\n' "$name"
                tail -n 220 "$log_dir/$slug.log"
                printf '\n```\n'
              } >> "$report"
            fi
          }

          run_check "Adapter formatting" pnpm exec oxfmt --check \
            apps/flowcordia-studio-activepieces \
            apps/webapp/app/features/flowcordia/workflows/studio-v2/StudioV2ActivepiecesHost.tsx \
            apps/webapp/app/features/flowcordia/workflows/studio-v2/StudioV2Surface.tsx \
            'apps/webapp/app/routes/_app.orgs.$organizationSlug.projects.$projectParam.env.$envParam.flowcordia.studio-v2/route.tsx' \
            apps/webapp/test/flowcordia/studioV2PreviewRoute.test.ts \
            packages/flowcordia-workflow/src/studio-v2.ts \
            packages/flowcordia-workflow/src/studio-v2.test.ts \
            package.json
          run_check "Adapter and host typecheck" pnpm --filter @flowcordia/studio-activepieces typecheck
          run_check "Adapter tests" pnpm --filter @flowcordia/studio-activepieces test
          run_check "Workflow contract tests" pnpm --filter @flowcordia/workflow test -- --run
          run_check "Adapter production build" pnpm --filter @flowcordia/studio-activepieces build
          run_check "Webapp typecheck" pnpm --filter webapp typecheck
          run_check "Studio route tests" pnpm --filter webapp exec vitest run test/flowcordia/studioV2PreviewRoute.test.ts
          run_check "Webapp production build" pnpm --filter webapp build

          git config user.name "Flowcordia Studio Agent"
          git config user.email "actions@users.noreply.github.com"

          if [ "$failed" -eq 0 ]; then
            rm -f "$report" .github/workflows/studio-v2-activepieces-validation.yml
            git add -A
            git commit -m "Complete and validate the Activepieces Studio integration"
            git push origin HEAD:agent/studio-v2-activepieces-frontend
            echo "passed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          git add -A
          git commit -m "Apply Activepieces Studio fixes and record validation failures"
          git push origin HEAD:agent/studio-v2-activepieces-frontend
          echo "passed=false" >> "$GITHUB_OUTPUT"
          exit 1
