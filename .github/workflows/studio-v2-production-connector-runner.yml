name: Studio V2 production connector runner

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/studio-v2-production-connector-runner.yml

permissions:
  contents: write

jobs:
  patch:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: agent/studio-v2-activepieces-production-binding
      - name: Apply connector-only production trigger slice
        shell: python
        run: |
          from pathlib import Path

          context = Path('apps/webapp/app/features/flowcordia/workflows/studio-v2/activepieces-interaction-context.server.ts')
          text = context.read_text()
          text = text.replace(
              '  executeFlowcordiaActivepiecesTriggerTest,\n  inspectFlowcordiaActivepiecesWebhookTrigger,\n',
              '  executeFlowcordiaActivepiecesTriggerTest,\n  inspectFlowcordiaActivepiecesTrigger,\n  inspectFlowcordiaActivepiecesWebhookTrigger,\n',
              1,
          )
          text = text.replace(
              '      kind: "trigger_webhook_inspect";\n      interaction: FlowcordiaActivepiecesTriggerInteraction;\n',
              '      kind: "trigger_inspect" | "trigger_webhook_inspect";\n      interaction: FlowcordiaActivepiecesTriggerInteraction;\n',
              1,
          )
          anchor = '''        case "trigger_test":\n          result = await executeFlowcordiaActivepiecesTriggerTest({ interaction: payload.interaction, services });\n          break;\n        case "trigger_webhook_inspect":\n'''
          replacement = '''        case "trigger_test":\n          result = await executeFlowcordiaActivepiecesTriggerTest({ interaction: payload.interaction, services });\n          break;\n        case "trigger_inspect":\n          result = JSON.parse(JSON.stringify(await inspectFlowcordiaActivepiecesTrigger({ interaction: payload.interaction, services }))) as JsonValue;\n          break;\n        case "trigger_webhook_inspect":\n'''
          if anchor not in text:
              raise SystemExit('interaction context switch anchor missing')
          context.write_text(text.replace(anchor, replacement, 1))

          interaction = Path('apps/webapp/app/features/flowcordia/workflows/studio-v2/activepieces-interaction.server.ts')
          text = interaction.read_text()
          text = text.replace(
              '''      kind:\n        | "trigger_webhook_inspect"\n''',
              '''      kind:\n        | "trigger_inspect"\n        | "trigger_webhook_inspect"\n''',
              1,
          )
          production_interaction = '''      interaction: {\n        pieceName: string;\n        triggerName: string;\n        input: Record<string, unknown>;\n        sampleData?: Record<string, unknown>;\n'''
          production_replacement = '''      interaction: {\n        pieceName: string;\n        triggerName: string;\n        flowId?: string;\n        input: Record<string, unknown>;\n        sampleData?: Record<string, unknown>;\n'''
          if production_interaction not in text:
              raise SystemExit('production interaction type anchor missing')
          interaction.write_text(text.replace(production_interaction, production_replacement, 1))

          compiler = Path('packages/flowcordia-runtime/src/compiler.ts')
          text = compiler.read_text()
          anchor = '''    `    return result.output;`,\n    `  },`,\n    `});`,\n    ...(validationTaskId\n'''
          replacement = '''    `    return result.output;`,\n    `  },`,\n    `});`,\n    ...(activepiecesTriggerConfiguration\n      ? [\n          "",\n          `export const ${safeIdentifier(`${workflow.id}ActivepiecesScheduleTask`)} = task({`,\n          `  id: ${JSON.stringify(`${taskId}-activepieces-schedule`)},`,\n          `  queue: { concurrencyLimit: 1 },`,\n          `  retry: { maxAttempts: 3 },`,\n          `  run: async (_payload: unknown, { ctx }) => {`,\n          `    const origin = process.env.APP_ORIGIN;`,\n          `    const token = process.env.TRIGGER_SECRET_KEY;`,\n          `    if (!origin || !token) throw new Error("Activepieces production schedule connector requires APP_ORIGIN and TRIGGER_SECRET_KEY.");`,\n          `    const response = await fetch(new URL(${JSON.stringify(`/api/v1/flowcordia/activepieces/production-schedules/${taskId}-activepieces-schedule`)}, origin), {`,\n          `      method: "POST",`,\n          `      headers: { authorization: \`Bearer \${token}\`, "content-type": "application/json" },`,\n          `      body: JSON.stringify({ runId: ctx.run.id }),`,\n          `      redirect: "error",`,\n          `    });`,\n          `    if (!response.ok) throw new Error(\`Activepieces production schedule connector failed with HTTP \${response.status}.\`);`,\n          `    return await response.json();`,\n          `  },`,\n          `});`,\n        ]\n      : []),\n    ...(validationTaskId\n'''
          if anchor not in text:
              raise SystemExit('compiler task anchor missing')
          compiler.write_text(text.replace(anchor, replacement, 1))

          test = Path('packages/flowcordia-runtime/src/activepieces-production-binding.test.ts')
          text = test.read_text()
          anchor = '''    expect(result.artifact.warnings).not.toContain(\n      "activepieces.piece.trigger requires a deployment binding before it can receive production events."\n    );\n'''
          replacement = anchor + '''    expect(result.artifact.source).toContain('id: "flowcordia-slack_events-activepieces-schedule"');\n    expect(result.artifact.source).toContain("queue: { concurrencyLimit: 1 }");\n    expect(result.artifact.source).toContain(\n      "/api/v1/flowcordia/activepieces/production-schedules/flowcordia-slack_events-activepieces-schedule"\n    );\n'''
          if anchor not in text:
              raise SystemExit('production binding test anchor missing')
          test.write_text(text.replace(anchor, replacement, 1))

          Path('.github/workflows/studio-v2-production-connector-runner.yml').unlink()
      - name: Commit product connector slice
        shell: bash
        run: |
          git config user.name 'flowcordia-studio-v2-bot'
          git config user.email 'flowcordia-studio-v2-bot@users.noreply.github.com'
          git add -A
          git commit -m 'feat(studio-v2): connect Activepieces production trigger scheduling'
          git push origin HEAD:agent/studio-v2-activepieces-production-binding
