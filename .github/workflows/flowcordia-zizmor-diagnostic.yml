name: Flowcordia temporary zizmor diagnostic

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/flowcordia-zizmor-diagnostic.yml"

permissions: {}

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      actions: read
      contents: read
      security-events: write
    steps:
      - name: Checkout exact revision
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Capture zizmor findings
        id: zizmor
        continue-on-error: true
        uses: zizmorcore/zizmor-action@6599ee8b7a49aef6a770f63d261d214911a7ce02 # v0.6.0
        with:
          min-severity: low
          advanced-security: true
          color: false

      - name: Preserve SARIF diagnostic
        if: always() && steps.zizmor.outputs.output-file != ''
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: flowcordia-zizmor-diagnostic-${{ github.run_id }}
          path: ${{ steps.zizmor.outputs.output-file }}
          if-no-files-found: error
          retention-days: 1
          include-hidden-files: false
