name: Flowcordia Beta failure acceptance

on:
  workflow_dispatch:
    inputs:
      publication_run_id:
        description: Successful protected self-host image publication run for this exact main revision
        required: true
        type: string
      lifecycle_run_id:
        description: Successful published self-host lifecycle run for this exact main revision
        required: true
        type: string
      confirmation:
        description: Type RUN-BETA-FAILURE-ACCEPTANCE to permit destructive disposable failure acceptance
        required: true
        type: string

permissions: {}

concurrency:
  group: flowcordia-bundled-execution-acceptance
  cancel-in-progress: false

jobs:
  acceptance:
    if: github.ref == 'refs/heads/main'
    environment: flowcordia-bundled-execution-acceptance
    runs-on:
      - self-hosted
      - linux
      - x64
      - flowcordia-release
    timeout-minutes: 210
    permissions:
      actions: read
      attestations: read
      contents: read
      packages: read
    env:
      PUBLICATION_RUN_ID: ${{ inputs.publication_run_id }}
      LIFECYCLE_RUN_ID: ${{ inputs.lifecycle_run_id }}
      ACCEPTANCE_CONFIRMATION: ${{ inputs.confirmation }}
      BUNDLED_CONFIG_FILE: ${{ vars.FLOWCORDIA_BUNDLED_ACCEPTANCE_CONFIG_FILE }}
      BUNDLED_SECRETS_FILE: ${{ secrets.FLOWCORDIA_BUNDLED_ACCEPTANCE_SECRETS_FILE }}
      BUNDLED_REGISTRY_AUTH_FILE: ${{ secrets.FLOWCORDIA_BUNDLED_ACCEPTANCE_REGISTRY_AUTH_FILE }}
      BUNDLED_WORK_PARENT: ${{ vars.FLOWCORDIA_BUNDLED_ACCEPTANCE_WORK_PARENT }}
      BUNDLED_EVIDENCE_DIR: ${{ vars.FLOWCORDIA_BUNDLED_ACCEPTANCE_EVIDENCE_DIR }}

    steps:
      - name: Checkout exact target main revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Validate protected request and source lineage
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          [[ "$ACCEPTANCE_CONFIRMATION" == "RUN-BETA-FAILURE-ACCEPTANCE" ]] || {
            echo "Beta failure confirmation is invalid." >&2
            exit 1
          }
          [[ "$PUBLICATION_RUN_ID" =~ ^[1-9][0-9]{0,19}$ ]] || exit 1
          [[ "$LIFECYCLE_RUN_ID" =~ ^[1-9][0-9]{0,19}$ ]] || exit 1
          [[ "$PUBLICATION_RUN_ID" != "$LIFECYCLE_RUN_ID" ]] || exit 1
          [[ "$(id -u)" == "1000" ]] || {
            echo "The protected Beta failure runner must use UID 1000." >&2
            exit 1
          }
          for path in "$BUNDLED_CONFIG_FILE" "$BUNDLED_SECRETS_FILE" "$BUNDLED_REGISTRY_AUTH_FILE" "$BUNDLED_WORK_PARENT" "$BUNDLED_EVIDENCE_DIR"; do
            [[ "$path" == /* ]] || {
              echo "Protected Beta failure paths must be absolute." >&2
              exit 1
            }
          done
          publication_json="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$PUBLICATION_RUN_ID")"
          lifecycle_json="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$LIFECYCLE_RUN_ID")"
          jq -e '
            .conclusion == "success" and
            .event == "workflow_dispatch" and
            .head_branch == "main" and
            .path == ".github/workflows/flowcordia-publish-self-host-image.yml"
          ' <<< "$publication_json" >/dev/null
          jq -e '
            .conclusion == "success" and
            .event == "workflow_dispatch" and
            .head_branch == "main" and
            .path == ".github/workflows/flowcordia-self-host-lifecycle.yml"
          ' <<< "$lifecycle_json" >/dev/null
          publication_sha="$(jq -er '.head_sha | select(test("^[0-9a-f]{40}$"))' <<< "$publication_json")"
          lifecycle_sha="$(jq -er '.head_sha | select(test("^[0-9a-f]{40}$"))' <<< "$lifecycle_json")"
          [[ "$publication_sha" == "$GITHUB_SHA" && "$lifecycle_sha" == "$GITHUB_SHA" ]] || {
            echo "Beta failure sources do not belong to this exact main revision." >&2
            exit 1
          }

      - name: Download exact publication and lifecycle artifacts
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          artifact_root="$RUNNER_TEMP/flowcordia-beta-failure-artifacts-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          [[ ! -e "$artifact_root" ]] || exit 1
          mkdir -m 0700 "$artifact_root/publication" "$artifact_root/lifecycle"
          gh run download "$PUBLICATION_RUN_ID" --dir "$artifact_root/publication"
          gh run download "$LIFECYCLE_RUN_ID" --dir "$artifact_root/lifecycle"
          [[ "$(find "$artifact_root/publication" -type f -name flowcordia-release-manifest.json | wc -l)" -eq 1 ]] || exit 1
          [[ "$(find "$artifact_root/publication" -type f -name flowcordia-release-image-evidence.json | wc -l)" -eq 1 ]] || exit 1
          [[ "$(find "$artifact_root/lifecycle" -type f -name 'flowcordia-self-host-lifecycle-*.json' | wc -l)" -eq 1 ]] || exit 1
          {
            echo "BETA_FAILURE_ARTIFACT_ROOT=$artifact_root"
            echo "BETA_FAILURE_MANIFEST=$(find "$artifact_root/publication" -type f -name flowcordia-release-manifest.json)"
            echo "BETA_FAILURE_IMAGE_EVIDENCE=$(find "$artifact_root/publication" -type f -name flowcordia-release-image-evidence.json)"
            echo "BETA_FAILURE_LIFECYCLE=$(find "$artifact_root/lifecycle" -type f -name 'flowcordia-self-host-lifecycle-*.json')"
          } >> "$GITHUB_ENV"

      - name: Setup pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 10.33.2

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 20.20.2
          cache: pnpm

      - name: Install exact failure acceptance tooling
        run: |
          pnpm install --frozen-lockfile
          pnpm --filter @trigger.dev/database generate

      - name: Verify immutable publication and provenance
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          pnpm flowcordia:self-host:artifact-preflight -- \
            --manifest "$BETA_FAILURE_MANIFEST" \
            --image-evidence "$BETA_FAILURE_IMAGE_EVIDENCE" \
            --expected-repository "${GITHUB_REPOSITORY,,}" \
            --expected-run-id "$PUBLICATION_RUN_ID" \
            --expected-application-sha "$GITHUB_SHA"
          image_reference="$(jq -er '.image.reference | select(test("^ghcr.io/.+@sha256:[0-9a-f]{64}$"))' "$BETA_FAILURE_MANIFEST")"
          gh attestation verify \
            "oci://$image_reference" \
            --repo "$GITHUB_REPOSITORY" \
            --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/flowcordia-publish-self-host-image.yml" \
            --source-digest "$GITHUB_SHA" \
            --source-ref refs/heads/main \
            --deny-self-hosted-runners \
            --format json | jq -e 'length > 0' >/dev/null

      - name: Authenticate immutable image pulls
        env:
          GH_TOKEN: ${{ github.token }}
        run: echo "$GH_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin

      - name: Execute disposable load outage and recovery campaign
        id: campaign
        shell: bash
        run: |
          set -euo pipefail
          work_root="$BUNDLED_WORK_PARENT/failure-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          observation="$BUNDLED_EVIDENCE_DIR/flowcordia-beta-failure-observation-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT.json"
          evidence="$BUNDLED_EVIDENCE_DIR/flowcordia-beta-failure-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT.json"
          bash scripts/flowcordia-beta-failure-run.sh \
            --checkout "$GITHUB_WORKSPACE" \
            --config "$BUNDLED_CONFIG_FILE" \
            --secrets "$BUNDLED_SECRETS_FILE" \
            --manifest "$BETA_FAILURE_MANIFEST" \
            --registry-auth "$BUNDLED_REGISTRY_AUTH_FILE" \
            --work-root "$work_root" \
            --observation "$observation" \
            --repository "${GITHUB_REPOSITORY,,}" \
            --run-id "$GITHUB_RUN_ID" \
            --run-attempt "$GITHUB_RUN_ATTEMPT" \
            --source-sha "$GITHUB_SHA"
          pnpm exec tsx scripts/flowcordia-beta-failure-evidence.ts \
            --observation "$observation" \
            --lifecycle "$BETA_FAILURE_LIFECYCLE" \
            --repository "${GITHUB_REPOSITORY,,}" \
            --run-id "$GITHUB_RUN_ID" \
            --run-attempt "$GITHUB_RUN_ATTEMPT" \
            --source-sha "$GITHUB_SHA" \
            --output "$evidence"
          echo "observation=$observation" >> "$GITHUB_OUTPUT"
          echo "evidence=$evidence" >> "$GITHUB_OUTPUT"

      - name: Preserve sanitized Beta failure evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: flowcordia-beta-failure-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ steps.campaign.outputs.evidence }}
          if-no-files-found: error
          retention-days: 90
          include-hidden-files: false

      - name: Remove private artifacts and credentials
        if: always()
        shell: bash
        run: |
          docker logout ghcr.io >/dev/null 2>&1 || true
          rm -rf \
            "${BETA_FAILURE_ARTIFACT_ROOT:-}" \
            "$BUNDLED_WORK_PARENT/failure-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          rm -f \
            "$BUNDLED_EVIDENCE_DIR/flowcordia-beta-failure-observation-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT.json"
