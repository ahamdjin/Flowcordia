name: Studio V2 production lifecycle runner

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/studio-v2-production-lifecycle-runner.yml

permissions:
  contents: write

jobs:
  patch:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: agent/studio-v2-activepieces-production-binding
      - name: Match Activepieces replacement and handshake lifecycle
        shell: python
        run: |
          from pathlib import Path

          service = Path('apps/webapp/app/features/flowcordia/workflows/studio-v2/activepieces-production-binding.server.ts')
          text = service.read_text()
          old = '''    let enableResult: TriggerEnableResult = { ...descriptor, schedule: null, appListeners: [] };\n    let webhookDescriptor: WebhookDescriptor | null = null;\n    if (descriptor.triggerType !== "MANUAL") {\n      if (descriptor.triggerType === "APP_WEBHOOK" && !appUrl) {\n        throw new Error(\n          `Activepieces APP_WEBHOOK piece ${binding.pieceName} has no exact upstream route mapping.`\n        );\n      }\n      if (descriptor.triggerType === "WEBHOOK") {\n        webhookDescriptor = parseWebhookDescriptor(\n          await executeStudioV2ActivepiecesInteraction({\n            projectId: release.scope.projectId,\n            environmentId: release.scope.environmentId,\n            actorId: actorId(release),\n            pieceName: binding.pieceName,\n            pieceVersion: binding.pieceVersion,\n            payload: {\n              kind: "trigger_webhook_inspect",\n              interaction: interaction(binding, release, webhookUrl),\n            },\n          })\n        );\n      }\n      enableResult = parseEnableResult(\n        await executeStudioV2ActivepiecesInteraction({\n          projectId: release.scope.projectId,\n          environmentId: release.scope.environmentId,\n          actorId: actorId(release),\n          pieceName: binding.pieceName,\n          pieceVersion: binding.pieceVersion,\n          payload: {\n            kind: "trigger_enable",\n            interaction: interaction(\n              binding,\n              release,\n              descriptor.triggerType === "APP_WEBHOOK" ? appUrl : webhookUrl\n            ),\n          },\n        })\n      );\n    }\n'''
          new = '''    let enableResult: TriggerEnableResult = { ...descriptor, schedule: null, appListeners: [] };\n    let webhookDescriptor: WebhookDescriptor | null = null;\n    if (descriptor.triggerType === "APP_WEBHOOK" && !appUrl) {\n      throw new Error(\n        `Activepieces APP_WEBHOOK piece ${binding.pieceName} has no exact upstream route mapping.`\n      );\n    }\n    if (descriptor.triggerType === "WEBHOOK") {\n      webhookDescriptor = parseWebhookDescriptor(\n        await executeStudioV2ActivepiecesInteraction({\n          projectId: release.scope.projectId,\n          environmentId: release.scope.environmentId,\n          actorId: actorId(release),\n          pieceName: binding.pieceName,\n          pieceVersion: binding.pieceVersion,\n          payload: {\n            kind: "trigger_webhook_inspect",\n            interaction: interaction(binding, release, webhookUrl),\n          },\n        })\n      );\n    }\n\n    await prisma.$executeRaw(Prisma.sql`\n      UPDATE "FlowcordiaActivepiecesProductionBinding"\n      SET\n        "triggerType" = ${descriptor.triggerType},\n        "handshakeConfiguration" = CAST(${JSON.stringify(webhookDescriptor?.handshakeConfiguration ?? null)} AS JSONB),\n        "renewConfiguration" = CAST(${JSON.stringify(webhookDescriptor?.renewConfiguration ?? null)} AS JSONB),\n        "updatedAt" = ${new Date()}\n      WHERE "releasePublicId" = ${release.publicId}\n    `);\n\n    const previous = await previousEnabledBinding(release);\n    if (previous) await disablePreviousBinding(previous);\n\n    if (descriptor.triggerType !== "MANUAL") {\n      enableResult = parseEnableResult(\n        await executeStudioV2ActivepiecesInteraction({\n          projectId: release.scope.projectId,\n          environmentId: release.scope.environmentId,\n          actorId: actorId(release),\n          pieceName: binding.pieceName,\n          pieceVersion: binding.pieceVersion,\n          payload: {\n            kind: "trigger_enable",\n            interaction: interaction(\n              binding,\n              release,\n              descriptor.triggerType === "APP_WEBHOOK" ? appUrl : webhookUrl\n            ),\n          },\n        })\n      );\n    }\n'''
          if old not in text:
              raise SystemExit('activation lifecycle block missing')
          text = text.replace(old, new, 1)
          old = '''    const previous = await previousEnabledBinding(release);\n    if (previous) await disablePreviousBinding(previous);\n\n    await prisma.$executeRaw(Prisma.sql`\n'''
          if old not in text:
              raise SystemExit('late previous binding cleanup block missing')
          text = text.replace(old, '''    await prisma.$executeRaw(Prisma.sql`\n''', 1)
          service.write_text(text)

          route = Path('apps/webapp/app/routes/api.v1.flowcordia.activepieces.production-webhooks.$releasePublicId.ts')
          text = route.read_text()
          old = '''  if (!binding || binding.status !== "ENABLED" || !release || release.status !== "DEPLOYED") {\n    return Response.json({ code: "activepieces_production_binding_not_found" }, { status: 404 });\n  }\n'''
          new = '''  if (\n    !binding ||\n    (binding.status !== "PREPARING" && binding.status !== "ENABLED") ||\n    !release ||\n    release.status !== "DEPLOYED"\n  ) {\n    return Response.json({ code: "activepieces_production_binding_not_found" }, { status: 404 });\n  }\n'''
          if old not in text:
              raise SystemExit('webhook binding status guard missing')
          text = text.replace(old, new, 1)
          old = '''    return webhookResponse(result);\n  }\n\n  const runIds = await runStudioV2ActivepiecesProductionTrigger({\n'''
          new = '''    return webhookResponse(result);\n  }\n\n  if (binding.status !== "ENABLED") {\n    return Response.json(\n      { code: "activepieces_production_binding_preparing" },\n      { status: 503, headers: { "retry-after": "1" } }\n    );\n  }\n\n  const runIds = await runStudioV2ActivepiecesProductionTrigger({\n'''
          if old not in text:
              raise SystemExit('webhook post-handshake guard anchor missing')
          route.write_text(text.replace(old, new, 1))
      - name: Format lifecycle adapter files
        shell: bash
        run: |
          npx --yes oxfmt@0.54.0 \
            apps/webapp/app/features/flowcordia/workflows/studio-v2/activepieces-production-binding.server.ts \
            'apps/webapp/app/routes/api.v1.flowcordia.activepieces.production-webhooks.$releasePublicId.ts'
          rm -f .github/workflows/studio-v2-production-lifecycle-runner.yml
      - name: Commit lifecycle alignment
        shell: bash
        run: |
          git config user.name 'flowcordia-studio-v2-bot'
          git config user.email 'flowcordia-studio-v2-bot@users.noreply.github.com'
          git add -A
          git commit -m 'fix(studio-v2): match Activepieces trigger replacement lifecycle'
          git push origin HEAD:agent/studio-v2-activepieces-production-binding
