name: Temporary format PR 209

on:
  pull_request:
    branches: [main]
    types: [synchronize]

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/studio-v2-activepieces-native-testing
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.2
      - uses: actions/setup-node@v4
        with:
          node-version: 20.20.2
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: >-
          pnpm exec oxfmt
          apps/flowcordia-studio-activepieces/src/activepieces-api.ts
          apps/flowcordia-studio-activepieces/src/studio-host.tsx
          apps/flowcordia-studio-activepieces/src/studio-integration.test.ts
          apps/flowcordia-studio-activepieces/src/typecheck/activepieces-shared.ts
          apps/flowcordia-studio-activepieces/src/typecheck/activepieces-web.ts
          apps/webapp/app/features/flowcordia/workflows/studio-v2/activepieces-extended-api.server.ts
          apps/webapp/app/features/flowcordia/workflows/studio-v2/workspace-http.ts
          'apps/webapp/app/routes/_app.orgs.$organizationSlug.projects.$projectParam.env.$envParam.flowcordia.studio-v2/route.tsx'
      - run: |
          rm -f .studio-v2-pr209-format-kick
          git rm -f .github/workflows/temp-format-pr209.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/flowcordia-studio-activepieces/src/activepieces-api.ts \
            apps/flowcordia-studio-activepieces/src/studio-host.tsx \
            apps/flowcordia-studio-activepieces/src/studio-integration.test.ts \
            apps/flowcordia-studio-activepieces/src/typecheck/activepieces-shared.ts \
            apps/flowcordia-studio-activepieces/src/typecheck/activepieces-web.ts \
            apps/webapp/app/features/flowcordia/workflows/studio-v2/activepieces-extended-api.server.ts \
            apps/webapp/app/features/flowcordia/workflows/studio-v2/workspace-http.ts \
            'apps/webapp/app/routes/_app.orgs.$organizationSlug.projects.$projectParam.env.$envParam.flowcordia.studio-v2/route.tsx' \
            .github/workflows/temp-format-pr209.yml
          git add -u .studio-v2-pr209-format-kick || true
          git commit -m "chore(studio-v2): format native Activepieces testing bridge"
          git push origin HEAD:agent/studio-v2-activepieces-native-testing
