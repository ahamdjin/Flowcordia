name: Flowcordia Private Beta dossier one-shot format application

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/flowcordia-private-beta-dossier-apply-format.yml"

permissions:
  contents: write

jobs:
  apply:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'agent/flowcordia-private-beta-dossier'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout exact head branch
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: agent/flowcordia-private-beta-dossier
          fetch-depth: 1

      - name: Setup pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5.0.0
        with:
          version: 10.33.2

      - name: Setup Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 20.20.2
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Apply formatter and remove one-shot workflow
        shell: bash
        run: |
          set -euo pipefail
          pnpm exec oxfmt --write \
            apps/webapp/app/features/flowcordia/acceptance/private-beta-dossier.ts \
            apps/webapp/test/flowcordia/privateBetaDossier.test.ts \
            scripts/flowcordia-private-beta-dossier.ts
          git rm ".github/workflows/flowcordia-private-beta-dossier-apply-format.yml"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            apps/webapp/app/features/flowcordia/acceptance/private-beta-dossier.ts \
            apps/webapp/test/flowcordia/privateBetaDossier.test.ts \
            scripts/flowcordia-private-beta-dossier.ts
          git diff --cached --check
          git commit -m "Format Private Beta dossier sources"
          git push origin HEAD:agent/flowcordia-private-beta-dossier
