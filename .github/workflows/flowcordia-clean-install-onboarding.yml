name: Flowcordia clean-install onboarding

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/flowcordia-clean-install-onboarding.yml"
      - ".github/workflows/flowcordia-clean-install-onboarding-acceptance.yml"
      - "apps/webapp/app/features/flowcordia/operations/clean-install-onboarding.ts"
      - "apps/webapp/scripts/flowcordia-clean-install-cli-bootstrap.ts"
      - "apps/webapp/test/cleanInstallOnboardingEvidence.test.ts"
      - "flowcordia/acceptance/clean-install-onboarding.spec.ts"
      - "flowcordia/testing/clean-install-onboarding.md"
      - "playwright.clean-install-onboarding.config.ts"
      - "scripts/flowcordia-clean-install-github-fixture.ts"
      - "scripts/flowcordia-clean-install-onboarding-evidence.ts"
      - "scripts/flowcordia-clean-install-onboarding-finalize.ts"
      - "scripts/flowcordia-clean-install-onboarding-run.sh"
  push:
    branches: [main]
    paths:
      - ".github/workflows/flowcordia-clean-install-onboarding.yml"
      - ".github/workflows/flowcordia-clean-install-onboarding-acceptance.yml"
      - "apps/webapp/app/features/flowcordia/operations/clean-install-onboarding.ts"
      - "apps/webapp/scripts/flowcordia-clean-install-cli-bootstrap.ts"
      - "apps/webapp/test/cleanInstallOnboardingEvidence.test.ts"
      - "flowcordia/acceptance/clean-install-onboarding.spec.ts"
      - "playwright.clean-install-onboarding.config.ts"
      - "scripts/flowcordia-clean-install-github-fixture.ts"
      - "scripts/flowcordia-clean-install-onboarding-evidence.ts"
      - "scripts/flowcordia-clean-install-onboarding-finalize.ts"
      - "scripts/flowcordia-clean-install-onboarding-run.sh"

permissions: {}

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - name: Checkout exact revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          version: 10.33.2

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 20.20.2
          cache: pnpm

      - name: Install and generate dependency-aware workspace
        run: |
          pnpm install --frozen-lockfile
          pnpm --filter @trigger.dev/database generate

      - name: Test clean-install evidence contract
        run: pnpm --filter webapp exec vitest run test/cleanInstallOnboardingEvidence.test.ts

      - name: Validate Playwright journey discovery
        run: pnpm exec playwright test --config playwright.clean-install-onboarding.config.ts --list

      - name: Validate shell and protected workflow boundaries
        shell: bash
        run: |
          set -euo pipefail
          bash -n scripts/flowcordia-clean-install-onboarding-run.sh
          node <<'NODE'
          const fs = require("node:fs");
          const protectedWorkflow = fs.readFileSync(
            ".github/workflows/flowcordia-clean-install-onboarding-acceptance.yml",
            "utf8"
          );
          const runner = fs.readFileSync("scripts/flowcordia-clean-install-onboarding-run.sh", "utf8");
          const journey = fs.readFileSync("flowcordia/acceptance/clean-install-onboarding.spec.ts", "utf8");
          for (const required of [
            "workflow_dispatch:",
            "environment: flowcordia-clean-install-onboarding",
            "flowcordia-release",
            "--deny-self-hosted-runners",
            "retention-days: 90",
          ]) {
            if (!protectedWorkflow.includes(required)) {
              throw new Error(`Missing protected workflow boundary: ${required}`);
            }
          }
          if (/\bpull_request\s*:/.test(protectedWorkflow)) {
            throw new Error("Protected clean-install acceptance must never run for pull requests.");
          }
          for (const required of [
            "compose up -d --wait",
            "playwright.clean-install-onboarding.config.ts",
            "down --remove-orphans --volumes",
            "flowcordia-clean-install-onboarding-finalize.ts",
            "FLOWCORDIA_ACCEPTANCE_MAILPIT_IMAGE_REFERENCE",
            "FLOWCORDIA_ACCEPTANCE_CADDY_IMAGE_REFERENCE",
          ]) {
            if (!runner.includes(required)) throw new Error(`Missing runner boundary: ${required}`);
          }
          for (const required of [
            "/setup/owner",
            "/login/password",
            "/setup/email",
            "/setup/github",
            "deployReference",
            "/invite",
            "second_user_signed_in",
          ]) {
            if (!journey.includes(required)) throw new Error(`Missing browser journey boundary: ${required}`);
          }
          NODE

      - name: Check exact changed-source formatting
        run: |
          pnpm exec oxfmt --check \
            apps/webapp/app/features/flowcordia/operations/clean-install-onboarding.ts \
            apps/webapp/scripts/flowcordia-clean-install-cli-bootstrap.ts \
            apps/webapp/test/cleanInstallOnboardingEvidence.test.ts \
            flowcordia/acceptance/clean-install-onboarding.spec.ts \
            playwright.clean-install-onboarding.config.ts \
            scripts/flowcordia-clean-install-github-fixture.ts \
            scripts/flowcordia-clean-install-onboarding-evidence.ts \
            scripts/flowcordia-clean-install-onboarding-finalize.ts
