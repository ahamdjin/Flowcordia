name: Temporary PR 105 integration

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
    paths:
      - ".github/workflows/temporary-pr105-connect.yml"
      - ".github/workflows/flowcordia-bundled-self-host.yml"
      - "apps/webapp/app/features/flowcordia/operations/bundled-self-host-topology.ts"
      - "apps/webapp/test/flowcordia/bundledSelfHostTopology.test.ts"
      - "apps/webapp/test/flowcordia/bundledSelfHostTopologySource.test.ts"
      - "docker/flowcordia-bundled.env.example"
      - "docker/flowcordia-bundled.secrets.example"
      - "docker/scripts/generate-flowcordia-bundled-secrets.sh"
      - "flowcordia/runbooks/bundled-self-host-deployment.md"

permissions: {}

concurrency:
  group: temporary-pr105-integration-${{ github.event.pull_request.head.sha }}
  cancel-in-progress: true

jobs:
  verify:
    if: github.head_ref == 'agent/flowcordia-bundled-self-host-stack-clean'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - name: Checkout exact pull-request merge candidate
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 1

      - name: Setup pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5.0.0
        with:
          version: 10.33.2

      - name: Setup Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 20.20.2
          cache: pnpm

      - name: Apply exact compatibility patch
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path

          def replace_one(path: str, old: str, new: str) -> None:
              file = Path(path)
              text = file.read_text()
              if text.count(old) != 1:
                  raise SystemExit(f"{path}: anchor changed: {old!r}")
              file.write_text(text.replace(old, new))

          replace_one(
              "apps/webapp/app/features/flowcordia/operations/bundled-self-host-topology.ts",
              '    value(environment, "FLOWCORDIA_BUNDLED_MODE") === "1" &&\n',
              '    value(environment, "FLOWCORDIA_BUNDLED_MODE") === "1" &&\n    value(environment, "DATABASE_HOST") === "postgres:5432" &&\n',
          )

          test = "apps/webapp/test/flowcordia/bundledSelfHostTopology.test.ts"
          replace_one(
              test,
              '    ENCRYPTION_KEY: "0123456789abcdef0123456789abcdef",\n',
              '    ENCRYPTION_KEY: "0123456789abcdef0123456789abcdef",\n    PROVIDER_SECRET: "provider-4d5acdfb7e6866db93ed63b9",\n    COORDINATOR_SECRET: "coordinator-035caec12f77512860228f88",\n',
          )
          replace_one(
              test,
              '    DIRECT_URL:\n      "postgresql://flowcordia:strong-database-password@postgres:5432/flowcordia?schema=public&sslmode=disable",\n',
              '    DIRECT_URL:\n      "postgresql://flowcordia:strong-database-password@postgres:5432/flowcordia?schema=public&sslmode=disable",\n    DATABASE_HOST: "postgres:5432",\n',
          )
          replace_one(
              test,
              '    FLOWCORDIA_PROPOSAL_EVENT_URL: "https://flowcordia.example.com/api/flowcordia/proposal-events",\n',
              '    FLOWCORDIA_PROPOSAL_EVENT_URL: "https://events.example.com/flowcordia",\n',
          )
          replace_one(
              test,
              '    expect(projection({ REDIS_HOST: "external-redis.example" }).state).toBe("BLOCKED");\n',
              '    expect(projection({ REDIS_HOST: "external-redis.example" }).state).toBe("BLOCKED");\n    expect(projection({ DATABASE_HOST: "external.example:5432" }).state).toBe("BLOCKED");\n',
          )

          environment = "docker/flowcordia-bundled.env.example"
          replace_one(
              environment,
              "FLOWCORDIA_POSTGRES_DB=flowcordia\n",
              "FLOWCORDIA_POSTGRES_DB=flowcordia\nDATABASE_HOST=postgres:5432\n",
          )
          replace_one(
              environment,
              "FLOWCORDIA_PROPOSAL_EVENT_URL=https://flowcordia.example.com/api/flowcordia/proposal-events",
              "FLOWCORDIA_PROPOSAL_EVENT_URL=https://events.example.com/flowcordia",
          )

          secrets = "docker/flowcordia-bundled.secrets.example"
          replace_one(
              secrets,
              "ENCRYPTION_KEY=<exactly-32-random-hex-characters>\nMANAGED_WORKER_SECRET=<at-least-32-random-characters>\n",
              "ENCRYPTION_KEY=<exactly-32-random-hex-characters>\nPROVIDER_SECRET=<at-least-32-random-characters>\nCOORDINATOR_SECRET=<at-least-32-random-characters>\nMANAGED_WORKER_SECRET=<at-least-32-random-characters>\n",
          )

          generator = "docker/scripts/generate-flowcordia-bundled-secrets.sh"
          replace_one(
              generator,
              'managed_worker_secret="$(random_hex 32)"\n',
              'provider_secret="$(random_hex 32)"\ncoordinator_secret="$(random_hex 32)"\nmanaged_worker_secret="$(random_hex 32)"\n',
          )
          replace_one(
              generator,
              "FLOWCORDIA_POSTGRES_DB=flowcordia\n",
              "FLOWCORDIA_POSTGRES_DB=flowcordia\nDATABASE_HOST=postgres:5432\n",
          )
          replace_one(
              generator,
              "FLOWCORDIA_PROPOSAL_EVENT_URL=https://flowcordia.example.com/api/flowcordia/proposal-events",
              "FLOWCORDIA_PROPOSAL_EVENT_URL=https://events.example.com/flowcordia",
          )
          replace_one(
              generator,
              "ENCRYPTION_KEY=$encryption_key\nMANAGED_WORKER_SECRET=$managed_worker_secret\n",
              "ENCRYPTION_KEY=$encryption_key\nPROVIDER_SECRET=$provider_secret\nCOORDINATOR_SECRET=$coordinator_secret\nMANAGED_WORKER_SECRET=$managed_worker_secret\n",
          )

          source_test = "apps/webapp/test/flowcordia/bundledSelfHostTopologySource.test.ts"
          replace_one(
              source_test,
              '    expect(generator).toContain("openssl rand -hex");\n',
              '    expect(generator).toContain("openssl rand -hex");\n    expect(generator).toContain("provider_secret=\\\"$(random_hex 32)\\\"");\n    expect(generator).toContain("coordinator_secret=\\\"$(random_hex 32)\\\"");\n    expect(generator).toContain("PROVIDER_SECRET=$provider_secret");\n    expect(generator).toContain("COORDINATOR_SECRET=$coordinator_secret");\n',
          )
          replace_one(
              source_test,
              '    expect(environment).toContain("REDIS_HOST=redis");\n',
              '    expect(environment).toContain("REDIS_HOST=redis");\n    expect(environment).toContain("DATABASE_HOST=postgres:5432");\n    expect(environment).toContain("FLOWCORDIA_PROPOSAL_EVENT_URL=https://events.example.com/flowcordia");\n    expect(environment).not.toContain("/api/flowcordia/proposal-events");\n',
          )

          workflow = ".github/workflows/flowcordia-bundled-self-host.yml"
          replace_one(
              workflow,
              "          FLOWCORDIA_POSTGRES_DB=flowcordia\n",
              "          FLOWCORDIA_POSTGRES_DB=flowcordia\n          DATABASE_HOST=postgres:5432\n",
          )
          replace_one(
              workflow,
              "          FLOWCORDIA_PROPOSAL_EVENT_URL=https://flowcordia.example.com/api/flowcordia/proposal-events\n",
              "          FLOWCORDIA_PROPOSAL_EVENT_URL=https://events.example.com/flowcordia\n",
          )
          replace_one(
              workflow,
              "          ENCRYPTION_KEY=0123456789abcdef0123456789abcdef\n          MANAGED_WORKER_SECRET=strong-managed-worker-secret-123456\n",
              "          ENCRYPTION_KEY=0123456789abcdef0123456789abcdef\n          PROVIDER_SECRET=provider-4d5acdfb7e6866db93ed63b9\n          COORDINATOR_SECRET=coordinator-035caec12f77512860228f88\n          MANAGED_WORKER_SECRET=worker-0e3b895ca9b91313a052ef57a\n",
          )

          runbook = Path("flowcordia/runbooks/bundled-self-host-deployment.md")
          text = runbook.read_text().replace(
              "https://flowcordia.example.com/api/flowcordia/proposal-events",
              "https://events.example.com/flowcordia",
          )
          marker = "The generated secrets file is owner-only and must remain outside the repository."
          if marker in text and "independent provider, coordinator, and managed-worker secrets" not in text:
              text = text.replace(
                  marker,
                  marker + " It includes independent provider, coordinator, and managed-worker secrets required by the production control plane.",
              )
          runbook.write_text(text)
          PY

      - name: Install, format, and validate connected bundle
        shell: bash
        env:
          NODE_OPTIONS: --max-old-space-size=8192
          NODE_ENV: test
          APP_ENV: development
          DATABASE_URL: postgresql://flowcordia:test@localhost:5432/flowcordia
          DIRECT_URL: postgresql://flowcordia:test@localhost:5432/flowcordia
          SESSION_SECRET: 0123456789abcdef0123456789abcdef
          MAGIC_LINK_SECRET: fedcba9876543210fedcba9876543210
          ENCRYPTION_KEY: 0123456789abcdef0123456789abcdef
          DEPLOY_REGISTRY_HOST: localhost:5000
          V4_DEPLOY_REGISTRY_HOST: localhost:5000
          CLICKHOUSE_URL: http://localhost:8123/default
        run: |
          set -euo pipefail
          pnpm install --frozen-lockfile
          pnpm run generate
          pnpm --filter @trigger.dev/database build
          pnpm --filter @trigger.dev/core build
          pnpm exec oxfmt --write \
            .github/workflows/flowcordia-bundled-self-host.yml \
            apps/webapp/app/features/flowcordia/operations/bundled-self-host-topology.ts \
            apps/webapp/test/flowcordia/bundledSelfHostTopology.test.ts \
            apps/webapp/test/flowcordia/bundledSelfHostTopologySource.test.ts \
            docker/flowcordia-bundled.env.example \
            docker/flowcordia-bundled.secrets.example \
            flowcordia/runbooks/bundled-self-host-deployment.md
          pnpm --filter webapp test --run \
            test/flowcordia/bundledSelfHostTopology.test.ts \
            test/flowcordia/bundledSelfHostTopologySource.test.ts \
            test/flowcordia/productionControlPlaneSecurity.test.ts
          pnpm typecheck --filter webapp
          bash -n docker/scripts/flowcordia-bundled.sh
          bash -n docker/scripts/generate-flowcordia-bundled-secrets.sh
          git diff --check

      - name: Upload exact tested integration sources
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: pr105-connected-bundle-${{ github.run_id }}
          path: |
            .github/workflows/flowcordia-bundled-self-host.yml
            apps/webapp/app/features/flowcordia/operations/bundled-self-host-topology.ts
            apps/webapp/test/flowcordia/bundledSelfHostTopology.test.ts
            apps/webapp/test/flowcordia/bundledSelfHostTopologySource.test.ts
            docker/flowcordia-bundled.env.example
            docker/flowcordia-bundled.secrets.example
            docker/scripts/generate-flowcordia-bundled-secrets.sh
            flowcordia/runbooks/bundled-self-host-deployment.md
          if-no-files-found: error
          retention-days: 1
