name: Temporary PR 105 artifact publisher

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
    paths:
      - ".github/workflows/temporary-pr105-connect.yml"
      - "flowcordia/testing/pr105-connected-bundle.marker"

permissions: {}

concurrency:
  group: temporary-pr105-publisher-${{ github.event.pull_request.head.sha }}
  cancel-in-progress: true

jobs:
  publish:
    if: github.head_ref == 'agent/flowcordia-bundled-self-host-stack-clean'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      actions: read
      contents: write
    steps:
      - name: Checkout exact pull-request head
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: true
          fetch-depth: 1

      - name: Detect completed publication
        id: publication
        shell: bash
        run: |
          if [ -f flowcordia/testing/pr105-connected-bundle.marker ]; then
            echo "needed=false" >> "$GITHUB_OUTPUT"
          else
            echo "needed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Download and verify exact tested artifact
        if: steps.publication.outputs.needed == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/pr105-artifact
          gh api repos/${GITHUB_REPOSITORY}/actions/artifacts/8621644337/zip > /tmp/pr105-artifact.zip
          printf '%s  %s\n' \
            '3ec4e4406fe57034cbf8777f5dd1f11baf1c83df3096e3a82161695d803c933c' \
            /tmp/pr105-artifact.zip | sha256sum --check
          unzip -q /tmp/pr105-artifact.zip -d /tmp/pr105-artifact
          python3 <<'PY'
          from pathlib import Path

          root = Path('/tmp/pr105-artifact')
          expected = {
              '.github/workflows/flowcordia-bundled-self-host.yml',
              'apps/webapp/app/features/flowcordia/operations/bundled-self-host-topology.ts',
              'apps/webapp/test/flowcordia/bundledSelfHostTopology.test.ts',
              'apps/webapp/test/flowcordia/bundledSelfHostTopologySource.test.ts',
              'docker/flowcordia-bundled.env.example',
              'docker/flowcordia-bundled.secrets.example',
              'docker/scripts/generate-flowcordia-bundled-secrets.sh',
              'flowcordia/runbooks/bundled-self-host-deployment.md',
          }
          actual = {
              str(path.relative_to(root))
              for path in root.rglob('*')
              if path.is_file()
          }
          if actual != expected:
              raise SystemExit(f'artifact files differ: expected={sorted(expected)} actual={sorted(actual)}')
          PY

      - name: Commit tested non-workflow sources
        if: steps.publication.outputs.needed == 'true'
        shell: bash
        run: |
          set -euo pipefail
          for path in \
            apps/webapp/app/features/flowcordia/operations/bundled-self-host-topology.ts \
            apps/webapp/test/flowcordia/bundledSelfHostTopology.test.ts \
            apps/webapp/test/flowcordia/bundledSelfHostTopologySource.test.ts \
            docker/flowcordia-bundled.env.example \
            docker/flowcordia-bundled.secrets.example \
            docker/scripts/generate-flowcordia-bundled-secrets.sh \
            flowcordia/runbooks/bundled-self-host-deployment.md
          do
            install -D -m "$(stat -c '%a' "$path")" "/tmp/pr105-artifact/$path" "$path"
          done

          mkdir -p flowcordia/testing
          cat > flowcordia/testing/pr105-connected-bundle.marker <<'EOF'
          artifact-id=8621644337
          artifact-run=30166085507
          artifact-digest=3ec4e4406fe57034cbf8777f5dd1f11baf1c83df3096e3a82161695d803c933c
          EOF

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            apps/webapp/app/features/flowcordia/operations/bundled-self-host-topology.ts \
            apps/webapp/test/flowcordia/bundledSelfHostTopology.test.ts \
            apps/webapp/test/flowcordia/bundledSelfHostTopologySource.test.ts \
            docker/flowcordia-bundled.env.example \
            docker/flowcordia-bundled.secrets.example \
            docker/scripts/generate-flowcordia-bundled-secrets.sh \
            flowcordia/runbooks/bundled-self-host-deployment.md \
            flowcordia/testing/pr105-connected-bundle.marker

          if git diff --cached --name-only | grep -q '^.github/workflows/'; then
            echo 'A workflow file entered the non-workflow artifact commit.' >&2
            exit 1
          fi

          git diff --cached --check
          git commit -m "Connect bundled self-host contracts to current main"
          git push origin HEAD:refs/heads/agent/flowcordia-bundled-self-host-stack-clean
