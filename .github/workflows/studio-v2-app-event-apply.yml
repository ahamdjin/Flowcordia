name: Studio V2 app-event parity apply

on:
  pull_request:
    branches:
      - main
    paths:
      - .studio-v2-app-event-kick

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: agent/studio-v2-activepieces-webhook-parity
      - name: Apply patch
        run: python .studio-v2-app-event-patch.py
      - name: Commit product patch
        run: |
          rm -f .github/workflows/studio-v2-app-event-apply.yml
          rm -f .studio-v2-app-event-kick
          rm -f .studio-v2-app-event-patch.py
          git config user.name "flowcordia-studio-v2-bot"
          git config user.email "flowcordia-studio-v2-bot@users.noreply.github.com"
          git add -A
          git commit -m "feat(studio-v2): persist and parse Activepieces app events"
          git push origin HEAD:agent/studio-v2-activepieces-webhook-parity
