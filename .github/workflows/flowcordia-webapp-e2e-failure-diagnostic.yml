name: Flowcordia temporary webapp E2E failure diagnostic

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/flowcordia-webapp-e2e-failure-diagnostic.yml"

permissions: {}

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: read
      contents: read
    steps:
      - name: Checkout exact revision
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Extract failed E2E summary
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          JOB_ID: "89809309418"
        run: |
          set -euo pipefail
          output="$RUNNER_TEMP/webapp-e2e-failure"
          mkdir -p "$output"
          gh api "/repos/${GITHUB_REPOSITORY}/actions/jobs/${JOB_ID}/logs" > "$output/full.log"
          python <<'PY'
          import re
          from pathlib import Path

          raw = Path("/home/runner/work/_temp/webapp-e2e-failure/full.log").read_text(errors="replace")
          ansi = re.compile(r"\x1b\[[0-9;]*[A-Za-z]")
          text = ansi.sub("", raw).replace("\r", "")
          lines = text.splitlines()
          markers = (
              "FAIL ", "Failed Tests", "Test Files", "Tests ", "AssertionError",
              "Error:", "expected", "Received", "Expected", "at ", "Serialized Error"
          )
          selected = []
          for index, line in enumerate(lines):
              if any(marker in line for marker in markers):
                  start = max(0, index - 4)
                  end = min(len(lines), index + 12)
                  selected.extend(lines[start:end])
          if not selected:
              selected = lines[-300:]
          deduped = []
          for line in selected:
              if not deduped or deduped[-1] != line:
                  deduped.append(line)
          summary = "\n".join(deduped[-500:]) + "\n"
          Path("/home/runner/work/_temp/webapp-e2e-failure/summary.log").write_text(summary)
          print(summary)
          PY

      - name: Preserve bounded diagnostic
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: flowcordia-webapp-e2e-failure-${{ github.run_id }}
          path: ${{ runner.temp }}/webapp-e2e-failure/summary.log
          if-no-files-found: error
          retention-days: 1
          include-hidden-files: false
