name: Ajv workflow validation migration

on:
  pull_request:
    branches: [agent/mature-library-foundation]
    types: [opened, reopened, synchronize]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  validate-and-finalize:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout exact pull request head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Apply staged schema migration
        run: |
          set -o pipefail
          cp .agent/schema-validation.patch.gz.b64 /tmp/schema-validation.patch.gz.b64
          echo "ce8144c664ccfb673906ddd19b79710bc042f947f1142f3a4c07d046ad16954e  /tmp/schema-validation.patch.gz.b64" | sha256sum --check
          base64 --decode /tmp/schema-validation.patch.gz.b64 | gunzip > /tmp/schema-validation.patch
          echo "6cc3fffd43b4eaf5cd07878197082574feadf9e1dbdc3e0d17312465c80e4905  /tmp/schema-validation.patch" | sha256sum --check
          git apply --check --verbose /tmp/schema-validation.patch
          git apply /tmp/schema-validation.patch

      - name: Setup pnpm
        uses: pnpm/action-setup@v5
        with:
          version: 10.33.2

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 20.20.2
          cache: pnpm

      - name: Install exact dependencies
        run: pnpm install --frozen-lockfile

      - name: Format migration boundary
        run: |
          pnpm exec oxfmt \
            packages/flowcordia-foundation/src/index.ts \
            packages/flowcordia-foundation/src/json-value.ts \
            packages/flowcordia-foundation/test/json-value.test.ts \
            packages/flowcordia-workflow/schema/0.1.json \
            packages/flowcordia-workflow/src/validation.ts \
            packages/flowcordia-workflow/test/validation.test.ts

      - name: Typecheck affected packages
        run: |
          pnpm --filter @flowcordia/foundation typecheck
          pnpm --filter @flowcordia/workflow typecheck
          pnpm --filter @flowcordia/runtime typecheck

      - name: Test affected dependency graph
        run: |
          pnpm exec turbo run test \
            --concurrency=1 \
            --filter=@flowcordia/foundation \
            --filter=@flowcordia/workflow \
            --filter=@flowcordia/runtime \
            -- --run

      - name: Remove temporary migration transport
        run: rm -rf .agent .github/workflows/agent-schema-source-bootstrap.yml

      - name: Commit verified schema migration
        env:
          HEAD_BRANCH: ${{ github.head_ref }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Replace workflow structural validation with Ajv"
          git push origin "HEAD:${HEAD_BRANCH}"
