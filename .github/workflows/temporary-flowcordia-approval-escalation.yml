name: Temporary Flowcordia approval escalation

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
    paths:
      - ".github/workflows/temporary-flowcordia-approval-escalation.yml"
      - "scripts/flowcordia_apply_approval_escalation.part*"
      - "scripts/flowcordia_apply_approval_escalation.b64part*"
      - "flowcordia/testing/approval-escalation-applied.marker"

permissions: {}

concurrency:
  group: temporary-flowcordia-approval-escalation-${{ github.event.pull_request.head.sha }}
  cancel-in-progress: true

jobs:
  apply:
    if: github.head_ref == 'agent/flowcordia-approval-escalation'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write
    steps:
      - name: Checkout exact pull-request head
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: true
          fetch-depth: 1

      - name: Detect completed integration
        id: integration
        shell: bash
        run: |
          if [ -f flowcordia/testing/approval-escalation-applied.marker ]; then
            echo "needed=false" >> "$GITHUB_OUTPUT"
          else
            echo "needed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup pnpm
        if: steps.integration.outputs.needed == 'true'
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5.0.0
        with:
          version: 10.33.2

      - name: Setup Node
        if: steps.integration.outputs.needed == 'true'
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 20.20.2
          cache: pnpm

      - name: Install dependencies
        if: steps.integration.outputs.needed == 'true'
        run: pnpm install --frozen-lockfile

      - name: Apply exact integration patch
        id: patch
        if: steps.integration.outputs.needed == 'true'
        continue-on-error: true
        shell: bash
        run: |
          set +e
          : > /tmp/flowcordia_apply_approval_escalation.py
          : > /tmp/flowcordia-approval-escalation-patch.log
          status=0
          while read -r index expected; do
            encoded="scripts/flowcordia_apply_approval_escalation.b64part${index}"
            decoded="/tmp/flowcordia-approval-escalation-${index}.part"
            if ! base64 -d "$encoded" > "$decoded"; then
              printf 'chunk %s failed base64 decoding\n' "$index" >> /tmp/flowcordia-approval-escalation-patch.log
              status=1
              break
            fi
            actual="$(sha256sum "$decoded" | cut -d' ' -f1)"
            if [ "$actual" != "$expected" ]; then
              printf 'chunk %s digest mismatch: expected %s, got %s\n' "$index" "$expected" "$actual" >> /tmp/flowcordia-approval-escalation-patch.log
              status=1
              break
            fi
            cat "$decoded" >> /tmp/flowcordia_apply_approval_escalation.py
          done <<'HASHES'
          00 cf947f2df9ef4dd40620081569d41230da2ae51174fb90d3a8a85b8d5413a408
          01 daaf8ab9aede1a49f9f87b0039b56a6930444073f58e10e7555747fcfdcc4953
          02 3c943335ce2d2b51b64427e921eca04bded64812d136fe1d5f8d81d0dfa49f9f
          03 b6bec8efeac15a1f38a13a9ad807a102c3bffd6ebe4231ae5137a325735ff4bb
          04 eeb764d6fc78b87e907d23a566e24721e40a531bd41a86cdfb725fcc61e6b24e
          05 befc99241bf26dac45e793bbde42dce9977535eec05c07991771b17adb9391f7
          06 dbfe991c945ca75f75e9f069e0f1d4453ac9bef1fddd87a2ab0851286e8a0390
          07 075d0d18507431cc4557e6c433d5fb7bd0fb0e0016dac6a41bed84eb305aaf77
          08 9d7c06eeb9ae70864e3cc76bcf7ac61917539a35d31f58daff7f37479b5ad3bc
          09 dfa4abb4bd588d41ecc7eb9c8b459cd934c3c984681e5240f101ed2d96fc3e01
          10 7b29c9168eee664d585e841f07f93018873c16f1fc9651c49d7eea3ce2cd878e
          11 c1a2a3f296f4c7794bf69873ea9e376b4c733b66aefcc6386ba8067f0a1ced24
          HASHES
          if [ "$status" -eq 0 ]; then
            actual="$(sha256sum /tmp/flowcordia_apply_approval_escalation.py | cut -d' ' -f1)"
            expected="24b2d937cb7310e2e59fd6b68622740b66891541e8a9b3cdfc67c54534509e64"
            if [ "$actual" != "$expected" ]; then
              printf 'whole patch digest mismatch: expected %s, got %s\n' "$expected" "$actual" >> /tmp/flowcordia-approval-escalation-patch.log
              status=1
            else
              {
                python3 -m py_compile /tmp/flowcordia_apply_approval_escalation.py &&
                python3 /tmp/flowcordia_apply_approval_escalation.py
              } >> /tmp/flowcordia-approval-escalation-patch.log 2>&1
              status=$?
            fi
          fi
          mkdir -p flowcordia/testing
          tail -n 80 /tmp/flowcordia-approval-escalation-patch.log > flowcordia/testing/approval-escalation-patch-diagnostic.txt
          exit "$status"

      - name: Upload bounded patch diagnostic
        if: steps.integration.outputs.needed == 'true' && steps.patch.outcome == 'failure'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v6.0.0
        with:
          name: flowcordia-approval-escalation-patch-diagnostic-${{ github.run_id }}
          path: flowcordia/testing/approval-escalation-patch-diagnostic.txt
          if-no-files-found: error
          retention-days: 1

      - name: Stop after patch failure
        if: steps.integration.outputs.needed == 'true' && steps.patch.outcome == 'failure'
        run: exit 1

      - name: Format exact changed sources
        if: steps.integration.outputs.needed == 'true'
        run: |
          pnpm exec oxfmt --write \
            packages/flowcordia-workflow/src/approval.ts \
            packages/flowcordia-workflow/src/catalog.ts \
            packages/flowcordia-workflow/test/approval.test.ts \
            packages/flowcordia-runtime/src/compiler.ts \
            packages/flowcordia-runtime/test/approval-runtime.test.ts \
            apps/webapp/app/features/flowcordia/workflows/studio/node-configuration.ts \
            apps/webapp/app/features/flowcordia/workflows/studio/WorkflowStudioNodeConfigurationEditor.tsx \
            apps/webapp/app/features/flowcordia/workflows/approval/contract.ts \
            apps/webapp/app/features/flowcordia/workflows/approval/repository.server.ts \
            apps/webapp/app/features/flowcordia/workflows/approval/WorkflowApprovalInboxPanel.tsx \
            apps/webapp/test/flowcordia/approvalInboxPresentation.test.ts \
            apps/webapp/test/flowcordia/workflowStudioApprovalEscalation.test.ts

      - name: Run portable approval contracts
        if: steps.integration.outputs.needed == 'true'
        run: pnpm --filter @flowcordia/workflow exec vitest run test/approval.test.ts

      - name: Build portable workflow package
        if: steps.integration.outputs.needed == 'true'
        run: pnpm --filter @flowcordia/workflow build

      - name: Run runtime approval contracts
        if: steps.integration.outputs.needed == 'true'
        run: pnpm --filter @flowcordia/runtime exec vitest run test/approval-runtime.test.ts

      - name: Run approval inbox and Studio contracts
        if: steps.integration.outputs.needed == 'true'
        run: |
          pnpm --filter webapp exec vitest run \
            test/flowcordia/approvalInboxPresentation.test.ts \
            test/flowcordia/workflowStudioApprovalEscalation.test.ts

      - name: Typecheck portable packages
        if: steps.integration.outputs.needed == 'true'
        run: |
          pnpm --filter @flowcordia/workflow typecheck
          pnpm --filter @flowcordia/runtime typecheck

      - name: Check exact diff
        if: steps.integration.outputs.needed == 'true'
        run: git diff --check

      - name: Commit tested permanent sources
        if: steps.integration.outputs.needed == 'true'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p flowcordia/testing
          rm -f flowcordia/testing/approval-escalation-patch-diagnostic.txt
          cat > flowcordia/testing/approval-escalation-applied.marker <<'EOF'
          focused-contracts=passed
          EOF
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            packages/flowcordia-workflow/src/approval.ts \
            packages/flowcordia-workflow/src/catalog.ts \
            packages/flowcordia-workflow/test/approval.test.ts \
            packages/flowcordia-runtime/src/compiler.ts \
            packages/flowcordia-runtime/test/approval-runtime.test.ts \
            apps/webapp/app/features/flowcordia/workflows/studio/node-configuration.ts \
            apps/webapp/app/features/flowcordia/workflows/studio/WorkflowStudioNodeConfigurationEditor.tsx \
            apps/webapp/app/features/flowcordia/workflows/approval/contract.ts \
            apps/webapp/app/features/flowcordia/workflows/approval/repository.server.ts \
            apps/webapp/app/features/flowcordia/workflows/approval/WorkflowApprovalInboxPanel.tsx \
            apps/webapp/test/flowcordia/approvalInboxPresentation.test.ts \
            apps/webapp/test/flowcordia/workflowStudioApprovalEscalation.test.ts \
            flowcordia/product/capability-matrix.md \
            flowcordia/testing/approval-reminder-escalation.md \
            flowcordia/testing/approval-escalation-applied.marker
          if git diff --cached --name-only | grep -Eq '^(\.github/workflows/|scripts/)'; then
            echo 'Temporary integration machinery entered the product commit.' >&2
            exit 1
          fi
          git diff --cached --check
          git commit -m "Add durable approval reminder and escalation state"
          git push origin HEAD:refs/heads/agent/flowcordia-approval-escalation
