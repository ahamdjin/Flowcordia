name: Mature library foundation validation

on:
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  validate-and-finalize:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout exact pull request head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Apply staged migration
        run: |
          set -o pipefail
          sed -i 's/QYBHmLqH7riusKtlJ/QYBHmLqH7liusKtlJ/' .agent/mature-library-foundation.part01
          cat .agent/mature-library-foundation.part* > /tmp/mature-library-foundation.patch.gz.b64
          wc -c .agent/mature-library-foundation.part* /tmp/mature-library-foundation.patch.gz.b64 \
            | tee /tmp/apply.log
          echo "83b23ffdee5f582a72af4059c3d2c069e923b0ba4ef59d764ab20ad4d3fecddc  /tmp/mature-library-foundation.patch.gz.b64" \
            | sha256sum --check 2>&1 | tee -a /tmp/apply.log
          base64 --decode /tmp/mature-library-foundation.patch.gz.b64 \
            | gunzip > /tmp/mature-library-foundation.patch
          echo "628e2d164a7215ed5a18e3291fc6c0300bf8d97770b160608942a3c3237b33d5  /tmp/mature-library-foundation.patch" \
            | sha256sum --check 2>&1 | tee -a /tmp/apply.log
          git apply --check --verbose /tmp/mature-library-foundation.patch 2>&1 | tee -a /tmp/apply.log
          git apply /tmp/mature-library-foundation.patch
          python - <<'PY'
          from pathlib import Path
          path = Path("packages/flowcordia-foundation/src/validation.ts")
          source = path.read_text()
          source = source.replace(
              'import Ajv2020, { type ErrorObject, type Options, type ValidateFunction } from "ajv/dist/2020";',
              'import { Ajv2020, type ErrorObject, type Options, type ValidateFunction } from "ajv/dist/2020.js";',
          )
          source = source.replace('.map((segment) =>', '.map((segment: string) =>', 2)
          path.write_text(source)
          PY

      - name: Upload apply diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: mature-library-apply-${{ github.run_id }}
          path: |
            /tmp/apply.log
            /tmp/mature-library-foundation.patch.gz.b64
          retention-days: 1

      - name: Enable pinned package manager
        run: corepack enable

      - name: Install and update workspace lock
        run: pnpm install --no-frozen-lockfile

      - name: Format migration boundary
        run: |
          pnpm exec oxfmt \
            packages/flowcordia-foundation \
            packages/flowcordia-workflow/src/serialization.ts \
            packages/flowcordia-workflow/src/mapping.ts \
            packages/flowcordia-workflow/src/editor.ts \
            packages/flowcordia-runtime/src/analyze.ts \
            packages/flowcordia-runtime/src/runtime.ts \
            packages/flowcordia-github-workflows/src/repository/read-retry.ts \
            packages/flowcordia-control-plane/src/outbox/dispatcher.ts \
            packages/flowcordia-control-plane/src/outbox/http-publisher.ts

      - name: Typecheck affected packages
        run: |
          set -o pipefail
          {
            pnpm --filter @flowcordia/foundation typecheck
            pnpm --filter @flowcordia/workflow typecheck
            pnpm --filter @flowcordia/runtime typecheck
            pnpm --filter @flowcordia/github-workflows typecheck
            pnpm --filter @flowcordia/control-plane typecheck
          } 2>&1 | tee /tmp/typecheck.log

      - name: Upload typecheck diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: mature-library-typecheck-${{ github.run_id }}
          path: /tmp/typecheck.log
          retention-days: 1

      - name: Test affected dependency graph
        run: |
          set -o pipefail
          pnpm exec turbo run test \
            --concurrency=1 \
            --filter=@flowcordia/foundation \
            --filter=@flowcordia/workflow \
            --filter=@flowcordia/runtime \
            --filter=@flowcordia/github-workflows \
            --filter=@flowcordia/control-plane \
            -- --run 2>&1 | tee /tmp/test.log

      - name: Upload test diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: mature-library-tests-${{ github.run_id }}
          path: /tmp/test.log
          retention-days: 1

      - name: Remove temporary migration transport
        run: rm -rf .agent .github/workflows/agent-source-bootstrap.yml

      - name: Commit verified migration
        env:
          HEAD_BRANCH: ${{ github.head_ref }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Establish mature library foundation"
          git push origin "HEAD:${HEAD_BRANCH}"
