name: Diagnose publication report workflow

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/flowcordia-diagnose-publication-report.yml
      - .github/workflows/flowcordia-report-first-image-publication.yml

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout exact reporter revision
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false

      - name: Run actionlint on reporter
        run: >-
          docker run --rm -v "$PWD:/repo" -w /repo
          rhysd/actionlint:1.7.12@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667
          -color .github/workflows/flowcordia-report-first-image-publication.yml
