name: Diagnose publication report workflow

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/flowcordia-diagnose-publication-report.yml
      - .github/workflows/flowcordia-report-first-image-publication.yml

permissions: {}

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Fetch exact reporter workflow
        run: >-
          curl --fail --silent --show-error --location
          --output /tmp/reporter.yml
          https://raw.githubusercontent.com/ahamdjin/Flowcordia/agent/report-first-image-publication/.github/workflows/flowcordia-report-first-image-publication.yml

      - name: Run actionlint on reporter
        run: >-
          docker run --rm -v /tmp:/repo:ro
          rhysd/actionlint:1.7.12@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667
          -color /repo/reporter.yml
