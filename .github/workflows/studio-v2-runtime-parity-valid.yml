name: Studio V2 runtime parity valid runner

on:
  pull_request:
    branches:
      - main
    types:
      - synchronize

permissions:
  contents: write

jobs:
  apply:
    if: github.event.pull_request.head.ref == 'agent/studio-v2-runtime-parity'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: agent/studio-v2-runtime-parity
          fetch-depth: 0
      - name: Apply source patch
        shell: python
        run: |
          from pathlib import Path
          ap = Path('packages/flowcordia-runtime/src/activepieces.ts')
          text = ap.read_text()
          old = '  serverPublicUrl?: string;\n  store?: FlowcordiaActivepiecesStoreService;'
          new = '  serverPublicUrl?: string;\n  executionType?: "BEGIN" | "RESUME";\n  resumePayload?: unknown;\n  awaitWaitpoint?(waitpointId: string): Promise<unknown>;\n  store?: FlowcordiaActivepiecesStoreService;'
          assert old in text
          text = text.replace(old, new, 1)
          marker = 'export interface FlowcordiaActivepiecesPropertyInteraction {'
          signal = '\n'.join(['export class FlowcordiaActivepiecesWaitpointRequested extends Error {','  constructor(readonly waitpointId: string) {','    super(`Activepieces requested waitpoint ${waitpointId}.`);','    this.name = "FlowcordiaActivepiecesWaitpointRequested";','  }','}','',''])
          assert marker in text
          text = text.replace(marker, signal + marker, 1)
          old = '    waitForWaitpoint: (waitpointId: string) => {\n      if (!services.waitForWaitpoint) return unsupportedCapability("context.run.waitForWaitpoint");\n      return services.waitForWaitpoint(waitpointId);\n    },'
          new = '    waitForWaitpoint: (waitpointId: string) => {\n      if (services.waitForWaitpoint) return services.waitForWaitpoint(waitpointId);\n      throw new FlowcordiaActivepiecesWaitpointRequested(waitpointId);\n    },'
          assert old in text
          text = text.replace(old, new, 1)
          old = '}) {\n  return {\n    executionType: "BEGIN",\n    propsValue: input.propsValue,'
          new = '}) {\n  const executionType = input.services.executionType ?? "BEGIN";\n  return {\n    executionType,\n    ...(executionType === "RESUME" ? { resumePayload: input.services.resumePayload ?? {} } : {}),\n    propsValue: input.propsValue,'
          assert old in text
          ap.write_text(text.replace(old, new, 1))
          runtime = Path('packages/flowcordia-runtime/src/runtime.ts')
          text = runtime.read_text()
          old = 'import { executeFlowcordiaActivepiecesAction } from "./activepieces.js";'
          new = '\n'.join(['import {','  FlowcordiaActivepiecesWaitpointRequested,','  executeFlowcordiaActivepiecesAction,','} from "./activepieces.js";'])
          assert old in text
          text = text.replace(old, new, 1)
          start = text.index('      return executeFlowcordiaActivepiecesAction({', text.index('async activepieces('))
          end_marker = '      });\n    },\n    async subflow'
          end = text.index(end_marker, start)
          lines = ['      let executionType = options.activepiecesRuntimeServices?.executionType ?? "BEGIN";','      let resumePayload = options.activepiecesRuntimeServices?.resumePayload;','      while (true) {','        try {','          return await executeFlowcordiaActivepiecesAction({','            node,','            configuration,','            workflowInput,','            outputs,','            services: {','              ...options.activepiecesRuntimeServices,','              loadPiece: options.loadActivepiecesPiece,','              resolveConnection: options.resolveActivepiecesConnection,','              formulaEvaluator: options.activepiecesFormulaEvaluator,','              projectId: options.activepiecesProjectId,','              projectExternalId: options.activepiecesProjectExternalId,','              runId: options.activepiecesRunId,','              serverApiUrl: options.activepiecesServerApiUrl,','              serverPublicUrl: options.activepiecesServerPublicUrl,','              executionType,','              resumePayload,','            },','          });','        } catch (error) {','          if (!(error instanceof FlowcordiaActivepiecesWaitpointRequested)) throw error;','          const awaitWaitpoint = options.activepiecesRuntimeServices?.awaitWaitpoint;','          if (!awaitWaitpoint) {','            throw new Error(','              `Activepieces requested waitpoint ${error.waitpointId}, but this Trigger.dev runtime has no durable waitpoint adapter.`','            );','          }','          resumePayload = await awaitWaitpoint(error.waitpointId);','          executionType = "RESUME";','        }','      }','    },','    async subflow']
          replacement = '\n'.join(lines)
          runtime.write_text(text[:start] + replacement + text[end + len(end_marker):])
      - name: Verify source patch
        run: git diff --check
      - name: Commit clean product tree
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -f .github/workflows/studio-v2-runtime-parity-patch.yml .github/workflows/studio-v2-runtime-parity-run.yml .github/workflows/studio-v2-runtime-parity-source.yml .github/workflows/studio-v2-runtime-parity-valid.yml
          git rm -f .studio-v2-runtime-parity-kick .studio-v2-runtime-parity-kick-2 || true
          git add packages/flowcordia-runtime/src/activepieces.ts packages/flowcordia-runtime/src/runtime.ts packages/flowcordia-runtime/src/types.ts packages/flowcordia-runtime/src/activepieces-runtime-parity.test.ts
          git commit -m "feat(studio-v2): add durable Activepieces action resume semantics"
          git push origin HEAD:agent/studio-v2-runtime-parity
