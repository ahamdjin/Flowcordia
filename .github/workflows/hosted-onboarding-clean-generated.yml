name: Clean hosted onboarding generated spillover

on:
  push:
    branches: [agent/simplify-hosted-onboarding]

permissions:
  contents: write

jobs:
  clean:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact branch
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: agent/simplify-hosted-onboarding
          fetch-depth: 0
          persist-credentials: false

      - name: Restore unrelated generated files
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git checkout origin/main -- \
            internal-packages/llm-model-catalog/src/defaultPrices.ts \
            internal-packages/llm-model-catalog/src/modelCatalog.ts
          rm -f .github/workflows/hosted-onboarding-clean-generated.yml
          git diff --check
          git config user.name flowcordia-onboarding-bot
          git config user.email flowcordia-onboarding-bot@users.noreply.github.com
          git add \
            internal-packages/llm-model-catalog/src/defaultPrices.ts \
            internal-packages/llm-model-catalog/src/modelCatalog.ts \
            .github/workflows/hosted-onboarding-clean-generated.yml
          git commit -m 'Keep hosted onboarding changes isolated'
          git remote set-url origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push origin HEAD:agent/simplify-hosted-onboarding
