name: Flowcordia PR 177 formatter

on:
  push:
    branches:
      - agent/simplify-self-host-first-run
    paths:
      - ".github/workflows/flowcordia-pr177-format.yml"
      - "apps/webapp/app/routes/setup.first-run/route.tsx"
      - "apps/webapp/app/routes/setup.owner/route.tsx"
      - "apps/webapp/app/routes/setup/route.tsx"

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout branch
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: agent/simplify-self-host-first-run

      - name: Setup pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5.0.0
        with:
          version: 10.33.2

      - name: Setup Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 20.20.2
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Format bounded onboarding files
        run: |
          pnpm exec oxfmt \
            apps/webapp/app/routes/setup.first-run/route.tsx \
            apps/webapp/app/routes/setup.owner/route.tsx \
            apps/webapp/app/routes/setup/route.tsx

      - name: Commit formatter output
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- \
            apps/webapp/app/routes/setup.first-run/route.tsx \
            apps/webapp/app/routes/setup.owner/route.tsx \
            apps/webapp/app/routes/setup/route.tsx; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            apps/webapp/app/routes/setup.first-run/route.tsx \
            apps/webapp/app/routes/setup.owner/route.tsx \
            apps/webapp/app/routes/setup/route.tsx
          git commit -m "Format simplified self-host onboarding"
          git push origin HEAD:agent/simplify-self-host-first-run
