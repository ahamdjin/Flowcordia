name: Flowcordia canvas temporary typecheck diagnostic

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/flowcordia-canvas-typecheck-diagnostic.yml"

permissions: {}

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Checkout exact revision
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5.0.0
        with:
          version: 10.33.2

      - name: Setup Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 20.20.2
          cache: pnpm

      - name: Capture exact typecheck output
        shell: bash
        run: |
          set +e
          pnpm install --frozen-lockfile
          pnpm --filter @trigger.dev/database generate
          pnpm run typecheck > "$RUNNER_TEMP/typecheck.log" 2>&1
          status=$?
          echo "$status" > "$RUNNER_TEMP/typecheck-status"
          exit 0

      - name: Upload diagnostics
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: flowcordia-canvas-typecheck-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/typecheck.log
            ${{ runner.temp }}/typecheck-status
          if-no-files-found: error
          retention-days: 1
          include-hidden-files: false
