name: Flowcordia temporary OpenTelemetry family repair

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/flowcordia-opentelemetry-family-repair.yml"

permissions: {}

jobs:
  repair:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write
    steps:
      - name: Disable IPv6
        run: |
          sudo sysctl -w net.ipv6.conf.all.disable_ipv6=1
          sudo sysctl -w net.ipv6.conf.default.disable_ipv6=1
          sudo sysctl -w net.ipv6.conf.lo.disable_ipv6=1

      - name: Configure Docker address pool
        run: |
          config='{
            "default-address-pools": [
              {"base": "172.17.0.0/12", "size": 20},
              {"base": "192.168.0.0/16", "size": 24}
            ]
          }'
          echo "$config" | sudo tee /etc/docker/daemon.json
          sudo systemctl restart docker

      - name: Checkout exact repair branch
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5.0.0
        with:
          version: 10.33.2

      - name: Setup Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 20.20.2
          cache: pnpm

      - name: Remove incompatible core-only override
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require("node:fs");
          const root = JSON.parse(fs.readFileSync("package.json", "utf8"));
          const overrides = root.pnpm?.overrides ?? {};
          const removed = [];
          for (const selector of Object.keys(overrides)) {
            if (selector === "@opentelemetry/core" || selector.startsWith("@opentelemetry/core@")) {
              removed.push(`${selector} -> ${overrides[selector]}`);
              delete overrides[selector];
            }
          }
          if (removed.length === 0) {
            throw new Error("Expected the incompatible OpenTelemetry core-only override.");
          }
          root.pnpm.overrides = overrides;
          fs.writeFileSync("package.json", JSON.stringify(root, null, 2) + "\n");
          console.log(`Removed ${removed.join(", ")}`);
          NODE
          pnpm install --lockfile-only --no-frozen-lockfile
          pnpm install --frozen-lockfile

      - name: Verify exception-aware lockfile
        id: scan
        continue-on-error: true
        uses: google/osv-scanner-action/osv-scanner-action@9a498708959aeaef5ef730655706c5a1df1edbc2 # v2.3.8
        with:
          scan-args: |-
            --config=osv-scanner.toml
            --format=json
            --output=osv-opentelemetry-repair.json
            --lockfile=pnpm-lock.yaml

      - name: Refuse findings outside reviewed exceptions
        if: steps.scan.outcome != 'success'
        run: |
          echo "Restoring OpenTelemetry family compatibility introduced an unreviewed vulnerability." >&2
          exit 1

      - name: Prove webapp startup and behavior
        shell: bash
        env:
          WEBAPP_TEST_VERBOSE: "1"
        run: |
          set -euo pipefail
          pnpm run generate
          pnpm run build --filter webapp
          cd apps/webapp
          pnpm exec vitest run --config vitest.e2e.config.ts --reporter=default

      - name: Commit repair and remove diagnostics
        shell: bash
        env:
          HEAD_BRANCH: ${{ github.event.pull_request.head.ref }}
        run: |
          set -euo pipefail
          rm .github/workflows/flowcordia-opentelemetry-family-repair.yml
          rm -f .github/workflows/flowcordia-webapp-e2e-failure-diagnostic.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json pnpm-lock.yaml .github/workflows/flowcordia-opentelemetry-family-repair.yml .github/workflows/flowcordia-webapp-e2e-failure-diagnostic.yml
          git commit -m "Restore compatible OpenTelemetry 1.30 family"
          git push origin "HEAD:${HEAD_BRANCH}"
