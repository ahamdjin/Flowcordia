name: Studio V2 browser JSON type

on:
  push:
    branches:
      - agent/studio-v2-browser-workspace
    paths:
      - .github/workflows/studio-v2-browser-json-type.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout browser branch
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Apply JsonValue boundary
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path("apps/webapp/app/features/flowcordia/workflows/studio-v2/StudioV2Surface.tsx")
          text = path.read_text()
          old_import = '  type StudioV2FoundationNodeId,\n  type WorkflowDefinition,'
          new_import = '  type JsonValue,\n  type StudioV2FoundationNodeId,\n  type WorkflowDefinition,'
          if old_import not in text:
            raise SystemExit("Expected workflow type import boundary was not found")
          text = text.replace(old_import, new_import, 1)
          old_submit = '      JSON.parse(\n        JSON.stringify({ intent: "save", expectedVersion: workspaceVersion, document: workflow })\n      ),'
          new_submit = '      JSON.parse(\n        JSON.stringify({ intent: "save", expectedVersion: workspaceVersion, document: workflow })\n      ) as JsonValue,'
          if old_submit not in text:
            raise SystemExit("Expected serialized save command was not found")
          path.write_text(text.replace(old_submit, new_submit, 1))
          PY
          git config user.name "flowcordia-ci"
          git config user.email "flowcordia-ci@users.noreply.github.com"
          git add apps/webapp/app/features/flowcordia/workflows/studio-v2/StudioV2Surface.tsx
          git commit -m "Type Studio V2 JSON submissions as JsonValue"
          git push origin HEAD:agent/studio-v2-browser-workspace
