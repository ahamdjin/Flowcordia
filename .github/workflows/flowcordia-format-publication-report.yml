name: Format publication status workflow

on:
  push:
    branches:
      - agent/report-first-image-publication
    paths:
      - .github/workflows/flowcordia-format-publication-report.yml

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout formatter branch
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: agent/report-first-image-publication
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320
        with:
          version: 10.33.2

      - name: Setup Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: 20.20.2
          cache: pnpm

      - name: Format and remove temporary workflow
        shell: bash
        run: |
          set -euo pipefail
          pnpm install --frozen-lockfile
          pnpm exec oxfmt --write .github/workflows/flowcordia-report-first-image-publication.yml
          rm .github/workflows/flowcordia-format-publication-report.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add .github/workflows/flowcordia-report-first-image-publication.yml .github/workflows/flowcordia-format-publication-report.yml
          git diff --cached --check
          git commit -m 'Format publication status workflow'
          git push origin HEAD:agent/report-first-image-publication
