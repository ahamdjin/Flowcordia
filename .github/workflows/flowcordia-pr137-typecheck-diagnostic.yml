name: Flowcordia PR 137 typecheck diagnostic

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  capture:
    if: github.event.pull_request.head.ref == 'agent/flowcordia-github-setup-deploy-latest'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout merge ref
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Setup pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5.0.0
        with:
          version: 10.33.2
      - name: Setup Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 20.20.2
          cache: pnpm
      - name: Install and generate
        run: |
          pnpm install --frozen-lockfile
          pnpm run generate
      - name: Capture typecheck
        id: typecheck
        continue-on-error: true
        shell: bash
        env:
          NODE_OPTIONS: --max-old-space-size=8192
        run: |
          set -o pipefail
          pnpm run typecheck 2>&1 | tee /tmp/flowcordia-pr137-typecheck.log
      - name: Upload diagnostics
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: flowcordia-pr137-typecheck-${{ github.run_id }}
          path: /tmp/flowcordia-pr137-typecheck.log
          if-no-files-found: error
          retention-days: 1
      - name: Fail with captured result
        if: steps.typecheck.outcome == 'failure'
        run: exit 1
