name: Flowcordia PR 137 type fix

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  apply:
    if: github.event.pull_request.head.ref == 'agent/flowcordia-github-setup-deploy-latest'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout branch
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Apply asserted type fixes
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path

          config_path = Path("apps/webapp/app/features/flowcordia/setup/githubAppConfiguration.server.ts")
          config = config_path.read_text()
          old_line = '  return { appId: response.data.id, slug: response.data.slug };'
          new_block = '''  const identity = response.data;
          if (
            !identity ||
            typeof identity.id !== "number" ||
            typeof identity.slug !== "string" ||
            identity.slug.length === 0
          ) {
            throw new Error("GitHub returned an invalid App identity.");
          }
          return { appId: identity.id, slug: identity.slug };'''
          if config.count(old_line) != 1:
              raise SystemExit(f"Expected one GitHub identity return, found {config.count(old_line)}")
          config_path.write_text(config.replace(old_line, new_block))

          def replace_disabled_branch(path: Path, marker: str, new_import: str) -> None:
              text = path.read_text()
              old_import = 'import { err, fromPromise, ok, ResultAsync } from "neverthrow";'
              if text.count(old_import) != 1:
                  raise SystemExit(f"Expected one neverthrow import in {path}")
              text = text.replace(old_import, new_import)
              marker_index = text.find(marker)
              if marker_index < 0:
                  raise SystemExit(f"Missing disabled-branch marker in {path}")
              return_index = text.find("return ok({", marker_index)
              if return_index < 0:
                  raise SystemExit(f"Missing disabled return in {path}")
              text = text[:return_index] + "return okAsync({" + text[return_index + len("return ok({"):]
              path.write_text(text)

          replace_disabled_branch(
              Path("apps/webapp/app/presenters/v3/GitHubSettingsPresenter.server.ts"),
              ")).andThen((githubAppEnabled) => {",
              'import { err, fromPromise, okAsync, ResultAsync } from "neverthrow";',
          )
          replace_disabled_branch(
              Path("apps/webapp/app/services/projectSettingsPresenter.server.ts"),
              "]).andThen(([project, githubAppEnabled]) => {",
              'import { err, fromPromise, ok, okAsync, ResultAsync } from "neverthrow";',
          )
          PY

      - name: Setup pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5.0.0
        with:
          version: 10.33.2

      - name: Setup Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 20.20.2
          cache: pnpm

      - name: Install and generate
        run: |
          pnpm install --frozen-lockfile
          pnpm run generate

      - name: Build focused dependencies
        run: |
          pnpm --filter @trigger.dev/database build
          pnpm --filter @trigger.dev/core build

      - name: Format and verify
        run: |
          pnpm exec oxfmt \
            apps/webapp/app/features/flowcordia/setup/githubAppConfiguration.server.ts \
            apps/webapp/app/presenters/v3/GitHubSettingsPresenter.server.ts \
            apps/webapp/app/services/projectSettingsPresenter.server.ts
          git diff --check

      - name: Run focused tests
        env:
          NODE_ENV: test
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/flowcordia_test
          DIRECT_URL: postgresql://postgres:postgres@localhost:5432/flowcordia_test
          SESSION_SECRET: flowcordia-test-session-secret
          MAGIC_LINK_SECRET: flowcordia-test-magic-link-secret
          ENCRYPTION_KEY: 0123456789abcdef0123456789abcdef
          DEPLOY_REGISTRY_HOST: localhost:5000
          V4_DEPLOY_REGISTRY_HOST: localhost:5000
          CLICKHOUSE_URL: http://localhost:8123
        run: |
          pnpm --filter webapp exec vitest run \
            app/features/flowcordia/setup/configuration.server.test.ts \
            app/features/flowcordia/setup/githubAppConfiguration.server.test.ts \
            app/features/flowcordia/deployments/latest.server.test.ts

      - name: Clean focused build outputs
        run: rm -rf internal-packages/database/dist packages/core/dist

      - name: Typecheck repository
        env:
          NODE_OPTIONS: --max-old-space-size=8192
        run: pnpm run typecheck

      - name: Commit product fixes and cleanup
        env:
          HEAD_BRANCH: ${{ github.event.pull_request.head.ref }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm .github/flowcordia-pr137-type-fix.patch
          rm .github/workflows/flowcordia-pr137-typecheck-diagnostic.yml
          git add -u .github
          git add \
            apps/webapp/app/features/flowcordia/setup/githubAppConfiguration.server.ts \
            apps/webapp/app/presenters/v3/GitHubSettingsPresenter.server.ts \
            apps/webapp/app/services/projectSettingsPresenter.server.ts
          git diff --cached --check
          git commit -m "Fix GitHub setup type integration"
          git push origin "HEAD:${HEAD_BRANCH}"
