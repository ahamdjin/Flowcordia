name: Capture PR 107 Git object manifest

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened

permissions:
  contents: read

concurrency:
  group: flowcordia-pr107-git-object-manifest
  cancel-in-progress: true

jobs:
  capture:
    if: ${{ github.head_ref == 'agent/flowcordia-production-auth-hardening' && github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact security branch
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: agent/flowcordia-production-auth-hardening
          fetch-depth: 1
          persist-credentials: false

      - name: Capture parent and tree identity
        shell: bash
        run: |
          set -euo pipefail
          parent_sha="$(git rev-parse HEAD)"
          tree_sha="$(git rev-parse HEAD^{tree})"
          cat > /tmp/flowcordia-pr107-git-objects.json <<JSON
          {
            "parentSha": "$parent_sha",
            "baseTreeSha": "$tree_sha",
            "topologyBlobSha": "ff27eb49524e085d15357e33b8a70dd734f99d9b"
          }
          JSON

      - name: Upload Git object manifest
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: flowcordia-pr107-git-objects
          path: /tmp/flowcordia-pr107-git-objects.json
          if-no-files-found: error
          retention-days: 1
