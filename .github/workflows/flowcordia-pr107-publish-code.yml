name: Publish PR 107 topology blob

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened

permissions:
  contents: write

concurrency:
  group: flowcordia-pr107-topology-blob
  cancel-in-progress: true

jobs:
  publish:
    if: ${{ github.head_ref == 'agent/flowcordia-production-auth-hardening' && github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout security branch
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: agent/flowcordia-production-auth-hardening
          fetch-depth: 1
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5.0.0
        with:
          version: 10.33.2

      - name: Setup Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 20.20.2
          cache: pnpm

      - name: Install and generate
        run: |
          pnpm install --frozen-lockfile --ignore-scripts
          pnpm --filter @trigger.dev/database generate

      - name: Correct and canonicalize topology fixture
        shell: bash
        run: |
          set -euo pipefail
          python <<'PY'
          from pathlib import Path
          path = Path('.github/workflows/flowcordia-self-host-topology.yml')
          value = path.read_text()
          old = 'worker-0e3b895ca9b91313a052ef57'
          new = 'worker-0e3b895ca9b91313a052ef57a'
          if value.count(old) != 1:
              raise SystemExit('managed-worker topology fixture anchor is not exact')
          path.write_text(value.replace(old, new))
          PY
          pnpm exec oxfmt --write .github/workflows/flowcordia-self-host-topology.yml

      - name: Validate corrected topology contract
        run: |
          pnpm --filter webapp test --run test/flowcordia/selfHostTopology.test.ts

      - name: Publish immutable topology blob
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('node:fs');
          const crypto = require('node:crypto');
          const token = process.env.GH_TOKEN;
          const [owner, repo] = process.env.REPOSITORY.split('/');
          const content = fs.readFileSync('.github/workflows/flowcordia-self-host-topology.yml');
          (async () => {
            const response = await fetch(`https://api.github.com/repos/${owner}/${repo}/git/blobs`, {
              method: 'POST',
              headers: {
                accept: 'application/vnd.github+json',
                authorization: `Bearer ${token}`,
                'x-github-api-version': '2022-11-28',
                'content-type': 'application/json',
              },
              body: JSON.stringify({ content: content.toString('base64'), encoding: 'base64' }),
            });
            if (!response.ok) throw new Error(`${response.status} ${await response.text()}`);
            const blob = await response.json();
            fs.writeFileSync('/tmp/flowcordia-pr107-topology-blob.json', `${JSON.stringify({
              blobSha: blob.sha,
              sha256: crypto.createHash('sha256').update(content).digest('hex'),
            }, null, 2)}\n`);
          })().catch((error) => {
            console.error(error);
            process.exit(1);
          });
          NODE

      - name: Upload topology blob manifest
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: flowcordia-pr107-topology-blob
          path: /tmp/flowcordia-pr107-topology-blob.json
          if-no-files-found: error
          retention-days: 1
