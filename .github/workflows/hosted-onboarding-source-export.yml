name: Hosted onboarding source export

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact pull request head
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false

      - name: Collect hosted onboarding source
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/hosted-onboarding-source
          cp -R apps/webapp/app/routes /tmp/hosted-onboarding-source/routes
          cp -R apps/webapp/app/features/flowcordia/setup /tmp/hosted-onboarding-source/setup-features
          cp apps/webapp/app/features.server.ts /tmp/hosted-onboarding-source/features.server.ts
          cp apps/webapp/app/root.tsx /tmp/hosted-onboarding-source/root.tsx
          cp apps/webapp/app/services/session.server.ts /tmp/hosted-onboarding-source/session.server.ts
          cp apps/webapp/app/services/organization.server.ts /tmp/hosted-onboarding-source/organization.server.ts || true
          cp apps/webapp/app/services/project.server.ts /tmp/hosted-onboarding-source/project.server.ts || true
          cp apps/webapp/app/db.server.ts /tmp/hosted-onboarding-source/db.server.ts
          cp apps/webapp/package.json /tmp/hosted-onboarding-source/webapp-package.json
          tar -C /tmp -czf hosted-onboarding-source.tgz hosted-onboarding-source

      - name: Upload source snapshot
        uses: actions/upload-artifact@v4
        with:
          name: hosted-onboarding-source
          path: hosted-onboarding-source.tgz
          retention-days: 1
          if-no-files-found: error
