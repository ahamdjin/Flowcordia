name: Verify complete Studio V2 Activepieces integration

on:
  push:
    branches:
      - agent/studio-v2-activepieces-frontend
    paths:
      - .github/workflows/studio-v2-activepieces-integration-verify.yml

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/studio-v2-activepieces-frontend
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.2
      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Finalize adapter and build wiring
        shell: bash
        run: |
          set -euo pipefail
          python <<'PY'
          import json
          from pathlib import Path

          bridge_path = Path('apps/flowcordia-studio-activepieces/src/flowcordia-activepieces-bridge.ts')
          bridge = bridge_path.read_text()
          if '  BranchOperator,\n' not in bridge:
              bridge = bridge.replace(
                  '  BranchExecutionType,\n',
                  '  BranchExecutionType,\n  BranchOperator,\n',
                  1,
              )
          bridge = bridge.replace(
              '  const operator = configuration.operator === "equals" ? "TEXT_EXACTLY_MATCHES" : "TEXT_EXACTLY_MATCHES";\n',
              '  const operator = BranchOperator.TEXT_EXACTLY_MATCHES;\n',
          )
          bridge = bridge.replace(
              '  if (step.type === FlowTriggerType.PIECE) {\n    if (step.settings.pieceName !== MANUAL_TRIGGER_PIECE) {',
              '  if (\n    step.type === FlowTriggerType.PIECE &&\n    "triggerName" in step.settings\n  ) {\n    if (step.settings.pieceName !== MANUAL_TRIGGER_PIECE) {',
          )
          bridge = bridge.replace(
              '  if (step.type === FlowActionType.PIECE && step.settings.pieceName === HTTP_PIECE) {',
              '  if (\n    step.type === FlowActionType.PIECE &&\n    "actionName" in step.settings &&\n    step.settings.pieceName === HTTP_PIECE\n  ) {',
          )
          bridge = bridge.replace(
              '    const condition = step.settings.branches[0]?.conditions?.[0]?.[0];\n',
              '    const branchDefinition = step.settings.branches[0];\n    const condition =\n      branchDefinition?.branchType === BranchExecutionType.CONDITION\n        ? branchDefinition.conditions?.[0]?.[0]\n        : undefined;\n',
          )
          bridge = bridge.replace(
              '    metadata: {\n      ...(original.metadata ?? {}),\n      updatedAt: flow.version.updated,\n    },\n',
              '    metadata: original.metadata,\n',
          )
          bridge_path.write_text(bridge)

          adapter_package_path = Path('apps/flowcordia-studio-activepieces/package.json')
          adapter_package = json.loads(adapter_package_path.read_text())
          adapter_package['scripts']['typecheck'] = 'tsc --noEmit -p tsconfig.bridge.json'
          adapter_package_path.write_text(json.dumps(adapter_package, indent=2) + '\n')

          Path('apps/flowcordia-studio-activepieces/tsconfig.bridge.json').write_text('''{
            "extends": "./tsconfig.json",
            "include": [
              "src/flowcordia-activepieces-bridge.ts",
              "src/flowcordia-activepieces-bridge.test.ts"
            ]
          }
          ''')

          webapp_package_path = Path('apps/webapp/package.json')
          webapp_package = json.loads(webapp_package_path.read_text())
          scripts = webapp_package['scripts']
          scripts['build:activepieces-studio'] = (
              'pnpm --filter @flowcordia/studio-activepieces build && '
              'pnpm --filter @flowcordia/studio-activepieces copy:webapp'
          )
          scripts['predev'] = scripts['build:activepieces-studio']
          webapp_package_path.write_text(json.dumps(webapp_package, indent=2) + '\n')
          PY

      - name: Run integration verification
        shell: bash
        run: |
          set +e
          set -o pipefail
          {
            set -euo pipefail
            pnpm install --no-frozen-lockfile --config.minimum-release-age=0
            pnpm --filter @flowcordia/studio-activepieces typecheck
            pnpm --filter @flowcordia/studio-activepieces test
            pnpm --filter @flowcordia/studio-activepieces build
            pnpm --filter @flowcordia/studio-activepieces copy:webapp
            test -f apps/webapp/public/flowcordia-studio-activepieces/index.html
            pnpm --filter webapp typecheck
            pnpm --filter webapp test -- --run test/flowcordia/studioV2PreviewRoute.test.ts
          } 2>&1 | tee /tmp/studio-v2-activepieces-integration.log
          status=${PIPESTATUS[0]}

          rm -rf apps/webapp/public/flowcordia-studio-activepieces
          git config user.name "Flowcordia Studio Agent"
          git config user.email "actions@users.noreply.github.com"
          mkdir -p .flowcordia/automation

          if [ "$status" -eq 0 ]; then
            printf 'status: passed\nupstream: d1b800f3db6db52379476c069ea3cdbd2c998276\n' > .flowcordia/automation/studio-v2-activepieces-integration.txt
            git add \
              apps/flowcordia-studio-activepieces/package.json \
              apps/flowcordia-studio-activepieces/tsconfig.bridge.json \
              apps/flowcordia-studio-activepieces/src/flowcordia-activepieces-bridge.ts \
              apps/webapp/package.json \
              pnpm-lock.yaml \
              .flowcordia/automation/studio-v2-activepieces-integration.txt
            git commit -m "Verify Activepieces Studio on Flowcordia contracts" || true
          else
            { printf 'status: failed\n\n'; tail -n 420 /tmp/studio-v2-activepieces-integration.log; } > .flowcordia/automation/studio-v2-activepieces-integration.txt
            git add .flowcordia/automation/studio-v2-activepieces-integration.txt
            git commit -m "Record Activepieces Studio integration failure" || true
          fi

          git pull --rebase origin agent/studio-v2-activepieces-frontend
          git push origin HEAD:agent/studio-v2-activepieces-frontend
          exit "$status"
