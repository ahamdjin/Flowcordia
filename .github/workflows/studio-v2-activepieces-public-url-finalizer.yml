name: Studio V2 Activepieces public URL finalizer

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/studio-v2-activepieces-public-url-finalizer.yml

permissions:
  contents: write

jobs:
  patch:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: agent/studio-v2-activepieces-production-binding
      - name: Keep provider-facing URLs public without runner APP_ORIGIN
        shell: python
        run: |
          from pathlib import Path

          server = Path('apps/webapp/app/features/flowcordia/workflows/studio-v2/activepieces-interaction.server.ts')
          text = server.read_text()
          text = text.replace(
              'export type StudioV2ActivepiecesInteractionPayload =\n  | {',
              'export type StudioV2ActivepiecesInteractionPayload = { serverPublicUrl?: string } & (\n  | {',
              1,
          )
          marker = '''  | {\n      requestId?: string;\n      kind: "action_test";\n      node: WorkflowNode;\n      workflowInput: unknown;\n      outputs: Record<string, unknown>;\n    };\n\nexport type StudioV2ActivepiecesInteractionExecution =\n'''
          replacement = '''  | {\n      requestId?: string;\n      kind: "action_test";\n      node: WorkflowNode;\n      workflowInput: unknown;\n      outputs: Record<string, unknown>;\n    }\n);\n\nexport type StudioV2ActivepiecesInteractionExecution =\n'''
          if marker not in text:
              raise SystemExit('interaction payload union close anchor missing')
          text = text.replace(marker, replacement, 1)
          anchor = '''function sleep(milliseconds: number): Promise<void> {\n'''
          public_origin = '''function activepiecesServerPublicUrl(): string {\n  const origin = process.env.APP_ORIGIN?.trim();\n  if (!origin) {\n    throw new StudioV2ActivepiecesInteractionError(\n      "activepieces_interaction_unavailable",\n      503,\n      "APP_ORIGIN is required on the Flowcordia server to provide Activepieces with its public callback origin.",\n      true\n    );\n  }\n  return origin;\n}\n\n'''
          if anchor not in text:
              raise SystemExit('sleep function anchor missing')
          text = text.replace(anchor, public_origin + anchor, 1)
          old = '''  const payload: StudioV2ActivepiecesInteractionPayload = {\n    requestId,\n    kind: "trigger_simulation",\n'''
          new = '''  const payload: StudioV2ActivepiecesInteractionPayload = {\n    requestId,\n    serverPublicUrl: activepiecesServerPublicUrl(),\n    kind: "trigger_simulation",\n'''
          if old not in text:
              raise SystemExit('simulation payload anchor missing')
          text = text.replace(old, new, 1)
          old = '''  const requestId = input.payload.requestId ?? randomUUID();\n  const payload = { ...input.payload, requestId };\n'''
          new = '''  const requestId = input.payload.requestId ?? randomUUID();\n  const payload = {\n    ...input.payload,\n    requestId,\n    serverPublicUrl: input.payload.serverPublicUrl ?? activepiecesServerPublicUrl(),\n  };\n'''
          if old not in text:
              raise SystemExit('interaction execution payload anchor missing')
          server.write_text(text.replace(old, new, 1))

          context = Path('apps/webapp/app/features/flowcordia/workflows/studio-v2/activepieces-interaction-context.server.ts')
          text = context.read_text()
          text = text.replace(
              'type InteractionPayload =\n  | {',
              'type InteractionPayload = { serverPublicUrl: string } & (\n  | {',
              1,
          )
          marker = '''  | {\n      requestId: string;\n      kind: "action_test";\n      node: WorkflowNode;\n      workflowInput: JsonValue;\n      outputs: Record<string, JsonValue>;\n    };\n\nfunction connectionEnvironmentName'''
          replacement = '''  | {\n      requestId: string;\n      kind: "action_test";\n      node: WorkflowNode;\n      workflowInput: JsonValue;\n      outputs: Record<string, JsonValue>;\n    }\n);\n\nfunction connectionEnvironmentName'''
          if marker not in text:
              raise SystemExit('generated interaction payload union close anchor missing')
          text = text.replace(marker, replacement, 1)
          old = '''function simulationWebhookUrl(environmentId: string, simulationId: string): string {\n  const origin = process.env.APP_ORIGIN;\n  if (!origin) throw new Error("APP_ORIGIN is required for Activepieces trigger simulation.");\n  return new URL(\n'''
          new = '''function simulationWebhookUrl(\n  environmentId: string,\n  simulationId: string,\n  serverPublicUrl: string\n): string {\n  return new URL(\n'''
          if old not in text:
              raise SystemExit('simulation webhook origin anchor missing')
          text = text.replace(old, new, 1)
          text = text.replace('''    origin\n  ).toString();\n}\n''', '''    serverPublicUrl\n  ).toString();\n}\n''', 1)
          old = '''      serverApiUrl: process.env.APP_ORIGIN,\n      serverPublicUrl: process.env.APP_ORIGIN,\n'''
          new = '''      serverApiUrl: process.env.TRIGGER_API_URL,\n      serverPublicUrl: payload.serverPublicUrl,\n'''
          if old not in text:
              raise SystemExit('Activepieces server URLs anchor missing')
          text = text.replace(old, new, 1)
          old = '''          const webhookUrl = simulationWebhookUrl(payload.environmentId, payload.simulationId);\n'''
          new = '''          const webhookUrl = simulationWebhookUrl(\n            payload.environmentId,\n            payload.simulationId,\n            payload.serverPublicUrl\n          );\n'''
          if old not in text:
              raise SystemExit('simulation webhook call anchor missing')
          context.write_text(text.replace(old, new, 1))
      - name: Format changed files
        shell: bash
        run: |
          npx --yes oxfmt@0.54.0 \
            apps/webapp/app/features/flowcordia/workflows/studio-v2/activepieces-interaction.server.ts \
            apps/webapp/app/features/flowcordia/workflows/studio-v2/activepieces-interaction-context.server.ts
          rm -f .github/workflows/studio-v2-activepieces-public-url-finalizer.yml
      - name: Commit provider public URL fix
        shell: bash
        run: |
          git config user.name 'flowcordia-studio-v2-bot'
          git config user.email 'flowcordia-studio-v2-bot@users.noreply.github.com'
          git add -A
          git commit -m 'fix(studio-v2): pass public Activepieces callback origin explicitly'
          git push origin HEAD:agent/studio-v2-activepieces-production-binding
