name: Flowcordia GitHub deploy scope diagnostic

on:
  push:
    branches:
      - agent/flowcordia-github-setup-deploy-latest

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Capture branch tree
        shell: bash
        run: git rev-parse 'HEAD^{tree}' > /tmp/flowcordia-branch-tree.txt
      - name: Preserve tree identity
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: flowcordia-branch-tree-${{ github.run_id }}
          path: /tmp/flowcordia-branch-tree.txt
          if-no-files-found: error
          retention-days: 1
