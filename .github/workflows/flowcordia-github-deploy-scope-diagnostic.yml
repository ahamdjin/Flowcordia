name: Flowcordia GitHub setup and deploy latest validation

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  apply-validate-and-commit:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'agent/flowcordia-github-setup-deploy-latest'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout exact pull request branch
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Apply exact implementation patch
        shell: bash
        run: |
          set -euo pipefail
          cat \
            .github/flowcordia-product.patch.part-00 \
            .github/flowcordia-product.patch.part-01-00 \
            .github/flowcordia-product.patch.part-01-01 \
            .github/flowcordia-product.patch.part-01-02 \
            .github/flowcordia-product.patch.part-01-03 \
            .github/flowcordia-product.patch.part-02 \
            .github/flowcordia-product.patch.part-03 \
            | base64 --decode \
            | gzip --decompress \
            > /tmp/flowcordia-product.patch
          git apply --check /tmp/flowcordia-product.patch
          git apply /tmp/flowcordia-product.patch
          git apply --check .github/flowcordia-type-fixes.patch
          git apply .github/flowcordia-type-fixes.patch
          rm -f \
            .github/flowcordia-product.patch.gz.b64 \
            .github/flowcordia-product.patch.part-* \
            .github/flowcordia-type-fixes.patch

      - name: Setup pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5.0.0
        with:
          version: 10.33.2

      - name: Setup Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 20.20.2
          cache: pnpm

      - name: Install and generate
        run: |
          pnpm install --frozen-lockfile
          pnpm run generate

      - name: Build focused test dependencies
        run: |
          pnpm --filter @trigger.dev/database build
          pnpm --filter @trigger.dev/core build

      - name: Format assigned scope
        shell: bash
        run: |
          pnpm exec oxfmt \
            apps/webapp/app/features/flowcordia/deployments/latest.server.test.ts \
            apps/webapp/app/features/flowcordia/deployments/latest.server.ts \
            apps/webapp/app/features/flowcordia/github/binding.server.ts \
            apps/webapp/app/features/flowcordia/proposals/worker/github-reconciliation.server.ts \
            apps/webapp/app/features/flowcordia/setup/README.md \
            apps/webapp/app/features/flowcordia/setup/configuration.server.test.ts \
            apps/webapp/app/features/flowcordia/setup/configuration.server.ts \
            apps/webapp/app/features/flowcordia/setup/githubAppConfiguration.server.test.ts \
            apps/webapp/app/features/flowcordia/setup/githubAppConfiguration.server.ts \
            apps/webapp/app/presenters/v3/GitHubSettingsPresenter.server.ts \
            'apps/webapp/app/routes/_app.orgs.$organizationSlug.projects.$projectParam.env.$envParam.deployments/route.tsx' \
            'apps/webapp/app/routes/_app.orgs.$organizationSlug.settings.flowcordia-setup/route.tsx' \
            'apps/webapp/app/routes/resources.orgs.$organizationSlug.projects.$projectParam.env.$envParam.deploy-latest.ts' \
            apps/webapp/app/routes/webhooks.flowcordia.github/route.ts \
            apps/webapp/app/services/dashboardAgent.server.ts \
            apps/webapp/app/services/gitHub.server.ts \
            apps/webapp/app/services/gitHubSession.server.ts \
            apps/webapp/app/services/platform.v3.server.ts \
            apps/webapp/app/services/projectSettingsPresenter.server.ts \
            flowcordia/runbooks/github-app-setup-and-deploy-latest.md
          git diff --check

      - name: Run focused tests
        shell: bash
        env:
          NODE_ENV: test
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/flowcordia_test
          DIRECT_URL: postgresql://postgres:postgres@localhost:5432/flowcordia_test
          SESSION_SECRET: flowcordia-test-session-secret
          MAGIC_LINK_SECRET: flowcordia-test-magic-link-secret
          ENCRYPTION_KEY: 0123456789abcdef0123456789abcdef
          DEPLOY_REGISTRY_HOST: localhost:5000
          V4_DEPLOY_REGISTRY_HOST: localhost:5000
          CLICKHOUSE_URL: http://localhost:8123
        run: |
          pnpm --filter webapp exec vitest run \
            app/features/flowcordia/setup/configuration.server.test.ts \
            app/features/flowcordia/setup/githubAppConfiguration.server.test.ts \
            app/features/flowcordia/deployments/latest.server.test.ts

      - name: Typecheck repository
        run: pnpm run typecheck
        env:
          NODE_OPTIONS: --max-old-space-size=8192

      - name: Commit only assigned implementation files
        shell: bash
        env:
          HEAD_BRANCH: ${{ github.event.pull_request.head.ref }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm .github/workflows/flowcordia-github-deploy-scope-diagnostic.yml
          git add -u .github
          git add \
            apps/webapp/app/features/flowcordia/deployments/latest.server.test.ts \
            apps/webapp/app/features/flowcordia/deployments/latest.server.ts \
            apps/webapp/app/features/flowcordia/github/binding.server.ts \
            apps/webapp/app/features/flowcordia/proposals/worker/github-reconciliation.server.ts \
            apps/webapp/app/features/flowcordia/setup/README.md \
            apps/webapp/app/features/flowcordia/setup/configuration.server.test.ts \
            apps/webapp/app/features/flowcordia/setup/configuration.server.ts \
            apps/webapp/app/features/flowcordia/setup/githubAppConfiguration.server.test.ts \
            apps/webapp/app/features/flowcordia/setup/githubAppConfiguration.server.ts \
            apps/webapp/app/presenters/v3/GitHubSettingsPresenter.server.ts \
            'apps/webapp/app/routes/_app.orgs.$organizationSlug.projects.$projectParam.env.$envParam.deployments/route.tsx' \
            'apps/webapp/app/routes/_app.orgs.$organizationSlug.settings.flowcordia-setup/route.tsx' \
            'apps/webapp/app/routes/resources.orgs.$organizationSlug.projects.$projectParam.env.$envParam.deploy-latest.ts' \
            apps/webapp/app/routes/webhooks.flowcordia.github/route.ts \
            apps/webapp/app/services/dashboardAgent.server.ts \
            apps/webapp/app/services/gitHub.server.ts \
            apps/webapp/app/services/gitHubSession.server.ts \
            apps/webapp/app/services/platform.v3.server.ts \
            apps/webapp/app/services/projectSettingsPresenter.server.ts \
            flowcordia/runbooks/github-app-setup-and-deploy-latest.md
          git diff --cached --check
          git commit -m "Add secure GitHub setup and deploy-latest recovery"
          git push origin "HEAD:${HEAD_BRANCH}"
