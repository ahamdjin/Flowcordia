name: Studio V2 final formatting

on:
  pull_request:
    branches:
      - main
    paths:
      - .studio-v2-final-format-kick

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: agent/studio-v2-activepieces-webhook-parity
          fetch-depth: 0
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320
        with:
          version: 10.33.2
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: 20.20.2
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Format exact webhook parity files
        run: |
          pnpm exec oxfmt \
            'apps/webapp/app/routes/api.v1.app-events.$pieceUrl.ts' \
            'apps/webapp/app/routes/api.v1.flowcordia.studio-v2.activepieces-trigger-simulations.$environmentId.$simulationId.ts' \
            packages/flowcordia-runtime/src/activepieces-app-events.ts \
            packages/flowcordia-runtime/src/activepieces.ts
      - name: Commit formatted product files and remove helper
        run: |
          rm -f .github/workflows/studio-v2-final-format.yml .studio-v2-final-format-kick
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'style(studio-v2): format webhook parity'
          git push origin HEAD:agent/studio-v2-activepieces-webhook-parity
