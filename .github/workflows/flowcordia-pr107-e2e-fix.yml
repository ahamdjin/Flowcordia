name: Fix PR 107 E2E production credentials

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened

permissions:
  contents: write

concurrency:
  group: flowcordia-pr107-e2e-fix
  cancel-in-progress: true

jobs:
  fix:
    if: ${{ github.head_ref == 'agent/flowcordia-production-auth-hardening' && github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Disable IPv6 and configure Docker
        shell: bash
        run: |
          set -euo pipefail
          sudo sysctl -w net.ipv6.conf.all.disable_ipv6=1
          sudo sysctl -w net.ipv6.conf.default.disable_ipv6=1
          sudo sysctl -w net.ipv6.conf.lo.disable_ipv6=1
          CONFIG='{
            "default-address-pools" : [
              { "base" : "172.17.0.0/12", "size" : 20 },
              { "base" : "192.168.0.0/16", "size" : 24 }
            ]
          }'
          mkdir -p /etc/docker
          echo "$CONFIG" | sudo tee /etc/docker/daemon.json
          sudo systemctl restart docker

      - name: Checkout security branch
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: agent/flowcordia-production-auth-hardening
          fetch-depth: 1

      - name: Setup pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5.0.0
        with:
          version: 10.33.2

      - name: Setup Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 20.20.2
          cache: pnpm

      - name: Install and generate
        run: |
          pnpm install --frozen-lockfile
          pnpm run generate

      - name: Apply central E2E credential contract
        shell: bash
        run: |
          set -euo pipefail
          python <<'PY'
          from pathlib import Path

          harness = Path("internal-packages/testcontainers/src/webapp.ts")
          value = harness.read_text()
          anchor = 'const PNPM_HOISTED_MODULES = resolve(__dirname, "../../../node_modules/.pnpm/node_modules");\n'
          addition = '''const PNPM_HOISTED_MODULES = resolve(__dirname, "../../../node_modules/.pnpm/node_modules");

// The E2E server intentionally boots the production bundle. Keep its control-plane
// credentials independent, strong, and outside the public development defaults so
// production startup validation is exercised rather than bypassed.
const E2E_CONTROL_PLANE_SECRETS = {
  PROVIDER_SECRET: "e2e-provider-6fb57f42b5e646b1901758bc4d75cc0a",
  COORDINATOR_SECRET: "e2e-coordinator-771ae0e46b7e4c86a30e9c04a6535714",
  MANAGED_WORKER_SECRET: "e2e-managed-worker-34886e6573f04dc396db7c89e457ce32",
} as const;
'''
          if value.count(anchor) != 1:
              raise SystemExit("E2E secret constant anchor is not exact")
          value = value.replace(anchor, addition)

          env_anchor = '      NODE_ENV: "production",\n      DATABASE_URL: databaseUrl,\n'
          env_replacement = '      NODE_ENV: "production",\n      APP_ENV: "production",\n      ...E2E_CONTROL_PLANE_SECRETS,\n      DATABASE_URL: databaseUrl,\n'
          if value.count(env_anchor) != 1:
              raise SystemExit("E2E spawned environment anchor is not exact")
          harness.write_text(value.replace(env_anchor, env_replacement))

          test = Path("apps/webapp/test/flowcordia/productionControlPlaneSecurity.test.ts")
          value = test.read_text()
          test_anchor = '''  it("documents and templates every required secret", () => {
'''
          test_addition = '''  it("boots the production E2E harness with independent strong credentials", () => {
    const harness = source("internal-packages/testcontainers/src/webapp.ts");
    const keys = ["PROVIDER_SECRET", "COORDINATOR_SECRET", "MANAGED_WORKER_SECRET"] as const;
    const credentials = Object.fromEntries(
      keys.map((key) => {
        const match = harness.match(new RegExp(`${key}: "(e2e-[^"]+)"`));
        expect(match, `${key} must be explicit in the E2E harness`).not.toBeNull();
        return [key, match![1]];
      })
    );

    expect(flowcordiaControlPlaneSecretsReady(credentials)).toBe(true);
    expect(new Set(Object.values(credentials)).size).toBe(keys.length);
    expect(harness).toContain('APP_ENV: "production"');
    expect(harness).toContain("...E2E_CONTROL_PLANE_SECRETS");
  });

  it("documents and templates every required secret", () => {
'''
          if value.count(test_anchor) != 1:
              raise SystemExit("production security regression anchor is not exact")
          test.write_text(value.replace(test_anchor, test_addition))
          PY

      - name: Canonicalize changed files
        run: |
          pnpm exec oxfmt --write \
            internal-packages/testcontainers/src/webapp.ts \
            apps/webapp/test/flowcordia/productionControlPlaneSecurity.test.ts

      - name: Validate focused security and harness contracts
        env:
          NODE_OPTIONS: --max-old-space-size=8192
        run: |
          pnpm --filter webapp test --run test/flowcordia/productionControlPlaneSecurity.test.ts
          pnpm --filter @internal/testcontainers typecheck
          pnpm typecheck --filter webapp

      - name: Build and run exact webapp E2E suite
        env:
          WEBAPP_TEST_VERBOSE: "1"
        run: |
          pnpm run build --filter webapp
          cd apps/webapp
          pnpm exec vitest run --config vitest.e2e.config.ts --reporter=default

      - name: Publish validated ordinary files
        shell: bash
        run: |
          set -euo pipefail
          git add \
            internal-packages/testcontainers/src/webapp.ts \
            apps/webapp/test/flowcordia/productionControlPlaneSecurity.test.ts
          git diff --cached --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "fix: give E2E production isolated control-plane credentials"
          git push origin HEAD:agent/flowcordia-production-auth-hardening
