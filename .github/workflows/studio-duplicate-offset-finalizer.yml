name: Flowcordia Studio duplicate offset finalizer

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened

permissions:
  contents: write

concurrency:
  group: flowcordia-studio-duplicate-offset-finalizer
  cancel-in-progress: true

jobs:
  finalize:
    if: github.head_ref == 'studio/multi-select-clipboard'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout isolated branch
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: studio/multi-select-clipboard
          persist-credentials: true
          fetch-depth: 1

      - name: Setup pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5.0.0
        with:
          version: 10.33.2

      - name: Setup Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 20.20.2
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Apply progressive duplicate offsets
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              file = Path(path)
              text = file.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"Expected one marker in {path}, found {count}: {old[:100]!r}")
              file.write_text(text.replace(old, new, 1))

          helper = "apps/webapp/app/features/flowcordia/workflows/studio/canvas-selection.ts"
          replace_once(
              helper,
              '''function uniqueNodeIds(nodeIds: readonly string[]): string[] {\n  return [...new Set(nodeIds.filter((nodeId) => ENTITY_ID.test(nodeId)))].slice(0, MAX_SELECTION);\n}\n\n''',
              '''function uniqueNodeIds(nodeIds: readonly string[]): string[] {\n  return [...new Set(nodeIds.filter((nodeId) => ENTITY_ID.test(nodeId)))].slice(0, MAX_SELECTION);\n}\n\nexport function nextWorkflowStudioDuplicateOffset(input: {\n  currentStep: number;\n  distance: number;\n  cycle?: number;\n}): { step: number; offset: { x: number; y: number } } {\n  const cycle = Number.isInteger(input.cycle) && input.cycle! > 0 ? input.cycle! : 5;\n  const distance = Number.isFinite(input.distance) && input.distance > 0 ? input.distance : 40;\n  const currentStep =\n    Number.isInteger(input.currentStep) && input.currentStep >= 0 ? input.currentStep : 0;\n  const step = (currentStep % cycle) + 1;\n  const value = step * distance;\n  return { step, offset: { x: value, y: value } };\n}\n\n''',
          )

          test = "apps/webapp/app/features/flowcordia/workflows/studio/canvas-selection.test.ts"
          replace_once(
              test,
              '''  createWorkflowStudioNodeClipboardPayload,\n  parseWorkflowStudioNodeClipboardPayload,\n''',
              '''  createWorkflowStudioNodeClipboardPayload,\n  nextWorkflowStudioDuplicateOffset,\n  parseWorkflowStudioNodeClipboardPayload,\n''',
          )
          replace_once(
              test,
              '''  it("builds bounded duplicate and grouped-move commands", () => {\n''',
              '''  it("advances repeated duplicate actions without stacking copies", () => {\n    const offsets = Array.from({ length: 6 }, (_, index) =>\n      nextWorkflowStudioDuplicateOffset({ currentStep: index, distance: 40 })\n    );\n    expect(offsets.map((entry) => entry.step)).toEqual([1, 2, 3, 4, 5, 1]);\n    expect(offsets.map((entry) => entry.offset)).toEqual([\n      { x: 40, y: 40 },\n      { x: 80, y: 80 },\n      { x: 120, y: 120 },\n      { x: 160, y: 160 },\n      { x: 200, y: 200 },\n      { x: 40, y: 40 },\n    ]);\n  });\n\n  it("builds bounded duplicate and grouped-move commands", () => {\n''',
          )

          canvas = "apps/webapp/app/features/flowcordia/workflows/studio/WorkflowStudioCanvas.tsx"
          replace_once(
              canvas,
              '''  createWorkflowStudioNodeClipboardPayload,\n  parseWorkflowStudioNodeClipboardPayload,\n''',
              '''  createWorkflowStudioNodeClipboardPayload,\n  nextWorkflowStudioDuplicateOffset,\n  parseWorkflowStudioNodeClipboardPayload,\n''',
          )
          replace_once(canvas, "  const pasteOffsetStep = useRef(0);\n", "  const duplicateOffsetStep = useRef(0);\n")
          replace_once(
              canvas,
              '''  const handleCopy = (event: ReactClipboardEvent<HTMLDivElement>) => {\n''',
              '''  const nextDuplicateOffset = () => {\n    const next = nextWorkflowStudioDuplicateOffset({\n      currentStep: duplicateOffsetStep.current,\n      distance: GRID_SIZE * 2,\n    });\n    duplicateOffsetStep.current = next.step;\n    return next.offset;\n  };\n\n  const handleCopy = (event: ReactClipboardEvent<HTMLDivElement>) => {\n''',
          )
          replace_once(
              canvas,
              '''    pasteOffsetStep.current = (pasteOffsetStep.current % 5) + 1;\n    const distance = pasteOffsetStep.current * GRID_SIZE * 2;\n    submitDuplicate(payload.nodeIds, { x: distance, y: distance });\n''',
              '''    submitDuplicate(payload.nodeIds, nextDuplicateOffset());\n''',
          )
          replace_once(
              canvas,
              '''      submitDuplicate(nodeIds, { x: GRID_SIZE * 2, y: GRID_SIZE * 2 });\n''',
              '''      submitDuplicate(nodeIds, nextDuplicateOffset());\n''',
          )
          replace_once(
              canvas,
              '''                  onClick={() =>\n                    submitDuplicate(selectedNodeIdsInGraphOrder(), {\n                      x: GRID_SIZE * 2,\n                      y: GRID_SIZE * 2,\n                    })\n                  }\n''',
              '''                  onClick={() =>\n                    submitDuplicate(selectedNodeIdsInGraphOrder(), nextDuplicateOffset())\n                  }\n''',
          )
          PY

      - name: Format exact changed sources
        run: |
          pnpm exec oxfmt --write \
            apps/webapp/app/features/flowcordia/workflows/studio/WorkflowStudioCanvas.tsx \
            apps/webapp/app/features/flowcordia/workflows/studio/canvas-selection.test.ts \
            apps/webapp/app/features/flowcordia/workflows/studio/canvas-selection.ts

      - name: Build workflow package
        run: pnpm exec turbo run build --filter=@flowcordia/workflow

      - name: Run selection and canvas contracts
        run: |
          pnpm --filter webapp exec vitest run \
            app/features/flowcordia/workflows/studio/canvas-selection.test.ts \
            app/features/flowcordia/workflows/studio/WorkflowStudioCanvas.react-flow-contract.test.ts \
            test/flowcordia/canvasManualAcceptance.test.ts \
            test/flowcordia/workflowStudioCanvasConnections.test.ts \
            test/flowcordia/workflowStudioCanvasNavigation.test.ts

      - name: Generate Prisma client
        run: pnpm --filter @trigger.dev/database generate

      - name: Run dependency-aware typecheck
        run: pnpm exec turbo run typecheck --filter=@flowcordia/workflow --filter=webapp

      - name: Commit verified product polish
        run: |
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            apps/webapp/app/features/flowcordia/workflows/studio/WorkflowStudioCanvas.tsx \
            apps/webapp/app/features/flowcordia/workflows/studio/canvas-selection.test.ts \
            apps/webapp/app/features/flowcordia/workflows/studio/canvas-selection.ts
          git commit -m "fix(studio): stagger repeated node duplication"
          git push origin HEAD:studio/multi-select-clipboard
