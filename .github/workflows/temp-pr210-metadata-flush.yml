name: Temporary PR 210 metadata flush

on:
  pull_request:
    branches: [main]
    types: [synchronize]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/studio-v2-activepieces-trigger-simulation
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.2
      - uses: actions/setup-node@v4
        with:
          node-version: 20.20.2
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Flush callback binding before provider subscription
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path("apps/webapp/app/features/flowcordia/workflows/studio-v2/activepieces-interaction-context.server.ts")
          text = path.read_text()
          old = '''            status: "ARMING",\n            updatedAt: new Date().toISOString(),\n          });\n          const enabled = await executeFlowcordiaActivepiecesTriggerEnable({ interaction, services });'''
          new = '''            status: "ARMING",\n            updatedAt: new Date().toISOString(),\n          });\n          await metadata.flush();\n          const enabled = await executeFlowcordiaActivepiecesTriggerEnable({ interaction, services });'''
          assert old in text
          text = text.replace(old, new, 1)
          old = '''            status: "ARMED",\n            updatedAt: new Date().toISOString(),\n          });\n          try {'''
          new = '''            status: "ARMED",\n            updatedAt: new Date().toISOString(),\n          });\n          await metadata.flush();\n          try {'''
          assert old in text
          path.write_text(text.replace(old, new, 1))

          test = Path("apps/webapp/app/features/flowcordia/workflows/studio-v2/activepieces-interaction-context.test.ts")
          text = test.read_text()
          marker = '''    expect(source).toContain("waitTokenUrl: token.url");'''
          assert marker in text
          test.write_text(text.replace(marker, marker + '\n    expect(source).toContain("await metadata.flush()");', 1))
          PY
      - run: >-
          pnpm exec oxfmt
          apps/webapp/app/features/flowcordia/workflows/studio-v2/activepieces-interaction-context.server.ts
          apps/webapp/app/features/flowcordia/workflows/studio-v2/activepieces-interaction-context.test.ts
      - run: |
          git rm -f .github/workflows/temp-pr210-metadata-flush.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix(studio-v2): flush trigger simulation binding before enable"
          git push origin HEAD:agent/studio-v2-activepieces-trigger-simulation
