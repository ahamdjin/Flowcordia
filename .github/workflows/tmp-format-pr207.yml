name: Temporary format PR 207

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/studio-v2-completion
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.2
      - uses: actions/setup-node@v4
        with:
          node-version: 20.20.2
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: >-
          pnpm exec oxfmt
          packages/flowcordia-runtime/src/activepieces.ts
          packages/flowcordia-runtime/src/activepieces.test.ts
          apps/flowcordia-studio-activepieces/src/activepieces-api.ts
          apps/flowcordia-studio-activepieces/src/studio-host.tsx
          apps/webapp/app/features/flowcordia/workflows/studio-v2/activepieces-api.server.ts
          apps/webapp/app/features/flowcordia/workflows/studio-v2/activepieces-api.server.test.ts
          apps/webapp/app/features/flowcordia/workflows/studio-v2/activepieces-interaction-context.server.ts
          apps/webapp/app/features/flowcordia/workflows/studio-v2/activepieces-interaction-context.test.ts
          apps/webapp/app/features/flowcordia/workflows/studio-v2/activepieces-interaction.server.ts
          apps/webapp/app/features/flowcordia/workflows/studio-v2/activepieces-connection-replace.ts
          apps/webapp/app/features/flowcordia/workflows/studio-v2/activepieces-connection-replace.test.ts
          apps/webapp/app/features/flowcordia/workflows/studio-v2/activepieces-extended-api.server.ts
          'apps/webapp/app/routes/_app.orgs.$organizationSlug.projects.$projectParam.env.$envParam.flowcordia.studio-v2/route.tsx'
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if ! git diff --quiet; then
            git add packages/flowcordia-runtime/src/activepieces.ts packages/flowcordia-runtime/src/activepieces.test.ts apps/flowcordia-studio-activepieces/src/activepieces-api.ts apps/flowcordia-studio-activepieces/src/studio-host.tsx apps/webapp/app/features/flowcordia/workflows/studio-v2/activepieces-api.server.ts apps/webapp/app/features/flowcordia/workflows/studio-v2/activepieces-api.server.test.ts apps/webapp/app/features/flowcordia/workflows/studio-v2/activepieces-interaction-context.server.ts apps/webapp/app/features/flowcordia/workflows/studio-v2/activepieces-interaction-context.test.ts apps/webapp/app/features/flowcordia/workflows/studio-v2/activepieces-interaction.server.ts apps/webapp/app/features/flowcordia/workflows/studio-v2/activepieces-connection-replace.ts apps/webapp/app/features/flowcordia/workflows/studio-v2/activepieces-connection-replace.test.ts apps/webapp/app/features/flowcordia/workflows/studio-v2/activepieces-extended-api.server.ts 'apps/webapp/app/routes/_app.orgs.$organizationSlug.projects.$projectParam.env.$envParam.flowcordia.studio-v2/route.tsx'
            git commit -m "style(studio-v2): format final Activepieces interactions"
            git push
          fi
