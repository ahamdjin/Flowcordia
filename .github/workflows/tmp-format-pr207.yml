name: Temporary format PR 207 boundary fixes

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/studio-v2-completion
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.2
      - uses: actions/setup-node@v4
        with:
          node-version: 20.20.2
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec oxfmt apps/webapp/app/features/flowcordia/workflows/studio-v2/activepieces-connection-replace.ts apps/webapp/app/features/flowcordia/workflows/studio-v2/activepieces-interaction-context.test.ts
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if ! git diff --quiet; then
            git add apps/webapp/app/features/flowcordia/workflows/studio-v2/activepieces-connection-replace.ts apps/webapp/app/features/flowcordia/workflows/studio-v2/activepieces-interaction-context.test.ts
            git commit -m "style(studio-v2): format boundary fixes"
            git push
          fi
