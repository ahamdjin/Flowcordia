name: Flowcordia temporary Kubernetes client migration

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/flowcordia-kubernetes-client-migration.yml"

permissions: {}

jobs:
  migrate:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      actions: read
      contents: write
    steps:
      - name: Checkout exact migration branch
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5.0.0
        with:
          version: 10.33.2

      - name: Setup Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 20.20.2
          cache: pnpm

      - name: Apply request-object API migration
        shell: bash
        run: |
          set -euo pipefail
          python <<'PY'
          from pathlib import Path

          def replace(path: str, old: str, new: str, count: int = 1) -> None:
              target = Path(path)
              text = target.read_text()
              found = text.count(old)
              if found != count:
                  raise SystemExit(f"{path}: expected {count} occurrence(s), found {found}: {old[:80]!r}")
              target.write_text(text.replace(old, new))

          replace(
              "apps/kubernetes-provider/src/index.ts",
              """      const res = await this.#k8sApi.core.createNamespacedPod(namespace.metadata.name, pod);\n      logger.debug(res.body);""",
              """      const createdPod = await this.#k8sApi.core.createNamespacedPod({\n        namespace: namespace.metadata.name,\n        body: pod,\n      });\n      logger.debug(createdPod);""",
          )
          replace(
              "apps/kubernetes-provider/src/index.ts",
              """      const res = await this.#k8sApi.core.deleteNamespacedPod(\n        opts.runId,\n        opts.namespace.metadata.name\n      );\n      logger.debug(res.body);""",
              """      const deletedPod = await this.#k8sApi.core.deleteNamespacedPod({\n        name: opts.runId,\n        namespace: opts.namespace.metadata.name,\n      });\n      logger.debug(deletedPod);""",
          )
          replace(
              "apps/kubernetes-provider/src/index.ts",
              """      const res = await this.#k8sApi.core.readNamespacedPod(runId, namespace.metadata.name);\n      logger.debug(res.body);\n      return res.body;""",
              """      const pod = await this.#k8sApi.core.readNamespacedPod({\n        name: runId,\n        namespace: namespace.metadata.name,\n      });\n      logger.debug(pod);\n      return pod;""",
          )
          replace(
              "apps/kubernetes-provider/src/index.ts",
              """      const res = await this.#k8sApi.batch.createNamespacedJob(namespace.metadata.name, job);\n      logger.debug(res.body);""",
              """      const createdJob = await this.#k8sApi.batch.createNamespacedJob({\n        namespace: namespace.metadata.name,\n        body: job,\n      });\n      logger.debug(createdJob);""",
          )
          replace(
              "apps/kubernetes-provider/src/index.ts",
              """      const res = await this.#k8sApi.apps.createNamespacedDaemonSet(\n        namespace.metadata.name,\n        daemonSet\n      );\n      logger.debug(res.body);""",
              """      const createdDaemonSet = await this.#k8sApi.apps.createNamespacedDaemonSet({\n        namespace: namespace.metadata.name,\n        body: daemonSet,\n      });\n      logger.debug(createdDaemonSet);""",
          )

          replace(
              "apps/kubernetes-provider/src/podCleaner.ts",
              """      .deleteCollectionNamespacedPod(\n        opts.namespace,\n        undefined, // pretty\n        undefined, // continue\n        opts.dryRun ? \"All\" : undefined,\n        opts.fieldSelector,\n        undefined, // gracePeriodSeconds\n        opts.labelSelector\n      )""",
              """      .deleteCollectionNamespacedPod({\n        namespace: opts.namespace,\n        dryRun: opts.dryRun ? \"All\" : undefined,\n        fieldSelector: opts.fieldSelector,\n        labelSelector: opts.labelSelector,\n      })""",
          )
          replace(
              "apps/kubernetes-provider/src/podCleaner.ts",
              """      .deleteCollectionNamespacedDaemonSet(\n        opts.namespace,\n        undefined, // pretty\n        undefined, // continue\n        opts.dryRun ? \"All\" : undefined,\n        opts.fieldSelector,\n        undefined, // gracePeriodSeconds\n        opts.labelSelector\n      )""",
              """      .deleteCollectionNamespacedDaemonSet({\n        namespace: opts.namespace,\n        dryRun: opts.dryRun ? \"All\" : undefined,\n        fieldSelector: opts.fieldSelector,\n        labelSelector: opts.labelSelector,\n      })""",
          )
          replace(
              "apps/kubernetes-provider/src/podCleaner.ts",
              """    const total = (result.response as any)?.body?.items?.length ?? 0;\n\n    this.logger.log(\"Deleting completed runs: Done\", { total, elapsedMs });""",
              """    this.logger.log(\"Deleting completed runs: Done\", {\n      status: result.status,\n      message: result.message,\n      elapsedMs,\n    });""",
          )
          replace(
              "apps/kubernetes-provider/src/podCleaner.ts",
              """    const total = (result.response as any)?.body?.items?.length ?? 0;\n\n    this.logger.log(\"Deleting failed runs: Done\", { total, elapsedMs });""",
              """    this.logger.log(\"Deleting failed runs: Done\", {\n      status: result.status,\n      message: result.message,\n      elapsedMs,\n    });""",
          )
          replace(
              "apps/kubernetes-provider/src/podCleaner.ts",
              """    const total = (result.response as any)?.body?.items?.length ?? 0;\n\n    this.logger.log(\"Deleting completed pre-pulls: Done\", { total, elapsedMs });""",
              """    this.logger.log(\"Deleting completed pre-pulls: Done\", {\n      status: result.status,\n      message: result.message,\n      elapsedMs,\n    });""",
          )
          replace(
              "apps/kubernetes-provider/src/podCleaner.ts",
              ".createNamespacedPod(this.namespace, pod)",
              ".createNamespacedPod({ namespace: this.namespace, body: pod })",
          )

          replace(
              "apps/kubernetes-provider/src/taskMonitor.ts",
              """      this.#k8sClient.core.listNamespacedPod(\n        this.namespace,\n        undefined,\n        undefined,\n        undefined,\n        this.fieldSelector,\n        this.labelSelector\n      );""",
              """      this.#k8sClient.core.listNamespacedPod({\n        namespace: this.namespace,\n        fieldSelector: this.fieldSelector,\n        labelSelector: this.labelSelector,\n      });""",
          )
          replace(
              "apps/kubernetes-provider/src/taskMonitor.ts",
              """    const informer = k8s.makeInformer(\n      this.#k8sClient.kubeConfig,\n      `/api/v1/namespaces/${this.namespace}/pods`,\n      listTasks,\n      this.labelSelector,\n      this.fieldSelector\n    );""",
              """    const informerPath = `/api/v1/namespaces/${this.namespace}/pods?fieldSelector=${encodeURIComponent(\n      this.fieldSelector\n    )}`;\n    const informer = k8s.makeInformer(\n      this.#k8sClient.kubeConfig,\n      informerPath,\n      listTasks,\n      this.labelSelector\n    );""",
          )
          replace(
              "apps/kubernetes-provider/src/taskMonitor.ts",
              """      const logs = await this.#k8sClient.core.readNamespacedPodLog(\n        podName,\n        this.namespace,\n        undefined,\n        undefined,\n        undefined,\n        1024, // limitBytes\n        undefined,\n        undefined,\n        undefined,\n        20 // tailLines\n      );\n\n      const responseBody = logs.body ?? \"\";""",
              """      const logs = await this.#k8sClient.core.readNamespacedPodLog({\n        name: podName,\n        namespace: this.namespace,\n        limitBytes: 1024,\n        tailLines: 20,\n      });\n\n      const responseBody = logs ?? \"\";""",
          )
          replace(
              "apps/kubernetes-provider/src/taskMonitor.ts",
              ".deleteNamespacedPod(name, this.namespace)",
              ".deleteNamespacedPod({ name, namespace: this.namespace })",
          )
          replace(
              "apps/kubernetes-provider/src/taskMonitor.ts",
              ".createNamespacedPod(this.namespace, pod)",
              ".createNamespacedPod({ namespace: this.namespace, body: pod })",
          )

          replace(
              "apps/kubernetes-provider/src/uptimeHeartbeat.ts",
              """      .listNamespacedPod(\n        opts.namespace,\n        undefined, // pretty\n        undefined, // allowWatchBookmarks\n        undefined, // _continue\n        opts.fieldSelector,\n        opts.labelSelector,\n        this.maxPendingRuns * 2, // limit\n        undefined, // resourceVersion\n        undefined, // resourceVersionMatch\n        undefined, // sendInitialEvents\n        this.intervalInSeconds, // timeoutSeconds,\n        undefined // watch\n      )""",
              """      .listNamespacedPod({\n        namespace: opts.namespace,\n        fieldSelector: opts.fieldSelector,\n        labelSelector: opts.labelSelector,\n        limit: this.maxPendingRuns * 2,\n        timeoutSeconds: this.intervalInSeconds,\n      })""",
          )
          replace(
              "apps/kubernetes-provider/src/uptimeHeartbeat.ts",
              "return listReturn?.body.items;",
              "return listReturn?.items;",
          )
          PY

      - name: Restore remediated dependency graph
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT_ID: "8633164672"
        run: |
          set -euo pipefail
          output="$RUNNER_TEMP/kubernetes-migration"
          mkdir -p "$output/artifact"
          gh api "/repos/${GITHUB_REPOSITORY}/actions/artifacts/${ARTIFACT_ID}/zip" > "$output/remediation.zip"
          unzip -q "$output/remediation.zip" -d "$output/artifact"
          cp "$output/artifact/_temp/dependency-remediation/package.after.json" package.json
          cp "$output/artifact/_temp/dependency-remediation/pnpm-lock.after.yaml" pnpm-lock.yaml
          node <<'NODE'
          const fs = require("node:fs");
          const webappPath = "apps/webapp/package.json";
          const webapp = JSON.parse(fs.readFileSync(webappPath, "utf8"));
          webapp.dependencies.dompurify = "3.4.12";
          for (const section of [webapp.dependencies, webapp.devDependencies]) {
            for (const name of Object.keys(section)) {
              if (name.startsWith("@remix-run/") && /\^?2\.17\.4/.test(section[name])) section[name] = "2.17.5";
            }
          }
          fs.writeFileSync(webappPath, JSON.stringify(webapp, null, 2) + "\n");
          const path = "apps/kubernetes-provider/package.json";
          const pkg = JSON.parse(fs.readFileSync(path, "utf8"));
          pkg.dependencies["@kubernetes/client-node"] = "1.4.0";
          fs.writeFileSync(path, JSON.stringify(pkg, null, 2) + "\n");
          NODE

      - name: Validate maintained client compatibility
        shell: bash
        run: |
          set -euo pipefail
          pnpm install --frozen-lockfile
          pnpm --filter @trigger.dev/database generate
          pnpm --filter @trigger.dev/database build
          pnpm --filter kubernetes-provider typecheck

      - name: Commit migration and remove temporary diagnostics
        shell: bash
        env:
          HEAD_BRANCH: ${{ github.event.pull_request.head.ref }}
        run: |
          set -euo pipefail
          rm .github/workflows/flowcordia-kubernetes-client-migration.yml
          rm -f .github/workflows/flowcordia-kubernetes-api-diagnostic.yml
          rm -f .github/workflows/flowcordia-dependency-compatibility-diagnostic.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/kubernetes-provider/src/index.ts apps/kubernetes-provider/src/podCleaner.ts apps/kubernetes-provider/src/taskMonitor.ts apps/kubernetes-provider/src/uptimeHeartbeat.ts .github/workflows/flowcordia-kubernetes-client-migration.yml .github/workflows/flowcordia-kubernetes-api-diagnostic.yml .github/workflows/flowcordia-dependency-compatibility-diagnostic.yml
          git commit -m "Migrate Kubernetes provider to client 1.4"
          git push origin "HEAD:${HEAD_BRANCH}"
