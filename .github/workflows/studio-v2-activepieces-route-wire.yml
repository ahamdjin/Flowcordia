name: Wire Studio V2 Activepieces route

on:
  push:
    branches:
      - agent/studio-v2-activepieces-frontend
    paths:
      - .github/workflows/studio-v2-activepieces-route-wire.yml

permissions:
  contents: write

jobs:
  wire:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/studio-v2-activepieces-frontend
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.2
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Replace the custom surface and verify the webapp
        shell: bash
        run: |
          set +e
          set -o pipefail
          {
            set -euo pipefail
            python <<'PY'
          import json
          from pathlib import Path

          package_path = Path('apps/webapp/package.json')
          package = json.loads(package_path.read_text())
          scripts = package['scripts']
          updated_scripts = {}
          for key, value in scripts.items():
              updated_scripts[key] = value
              if key == 'build':
                  updated_scripts['build:activepieces-studio'] = (
                      'pnpm --filter @flowcordia/studio-activepieces build && '
                      'pnpm --filter @flowcordia/studio-activepieces copy:webapp'
                  )
          package['scripts'] = updated_scripts
          package_path.write_text(json.dumps(package, indent=2) + '\n')

          route_path = Path('apps/webapp/app/routes/_app.orgs.$organizationSlug.projects.$projectParam.env.$envParam.flowcordia.studio-v2/route.tsx')
          route = route_path.read_text()
          route = route.replace(
              'import { useLoaderData } from "@remix-run/react";\n',
              'import { useLoaderData } from "@remix-run/react";\nimport { useCallback, useState } from "react";\n',
          )
          route = route.replace(
              'import { StudioV2Surface } from "~/features/flowcordia/workflows/studio-v2/StudioV2Surface";\n',
              'import { StudioV2ActivepiecesHost } from "~/features/flowcordia/workflows/studio-v2/StudioV2ActivepiecesHost";\n',
          )
          route = route.replace(
              '      workspace,\n      release,\n      canWrite:',
              '      workspace,\n      release,\n      projectId,\n      canWrite:',
          )
          route = route.replace(
              '  const data = useLoaderData<typeof loader>();\n\n  return (',
              '  const data = useLoaderData<typeof loader>();\n  const [workspace, setWorkspace] = useState(data.workspace);\n  const handleWorkspaceChange = useCallback((nextWorkspace: typeof data.workspace) => {\n    setWorkspace(nextWorkspace);\n  }, []);\n\n  return (',
          )
          route = route.replace(
              '          data-persistence="durable-local"\n',
              '          data-persistence="durable-local"\n          data-studio-foundation="activepieces"\n',
          )
          route = route.replace(
              '            workspace={data.workspace}\n',
              '            workspace={workspace}\n',
          )
          route = route.replace(
              '          <StudioV2Surface initialWorkspace={data.workspace} canWrite={data.canWrite} />\n',
              '          <StudioV2ActivepiecesHost\n            workspace={workspace}\n            projectId={data.projectId}\n            canWrite={data.canWrite}\n            onWorkspaceChange={handleWorkspaceChange}\n          />\n',
          )
          route_path.write_text(route)

          test_path = Path('apps/webapp/test/flowcordia/studioV2PreviewRoute.test.ts')
          test = test_path.read_text()
          test = test.replace(
              'const surfacePath = "apps/webapp/app/features/flowcordia/workflows/studio-v2/StudioV2Surface.tsx";',
              'const hostPath =\n  "apps/webapp/app/features/flowcordia/workflows/studio-v2/StudioV2ActivepiecesHost.tsx";',
          )
          test = test.replace(
              '  const surface = readRepositoryFile(surfacePath);',
              '  const host = readRepositoryFile(hostPath);',
          )
          test = test.replace(
              'expect(route).toContain("StudioV2Surface");',
              'expect(route).toContain("StudioV2ActivepiecesHost");\n    expect(route).toContain(\'data-studio-foundation="activepieces"\');',
          )
          test = test.replace(
              '    expect(surface).toContain(\'intent: "save"\');\n    expect(surface).toContain(\'intent: "test"\');',
              '    expect(host).toContain(\'type: "bootstrap"\');\n    expect(host).toContain(\'data-studio-foundation="activepieces"\');\n    expect(route).toContain("structurallyTestStudioV2Workspace");',
          )
          test_path.write_text(test)
          PY

            pnpm install --no-frozen-lockfile --config.minimum-release-age=0
            pnpm --filter @flowcordia/studio-activepieces typecheck
            pnpm --filter @flowcordia/studio-activepieces test
            pnpm --filter @flowcordia/studio-activepieces build
            pnpm --filter @flowcordia/studio-activepieces copy:webapp
            test -f apps/webapp/public/flowcordia-studio-activepieces/index.html
            pnpm --filter webapp typecheck
            pnpm --filter webapp test -- --run apps/webapp/test/flowcordia/studioV2PreviewRoute.test.ts
          } 2>&1 | tee /tmp/flowcordia-activepieces-route.log
          status=${PIPESTATUS[0]}

          git config user.name "Flowcordia Studio Agent"
          git config user.email "actions@users.noreply.github.com"
          mkdir -p .flowcordia/automation
          if [ "$status" -eq 0 ]; then
            printf 'status: passed\n' > .flowcordia/automation/studio-v2-activepieces-route.txt
            git add apps/webapp/package.json apps/webapp/app/routes apps/webapp/test/flowcordia/studioV2PreviewRoute.test.ts pnpm-lock.yaml .flowcordia/automation/studio-v2-activepieces-route.txt
            git commit -m "Mount Activepieces Studio with Flowcordia permissions" || true
          else
            { printf 'status: failed\n\n'; tail -n 340 /tmp/flowcordia-activepieces-route.log; } > .flowcordia/automation/studio-v2-activepieces-route.txt
            git add .flowcordia/automation/studio-v2-activepieces-route.txt
            git commit -m "Record Activepieces Studio route failure" || true
          fi
          git pull --rebase origin agent/studio-v2-activepieces-frontend
          git push origin HEAD:agent/studio-v2-activepieces-frontend
          exit "$status"
