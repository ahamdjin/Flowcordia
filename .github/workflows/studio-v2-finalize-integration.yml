name: Studio V2 final integration fix

on:
  push:
    branches:
      - agent/studio-v2-completion
  pull_request:
    branches:
      - main
    types:
      - synchronize

permissions:
  contents: write

jobs:
  apply-fix:
    if: github.event_name == 'push' || github.event.pull_request.head.ref == 'agent/studio-v2-completion'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: agent/studio-v2-completion
          fetch-depth: 0
      - name: Apply typed boundary and unit isolation fixes
        shell: python
        run: |
          from pathlib import Path

          api = Path("apps/webapp/app/features/flowcordia/workflows/studio-v2/activepieces-api.server.ts")
          text = api.read_text()
          old = 'import { loadOrCreateStudioV2Workspace } from "./workspace-service.server";'
          new = '''import {
            loadOrCreateStudioV2Workspace,
            prepareStudioV2WorkspaceForSave,
          } from "./workspace-service.server";'''
          assert old in text
          text = text.replace(old, new, 1)
          old = '  return workspace.document;'
          new = '  return prepareStudioV2WorkspaceForSave(workspace.document);'
          assert old in text
          text = text.replace(old, new, 1)
          api.write_text(text)

          extended = Path("apps/webapp/app/features/flowcordia/workflows/studio-v2/activepieces-extended-api.server.ts")
          text = extended.read_text()
          for indent in (8, 10):
            needle = f'{" " * indent}intent: "activepieces_api",\n'
            assert text.count(needle) == 1, (indent, text.count(needle))
            text = text.replace(needle, "", 1)
          extended.write_text(text)

          interaction = Path("apps/webapp/app/features/flowcordia/workflows/studio-v2/activepieces-interaction.server.ts")
          text = interaction.read_text()
          anchor = 'import type { InitializeDeploymentRequestBody } from "@trigger.dev/core/v3";\n'
          assert anchor in text
          text = text.replace(anchor, anchor + 'import type { WorkflowNode } from "@flowcordia/workflow";\n', 1)
          old = '      node: Record<string, unknown>;'
          new = '      node: WorkflowNode;'
          assert old in text
          text = text.replace(old, new, 1)
          interaction.write_text(text)

          test = Path("apps/webapp/app/features/flowcordia/workflows/studio-v2/activepieces-api.server.test.ts")
          text = test.read_text()
          old = 'import { describe, expect, it } from "vitest";\nimport { handleStudioV2ActivepiecesApi } from "./activepieces-api.server";'
          new = '''import { describe, expect, it, vi } from "vitest";

          vi.mock("./activepieces-interaction.server", () => ({
            StudioV2ActivepiecesInteractionError: class extends Error {},
            executeStudioV2ActivepiecesInteraction: vi.fn(),
          }));

          import { handleStudioV2ActivepiecesApi } from "./activepieces-api.server";'''
          assert old in text
          text = text.replace(old, new, 1)
          test.write_text(text)
      - name: Verify patch shape
        run: |
          git diff --check
          git diff -- apps/webapp/app/features/flowcordia/workflows/studio-v2/activepieces-api.server.ts \
            apps/webapp/app/features/flowcordia/workflows/studio-v2/activepieces-extended-api.server.ts \
            apps/webapp/app/features/flowcordia/workflows/studio-v2/activepieces-interaction.server.ts \
            apps/webapp/app/features/flowcordia/workflows/studio-v2/activepieces-api.server.test.ts
      - name: Commit product fix and remove helper
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/studio-v2-finalize-integration.yml
          git add apps/webapp/app/features/flowcordia/workflows/studio-v2/activepieces-api.server.ts \
            apps/webapp/app/features/flowcordia/workflows/studio-v2/activepieces-extended-api.server.ts \
            apps/webapp/app/features/flowcordia/workflows/studio-v2/activepieces-interaction.server.ts \
            apps/webapp/app/features/flowcordia/workflows/studio-v2/activepieces-api.server.test.ts
          git commit -m "fix(studio-v2): close webapp integration gates"
          git push origin HEAD:agent/studio-v2-completion
