name: Agent cross-workflow paste integration

on:
  pull_request:
    paths:
      - ".github/workflows/agent-cross-workflow-paste.yml"
      - "scripts/agent-integrate-cross-workflow-paste.mjs"
      - "packages/flowcordia-workflow/src/editor.ts"
      - "packages/flowcordia-workflow/src/editor.paste.test.ts"
      - "apps/webapp/app/features/flowcordia/workflows/drafts/commands.server.ts"
      - "apps/webapp/app/features/flowcordia/workflows/drafts/paste-command-contract.ts"
      - "apps/webapp/app/features/flowcordia/workflows/drafts/paste-command-contract.test.ts"
      - "apps/webapp/app/features/flowcordia/workflows/drafts/paste-service-contract.test.ts"
      - "apps/webapp/app/features/flowcordia/workflows/drafts/service.server.ts"
      - "apps/webapp/app/features/flowcordia/workflows/drafts/types.ts"
      - "apps/webapp/app/features/flowcordia/workflows/studio/WorkflowStudio.tsx"
      - "apps/webapp/app/features/flowcordia/workflows/studio/WorkflowStudioCanvas.tsx"
      - "apps/webapp/app/features/flowcordia/workflows/studio/WorkflowStudioCanvas.cross-workflow-paste-contract.test.ts"
      - "apps/webapp/app/features/flowcordia/workflows/studio/canvas-selection.ts"
      - "apps/webapp/app/features/flowcordia/workflows/studio/canvas-selection.test.ts"

permissions:
  contents: write

concurrency:
  group: agent-cross-workflow-paste-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  integrate:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout exact branch head
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 1

      - name: Setup pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5.0.0
        with:
          version: 10.33.2

      - name: Setup Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 20.20.2
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Integrate exact source-draft paste path
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path("scripts/agent-integrate-cross-workflow-paste.mjs")
          source = path.read_text()
          source = source.replace(
              'if (next === source) throw new Error(`No change produced for ${path}`);',
              'if (next === source) return;'
          )
          path.write_text(source)
          PY
          node scripts/agent-integrate-cross-workflow-paste.mjs
          git checkout -- scripts/agent-integrate-cross-workflow-paste.mjs

      - name: Format bounded product files
        run: |
          pnpm exec oxfmt --write \
            packages/flowcordia-workflow/src/editor.ts \
            packages/flowcordia-workflow/src/editor.paste.test.ts \
            apps/webapp/app/features/flowcordia/workflows/drafts/commands.server.ts \
            apps/webapp/app/features/flowcordia/workflows/drafts/paste-command-contract.ts \
            apps/webapp/app/features/flowcordia/workflows/drafts/paste-command-contract.test.ts \
            apps/webapp/app/features/flowcordia/workflows/drafts/paste-service-contract.test.ts \
            apps/webapp/app/features/flowcordia/workflows/drafts/service.server.ts \
            apps/webapp/app/features/flowcordia/workflows/drafts/types.ts \
            apps/webapp/app/features/flowcordia/workflows/studio/WorkflowStudio.tsx \
            apps/webapp/app/features/flowcordia/workflows/studio/WorkflowStudioCanvas.tsx \
            apps/webapp/app/features/flowcordia/workflows/studio/WorkflowStudioCanvas.cross-workflow-paste-contract.test.ts \
            apps/webapp/app/features/flowcordia/workflows/studio/canvas-selection.ts \
            apps/webapp/app/features/flowcordia/workflows/studio/canvas-selection.test.ts

      - name: Run portable paste contracts
        run: pnpm --filter @flowcordia/workflow exec vitest run src/editor.paste.test.ts

      - name: Generate Prisma client
        run: pnpm --filter @trigger.dev/database generate

      - name: Build webapp dependency graph
        run: pnpm exec turbo run build --filter=webapp...

      - name: Run route and canvas paste contracts
        run: |
          pnpm --filter webapp exec vitest run \
            app/features/flowcordia/workflows/drafts/paste-command-contract.test.ts \
            app/features/flowcordia/workflows/drafts/paste-service-contract.test.ts \
            app/features/flowcordia/workflows/studio/canvas-selection.test.ts \
            app/features/flowcordia/workflows/studio/WorkflowStudioCanvas.cross-workflow-paste-contract.test.ts \
            app/features/flowcordia/workflows/studio/WorkflowStudioCanvas.react-flow-contract.test.ts

      - name: Run dependency-aware webapp typecheck
        run: pnpm --filter webapp typecheck

      - name: Enforce bounded product boundary
        shell: bash
        run: |
          git diff --check
          unexpected="$(git status --short | awk '{print $2}' | grep -Ev '^(packages/flowcordia-workflow/src/editor.ts|packages/flowcordia-workflow/src/editor.paste.test.ts|apps/webapp/app/features/flowcordia/workflows/drafts/commands.server.ts|apps/webapp/app/features/flowcordia/workflows/drafts/paste-command-contract.ts|apps/webapp/app/features/flowcordia/workflows/drafts/paste-command-contract.test.ts|apps/webapp/app/features/flowcordia/workflows/drafts/paste-service-contract.test.ts|apps/webapp/app/features/flowcordia/workflows/drafts/service.server.ts|apps/webapp/app/features/flowcordia/workflows/drafts/types.ts|apps/webapp/app/features/flowcordia/workflows/studio/WorkflowStudio.tsx|apps/webapp/app/features/flowcordia/workflows/studio/WorkflowStudioCanvas.tsx|apps/webapp/app/features/flowcordia/workflows/studio/WorkflowStudioCanvas.cross-workflow-paste-contract.test.ts|apps/webapp/app/features/flowcordia/workflows/studio/canvas-selection.ts|apps/webapp/app/features/flowcordia/workflows/studio/canvas-selection.test.ts)$' || true)"
          if [[ -n "$unexpected" ]]; then
            echo "Unexpected changed paths:"
            echo "$unexpected"
            exit 1
          fi

      - name: Publish verified product integration
        shell: bash
        run: |
          git config user.name "flowcordia-studio-agent"
          git config user.email "flowcordia-studio-agent@users.noreply.github.com"
          git add \
            packages/flowcordia-workflow/src/editor.ts \
            packages/flowcordia-workflow/src/editor.paste.test.ts \
            apps/webapp/app/features/flowcordia/workflows/drafts/commands.server.ts \
            apps/webapp/app/features/flowcordia/workflows/drafts/paste-command-contract.ts \
            apps/webapp/app/features/flowcordia/workflows/drafts/paste-command-contract.test.ts \
            apps/webapp/app/features/flowcordia/workflows/drafts/paste-service-contract.test.ts \
            apps/webapp/app/features/flowcordia/workflows/drafts/service.server.ts \
            apps/webapp/app/features/flowcordia/workflows/drafts/types.ts \
            apps/webapp/app/features/flowcordia/workflows/studio/WorkflowStudio.tsx \
            apps/webapp/app/features/flowcordia/workflows/studio/WorkflowStudioCanvas.tsx \
            apps/webapp/app/features/flowcordia/workflows/studio/WorkflowStudioCanvas.cross-workflow-paste-contract.test.ts \
            apps/webapp/app/features/flowcordia/workflows/studio/canvas-selection.ts \
            apps/webapp/app/features/flowcordia/workflows/studio/canvas-selection.test.ts
          if git diff --cached --quiet; then
            echo "Verified cross-workflow paste integration is already published."
            exit 0
          fi
          git commit -m "Add exact cross-workflow node paste"
          git push origin HEAD:${{ github.head_ref }}
