name: Clean-install onboarding final corrections

on:
  push:
    branches:
      - agent/clean-install-onboarding-acceptance

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout acceptance branch
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: agent/clean-install-onboarding-acceptance
          fetch-depth: 1
          persist-credentials: false

      - name: Apply exact corrections
        shell: bash
        run: |
          set -euo pipefail
          python <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              file = Path(path)
              text = file.read_text()
              if text.count(old) != 1:
                  raise SystemExit(f"Unexpected replacement count in {path}: {old[:80]!r}")
              file.write_text(text.replace(old, new))

          spec = "flowcordia/acceptance/clean-install-onboarding.spec.ts"
          replace_once(
              spec,
              '''  await page.waitForURL(/\\/setup\\/github/);\n  await expect(page.getByText(/installed successfully/i)).toBeVisible();\n  record("github_installation_linked");\n\n  const repositoryOption = page\n''',
              '''  await page.waitForURL(\n    new RegExp(`/orgs/${organizationSlug}/settings/flowcordia-setup`)\n  );\n  await expect(page.getByText(/installed successfully/i)).toBeVisible();\n  record("github_installation_linked");\n  await page.goto(`${baseUrl}/setup/github`);\n\n  const repositoryOption = page\n''',
          )

          runner = "scripts/flowcordia-clean-install-onboarding-run.sh"
          replace_once(
              runner,
              'mkdir -m 0700 -p "$work_root"\n',
              'mkdir -m 0700 -p "$work_root" "$(dirname "$output")"\n',
          )

          workflow = ".github/workflows/flowcordia-clean-install-onboarding-acceptance.yml"
          replace_once(
              workflow,
              '''          docker logout ghcr.io >/dev/null 2>&1 || true\n          rm -rf \\\n            "${ONBOARDING_ARTIFACT_ROOT:-}" \\\n            "$ONBOARDING_WORK_PARENT/run-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"\n''',
              '''          docker logout ghcr.io >/dev/null 2>&1 || true\n          [[ -z "${ONBOARDING_ARTIFACT_ROOT:-}" ]] || rm -rf "$ONBOARDING_ARTIFACT_ROOT"\n          if [[ -n "${ONBOARDING_WORK_PARENT:-}" && "$ONBOARDING_WORK_PARENT" == /* ]]; then\n            rm -rf "$ONBOARDING_WORK_PARENT/run-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"\n          fi\n''',
          )
          PY
          bash -n scripts/flowcordia-clean-install-onboarding-run.sh

      - name: Commit corrections and remove this workflow
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm .github/workflows/clean-install-onboarding-final-patch.yml
          git add -A
          git commit -m "Correct clean-install callback and cleanup"
          git push "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" HEAD:agent/clean-install-onboarding-acceptance
