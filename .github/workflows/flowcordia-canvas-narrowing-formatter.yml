name: Flowcordia canvas temporary narrowing formatter

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/flowcordia-canvas-narrowing-formatter.yml"

permissions:
  contents: write

jobs:
  format:
    if: github.event.pull_request.head.ref == 'agent/flowcordia-beta-canvas-evidence'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout exact branch
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: agent/flowcordia-beta-canvas-evidence
          fetch-depth: 1
          persist-credentials: true

      - name: Setup pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5.0.0
        with:
          version: 10.33.2

      - name: Setup Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 20.20.2
          cache: pnpm

      - name: Format repair and remove helper
        shell: bash
        run: |
          set -euo pipefail
          pnpm install --frozen-lockfile
          pnpm exec oxfmt --write \
            apps/webapp/app/features/flowcordia/acceptance/canvas-manual-acceptance.ts
          rm .github/workflows/flowcordia-canvas-narrowing-formatter.yml
          git diff --check
          git config user.name "flowcordia-ci"
          git config user.email "flowcordia-ci@users.noreply.github.com"
          git add \
            apps/webapp/app/features/flowcordia/acceptance/canvas-manual-acceptance.ts \
            .github/workflows/flowcordia-canvas-narrowing-formatter.yml
          git commit -m "Format canvas manual evidence narrowing"
          git push origin HEAD:agent/flowcordia-beta-canvas-evidence
