name: Flowcordia Private Beta dossier checks

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/flowcordia-private-beta-dossier.yml"
      - ".github/workflows/flowcordia-private-beta-dossier-checks.yml"
      - "apps/webapp/app/features/flowcordia/acceptance/private-beta-dossier.ts"
      - "apps/webapp/test/flowcordia/privateBetaDossier.test.ts"
      - "scripts/flowcordia-private-beta-dossier.ts"
      - "flowcordia/testing/private-beta-dossier.md"
  push:
    branches: [main]
    paths:
      - ".github/workflows/flowcordia-private-beta-dossier.yml"
      - "apps/webapp/app/features/flowcordia/acceptance/private-beta-dossier.ts"

permissions: {}

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Checkout exact revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 10.33.2

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 20.20.2
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run Private Beta dossier contracts
        run: pnpm --filter webapp exec vitest run test/flowcordia/privateBetaDossier.test.ts

      - name: Validate protected workflow and evidence boundaries
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require("node:fs");
          const workflow = fs.readFileSync(".github/workflows/flowcordia-private-beta-dossier.yml", "utf8");
          const contract = fs.readFileSync("apps/webapp/app/features/flowcordia/acceptance/private-beta-dossier.ts", "utf8");
          for (const marker of [
            "workflow_dispatch:",
            "if: github.ref == 'refs/heads/main'",
            "environment: flowcordia-release-evidence",
            "ASSEMBLE-PRIVATE-BETA-DOSSIER",
            "actions: read",
            "contents: read",
            "permission-contents: write",
            "permission-pull-requests: write",
            "retention-days: 90",
            "rm -rf \"${FLOWCORDIA_BETA_PRIVATE_DIR:-}\"",
          ]) {
            if (!workflow.includes(marker)) throw new Error(`Missing protected dossier boundary: ${marker}`);
          }
          if (/\bpull_request\s*:/.test(workflow)) {
            throw new Error("Private Beta dossier assembly must not run for pull requests.");
          }
          for (const marker of [
            "launch_dossier",
            "bundled_execution",
            "api_reliability",
            "promotion_recovery",
            "failure_campaign",
            "canvas_manual",
            "verifyEvidenceDigest",
            "PRIVATE_BETA",
            "publicBeta: false",
            "generalAvailability: false",
            "pointInTimeRecovery: false",
            "crossRegionDisasterRecovery: false",
          ]) {
            if (!contract.includes(marker)) throw new Error(`Missing dossier contract boundary: ${marker}`);
          }
          NODE
          git diff --check

      - name: Check exact changed-source formatting
        run: |
          pnpm exec oxfmt --check \
            apps/webapp/app/features/flowcordia/acceptance/private-beta-dossier.ts \
            apps/webapp/test/flowcordia/privateBetaDossier.test.ts \
            scripts/flowcordia-private-beta-dossier.ts
