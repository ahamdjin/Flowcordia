name: Self-host image fix rebase

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  rebase:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.head_ref == 'agent/fix-self-host-image-runtime'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout image-fix branch
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: agent/fix-self-host-image-runtime
          fetch-depth: 0

      - name: Rebase onto current main and remove this workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          git rebase origin/main
          git rm .github/workflows/self-host-image-rebase.yml
          git commit -m "Remove temporary self-host image rebase workflow"
          git push --force-with-lease origin HEAD:agent/fix-self-host-image-runtime
