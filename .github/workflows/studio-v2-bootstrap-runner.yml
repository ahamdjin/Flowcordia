name: Studio V2 bootstrap runner

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/studio-v2-bootstrap-runner.yml

permissions:
  contents: write

jobs:
  patch:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: agent/studio-v2-activepieces-production-binding
      - name: Run checked-in product patch
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          workflow = Path('.github/workflows/studio-v2-production-runtime-bootstrap.yml')
          text = workflow.read_text()
          step = '      - name: Apply exact Activepieces production runtime adapters\n'
          start = text.index(step)
          start = text.index('        run: |\n', start) + len('        run: |\n')
          end = text.index('      - name: Commit runtime adapter slice\n', start)
          lines = text[start:end].splitlines()
          script = '\n'.join(line[10:] if line.startswith('          ') else line for line in lines) + '\n'
          Path('/tmp/apply-studio-v2-runtime.py').write_text(script)
          PY
          python /tmp/apply-studio-v2-runtime.py
          rm -f .github/workflows/studio-v2-bootstrap-runner.yml
      - name: Commit product patch
        shell: bash
        run: |
          git config user.name 'flowcordia-studio-v2-bot'
          git config user.email 'flowcordia-studio-v2-bot@users.noreply.github.com'
          git add -A
          git commit -m 'feat(studio-v2): map Activepieces production runtime contracts'
          git push origin HEAD:agent/studio-v2-activepieces-production-binding
