name: Materialize validated final CLI migration

on:
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize]

permissions:
  actions: read
  contents: write

jobs:
  materialize:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'agent/operations-cli-parseargs-final-audit'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact pull request head
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 1

      - name: Download exact validated product files
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: operations-cli-final-validated-30239478786
          path: .materialized
          github-token: ${{ github.token }}
          repository: ahamdjin/Flowcordia
          run-id: 30239478786

      - name: Replace scaffolding with validated files
        run: |
          set -euo pipefail
          cp -R .materialized/. .
          rm -rf .materialized .agent
          rm -f .github/workflows/agent-operations-cli-final-audit.yml
          rm -f .github/workflows/agent-materialize-final-cli.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --exit-code && { echo "No materialized changes found." >&2; exit 1; } || true
          git commit -m "Materialize validated final CLI migration"
          git push origin HEAD:${{ github.head_ref }}
