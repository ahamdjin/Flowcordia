name: Temporary Activepieces Trigger runtime PR patch

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: github.head_ref == 'agent/studio-v2-activepieces-trigger-runtime' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/studio-v2-activepieces-trigger-runtime
      - name: Apply patch
        run: python scripts/tmp-activepieces-runtime-patch.py
      - name: Commit patch
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add packages/flowcordia-runtime/src/runtime.ts packages/flowcordia-runtime/src/types.ts packages/flowcordia-runtime/src/index.ts packages/flowcordia-runtime/src/compiler.ts apps/webapp/app/features/flowcordia/workflows/studio-v2/deployment-context.server.ts
          git commit -m 'feat(runtime): wire Activepieces actions into Trigger.dev'
          git push origin HEAD:agent/studio-v2-activepieces-trigger-runtime
