name: Apply minimal hosted onboarding path

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  apply-and-validate:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact pull request head
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320
        with:
          version: 10.33.2

      - name: Setup Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: 20.20.2
          cache: pnpm

      - name: Apply minimal hosted onboarding patch
        shell: bash
        run: |
          set -euo pipefail
          awk '/base64 -d > \/tmp\/hosted-minimal.patch.gz/{capture=1; next} capture && /^          PATCH$/{exit} capture{sub(/^          /, ""); print}' \
            .github/workflows/hosted-onboarding-final-simplify.yml > /tmp/hosted-minimal.patch.b64
          base64 -d /tmp/hosted-minimal.patch.b64 > /tmp/hosted-minimal.patch.gz
          gzip -dc /tmp/hosted-minimal.patch.gz > /tmp/hosted-minimal.patch
          git apply --check /tmp/hosted-minimal.patch
          git apply /tmp/hosted-minimal.patch
          sed -i \
            's/1\. Name the workspace and first project on one screen\./1. Name the workspace. Flowcordia creates the first project automatically./' \
            flowcordia/testing/hosted-onboarding-simplification.md
          sed -i \
            's/3\. Choose the repository and production branch\./3. Choose the repository. Flowcordia uses its default branch automatically./' \
            flowcordia/testing/hosted-onboarding-simplification.md

      - name: Install dependency-aware workspace
        run: pnpm install --frozen-lockfile

      - name: Generate webapp dependencies
        run: pnpm run generate --filter webapp

      - name: Format exact changed sources
        run: |
          pnpm exec oxfmt --write \
            apps/webapp/app/routes/_app.orgs.new/route.tsx \
            apps/webapp/app/routes/setup.github/route.tsx \
            apps/webapp/test/hostedOnboardingSimplification.test.ts

      - name: Test minimal hosted onboarding contract
        run: pnpm --filter webapp exec vitest run test/hostedOnboardingSimplification.test.ts

      - name: Typecheck webapp
        run: pnpm run typecheck --filter webapp

      - name: Commit validated minimal journey
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          git checkout origin/main -- \
            internal-packages/llm-model-catalog/src/defaultPrices.ts \
            internal-packages/llm-model-catalog/src/modelCatalog.ts
          rm -f \
            .github/workflows/hosted-onboarding-final-simplify.yml \
            .github/workflows/hosted-onboarding-final-pr-apply.yml
          git diff --check
          git config user.name flowcordia-onboarding-bot
          git config user.email flowcordia-onboarding-bot@users.noreply.github.com
          git add -A
          git commit -m 'Reduce hosted onboarding to essential decisions'
          git remote set-url origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push origin HEAD:agent/simplify-hosted-onboarding
