name: Studio V2 runtime compiler apply

on:
  pull_request:
    branches:
      - main
    types:
      - synchronize

permissions:
  contents: write

jobs:
  apply:
    if: github.event.pull_request.head.ref == 'agent/studio-v2-runtime-parity'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: agent/studio-v2-runtime-parity
          fetch-depth: 0
      - name: Patch compiler
        shell: python
        run: |
          from pathlib import Path
          compiler = Path('packages/flowcordia-runtime/src/compiler.ts')
          text = compiler.read_text()
          old = '`import { createTriggerRuntimeAdapters, executeFlowcordiaFunctionValidationSuite, executeFlowcordiaWorkflow } from "@flowcordia/runtime";`'
          new = '`import { createFlowcordiaActivepiecesTriggerRuntimeServices, createTriggerRuntimeAdapters, executeFlowcordiaFunctionValidationSuite, executeFlowcordiaWorkflow } from "@flowcordia/runtime";`'
          assert old in text
          text = text.replace(old, new, 1)
          old = '`import { createTriggerRuntimeAdapters, executeFlowcordiaWorkflow } from "@flowcordia/runtime";`'
          new = '`import { createFlowcordiaActivepiecesTriggerRuntimeServices, createTriggerRuntimeAdapters, executeFlowcordiaWorkflow } from "@flowcordia/runtime";`'
          assert old in text
          text = text.replace(old, new, 1)
          anchor = '          `  activepiecesRunId: flowcordiaRunId,`,\n'
          assert anchor in text
          lines = [
            '          `  activepiecesRuntimeServices: createFlowcordiaActivepiecesTriggerRuntimeServices({`,',
            '          `    runId: flowcordiaRunId,`,',
            '          `    wait: {`,',
            '          `      createToken: async (input) => wait.createToken(input),`,',
            '          `      forToken: async (id) => {`,',
            '          `        const completed = await wait.forToken<unknown>(id);`,',
            '          `        return completed.ok`,',
            '          `          ? { ok: true, output: completed.output }`,',
            '          `          : { ok: false, error: completed.error };`,',
            '          `      },`,',
            '          `      until: async (date) => { await wait.until({ date }); },`,',
            '          `    },`,',
            '          `  }),`,',
          ]
          text = text.replace(anchor, anchor + '\n'.join(lines) + '\n', 1)
          compiler.write_text(text)
      - name: Verify compiler patch
        run: git diff --check
      - name: Commit compiler patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -f .github/workflows/studio-v2-runtime-compiler-apply.yml || true
          git add packages/flowcordia-runtime/src/compiler.ts
          git commit -m "feat(studio-v2): compile Activepieces waitpoints onto Trigger.dev"
          git push origin HEAD:agent/studio-v2-runtime-parity
