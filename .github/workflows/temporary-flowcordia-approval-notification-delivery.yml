name: Temporary Flowcordia approval notification delivery

on:
  push:
    branches:
      - agent/flowcordia-approval-notification-delivery
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: write

concurrency:
  group: temporary-flowcordia-approval-notification-delivery-${{ github.event.pull_request.head.sha || github.sha }}
  cancel-in-progress: true

jobs:
  integrate:
    if: github.event_name == 'push' || github.head_ref == 'agent/flowcordia-approval-notification-delivery'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout exact branch
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: agent/flowcordia-approval-notification-delivery
          persist-credentials: true
          fetch-depth: 1

      - name: Detect applied integration
        id: integration
        shell: bash
        run: |
          if grep -q 'model FlowcordiaApprovalNotificationDelivery' internal-packages/database/prisma/schema.prisma; then
            echo 'needed=false' >> "$GITHUB_OUTPUT"
          else
            echo 'needed=true' >> "$GITHUB_OUTPUT"
          fi

      - name: Setup pnpm
        if: steps.integration.outputs.needed == 'true'
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5.0.0
        with:
          version: 10.33.2

      - name: Setup Node
        if: steps.integration.outputs.needed == 'true'
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 20.20.2
          cache: pnpm

      - name: Install dependencies
        if: steps.integration.outputs.needed == 'true'
        run: pnpm install --frozen-lockfile

      - name: Bind exact typechecked integration script
        if: steps.integration.outputs.needed == 'true'
        shell: bash
        run: |
          set -euo pipefail
          actual="$(git hash-object scripts/temporary_apply_approval_notification_delivery.py)"
          expected="45cc1fb72da55a49af152bae2dd01317bf2a4129"
          test "$actual" = "$expected"
          echo 'Exact integration script passed repository typecheck in workflow run 30182875800.'

      - name: Apply exact integration
        if: steps.integration.outputs.needed == 'true'
        run: python3 scripts/temporary_apply_approval_notification_delivery.py

      - name: Format changed sources
        if: steps.integration.outputs.needed == 'true'
        run: |
          pnpm exec oxfmt --write \
            apps/webapp/app/features/flowcordia/workflows/approval/notification.ts \
            apps/webapp/app/features/flowcordia/workflows/approval/notification.server.ts \
            apps/webapp/app/v3/alertsWorker.server.ts \
            apps/webapp/test/flowcordia/approvalNotificationDelivery.test.ts

      - name: Generate database client
        if: steps.integration.outputs.needed == 'true'
        run: pnpm run generate

      - name: Run focused contracts
        if: steps.integration.outputs.needed == 'true'
        run: pnpm --filter webapp exec vitest run test/flowcordia/approvalNotificationDelivery.test.ts

      - name: Validate migration and source boundaries
        if: steps.integration.outputs.needed == 'true'
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('node:fs');
          const required = [
            ['internal-packages/database/prisma/schema.prisma', 'model FlowcordiaApprovalNotificationDelivery'],
            ['internal-packages/database/prisma/migrations/20260726011500_flowcordia_approval_notification_delivery/migration.sql', 'FlowcordiaApprovalNotificationDelivery_scope_key'],
            ['apps/webapp/app/v3/alertsWorker.server.ts', 'cron: "* * * * *"'],
            ['apps/webapp/app/features/flowcordia/workflows/approval/notification.ts', 'Delivery ID:'],
          ];
          for (const [path, marker] of required) {
            const source = fs.readFileSync(path, 'utf8');
            if (!source.includes(marker)) throw new Error(`Missing ${marker} in ${path}`);
          }
          NODE
          git diff --check

      - name: Commit tested permanent integration
        if: steps.integration.outputs.needed == 'true'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'flowcordia-ci'
          git config user.email 'flowcordia-ci@users.noreply.github.com'
          git add \
            internal-packages/database/prisma/schema.prisma \
            internal-packages/database/prisma/migrations/20260726011500_flowcordia_approval_notification_delivery/migration.sql \
            apps/webapp/app/features/flowcordia/workflows/approval/notification.ts \
            apps/webapp/app/features/flowcordia/workflows/approval/notification.server.ts \
            apps/webapp/app/v3/alertsWorker.server.ts \
            apps/webapp/test/flowcordia/approvalNotificationDelivery.test.ts
          if git diff --cached --name-only | grep -Eq '^(\.github/workflows/temporary-|scripts/temporary_)'; then
            echo 'Temporary integration machinery entered the product commit.' >&2
            exit 1
          fi
          git diff --cached --check
          git commit -m 'Add retry-safe approval notification delivery'
          git push origin HEAD:agent/flowcordia-approval-notification-delivery
