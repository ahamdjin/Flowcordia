name: Temporary Flowcordia approval notification delivery

on:
  push:
    branches:
      - agent/flowcordia-approval-notification-delivery
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: write

concurrency:
  group: temporary-flowcordia-approval-notification-delivery-${{ github.event.pull_request.head.sha || github.sha }}
  cancel-in-progress: true

jobs:
  integrate:
    if: github.event_name == 'push' || github.head_ref == 'agent/flowcordia-approval-notification-delivery'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout exact branch
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: agent/flowcordia-approval-notification-delivery
          persist-credentials: true
          fetch-depth: 1

      - name: Detect applied integration
        id: integration
        shell: bash
        run: |
          if grep -q 'model FlowcordiaApprovalNotificationDelivery' internal-packages/database/prisma/schema.prisma; then
            echo 'needed=false' >> "$GITHUB_OUTPUT"
          else
            echo 'needed=true' >> "$GITHUB_OUTPUT"
          fi

      - name: Setup pnpm
        if: steps.integration.outputs.needed == 'true'
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5.0.0
        with:
          version: 10.33.2

      - name: Setup Node
        if: steps.integration.outputs.needed == 'true'
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 20.20.2
          cache: pnpm

      - name: Install dependencies
        if: steps.integration.outputs.needed == 'true'
        run: pnpm install --frozen-lockfile

      - name: Apply exact integration
        if: steps.integration.outputs.needed == 'true'
        run: python3 scripts/temporary_apply_approval_notification_delivery.py

      - name: Format changed sources
        if: steps.integration.outputs.needed == 'true'
        run: |
          pnpm exec oxfmt --write \
            apps/webapp/app/features/flowcordia/workflows/approval/notification.ts \
            apps/webapp/app/features/flowcordia/workflows/approval/notification.server.ts \
            apps/webapp/app/v3/alertsWorker.server.ts \
            apps/webapp/test/flowcordia/approvalNotificationDelivery.test.ts

      - name: Generate database client
        if: steps.integration.outputs.needed == 'true'
        run: pnpm run generate

      - name: Run focused contracts
        if: steps.integration.outputs.needed == 'true'
        run: pnpm --filter webapp exec vitest run test/flowcordia/approvalNotificationDelivery.test.ts

      - name: Typecheck repository
        id: typecheck
        if: steps.integration.outputs.needed == 'true'
        continue-on-error: true
        env:
          NODE_OPTIONS: --max-old-space-size=8192
        shell: bash
        run: |
          set +e
          pnpm run typecheck > /tmp/flowcordia-approval-notification-typecheck.log 2>&1
          status=$?
          grep -E '(^|[[:space:]])(error TS[0-9]+:|TS[0-9]+:|Error:|ELIFECYCLE|Failed:)' \
            /tmp/flowcordia-approval-notification-typecheck.log \
            | tail -n 120 \
            > /tmp/flowcordia-approval-notification-typecheck-errors.txt || true
          if [ ! -s /tmp/flowcordia-approval-notification-typecheck-errors.txt ]; then
            tail -n 120 /tmp/flowcordia-approval-notification-typecheck.log \
              > /tmp/flowcordia-approval-notification-typecheck-errors.txt
          fi
          exit "$status"

      - name: Upload bounded typecheck diagnostic
        if: steps.integration.outputs.needed == 'true' && steps.typecheck.outcome == 'failure'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v6.0.0
        with:
          name: flowcordia-approval-notification-typecheck-${{ github.run_id }}
          path: /tmp/flowcordia-approval-notification-typecheck-errors.txt
          if-no-files-found: error
          retention-days: 1

      - name: Stop after typecheck failure
        if: steps.integration.outputs.needed == 'true' && steps.typecheck.outcome == 'failure'
        run: exit 1

      - name: Validate migration and source boundaries
        if: steps.integration.outputs.needed == 'true'
        shell: bash
        run: |
          set -euo pipefail
          pnpm --filter @trigger.dev/database exec prisma validate --schema prisma/schema.prisma
          grep -q 'FlowcordiaApprovalNotificationDelivery_scope_key' internal-packages/database/prisma/migrations/20260726011500_flowcordia_approval_notification_delivery/migration.sql
          grep -Fq 'cron: "* * * * *"' apps/webapp/app/v3/alertsWorker.server.ts
          grep -Fq 'client_msg_id: input.delivery.id' apps/webapp/app/features/flowcordia/workflows/approval/notification.server.ts
          git diff --check

      - name: Commit tested permanent integration
        if: steps.integration.outputs.needed == 'true'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'flowcordia-ci'
          git config user.email 'flowcordia-ci@users.noreply.github.com'
          git add \
            internal-packages/database/prisma/schema.prisma \
            internal-packages/database/prisma/migrations/20260726011500_flowcordia_approval_notification_delivery/migration.sql \
            apps/webapp/app/features/flowcordia/workflows/approval/notification.ts \
            apps/webapp/app/features/flowcordia/workflows/approval/notification.server.ts \
            apps/webapp/app/v3/alertsWorker.server.ts \
            apps/webapp/test/flowcordia/approvalNotificationDelivery.test.ts
          if git diff --cached --name-only | grep -Eq '^(\.github/workflows/temporary-|scripts/temporary_)'; then
            echo 'Temporary integration machinery entered the product commit.' >&2
            exit 1
          fi
          git commit -m 'Add retry-safe approval notification delivery'
          git push origin HEAD:agent/flowcordia-approval-notification-delivery
