name: Flowcordia report first self-host image publication

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/flowcordia-report-first-image-publication.yml
      - .github/scripts/report-first-image-publication.mjs

permissions: {}

concurrency:
  group: flowcordia-first-self-host-image-report
  cancel-in-progress: false

jobs:
  report:
    if: github.repository == 'ahamdjin/Flowcordia'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: read
      contents: read
      deployments: read
      issues: write
    env:
      GH_TOKEN: ${{ github.token }}
      REQUEST_SHA: 6be2c6e9f8b13afa42c0d67134bf70b7d9c3e7f7
      REQUEST_WORKFLOW: flowcordia-request-first-self-host-image.yml
      PUBLICATION_WORKFLOW: flowcordia-publish-self-host-image.yml
      PUBLICATION_ENVIRONMENT: flowcordia-self-host-release
      REPORT_ISSUE: "154"
    steps:
      - name: Fetch exact reporter script
        run: >-
          curl --fail --silent --show-error --location
          --output /tmp/report-first-image-publication.mjs
          https://raw.githubusercontent.com/ahamdjin/Flowcordia/agent/report-first-image-publication/.github/scripts/report-first-image-publication.mjs

      - name: Read exact publication state
        run: node /tmp/report-first-image-publication.mjs
