name: Flowcordia report first self-host image publication

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/flowcordia-report-first-image-publication.yml
      - .github/scripts/report-first-image-publication.mjs

permissions: {}

concurrency:
  group: flowcordia-first-self-host-image-report
  cancel-in-progress: false

jobs:
  report:
    if: github.repository == 'ahamdjin/Flowcordia'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: read
      contents: read
      issues: write
    env:
      GH_TOKEN: ${{ github.token }}
      REQUEST_SHA: 6be2c6e9f8b13afa42c0d67134bf70b7d9c3e7f7
      REQUEST_WORKFLOW: flowcordia-request-first-self-host-image.yml
      PUBLICATION_WORKFLOW: flowcordia-publish-self-host-image.yml
      REPORT_ISSUE: "154"
    steps:
      - name: Checkout exact reporter revision
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false

      - name: Read exact publication state
        run: node .github/scripts/report-first-image-publication.mjs
