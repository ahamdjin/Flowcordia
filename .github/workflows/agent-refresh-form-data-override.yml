name: Agent refresh form-data override

on:
  pull_request:
    paths:
      - ".github/workflows/agent-refresh-form-data-override.yml"
      - "scripts/agent-refresh-form-data-override.mjs"
      - "package.json"
      - "pnpm-lock.yaml"
      - "apps/webapp/test/flowcordia/workflowStudioEditingCapabilityEvidence.test.ts"

permissions:
  contents: write

concurrency:
  group: agent-refresh-form-data-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  refresh:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout exact branch head
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 1

      - name: Setup pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5.0.0
        with:
          version: 10.33.2

      - name: Setup Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 20.20.2
          cache: pnpm

      - name: Install exact current lockfile
        run: pnpm install --frozen-lockfile

      - name: Raise form-data v4 override
        run: node scripts/agent-refresh-form-data-override.mjs

      - name: Regenerate lockfile only
        run: pnpm install --lockfile-only

      - name: Verify fixed dependency graph
        shell: bash
        run: |
          node -e 'const p=require("./package.json"); if(p.pnpm?.overrides?.["form-data@^4"]!=="4.0.6") process.exit(1)'
          if grep -Eq '(^|[[:space:]])form-data@4\.0\.4:|form-data: 4\.0\.4' pnpm-lock.yaml; then
            echo "Vulnerable form-data 4.0.4 remains in the lockfile."
            exit 1
          fi
          grep -q 'form-data@4.0.6:' pnpm-lock.yaml
          pnpm install --frozen-lockfile

      - name: Run focused layout and evidence contracts
        run: |
          pnpm --filter webapp exec vitest run \
            app/features/flowcordia/workflows/studio/canvas-layout.test.ts \
            app/features/flowcordia/workflows/studio/WorkflowStudioCanvas.layout-contract.test.ts \
            test/flowcordia/workflowStudioEditingCapabilityEvidence.test.ts

      - name: Enforce two-file product boundary
        shell: bash
        run: |
          git diff --check
          unexpected="$(git status --short | awk '{print $2}' | grep -Ev '^(package.json|pnpm-lock.yaml)$' || true)"
          if [[ -n "$unexpected" ]]; then
            echo "Unexpected changed paths:"
            echo "$unexpected"
            exit 1
          fi

      - name: Publish fixed override and lockfile
        shell: bash
        run: |
          git config user.name "flowcordia-studio-agent"
          git config user.email "flowcordia-studio-agent@users.noreply.github.com"
          git add package.json pnpm-lock.yaml
          if git diff --cached --quiet; then
            echo "Fixed override and lockfile are already published."
            exit 0
          fi
          git commit -m "Update form-data override to fixed release"
          git push origin HEAD:${{ github.head_ref }}
