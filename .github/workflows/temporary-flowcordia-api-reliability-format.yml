name: Temporary Flowcordia API reliability formatting

on:
  push:
    branches:
      - agent/flowcordia-api-trigger-reliability

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout branch
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: agent/flowcordia-api-trigger-reliability
          persist-credentials: true

      - name: Setup pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5.0.0
        with:
          version: 10.33.2

      - name: Setup Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 20.20.2
          cache: pnpm

      - name: Apply exact formatter output
        run: |
          set -euo pipefail
          pnpm install --frozen-lockfile
          files=(
            apps/webapp/app/features/flowcordia/acceptance/api-trigger-reliability-contract.ts
            apps/webapp/test/flowcordia/apiTriggerReliabilityAcceptance.test.ts
            packages/trigger-sdk/test/flowcordia-api-trigger-reliability/trigger.config.ts
            packages/trigger-sdk/test/flowcordia-api-trigger-reliability/src/tasks.ts
            scripts/flowcordia-api-trigger-reliability-client.ts
            scripts/flowcordia-api-trigger-reliability-evidence.ts
          )
          pnpm exec oxfmt "${files[@]}"
          if git diff --quiet; then exit 0; fi
          git config user.name flowcordia-ci
          git config user.email flowcordia-ci@users.noreply.github.com
          git add "${files[@]}"
          git commit -m "Format API trigger reliability acceptance"
          git push origin HEAD:agent/flowcordia-api-trigger-reliability
