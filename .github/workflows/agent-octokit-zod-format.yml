name: Format Octokit Zod migration

on:
  pull_request:
    branches: [agent/octokit-zod-responses-clean]
    types: [opened, reopened, synchronize]

permissions:
  contents: read

jobs:
  format:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout exact pull request head
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5.0.0
        with:
          version: 10.33.2

      - name: Setup Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 20.20.2
          cache: pnpm

      - name: Install exact dependencies
        run: pnpm install --frozen-lockfile

      - name: Format exact migration boundary
        run: |
          pnpm exec oxfmt \
            packages/flowcordia-github-workflows/src/transport/response-contracts.ts \
            packages/flowcordia-github-workflows/src/index.ts \
            packages/flowcordia-github-proposals/src/transport/octokit-adapter.ts \
            packages/flowcordia-github-proposals/test/octokit-adapter.test.ts

      - name: Upload formatted product files
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: octokit-zod-formatted-${{ github.run_id }}
          path: |
            packages/flowcordia-github-workflows/src/transport/response-contracts.ts
            packages/flowcordia-github-workflows/src/index.ts
            packages/flowcordia-github-proposals/src/transport/octokit-adapter.ts
            packages/flowcordia-github-proposals/test/octokit-adapter.test.ts
          retention-days: 1
