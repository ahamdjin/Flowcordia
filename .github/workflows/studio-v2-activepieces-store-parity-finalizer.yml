name: Studio V2 Activepieces store parity finalizer

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/studio-v2-activepieces-store-parity-finalizer.yml

permissions:
  contents: write

jobs:
  patch:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: agent/studio-v2-activepieces-production-binding
      - name: Match pinned Activepieces StoreScope and test prefix
        shell: python
        run: |
          from pathlib import Path

          path = Path('apps/webapp/app/features/flowcordia/workflows/studio-v2/activepieces-interaction-context.server.ts')
          text = path.read_text()
          old = '''function activepiecesStoreKey(flowId: string, key: string, scope?: string): string {\n  if (!key || typeof key !== "string" || key.length > 128) {\n    throw new Error("Activepieces store key must contain between 1 and 128 characters.");\n  }\n  return scope === "COLLECTION" ? key : "flow_" + flowId + "/" + key;\n}\n'''
          new = '''function activepiecesStoreKey(\n  flowId: string,\n  key: string,\n  scope: string | undefined,\n  prefix: string\n): string {\n  if (!key || typeof key !== "string" || key.length > 128) {\n    throw new Error("Activepieces store key must contain between 1 and 128 characters.");\n  }\n  return prefix + (scope === "PROJECT" ? key : "flow_" + flowId + "/" + key);\n}\n'''
          if old not in text:
              raise SystemExit('store key function anchor missing')
          text = text.replace(old, new, 1)

          old = '''    const triggerFlowId =\n      triggerInteraction &&\n      "flowId" in triggerInteraction &&\n      typeof triggerInteraction.flowId === "string"\n        ? triggerInteraction.flowId\n        : undefined;\n    const services = {\n'''
          new = '''    const triggerFlowId =\n      triggerInteraction &&\n      "flowId" in triggerInteraction &&\n      typeof triggerInteraction.flowId === "string"\n        ? triggerInteraction.flowId\n        : undefined;\n    const triggerStorePrefix =\n      payload.kind === "trigger_simulation" || payload.kind === "trigger_test" ? "test" : "";\n    const services = {\n'''
          if old not in text:
              raise SystemExit('trigger flow id anchor missing')
          text = text.replace(old, new, 1)

          text = text.replace(
              '''                const storeKey = activepiecesStoreKey(triggerFlowId, key, scope);\n''',
              '''                const storeKey = activepiecesStoreKey(\n                  triggerFlowId,\n                  key,\n                  scope,\n                  triggerStorePrefix\n                );\n''',
              1,
          )
          text = text.replace(
              '''                  key: activepiecesStoreKey(triggerFlowId, key, scope),\n''',
              '''                  key: activepiecesStoreKey(triggerFlowId, key, scope, triggerStorePrefix),\n''',
              1,
          )
          text = text.replace(
              '''                  key: activepiecesStoreKey(triggerFlowId, key, scope),\n''',
              '''                  key: activepiecesStoreKey(triggerFlowId, key, scope, triggerStorePrefix),\n''',
              1,
          )
          path.write_text(text)
      - name: Format changed source
        shell: bash
        run: |
          npx --yes oxfmt@0.54.0 \
            apps/webapp/app/features/flowcordia/workflows/studio-v2/activepieces-interaction-context.server.ts
          rm -f .github/workflows/studio-v2-activepieces-store-parity-finalizer.yml
      - name: Commit Activepieces store parity fix
        shell: bash
        run: |
          git config user.name 'flowcordia-studio-v2-bot'
          git config user.email 'flowcordia-studio-v2-bot@users.noreply.github.com'
          git add -A
          git commit -m 'fix(studio-v2): match Activepieces store scope and test isolation'
          git push origin HEAD:agent/studio-v2-activepieces-production-binding
