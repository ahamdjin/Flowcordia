name: Studio V2 Activepieces store parity finalizer

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/studio-v2-activepieces-store-parity-finalizer.yml

permissions:
  contents: write

jobs:
  patch:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: agent/studio-v2-activepieces-production-binding
      - name: Match pinned Activepieces trigger-context contracts
        shell: python
        run: |
          from pathlib import Path

          context = Path('apps/webapp/app/features/flowcordia/workflows/studio-v2/activepieces-interaction-context.server.ts')
          text = context.read_text()
          old = '''function activepiecesStoreKey(flowId: string, key: string, scope?: string): string {\n  if (!key || typeof key !== "string" || key.length > 128) {\n    throw new Error("Activepieces store key must contain between 1 and 128 characters.");\n  }\n  return scope === "COLLECTION" ? key : "flow_" + flowId + "/" + key;\n}\n'''
          new = '''function activepiecesStoreKey(\n  flowId: string,\n  key: string,\n  scope: string | undefined,\n  prefix: string\n): string {\n  if (!key || typeof key !== "string" || key.length > 128) {\n    throw new Error("Activepieces store key must contain between 1 and 128 characters.");\n  }\n  return prefix + (scope === "PROJECT" ? key : "flow_" + flowId + "/" + key);\n}\n'''
          if old not in text:
              raise SystemExit('store key function anchor missing')
          text = text.replace(old, new, 1)

          old = '''    const triggerFlowId =\n      triggerInteraction && "flowId" in triggerInteraction && typeof triggerInteraction.flowId === "string"\n        ? triggerInteraction.flowId\n        : undefined;\n    const services = {\n'''
          new = '''    const triggerFlowId =\n      triggerInteraction && "flowId" in triggerInteraction && typeof triggerInteraction.flowId === "string"\n        ? triggerInteraction.flowId\n        : undefined;\n    const triggerStorePrefix =\n      payload.kind === "trigger_simulation" || payload.kind === "trigger_test" ? "test" : "";\n    const services = {\n'''
          if old not in text:
              raise SystemExit('trigger flow id anchor missing')
          text = text.replace(old, new, 1)

          text = text.replace(
              'const storeKey = activepiecesStoreKey(triggerFlowId, key, scope);',
              'const storeKey = activepiecesStoreKey(triggerFlowId, key, scope, triggerStorePrefix);',
          )
          text = text.replace(
              'activepiecesStoreKey(triggerFlowId, key, scope),',
              'activepiecesStoreKey(triggerFlowId, key, scope, triggerStorePrefix),',
          )
          context.write_text(text)

          runtime = Path('packages/flowcordia-runtime/src/activepieces.ts')
          text = runtime.read_text()
          old = '''  flowId: string;\n  setSchedule?: (schedule: UnknownRecord) => void;\n'''
          new = '''  flowId: string;\n  stepName: string;\n  setSchedule?: (schedule: UnknownRecord) => void;\n'''
          if old not in text:
              raise SystemExit('triggerContext stepName type anchor missing')
          text = text.replace(old, new, 1)
          old = '''    step: { name: input.flowId },\n'''
          new = '''    step: { name: input.stepName },\n'''
          if old not in text:
              raise SystemExit('triggerContext step.name anchor missing')
          text = text.replace(old, new, 1)
          old = '''    flowId: input.interaction.flowId ?? input.interaction.triggerName,\n'''
          new = '''    flowId: input.interaction.flowId ?? input.interaction.triggerName,\n    stepName: input.interaction.triggerName,\n'''
          count = text.count(old)
          if count < 5:
              raise SystemExit(f'expected trigger context flowId calls, found {count}')
          text = text.replace(old, new)
          runtime.write_text(text)
      - name: Format changed sources
        shell: bash
        run: |
          npx --yes oxfmt@0.54.0 \
            apps/webapp/app/features/flowcordia/workflows/studio-v2/activepieces-interaction-context.server.ts \
            packages/flowcordia-runtime/src/activepieces.ts
          rm -f .github/workflows/studio-v2-activepieces-store-parity-finalizer.yml
      - name: Commit Activepieces trigger-context parity fix
        shell: bash
        run: |
          git config user.name 'flowcordia-studio-v2-bot'
          git config user.email 'flowcordia-studio-v2-bot@users.noreply.github.com'
          git add -A
          git commit -m 'fix(studio-v2): match Activepieces trigger context contracts'
          git push origin HEAD:agent/studio-v2-activepieces-production-binding
