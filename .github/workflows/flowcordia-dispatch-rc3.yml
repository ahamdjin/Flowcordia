name: Flowcordia dispatch exact-main RC3

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
    paths:
      - .github/workflows/flowcordia-dispatch-rc3.yml

permissions: {}

jobs:
  dispatch:
    if: >-
      github.repository == 'ahamdjin/Flowcordia' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.head_ref == 'release/dispatch-rc3-20260730'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: write
      contents: read
    env:
      GH_TOKEN: ${{ github.token }}
      EXPECTED_MAIN_SHA: 9c4f15fc0f75987c523c5d609eae8c0fdc279d7b
      RELEASE_ID: flowcordia-0.1.0-rc.3
      RELEASE_VERSION: 0.1.0-rc.3
      FIRST_FLOWCORDIA_COMMIT: e9d87c27ddd74d72677d7fa68098d43319cf668d
      PUBLISH_WORKFLOW: flowcordia-publish-self-host-image.yml
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ env.EXPECTED_MAIN_SHA }}
          persist-credentials: false
          fetch-depth: 0

      - name: Require unchanged exact main
        shell: bash
        run: |
          set -euo pipefail
          current_main_sha="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq '.object.sha')"
          if [[ "$current_main_sha" != "$EXPECTED_MAIN_SHA" ]]; then
            echo "Main moved from $EXPECTED_MAIN_SHA to $current_main_sha; refusing stale publication." >&2
            exit 1
          fi
          test "$(git rev-parse HEAD)" = "$EXPECTED_MAIN_SHA"

      - name: Derive inherited Trigger.dev baseline
        id: upstream
        shell: bash
        run: |
          set -euo pipefail
          git cat-file -e "$FIRST_FLOWCORDIA_COMMIT^{commit}"
          upstream_sha="$(git rev-parse "$FIRST_FLOWCORDIA_COMMIT^")"
          if [[ ! "$upstream_sha" =~ ^[0-9a-f]{40}$ ]]; then
            echo "Derived upstream SHA is invalid." >&2
            exit 1
          fi
          git merge-base --is-ancestor "$upstream_sha" "$EXPECTED_MAIN_SHA"
          echo "sha=$upstream_sha" >> "$GITHUB_OUTPUT"

      - name: Dispatch protected immutable publication
        id: publish
        shell: bash
        env:
          UPSTREAM_SHA: ${{ steps.upstream.outputs.sha }}
        run: |
          set -euo pipefail
          dispatched_at="$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          gh api \
            --method POST \
            "repos/$GITHUB_REPOSITORY/actions/workflows/$PUBLISH_WORKFLOW/dispatches" \
            -f ref=main \
            -f "inputs[release_id]=$RELEASE_ID" \
            -f "inputs[version]=$RELEASE_VERSION" \
            -f "inputs[upstream_commit_sha]=$UPSTREAM_SHA"

          run_id=""
          for _ in $(seq 1 20); do
            run_id="$(
              gh api \
                "repos/$GITHUB_REPOSITORY/actions/workflows/$PUBLISH_WORKFLOW/runs?event=workflow_dispatch&branch=main&head_sha=$EXPECTED_MAIN_SHA&per_page=10" \
                --jq ".workflow_runs | map(select(.created_at >= \"$dispatched_at\")) | sort_by(.created_at) | reverse | .[0].id // empty"
            )"
            [[ -n "$run_id" ]] && break
            sleep 3
          done
          if [[ -z "$run_id" ]]; then
            echo "Publication dispatch was accepted but its run could not be observed." >&2
            exit 1
          fi
          echo "PUBLICATION_RUN_ID=$run_id"
          echo "APPLICATION_SHA=$EXPECTED_MAIN_SHA"
          echo "UPSTREAM_SHA=$UPSTREAM_SHA"
          echo "RELEASE_VERSION=$RELEASE_VERSION"
