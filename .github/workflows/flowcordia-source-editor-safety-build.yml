name: Flowcordia source editor safety artifact

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

concurrency:
  group: flowcordia-source-editor-safety-artifact-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  format-and-verify:
    if: github.head_ref == 'studio/code-editor-safety'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout isolated editor branch
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      - name: Setup pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320
        with:
          version: 10.33.2
      - name: Setup Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: 20.20.2
          cache: pnpm
      - name: Patch, format, and verify source editor
        run: |
          pnpm install --frozen-lockfile
          node scripts/flowcordia-source-editor-safety-build.mjs
          pnpm exec oxfmt apps/webapp/app/features/flowcordia/workflows/studio/WorkflowSourceWorkspace.tsx apps/webapp/app/features/flowcordia/workflows/studio/WorkflowSourceWorkspace.safety.test.ts apps/webapp/app/features/flowcordia/workflows/studio/source-editor-safety.ts apps/webapp/app/features/flowcordia/workflows/studio/source-editor-safety.test.ts
          pnpm --filter webapp exec vitest --run app/features/flowcordia/workflows/studio/source-editor-safety.test.ts app/features/flowcordia/workflows/studio/WorkflowSourceWorkspace.safety.test.ts
          pnpm exec oxlint -c .oxlintrc.json apps/webapp/app/features/flowcordia/workflows/studio/WorkflowSourceWorkspace.tsx apps/webapp/app/features/flowcordia/workflows/studio/WorkflowSourceWorkspace.safety.test.ts apps/webapp/app/features/flowcordia/workflows/studio/source-editor-safety.ts apps/webapp/app/features/flowcordia/workflows/studio/source-editor-safety.test.ts
      - name: Upload formatted product files
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: flowcordia-source-editor-safety-formatted
          if-no-files-found: error
          retention-days: 1
          path: |
            apps/webapp/app/features/flowcordia/workflows/studio/WorkflowSourceWorkspace.tsx
            apps/webapp/app/features/flowcordia/workflows/studio/WorkflowSourceWorkspace.safety.test.ts
            apps/webapp/app/features/flowcordia/workflows/studio/source-editor-safety.ts
            apps/webapp/app/features/flowcordia/workflows/studio/source-editor-safety.test.ts
