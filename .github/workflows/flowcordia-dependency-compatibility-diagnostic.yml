name: Flowcordia temporary dependency compatibility diagnostic

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/flowcordia-dependency-compatibility-diagnostic.yml"

permissions: {}

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      actions: read
      contents: read
    steps:
      - name: Checkout exact branch
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5.0.0
        with:
          version: 10.33.2

      - name: Setup Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 20.20.2
          cache: pnpm

      - name: Restore reviewed remediation proposal
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT_ID: "8633164672"
        run: |
          set -euo pipefail
          output="$RUNNER_TEMP/compatibility"
          mkdir -p "$output/artifact"
          gh api "/repos/${GITHUB_REPOSITORY}/actions/artifacts/${ARTIFACT_ID}/zip" > "$output/remediation.zip"
          unzip -q "$output/remediation.zip" -d "$output/artifact"
          cp "$output/artifact/_temp/dependency-remediation/package.after.json" package.json
          cp "$output/artifact/_temp/dependency-remediation/pnpm-lock.after.yaml" pnpm-lock.yaml

          node <<'NODE'
          const fs = require("node:fs");
          const webappPath = "apps/webapp/package.json";
          const webapp = JSON.parse(fs.readFileSync(webappPath, "utf8"));
          webapp.dependencies.dompurify = "3.4.12";
          for (const section of [webapp.dependencies, webapp.devDependencies]) {
            for (const name of Object.keys(section)) {
              if (name.startsWith("@remix-run/") && /\^?2\.17\.4/.test(section[name])) section[name] = "2.17.5";
            }
          }
          fs.writeFileSync(webappPath, JSON.stringify(webapp, null, 2) + "\n");

          const kubernetesPath = "apps/kubernetes-provider/package.json";
          const kubernetes = JSON.parse(fs.readFileSync(kubernetesPath, "utf8"));
          kubernetes.dependencies["@kubernetes/client-node"] = "1.4.0";
          fs.writeFileSync(kubernetesPath, JSON.stringify(kubernetes, null, 2) + "\n");
          NODE

      - name: Install reviewed graph
        shell: bash
        run: pnpm install --frozen-lockfile

      - name: Capture focused compiler results
        shell: bash
        run: |
          set +e
          output="$RUNNER_TEMP/compatibility"
          pnpm --filter kubernetes-provider typecheck > "$output/kubernetes.log" 2>&1
          echo "$?" > "$output/kubernetes.status"
          pnpm --filter webapp typecheck > "$output/webapp.log" 2>&1
          echo "$?" > "$output/webapp.status"
          pnpm --filter @trigger.dev/core typecheck > "$output/core.log" 2>&1
          echo "$?" > "$output/core.status"
          exit 0

      - name: Upload compatibility diagnostics
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: flowcordia-dependency-compatibility-${{ github.run_id }}
          path: ${{ runner.temp }}/compatibility
          if-no-files-found: error
          retention-days: 2
          include-hidden-files: false
