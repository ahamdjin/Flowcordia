name: Dispatch first protected Flowcordia image

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/flowcordia-dispatch-first-image.yml

permissions:
  actions: write
  contents: read

jobs:
  dispatch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_ID: flowcordia-0.1.0-rc.1
      RELEASE_VERSION: 0.1.0-rc.1
      FIRST_FLOWCORDIA_COMMIT: e9d87c27ddd74d72677d7fa68098d43319cf668d
      PUBLICATION_WORKFLOW: flowcordia-publish-self-host-image.yml
    steps:
      - name: Checkout exact main revision
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: main
          persist-credentials: false
          fetch-depth: 0

      - name: Dispatch protected publisher once
        shell: bash
        run: |
          set -euo pipefail
          main_sha="$(git rev-parse HEAD)"
          upstream_sha="$(git rev-parse "$FIRST_FLOWCORDIA_COMMIT^")"
          existing_count="$(
            gh api \
              --method GET \
              "repos/$GITHUB_REPOSITORY/actions/workflows/$PUBLICATION_WORKFLOW/runs" \
              -f event=workflow_dispatch \
              -f branch=main \
              -f head_sha="$main_sha" \
              -f per_page=1 \
              --jq '.total_count'
          )"
          if (( existing_count > 0 )); then
            echo "An exact-main publication run already exists for $main_sha."
            exit 0
          fi
          gh api \
            --method POST \
            "repos/$GITHUB_REPOSITORY/actions/workflows/$PUBLICATION_WORKFLOW/dispatches" \
            -f ref=main \
            -f "inputs[release_id]=$RELEASE_ID" \
            -f "inputs[version]=$RELEASE_VERSION" \
            -f "inputs[upstream_commit_sha]=$upstream_sha"
          echo "Protected publication dispatched for $main_sha."
