name: Temporary Studio V2 branch formatter

on:
  push:
    branches:
      - agent/studio-v2-exact-activepieces-ui

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout branch
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: agent/studio-v2-exact-activepieces-ui
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5.0.0
        with:
          version: 10.33.2

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 20.20.2
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Format exact files
        run: |
          pnpm exec oxfmt \
            apps/flowcordia-studio-activepieces/e2e/studio.spec.ts \
            apps/flowcordia-studio-activepieces/src/studio-integration.test.ts \
            apps/flowcordia-studio-activepieces/src/typecheck/activepieces-web.ts \
            apps/flowcordia-studio-activepieces/tsconfig.host.json

      - name: Commit formatter output
        run: |
          if git diff --quiet -- \
            apps/flowcordia-studio-activepieces/e2e/studio.spec.ts \
            apps/flowcordia-studio-activepieces/src/studio-integration.test.ts \
            apps/flowcordia-studio-activepieces/src/typecheck/activepieces-web.ts \
            apps/flowcordia-studio-activepieces/tsconfig.host.json; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            apps/flowcordia-studio-activepieces/e2e/studio.spec.ts \
            apps/flowcordia-studio-activepieces/src/studio-integration.test.ts \
            apps/flowcordia-studio-activepieces/src/typecheck/activepieces-web.ts \
            apps/flowcordia-studio-activepieces/tsconfig.host.json
          git commit -m "style(studio-v2): apply repository formatter"
          git push origin HEAD:agent/studio-v2-exact-activepieces-ui
