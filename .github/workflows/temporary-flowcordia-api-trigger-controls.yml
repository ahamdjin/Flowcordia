name: Temporary Flowcordia API trigger controls

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
    paths:
      - ".github/workflows/temporary-flowcordia-api-trigger-controls.yml"
      - "scripts/flowcordia_apply_api_trigger_controls.py"
      - "flowcordia/testing/api-trigger-controls-applied.marker"

permissions: {}

concurrency:
  group: temporary-flowcordia-api-trigger-controls-${{ github.event.pull_request.head.sha }}
  cancel-in-progress: true

jobs:
  apply:
    if: github.head_ref == 'agent/flowcordia-api-trigger-idempotency'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: write
    steps:
      - name: Checkout exact pull-request head
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: true
          fetch-depth: 1

      - name: Detect completed integration
        id: integration
        shell: bash
        run: |
          if [ -f flowcordia/testing/api-trigger-controls-applied.marker ]; then
            echo "needed=false" >> "$GITHUB_OUTPUT"
          else
            echo "needed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup pnpm
        if: steps.integration.outputs.needed == 'true'
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5.0.0
        with:
          version: 10.33.2

      - name: Setup Node
        if: steps.integration.outputs.needed == 'true'
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 20.20.2
          cache: pnpm

      - name: Install dependencies
        if: steps.integration.outputs.needed == 'true'
        run: pnpm install --frozen-lockfile

      - name: Apply exact integration patch
        if: steps.integration.outputs.needed == 'true'
        run: python3 scripts/flowcordia_apply_api_trigger_controls.py

      - name: Format exact changed sources
        if: steps.integration.outputs.needed == 'true'
        run: |
          pnpm exec oxfmt --write \
            packages/flowcordia-workflow/src/api-trigger.ts \
            packages/flowcordia-workflow/src/index.ts \
            packages/flowcordia-workflow/src/catalog.ts \
            packages/flowcordia-workflow/src/editor.ts \
            packages/flowcordia-workflow/test/api-trigger.test.ts \
            packages/flowcordia-runtime/src/analyze.ts \
            packages/flowcordia-runtime/src/types.ts \
            packages/flowcordia-runtime/src/compiler.ts \
            packages/flowcordia-runtime/test/runtime.test.ts \
            apps/webapp/app/features/flowcordia/workflows/studio/node-configuration.ts \
            apps/webapp/app/features/flowcordia/workflows/studio/WorkflowStudioNodeConfigurationEditor.tsx \
            apps/webapp/app/features/flowcordia/workflows/studio/presentation.ts \
            apps/webapp/test/flowcordia/workflowStudioApiTriggerConfiguration.test.ts

      - name: Run portable API trigger contracts
        if: steps.integration.outputs.needed == 'true'
        run: pnpm --filter @flowcordia/workflow exec vitest run test/api-trigger.test.ts

      - name: Build portable workflow package
        if: steps.integration.outputs.needed == 'true'
        run: pnpm --filter @flowcordia/workflow build

      - name: Run runtime API trigger contracts
        if: steps.integration.outputs.needed == 'true'
        run: pnpm --filter @flowcordia/runtime exec vitest run test/runtime.test.ts

      - name: Run Studio API trigger contracts
        if: steps.integration.outputs.needed == 'true'
        run: pnpm --filter webapp exec vitest run test/flowcordia/workflowStudioApiTriggerConfiguration.test.ts

      - name: Typecheck portable workflow package
        if: steps.integration.outputs.needed == 'true'
        run: pnpm --filter @flowcordia/workflow typecheck

      - name: Typecheck runtime package
        if: steps.integration.outputs.needed == 'true'
        run: pnpm --filter @flowcordia/runtime typecheck

      - name: Check exact diff
        if: steps.integration.outputs.needed == 'true'
        run: git diff --check

      - name: Commit tested permanent sources
        if: steps.integration.outputs.needed == 'true'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p flowcordia/testing
          cat > flowcordia/testing/api-trigger-controls-applied.marker <<'EOF'
          source-head=${{ github.event.pull_request.head.sha }}
          focused-contracts=passed
          EOF

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            packages/flowcordia-workflow/src/api-trigger.ts \
            packages/flowcordia-workflow/src/index.ts \
            packages/flowcordia-workflow/src/catalog.ts \
            packages/flowcordia-workflow/src/editor.ts \
            packages/flowcordia-workflow/test/api-trigger.test.ts \
            packages/flowcordia-runtime/src/analyze.ts \
            packages/flowcordia-runtime/src/types.ts \
            packages/flowcordia-runtime/src/compiler.ts \
            packages/flowcordia-runtime/test/runtime.test.ts \
            apps/webapp/app/features/flowcordia/workflows/studio/node-configuration.ts \
            apps/webapp/app/features/flowcordia/workflows/studio/WorkflowStudioNodeConfigurationEditor.tsx \
            apps/webapp/app/features/flowcordia/workflows/studio/presentation.ts \
            apps/webapp/test/flowcordia/workflowStudioApiTriggerConfiguration.test.ts \
            flowcordia/product/capability-matrix.md \
            flowcordia/testing/api-trigger-idempotency.md \
            flowcordia/testing/api-trigger-controls-applied.marker

          if git diff --cached --name-only | grep -Eq '^(\.github/workflows/|scripts/)'; then
            echo 'Temporary integration machinery entered the product commit.' >&2
            exit 1
          fi

          git diff --cached --check
          git commit -m "Add API trigger idempotency and TTL controls"
          git push origin HEAD:refs/heads/agent/flowcordia-api-trigger-idempotency
