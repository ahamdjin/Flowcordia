name: Capture PR 107 E2E failure

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened

permissions:
  contents: read

concurrency:
  group: flowcordia-pr107-e2e-diagnostic
  cancel-in-progress: true

jobs:
  diagnose:
    if: github.head_ref == 'agent/flowcordia-production-auth-hardening'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Disable IPv6
        run: |
          sudo sysctl -w net.ipv6.conf.all.disable_ipv6=1
          sudo sysctl -w net.ipv6.conf.default.disable_ipv6=1
          sudo sysctl -w net.ipv6.conf.lo.disable_ipv6=1

      - name: Configure docker address pool
        run: |
          CONFIG='{
            "default-address-pools" : [
              { "base" : "172.17.0.0/12", "size" : 20 },
              { "base" : "192.168.0.0/16", "size" : 24 }
            ]
          }'
          mkdir -p /etc/docker
          echo "$CONFIG" | sudo tee /etc/docker/daemon.json
          sudo systemctl restart docker

      - name: Checkout exact branch
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: agent/flowcordia-production-auth-hardening
          fetch-depth: 0
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5.0.0
        with:
          version: 10.33.2

      - name: Setup Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 20.20.2
          cache: pnpm

      - name: Install and generate
        run: |
          pnpm install --frozen-lockfile
          pnpm run generate

      - name: Build webapp
        run: pnpm run build --filter webapp

      - name: Capture webapp E2E output
        id: e2e
        continue-on-error: true
        env:
          WEBAPP_TEST_VERBOSE: "1"
        shell: bash
        run: |
          set -o pipefail
          cd apps/webapp
          pnpm exec vitest run --config vitest.e2e.config.ts --reporter=default > "$RUNNER_TEMP/flowcordia-pr107-e2e.log" 2>&1

      - name: Upload E2E diagnostic
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: flowcordia-pr107-e2e-diagnostic
          path: ${{ runner.temp }}/flowcordia-pr107-e2e.log
          if-no-files-found: error
          retention-days: 1

      - name: Require E2E success
        if: steps.e2e.outcome != 'success'
        run: exit 1
