name: Flowcordia Beta failure acceptance checks

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/flowcordia-beta-failure-acceptance.yml"
      - ".github/workflows/flowcordia-beta-failure-acceptance-checks.yml"
      - "apps/webapp/app/features/flowcordia/acceptance/beta-failure-contract.ts"
      - "apps/webapp/scripts/flowcordia-beta-failure-delivery.ts"
      - "apps/webapp/scripts/flowcordia-bundled-reference-bootstrap.ts"
      - "apps/webapp/test/flowcordia/betaFailureAcceptance.test.ts"
      - "scripts/flowcordia-beta-failure-evidence.ts"
      - "scripts/flowcordia-beta-failure-run.sh"
      - "scripts/flowcordia-beta-load-client.ts"
      - "scripts/flowcordia-beta-smtp-fixture.mjs"
      - "flowcordia/testing/beta-failure-acceptance.md"
  push:
    branches: [main]
    paths:
      - ".github/workflows/flowcordia-beta-failure-acceptance.yml"
      - "apps/webapp/app/features/flowcordia/acceptance/beta-failure-contract.ts"
      - "scripts/flowcordia-beta-failure-run.sh"

permissions: {}

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Checkout exact revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          version: 10.33.2

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 20.20.2
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run failure evidence contracts
        run: pnpm --filter webapp exec vitest run test/flowcordia/betaFailureAcceptance.test.ts

      - name: Validate protected workflow and source boundaries
        shell: bash
        run: |
          set -euo pipefail
          bash -n scripts/flowcordia-beta-failure-run.sh
          node --check scripts/flowcordia-beta-smtp-fixture.mjs
          node <<'NODE'
          const fs = require("node:fs");
          const workflow = fs.readFileSync(".github/workflows/flowcordia-beta-failure-acceptance.yml", "utf8");
          const runner = fs.readFileSync("scripts/flowcordia-beta-failure-run.sh", "utf8");
          const contract = fs.readFileSync("apps/webapp/app/features/flowcordia/acceptance/beta-failure-contract.ts", "utf8");
          const delivery = fs.readFileSync("apps/webapp/scripts/flowcordia-beta-failure-delivery.ts", "utf8");
          const requiredWorkflow = [
            "workflow_dispatch:",
            "if: github.ref == 'refs/heads/main'",
            "environment: flowcordia-bundled-execution-acceptance",
            "flowcordia-release",
            "flowcordia-self-host-lifecycle.yml",
            "flowcordia-publish-self-host-image.yml",
            "retention-days: 90",
            "--deny-self-hosted-runners",
          ];
          for (const marker of requiredWorkflow) {
            if (!workflow.includes(marker)) throw new Error(`Missing protected workflow boundary: ${marker}`);
          }
          if (/\bpull_request\s*:/.test(workflow)) {
            throw new Error("The destructive Beta failure workflow must not run for pull requests.");
          }
          for (const marker of [
            "flowcordia-beta-load-client.ts",
            "flowcordia-beta-failure-delivery.ts",
            "compose restart web operations supervisor",
            "--remove-orphans --volumes",
          ]) {
            if (!runner.includes(marker)) throw new Error(`Missing failure runner boundary: ${marker}`);
          }
          for (const marker of [
            "queueSaturation",
            "workerLoss",
            "providerOutage",
            "backupManifestSha256",
            "restoreEvidenceSha256",
            "evidenceSha256",
          ]) {
            if (!contract.includes(marker)) throw new Error(`Missing evidence contract boundary: ${marker}`);
          }
          for (const marker of [
            "flowcordia:approval",
            "PROVIDER_REJECTED",
            "leaseExpiresAt",
            "stableDeliveryId",
          ]) {
            if (!delivery.includes(marker)) throw new Error(`Missing delivery failure boundary: ${marker}`);
          }
          for (const forbidden of ["payload:", "authorization:", "credential:", "providerResponse:"]) {
            if (contract.includes(forbidden)) throw new Error(`Forbidden evidence field: ${forbidden}`);
          }
          NODE
          git diff --check

      - name: Check exact changed-source formatting
        run: |
          pnpm exec oxfmt --check \
            apps/webapp/app/features/flowcordia/acceptance/beta-failure-contract.ts \
            apps/webapp/scripts/flowcordia-beta-failure-delivery.ts \
            apps/webapp/scripts/flowcordia-bundled-reference-bootstrap.ts \
            apps/webapp/test/flowcordia/betaFailureAcceptance.test.ts \
            scripts/flowcordia-beta-failure-evidence.ts \
            scripts/flowcordia-beta-load-client.ts
