name: Email boolean schema repair

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  repair:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.head_ref == 'agent/self-host-email-configuration'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ github.head_ref }}
          persist-credentials: true

      - name: Setup pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320
        with:
          version: 10.33.2

      - name: Setup Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: 20.20.2
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Repair SMTP secure input contract
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          service = Path("apps/webapp/app/features/flowcordia/setup/emailConfiguration.server.ts")
          text = service.read_text()
          old = '''  secure: z.preprocess(
            (value) => value === true || value === "true" || value === "1" || value === "on",
            z.boolean()
          ),'''
          new = '''  secure: z.boolean(),'''
          if old not in text:
              raise SystemExit("SMTP secure schema block not found")
          text = text.replace(old, new)

          marker = '''function optionalString(source: object, key: string): string | undefined {
            const value = environmentValue(source, key);
            return typeof value === "string" && value.trim().length > 0 ? value.trim() : undefined;
          }
          '''
          helper = marker + '''
          function booleanValue(value: unknown): boolean {
            if (typeof value === "boolean") return value;
            return value === "true" || value === "1" || value === "on";
          }
          '''
          if marker not in text:
              raise SystemExit("optionalString marker not found")
          text = text.replace(marker, helper)
          text = text.replace(
              '''        secure: environmentValue(source, `${prefix}SMTP_SECURE`) ?? false,''',
              '''        secure: booleanValue(environmentValue(source, `${prefix}SMTP_SECURE`) ?? false),'''
          )
          service.write_text(text)

          route = Path("apps/webapp/app/routes/setup.email/route.tsx")
          route_text = route.read_text()
          old_route = '''        secure: formData.get("secure"),'''
          new_route = '''        secure: formData.get("secure") === "true",'''
          if old_route not in route_text:
              raise SystemExit("SMTP route secure field not found")
          route.write_text(route_text.replace(old_route, new_route))
          PY

          pnpm exec oxfmt \
            apps/webapp/app/features/flowcordia/setup/emailConfiguration.server.ts \
            apps/webapp/app/routes/setup.email/route.tsx
          rm -f .agent/email-typecheck-failure.md
          rm -f .github/workflows/email-typecheck-log-tail.yml

      - name: Commit repair and cleanup
        shell: bash
        run: |
          git config user.name "Flowcordia CI"
          git config user.email "flowcordia-ci@users.noreply.github.com"
          git add -A
          git commit -m "Make SMTP secure a normalized boolean"
          git push origin HEAD:${{ github.head_ref }}
