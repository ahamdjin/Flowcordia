name: Email typecheck log tail

on:
  pull_request:
    branches: [main]

permissions:
  actions: read
  contents: write

jobs:
  capture:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.head_ref == 'agent/self-host-email-configuration'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ github.head_ref }}
          persist-credentials: true

      - name: Capture failed typecheck tail
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/jobs/90335585561/logs" \
            --output /tmp/typecheck-job.log
          mkdir -p .agent
          {
            echo "# Typecheck failure tail"
            echo
            echo '```text'
            tail -n 260 /tmp/typecheck-job.log
            echo '```'
          } > .agent/email-typecheck-failure.md

      - name: Commit diagnostic
        shell: bash
        run: |
          git config user.name "Flowcordia CI"
          git config user.email "flowcordia-ci@users.noreply.github.com"
          git add .agent/email-typecheck-failure.md
          git commit -m "Capture email typecheck failure tail"
          git push origin HEAD:${{ github.head_ref }}
