name: Studio V2 PR 204 final formatter

on:
  push:
    branches:
      - agent/studio-v2-activepieces-official-catalog

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: agent/studio-v2-activepieces-official-catalog
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320
        with:
          version: 10.33.2
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: 20.20.2
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec oxfmt apps/flowcordia-studio-activepieces/src/activepieces-pieces-api.test.ts
      - name: Commit exact formatter output
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/flowcordia-studio-activepieces/src/activepieces-pieces-api.test.ts
          git commit -m "style(studio-v2): match final catalog test formatter"
          git push origin HEAD:agent/studio-v2-activepieces-official-catalog
