name: Temporary Studio V2 final formatting

on:
  push:
    branches:
      - agent/studio-v2-activepieces-runtime-adapters

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/studio-v2-activepieces-runtime-adapters
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.2
      - uses: actions/setup-node@v4
        with:
          node-version: 20.20.2
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: >-
          pnpm exec oxfmt
          apps/flowcordia-studio-activepieces/src/flowcordia-activepieces-piece-bridge.ts
          apps/flowcordia-studio-activepieces/src/flowcordia-activepieces-piece-bridge.test.ts
          apps/webapp/app/features/flowcordia/workflows/studio-v2/activepieces-api.server.ts
          apps/webapp/app/features/flowcordia/workflows/studio-v2/activepieces-api.server.test.ts
          apps/webapp/app/features/flowcordia/workflows/studio-v2/activepieces-connections.server.ts
          apps/webapp/app/features/flowcordia/workflows/studio-v2/activepieces-connections-oauth.server.test.ts
          apps/webapp/app/features/flowcordia/workflows/studio-v2/activepieces-oauth.server.ts
          apps/webapp/app/features/flowcordia/workflows/studio-v2/activepieces-oauth.server.test.ts
          apps/webapp/app/features/flowcordia/workflows/studio-v2/activepieces-oauth-client-credentials.server.test.ts
      - name: Commit formatting
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add apps/flowcordia-studio-activepieces/src/flowcordia-activepieces-piece-bridge.ts apps/flowcordia-studio-activepieces/src/flowcordia-activepieces-piece-bridge.test.ts apps/webapp/app/features/flowcordia/workflows/studio-v2/activepieces-api.server.ts apps/webapp/app/features/flowcordia/workflows/studio-v2/activepieces-api.server.test.ts apps/webapp/app/features/flowcordia/workflows/studio-v2/activepieces-connections.server.ts apps/webapp/app/features/flowcordia/workflows/studio-v2/activepieces-connections-oauth.server.test.ts apps/webapp/app/features/flowcordia/workflows/studio-v2/activepieces-oauth.server.ts apps/webapp/app/features/flowcordia/workflows/studio-v2/activepieces-oauth.server.test.ts apps/webapp/app/features/flowcordia/workflows/studio-v2/activepieces-oauth-client-credentials.server.test.ts
          git commit -m 'style(studio-v2): format remaining Activepieces adapters'
          git push origin HEAD:agent/studio-v2-activepieces-runtime-adapters
