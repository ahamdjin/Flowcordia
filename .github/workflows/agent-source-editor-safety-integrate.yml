name: Agent source editor safety integration

on:
  pull_request:
    paths:
      - ".github/workflows/agent-source-editor-safety-integrate.yml"
      - "scripts/flowcordia-integrate-source-editor-safety.py"
      - "apps/webapp/app/features/flowcordia/workflows/studio/WorkflowSourceWorkspace.tsx"
      - "apps/webapp/app/features/flowcordia/workflows/studio/WorkflowSourceWorkspace.safety.test.ts"
      - "apps/webapp/app/features/flowcordia/workflows/studio/source-editor-safety.ts"
      - "apps/webapp/app/features/flowcordia/workflows/studio/source-editor-safety.test.ts"

permissions:
  contents: write

concurrency:
  group: agent-source-editor-safety-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  integrate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout exact branch head
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 1

      - name: Setup pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5.0.0
        with:
          version: 10.33.2

      - name: Setup Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 20.20.2
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Integrate safety into redesigned workbench
        run: python scripts/flowcordia-integrate-source-editor-safety.py

      - name: Format bounded source files
        run: |
          pnpm exec oxfmt --write \
            apps/webapp/app/features/flowcordia/workflows/studio/WorkflowSourceWorkspace.tsx \
            apps/webapp/app/features/flowcordia/workflows/studio/WorkflowSourceWorkspace.safety.test.ts \
            apps/webapp/app/features/flowcordia/workflows/studio/source-editor-safety.ts \
            apps/webapp/app/features/flowcordia/workflows/studio/source-editor-safety.test.ts

      - name: Build workflow dependency
        run: pnpm exec turbo run build --filter=@flowcordia/workflow

      - name: Run source safety contracts
        run: |
          pnpm --filter webapp exec vitest run \
            app/features/flowcordia/workflows/studio/source-editor-safety.test.ts \
            app/features/flowcordia/workflows/studio/WorkflowSourceWorkspace.safety.test.ts

      - name: Generate Prisma client
        run: pnpm --filter @trigger.dev/database run generate

      - name: Run dependency-aware webapp typecheck
        run: pnpm exec turbo run typecheck --filter=webapp...

      - name: Enforce product-only integration boundary
        run: |
          allowed='^(apps/webapp/app/features/flowcordia/workflows/studio/WorkflowSourceWorkspace\.tsx|apps/webapp/app/features/flowcordia/workflows/studio/WorkflowSourceWorkspace\.safety\.test\.ts|apps/webapp/app/features/flowcordia/workflows/studio/source-editor-safety\.ts|apps/webapp/app/features/flowcordia/workflows/studio/source-editor-safety\.test\.ts)$'
          unexpected=$(git diff --name-only | grep -Ev "$allowed" || true)
          if [ -n "$unexpected" ]; then
            echo "Unexpected product paths changed:"
            echo "$unexpected"
            exit 1
          fi

      - name: Publish verified product integration
        env:
          BRANCH: ${{ github.event.pull_request.head.ref }}
        run: |
          git config user.name "flowcordia-studio-bot"
          git config user.email "studio-bot@flowcordia.invalid"
          git add \
            apps/webapp/app/features/flowcordia/workflows/studio/WorkflowSourceWorkspace.tsx \
            apps/webapp/app/features/flowcordia/workflows/studio/WorkflowSourceWorkspace.safety.test.ts \
            apps/webapp/app/features/flowcordia/workflows/studio/source-editor-safety.ts \
            apps/webapp/app/features/flowcordia/workflows/studio/source-editor-safety.test.ts
          if git diff --cached --quiet; then
            echo "Verified product integration is already present."
            exit 0
          fi
          git commit -m "Protect unsaved source edits in redesigned Studio"
          git push origin "HEAD:${BRANCH}"
