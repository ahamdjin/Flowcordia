name: Ajv function contract migration

on:
  pull_request:
    branches: [agent/schema-validation-consolidation]
    types: [opened, reopened, synchronize]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout exact pull request head
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Apply staged function migration
        run: |
          set -o pipefail
          cp .agent/function-contract-ajv.patch.gz.b64 /tmp/function-contract-ajv.patch.gz.b64
          echo "e82b5096382ecf47662ca36942f9324503a661704e6469495f4003bccde7ceae  /tmp/function-contract-ajv.patch.gz.b64" | sha256sum --check
          base64 --decode /tmp/function-contract-ajv.patch.gz.b64 | gunzip > /tmp/function-contract-ajv.patch
          echo "742dd27c379e2b866daa1946c42180018392a46489a22d869880495a7a1272f0  /tmp/function-contract-ajv.patch" | sha256sum --check
          git apply --check --verbose /tmp/function-contract-ajv.patch
          git apply /tmp/function-contract-ajv.patch

      - name: Guard Ajv schema lookup
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("packages/flowcordia-workflow/src/function-schema.ts")
          text = path.read_text()
          text = text.replace(
              "const schemaNodeValidator = schemaAjv.getSchema(",
              "const loadedSchemaNodeValidator = schemaAjv.getSchema(",
              1,
          )
          text = text.replace(
              'if (!schemaNodeValidator) throw new Error("Flowcordia function schema contract is unavailable.");',
              'if (!loadedSchemaNodeValidator) {\n  throw new Error("Flowcordia function schema contract is unavailable.");\n}\nconst schemaNodeValidator: ValidateFunction = loadedSchemaNodeValidator;',
              1,
          )
          path.write_text(text)
          PY

      - name: Setup pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5.0.0
        with:
          version: 10.33.2

      - name: Setup Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 20.20.2
          cache: pnpm

      - name: Install exact dependencies
        run: pnpm install --frozen-lockfile

      - name: Format migration boundary
        run: |
          pnpm exec oxfmt \
            packages/flowcordia-workflow/schema/functions-0.1.json \
            packages/flowcordia-workflow/src/function-schema.ts \
            packages/flowcordia-workflow/test/function-schema.test.ts

      - name: Typecheck affected packages
        run: |
          set -o pipefail
          {
            pnpm --filter @flowcordia/workflow typecheck
            pnpm --filter @flowcordia/runtime typecheck
          } 2>&1 | tee /tmp/function-contract-typecheck.log

      - name: Test affected dependency graph
        run: |
          set -o pipefail
          pnpm exec turbo run test \
            --concurrency=1 \
            --filter=@flowcordia/workflow \
            --filter=@flowcordia/runtime \
            -- --run 2>&1 | tee /tmp/function-contract-tests.log

      - name: Upload validated function contract files
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: function-contract-validated-${{ github.run_id }}
          path: |
            packages/flowcordia-workflow/schema/functions-0.1.json
            packages/flowcordia-workflow/src/function-schema.ts
            packages/flowcordia-workflow/test/function-schema.test.ts
          retention-days: 1

      - name: Upload migration diagnostics
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: function-contract-diagnostics-${{ github.run_id }}
          path: |
            /tmp/function-contract-typecheck.log
            /tmp/function-contract-tests.log
            packages/flowcordia-workflow/src/function-schema.ts
          if-no-files-found: ignore
          retention-days: 1
