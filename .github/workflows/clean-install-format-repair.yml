name: Clean-install evidence format repair

on:
  push:
    branches:
      - agent/clean-install-onboarding-acceptance

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout acceptance branch
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: agent/clean-install-onboarding-acceptance
          fetch-depth: 1
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320
        with:
          version: 10.33.2

      - name: Setup Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: 20.20.2
          cache: pnpm

      - name: Format and verify exact contract
        run: |
          pnpm install --frozen-lockfile
          pnpm --filter @trigger.dev/database generate
          pnpm exec oxfmt apps/webapp/app/features/flowcordia/operations/clean-install-onboarding.ts
          pnpm --filter webapp typecheck

      - name: Commit formatting and remove this workflow
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm .github/workflows/clean-install-format-repair.yml
          git add -A
          git commit -m "Format clean-install evidence contract"
          git push "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" HEAD:agent/clean-install-onboarding-acceptance
