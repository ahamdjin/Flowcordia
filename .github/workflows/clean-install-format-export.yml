name: Clean-install contract format export

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  export:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.head_ref == 'agent/clean-install-onboarding-acceptance'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact pull request head
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320
        with:
          version: 10.33.2

      - name: Setup Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: 20.20.2
          cache: pnpm

      - name: Format exact contract
        run: |
          pnpm install --frozen-lockfile
          pnpm exec oxfmt apps/webapp/app/features/flowcordia/operations/clean-install-onboarding.ts

      - name: Upload formatted contract
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: clean-install-formatted-contract
          path: apps/webapp/app/features/flowcordia/operations/clean-install-onboarding.ts
          if-no-files-found: error
          retention-days: 1
