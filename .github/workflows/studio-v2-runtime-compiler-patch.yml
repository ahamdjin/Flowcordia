name: Studio V2 runtime compiler patch

on:
  pull_request:
    branches:
      - main
    types:
      - synchronize

permissions:
  contents: write

jobs:
  apply:
    if: github.event.pull_request.head.ref == 'agent/studio-v2-runtime-parity'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: agent/studio-v2-runtime-parity
          fetch-depth: 0
      - name: Patch generated Trigger.dev task wiring
        shell: python
        run: |
          from pathlib import Path
          compiler = Path('packages/flowcordia-runtime/src/compiler.ts')
          text = compiler.read_text()
          text = text.replace(
            '`import { createTriggerRuntimeAdapters, executeFlowcordiaFunctionValidationSuite, executeFlowcordiaWorkflow } from "@flowcordia/runtime";`',
            '`import { createFlowcordiaActivepiecesTriggerRuntimeServices, createTriggerRuntimeAdapters, executeFlowcordiaFunctionValidationSuite, executeFlowcordiaWorkflow } from "@flowcordia/runtime";`',
            1,
          )
          text = text.replace(
            '`import { createTriggerRuntimeAdapters, executeFlowcordiaWorkflow } from "@flowcordia/runtime";`',
            '`import { createFlowcordiaActivepiecesTriggerRuntimeServices, createTriggerRuntimeAdapters, executeFlowcordiaWorkflow } from "@flowcordia/runtime";`',
            1,
          )
          anchor = '          `  activepiecesRunId: flowcordiaRunId,`,\n'
          assert anchor in text
          addition = ''.join([
            '          `  activepiecesRuntimeServices: createFlowcordiaActivepiecesTriggerRuntimeServices({`,\n',
            '          `    runId: flowcordiaRunId,`,\n',
            '          `    wait: {`,\n',
            '          `      createToken: async (input) => wait.createToken(input),`,\n',
            '          `      forToken: async (id) => {`,\n',
            '          `        const completed = await wait.forToken<unknown>(id);`,\n',
            '          `        return completed.ok`,\n',
            '          `          ? { ok: true, output: completed.output }`,\n',
            '          `          : { ok: false, error: completed.error };`,\n',
            '          `      },`,\n',
            '          `      until: async (date) => { await wait.until({ date }); },`,\n',
            '          `    },`,\n',
            '          `  }),`,\n',
          ])
          text = text.replace(anchor, anchor + addition, 1)
          compiler.write_text(text)
      - name: Verify compiler patch
        run: git diff --check
      - name: Commit source and remove helper
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/studio-v2-runtime-compiler-patch.yml
          git add packages/flowcordia-runtime/src/compiler.ts
          git commit -m "feat(studio-v2): compile Activepieces waitpoints onto Trigger.dev"
          git push origin HEAD:agent/studio-v2-runtime-parity
