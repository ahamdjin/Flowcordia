name: Studio V2 PR 202 finalize

on:
  push:
    branches:
      - agent/studio-v2-activepieces-connections

permissions:
  contents: write

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: agent/studio-v2-activepieces-connections
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320
        with:
          version: 10.33.2
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: 20.20.2
          cache: pnpm
      - name: Apply connection safety fixes
        shell: python
        run: |
          from pathlib import Path

          adapter = Path('apps/webapp/app/features/flowcordia/workflows/studio-v2/activepieces-connections.server.ts')
          text = adapter.read_text()

          old = '''  const pieceVersion = requiredString(input.body, "pieceVersion");
  const placeholder = requestedType === "PLACEHOLDER";
  const timestamp = new Date().toISOString();
'''
          new = '''  const pieceVersion = requiredString(input.body, "pieceVersion");
  const placeholder = requestedType === "PLACEHOLDER";
  const oauthTypes = new Set(["OAUTH2", "PLATFORM_OAUTH2", "CLOUD_OAUTH2"]);
  if (oauthTypes.has(requestedType)) {
    throw new StudioV2ActivepiecesConnectionError(
      "activepieces_backend_not_mapped",
      501,
      "Activepieces OAuth connection exchange is not mapped to Flowcordia yet."
    );
  }
  const timestamp = new Date().toISOString();
'''
          if old not in text:
              raise SystemExit('OAuth insertion anchor not found')
          text = text.replace(old, new, 1)

          old = '''    const mutationMatch = command.path.match(/^\\/v1\\/app-connections\\/([^/]+)$/);
    if (command.method === "POST" && mutationMatch) {
'''
          new = '''    if (command.method === "POST" && command.path === "/v1/app-connections/replace") {
      throw new StudioV2ActivepiecesConnectionError(
        "activepieces_backend_not_mapped",
        501,
        "Activepieces connection replacement is not mapped to Flowcordia yet."
      );
    }

    const mutationMatch = command.path.match(/^\\/v1\\/app-connections\\/([^/]+)$/);
    if (command.method === "POST" && mutationMatch) {
'''
          if old not in text:
              raise SystemExit('replace insertion anchor not found')
          text = text.replace(old, new, 1)

          old = '''      const updated: StoredActivepiecesConnection = {
        ...found.connection,
        displayName:
          typeof command.body.displayName === "string" && command.body.displayName.trim().length > 0
            ? command.body.displayName
            : found.connection.displayName,
        metadata: command.body.metadata ?? found.connection.metadata,
'''
          new = '''      const displayName = requiredString(command.body, "displayName");
      const updated: StoredActivepiecesConnection = {
        ...found.connection,
        displayName,
        metadata: command.body.metadata ?? found.connection.metadata,
'''
          if old not in text:
              raise SystemExit('update validation anchor not found')
          text = text.replace(old, new, 1)
          adapter.write_text(text)

          tests = Path('apps/webapp/app/features/flowcordia/workflows/studio-v2/activepieces-connections.server.test.ts')
          test_text = tests.read_text()
          test_text = test_text.replace('const encryptedEnvelopeInput = Array.from(values.values())[0]!;', 'const secretStoreEnvelope = Array.from(values.values())[0]!;', 1)
          test_text = test_text.replace('expect(encryptedEnvelopeInput).toContain("super-secret-token");', 'expect(secretStoreEnvelope).toContain("super-secret-token");', 1)

          anchor = '''  it("permission-gates mutations and keeps runtime-dependent operations fail-closed", async () => {
'''
          addition = '''  it("fails OAuth exchange and connection replacement closed until their exact runtime contracts exist", async () => {
    const { store } = memoryStore();
    const handle = createStudioV2ActivepiecesConnectionAdapter(store);

    await expect(
      handle({
        ...baseInput,
        command: {
          method: "POST",
          path: "/v1/app-connections",
          body: {
            externalId: "oauth-main",
            displayName: "OAuth main",
            pieceName: "@activepieces/piece-example",
            projectId: baseInput.projectId,
            type: "OAUTH2",
            value: {
              type: "OAUTH2",
              client_id: "client-id",
              client_secret: "client-secret",
              code: "authorization-code",
              redirect_url: "https://example.com/callback",
              scope: "read",
            },
            pieceVersion: "1.0.0",
          },
        },
      })
    ).rejects.toMatchObject({ code: "activepieces_backend_not_mapped", status: 501 });

    await expect(
      handle({
        ...baseInput,
        command: {
          method: "POST",
          path: "/v1/app-connections/replace",
          body: {
            sourceAppConnectionId: "source",
            targetAppConnectionId: "target",
            projectId: baseInput.projectId,
          },
        },
      })
    ).rejects.toMatchObject({ code: "activepieces_backend_not_mapped", status: 501 });
  });

'''
          if anchor not in test_text:
              raise SystemExit('test insertion anchor not found')
          test_text = test_text.replace(anchor, addition + anchor, 1)
          tests.write_text(test_text)
      - run: pnpm install --frozen-lockfile
      - name: Format owned files
        run: >-
          pnpm exec oxfmt
          apps/webapp/app/features/flowcordia/workflows/studio-v2/activepieces-connections.server.ts
          apps/webapp/app/features/flowcordia/workflows/studio-v2/activepieces-connections.server.test.ts
      - name: Commit exact result
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            apps/webapp/app/features/flowcordia/workflows/studio-v2/activepieces-connections.server.ts \
            apps/webapp/app/features/flowcordia/workflows/studio-v2/activepieces-connections.server.test.ts
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "fix(studio-v2): fail closed for unmapped connection runtimes"
          git push origin HEAD:agent/studio-v2-activepieces-connections
