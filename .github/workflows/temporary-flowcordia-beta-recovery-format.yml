name: Temporary Flowcordia Beta recovery formatting

on:
  push:
    branches:
      - agent/flowcordia-beta-promotion-recovery

permissions:
  contents: write

concurrency:
  group: temporary-flowcordia-beta-recovery-format
  cancel-in-progress: true

jobs:
  format:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout exact branch
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: agent/flowcordia-beta-promotion-recovery
          persist-credentials: true

      - name: Setup pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5.0.0
        with:
          version: 10.33.2

      - name: Setup Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 20.20.2
          cache: pnpm

      - name: Format exact changed sources
        shell: bash
        run: |
          set -euo pipefail
          pnpm install --frozen-lockfile
          pnpm exec oxfmt --write \
            apps/webapp/app/features/flowcordia/acceptance/beta-promotion-recovery.ts \
            apps/webapp/test/flowcordia/betaPromotionRecovery.test.ts \
            scripts/flowcordia-beta-promotion-recovery.ts
          if git diff --quiet; then
            exit 0
          fi
          git config user.name 'flowcordia-ci'
          git config user.email 'flowcordia-ci@users.noreply.github.com'
          git add \
            apps/webapp/app/features/flowcordia/acceptance/beta-promotion-recovery.ts \
            apps/webapp/test/flowcordia/betaPromotionRecovery.test.ts \
            scripts/flowcordia-beta-promotion-recovery.ts
          git commit -m 'Format Beta promotion recovery evidence'
          git push origin HEAD:agent/flowcordia-beta-promotion-recovery
