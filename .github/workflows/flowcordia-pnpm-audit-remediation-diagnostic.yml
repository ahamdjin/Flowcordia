name: Flowcordia temporary dependency remediation applicator

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/flowcordia-pnpm-audit-remediation-diagnostic.yml"

permissions: {}

jobs:
  apply:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
    steps:
      - name: Checkout exact remediation branch
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5.0.0
        with:
          version: 10.33.2

      - name: Setup Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 20.20.2
          cache: pnpm

      - name: Generate reviewed package resolution
        shell: bash
        run: |
          set -euo pipefail
          output="$RUNNER_TEMP/dependency-remediation"
          mkdir -p "$output"
          cp package.json "$output/package.before.json"
          cp pnpm-lock.yaml "$output/pnpm-lock.before.yaml"

          set +e
          pnpm audit --fix > "$output/pnpm-audit-fix.stdout" 2> "$output/pnpm-audit-fix.stderr"
          echo "$?" > "$output/pnpm-audit-fix.status"
          set -e

          node <<'NODE'
          const fs = require("node:fs");

          const root = JSON.parse(fs.readFileSync("package.json", "utf8"));
          const overrides = root.pnpm?.overrides ?? {};

          for (const [selector, requested] of Object.entries(overrides)) {
            if (typeof requested === "string" && requested.startsWith(">=")) {
              overrides[selector] = requested.slice(2);
            }
          }

          const resetPackages = [
            "vite",
            "react-router",
            "react-router-dom",
            "@fastify/static",
            "@hono/node-server",
            "file-type",
            "body-parser"
          ];
          for (const selector of Object.keys(overrides)) {
            if (resetPackages.some((name) => selector === name || selector.startsWith(`${name}@`))) {
              delete overrides[selector];
            }
          }
          delete overrides["brace-expansion@<=5.0.7"];

          Object.assign(overrides, {
            "vite@>=4 <7": "6.4.3",
            "webpack@>=5 <6": "5.104.1",
            "file-type@>=13 <22": "21.3.2",
            "body-parser@>=1 <2": "1.20.6",
            "body-parser@>=2 <3": "2.3.0",
            "dompurify@>=3 <4": "3.4.12",
            "fast-uri@>=3 <4": "3.1.4",
            "@hono/node-server@>=1 <3": "2.0.10",
            "@fastify/static@>=8 <11": "10.1.2",
            "@remix-run/router@<1.23.2": "1.23.2",
            "react-router@>=6 <7": "6.30.1",
            "react-router-dom@>=6 <7": "6.30.1"
          });

          root.pnpm.overrides = overrides;
          fs.writeFileSync("package.json", JSON.stringify(root, null, 2) + "\n");

          const webappPath = "apps/webapp/package.json";
          const webapp = JSON.parse(fs.readFileSync(webappPath, "utf8"));
          webapp.dependencies.dompurify = "3.4.12";
          for (const section of [webapp.dependencies, webapp.devDependencies]) {
            for (const name of Object.keys(section)) {
              if (name.startsWith("@remix-run/") && /\^?2\.17\.4/.test(section[name])) {
                section[name] = "2.17.5";
              }
            }
          }
          fs.writeFileSync(webappPath, JSON.stringify(webapp, null, 2) + "\n");

          const kubernetesPath = "apps/kubernetes-provider/package.json";
          const kubernetes = JSON.parse(fs.readFileSync(kubernetesPath, "utf8"));
          kubernetes.dependencies["@kubernetes/client-node"] = "1.4.0";
          fs.writeFileSync(kubernetesPath, JSON.stringify(kubernetes, null, 2) + "\n");
          NODE

          cat > osv-scanner.toml <<'TOML'
          [[IgnoredVulns]]
          id = "GHSA-866g-f22w-33x8"
          ignoreUntil = 2026-09-01
          reason = "No fixed provider-utils 1.x release exists; this occurrence is a development-only type/test dependency in packages/core. Re-evaluate during the AI SDK compatibility upgrade."

          [[IgnoredVulns]]
          id = "GHSA-mh99-v99m-4gvg"
          ignoreUntil = 2026-08-03
          reason = "Affected brace-expansion copies are build/test tooling. The fixed 5.0.8 release is temporarily held by the repository's 72-hour release-age policy; update immediately after the exception expires."

          [[IgnoredVulns]]
          id = "GHSA-2j2x-hqr9-3h42"
          ignoreUntil = 2026-09-01
          reason = "The affected react-router 6.x copy is reachable only through @remix-run/testing. The published remediation requires an incompatible router major; migrate with the Remix framework upgrade."

          [[IgnoredVulns]]
          id = "GHSA-337j-9hxr-rhxg"
          ignoreUntil = 2026-09-01
          reason = "The affected react-router 6.x copy is reachable only through @remix-run/testing. The published remediation requires an incompatible router major; migrate with the Remix framework upgrade."

          [[IgnoredVulns]]
          id = "GHSA-9jcx-v3wj-wh4m"
          ignoreUntil = 2026-09-01
          reason = "The affected react-router 6.x copy is reachable only through @remix-run/testing. The published remediation requires an incompatible router major; migrate with the Remix framework upgrade."

          [[IgnoredVulns]]
          id = "GHSA-wrjc-x8rr-h8h6"
          ignoreUntil = 2026-09-01
          reason = "The affected react-router 6.x copy is reachable only through @remix-run/testing. The published remediation requires an incompatible router major; migrate with the Remix framework upgrade."
          TOML

          pnpm install --lockfile-only --no-frozen-lockfile > "$output/pnpm-install.stdout" 2> "$output/pnpm-install.stderr"
          cp package.json "$output/package.after.json"
          cp pnpm-lock.yaml "$output/pnpm-lock.after.yaml"
          git diff --stat > "$output/diff-stat.txt"

      - name: Verify the remediated lockfile with OSV
        id: osv
        continue-on-error: true
        uses: google/osv-scanner-action/osv-scanner-action@9a498708959aeaef5ef730655706c5a1df1edbc2 # v2.3.8
        with:
          scan-args: |-
            --config=osv-scanner.toml
            --format=json
            --output=osv-results.json
            --lockfile=pnpm-lock.yaml

      - name: Preserve remediation diagnostics
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: flowcordia-dependency-remediation-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/dependency-remediation
            osv-results.json
          if-no-files-found: error
          retention-days: 2
          include-hidden-files: false

      - name: Refuse unresolved advisory findings
        if: steps.osv.outcome != 'success'
        shell: bash
        run: |
          echo "OSV still reports findings outside the bounded, expiring exceptions." >&2
          exit 1

      - name: Install and run focused compatibility checks
        shell: bash
        run: |
          set -euo pipefail
          pnpm install --frozen-lockfile
          pnpm --filter kubernetes-provider typecheck
          pnpm --filter webapp typecheck
          pnpm --filter @trigger.dev/core typecheck

      - name: Commit deterministic remediation and remove applicator
        shell: bash
        env:
          HEAD_BRANCH: ${{ github.event.pull_request.head.ref }}
        run: |
          set -euo pipefail
          rm .github/workflows/flowcordia-pnpm-audit-remediation-diagnostic.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json pnpm-lock.yaml apps/webapp/package.json apps/kubernetes-provider/package.json osv-scanner.toml .github/workflows/flowcordia-pnpm-audit-remediation-diagnostic.yml
          git commit -m "Remediate Beta dependency vulnerabilities"
          git push origin "HEAD:${HEAD_BRANCH}"
