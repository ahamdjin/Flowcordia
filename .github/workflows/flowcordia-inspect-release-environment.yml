name: Inspect Flowcordia release environment

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/flowcordia-inspect-release-environment.yml

permissions:
  deployments: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ github.token }}
      PUBLICATION_ENVIRONMENT: flowcordia-self-host-release
    steps:
      - name: Read environment protection
        shell: bash
        run: |
          set -euo pipefail
          gh api \
            --method GET \
            "repos/$GITHUB_REPOSITORY/environments/$PUBLICATION_ENVIRONMENT" \
            --jq '. | {name, can_admins_bypass, protection_rules}'
