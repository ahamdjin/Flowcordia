name: Verify Studio V2 Activepieces webapp integration

on:
  push:
    branches:
      - agent/studio-v2-activepieces-frontend
    paths:
      - .github/workflows/studio-v2-activepieces-webapp-verify.yml

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 80
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/studio-v2-activepieces-frontend
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.2
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Add build wiring
        shell: python
        run: |
          import json
          from pathlib import Path

          path = Path('apps/webapp/package.json')
          package = json.loads(path.read_text())
          command = (
              'pnpm --filter @flowcordia/studio-activepieces build && '
              'pnpm --filter @flowcordia/studio-activepieces copy:webapp'
          )
          package['scripts']['build:activepieces-studio'] = command
          package['scripts']['predev'] = command
          path.write_text(json.dumps(package, indent=2) + '\n')
      - name: Verify webapp boundary
        shell: bash
        run: |
          set +e
          set -o pipefail
          {
            set -euo pipefail
            pnpm install --no-frozen-lockfile --config.minimum-release-age=0
            pnpm --filter @flowcordia/studio-activepieces typecheck
            pnpm --filter @flowcordia/studio-activepieces test
            pnpm --filter @flowcordia/studio-activepieces build
            pnpm --filter @flowcordia/studio-activepieces copy:webapp
            test -f apps/webapp/public/flowcordia-studio-activepieces/index.html
            pnpm --filter webapp typecheck
            pnpm --filter webapp test -- --run test/flowcordia/studioV2PreviewRoute.test.ts
          } 2>&1 | tee /tmp/studio-v2-activepieces-webapp.log
          status=${PIPESTATUS[0]}

          rm -rf apps/webapp/public/flowcordia-studio-activepieces
          git config user.name "Flowcordia Studio Agent"
          git config user.email "actions@users.noreply.github.com"
          mkdir -p .flowcordia/automation
          if [ "$status" -eq 0 ]; then
            printf 'status: passed\nhead: %s\n' "$(git rev-parse HEAD)" > .flowcordia/automation/studio-v2-activepieces-webapp.txt
            git add apps/webapp/package.json pnpm-lock.yaml .flowcordia/automation/studio-v2-activepieces-webapp.txt
            git commit -m "Wire the Activepieces Studio into the Flowcordia webapp" || true
          else
            { printf 'status: failed\nhead: %s\n\n' "$(git rev-parse HEAD)"; tail -n 520 /tmp/studio-v2-activepieces-webapp.log; } > .flowcordia/automation/studio-v2-activepieces-webapp.txt
            git add .flowcordia/automation/studio-v2-activepieces-webapp.txt
            git commit -m "Record Activepieces Studio webapp failure" || true
          fi
          git pull --rebase origin agent/studio-v2-activepieces-frontend
          git push origin HEAD:agent/studio-v2-activepieces-frontend
          exit "$status"
