name: Temporary Flowcordia bundled formatting

on:
  push:
    branches:
      - agent/flowcordia-beta-bundled-execution

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout branch
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: agent/flowcordia-beta-bundled-execution
          persist-credentials: true

      - name: Setup pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5.0.0
        with:
          version: 10.33.2

      - name: Setup Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 20.20.2
          cache: pnpm

      - name: Apply exact formatter output
        run: |
          set -euo pipefail
          pnpm install --frozen-lockfile
          pnpm exec oxfmt \
            apps/webapp/app/features/flowcordia/acceptance/bundled-execution-contract.ts \
            apps/webapp/scripts/flowcordia-bundled-reference-bootstrap.ts \
            apps/webapp/test/flowcordia/bundledExecutionAcceptance.test.ts \
            flowcordia/testing/beta-reference/trigger.config.ts \
            flowcordia/testing/beta-reference/src/tasks.ts \
            scripts/flowcordia-bundled-execution-evidence.ts \
            scripts/flowcordia-bundled-reference-client.ts \
            .github/workflows/flowcordia-bundled-execution.yml \
            .github/workflows/flowcordia-bundled-execution-acceptance.yml \
            flowcordia/testing/bundled-execution-acceptance.md
          if git diff --quiet; then
            echo "Formatting already clean."
            exit 0
          fi
          git config user.name "flowcordia-ci"
          git config user.email "flowcordia-ci@users.noreply.github.com"
          git add \
            apps/webapp/app/features/flowcordia/acceptance/bundled-execution-contract.ts \
            apps/webapp/scripts/flowcordia-bundled-reference-bootstrap.ts \
            apps/webapp/test/flowcordia/bundledExecutionAcceptance.test.ts \
            flowcordia/testing/beta-reference/trigger.config.ts \
            flowcordia/testing/beta-reference/src/tasks.ts \
            scripts/flowcordia-bundled-execution-evidence.ts \
            scripts/flowcordia-bundled-reference-client.ts \
            .github/workflows/flowcordia-bundled-execution.yml \
            .github/workflows/flowcordia-bundled-execution-acceptance.yml \
            flowcordia/testing/bundled-execution-acceptance.md
          git commit -m "Format bundled execution acceptance"
          git push origin HEAD:agent/flowcordia-beta-bundled-execution
