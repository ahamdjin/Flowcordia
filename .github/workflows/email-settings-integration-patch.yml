name: Email settings integration patch

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.head_ref == 'agent/self-host-email-configuration'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ github.head_ref }}
          persist-credentials: true

      - name: Setup pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320
        with:
          version: 10.33.2

      - name: Setup Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: 20.20.2
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Integrate encrypted email status
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("apps/webapp/app/routes/_app.orgs.$organizationSlug.settings.flowcordia-setup/route.tsx")
          text = path.read_text()
          text = text.replace(
              '''import {
            getFlowcordiaSetupStatuses,
            isGeneralEmailPresent,
            type FlowcordiaSetupGroup,
            type FlowcordiaSetupState,
          } from "~/features/flowcordia/setup/configuration.server";''',
              '''import {
            getFlowcordiaSetupStatuses,
            type FlowcordiaSetupGroup,
            type FlowcordiaSetupState,
          } from "~/features/flowcordia/setup/configuration.server";
          import { getEmailConfigurationStatus } from "~/features/flowcordia/setup/emailConfiguration.server";'''
          )
          text = text.replace(
              '''  const githubApp = await getFlowcordiaGitHubAppConfigurationStatus();
            const organizationId = await resolveOrgIdFromSlug(orgSlug);''',
              '''  const [githubApp, generalEmail, alertEmail] = await Promise.all([
              getFlowcordiaGitHubAppConfigurationStatus(),
              getEmailConfigurationStatus("general"),
              getEmailConfigurationStatus("alert"),
            ]);
            const organizationId = await resolveOrgIdFromSlug(orgSlug);'''
          )
          text = text.replace(
              '''    githubAppConfigured: githubApp !== null,
            });''',
              '''    githubAppConfigured: githubApp !== null,
              generalEmailConfigured: generalEmail.state === "configured",
              alertEmailConfigured: alertEmail.state === "configured",
            });'''
          )
          text = text.replace(
              '''  if (!isGeneralEmailPresent(env)) {''',
              '''  const generalEmail = await getEmailConfigurationStatus("general");
            if (generalEmail.state !== "configured") {'''
          )
          text = text.replace(
              '''          message: "General email configuration is incomplete.",''',
              '''          message: generalEmail.message,'''
          )
          path.write_text(text)
          PY

          pnpm exec oxfmt 'apps/webapp/app/routes/_app.orgs.$organizationSlug.settings.flowcordia-setup/route.tsx'

      - name: Commit integration
        shell: bash
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "Flowcordia CI"
          git config user.email "flowcordia-ci@users.noreply.github.com"
          git add 'apps/webapp/app/routes/_app.orgs.$organizationSlug.settings.flowcordia-setup/route.tsx'
          git commit -m "Use encrypted email state in organization setup"
          git push origin HEAD:${{ github.head_ref }}
