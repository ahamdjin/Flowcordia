name: Agent format Studio layout files

on:
  pull_request:
    paths:
      - ".github/workflows/agent-format-studio-layout.yml"
      - "apps/webapp/app/features/flowcordia/workflows/studio/canvas-layout.test.ts"
      - "apps/webapp/test/flowcordia/workflowStudioEditingCapabilityEvidence.test.ts"

permissions:
  contents: write

concurrency:
  group: agent-format-studio-layout-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  format:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout exact branch head
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 1

      - name: Setup pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5.0.0
        with:
          version: 10.33.2

      - name: Setup Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 20.20.2
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Format exact files
        run: |
          pnpm exec oxfmt --write \
            apps/webapp/app/features/flowcordia/workflows/studio/canvas-layout.test.ts \
            apps/webapp/test/flowcordia/workflowStudioEditingCapabilityEvidence.test.ts
          pnpm exec oxfmt --check \
            apps/webapp/app/features/flowcordia/workflows/studio/canvas-layout.test.ts \
            apps/webapp/test/flowcordia/workflowStudioEditingCapabilityEvidence.test.ts

      - name: Run exact tests
        run: |
          pnpm --filter webapp exec vitest run \
            app/features/flowcordia/workflows/studio/canvas-layout.test.ts \
            test/flowcordia/workflowStudioEditingCapabilityEvidence.test.ts

      - name: Enforce two-file boundary
        shell: bash
        run: |
          git diff --check
          unexpected="$(git status --short | awk '{print $2}' | grep -Ev '^(apps/webapp/app/features/flowcordia/workflows/studio/canvas-layout.test.ts|apps/webapp/test/flowcordia/workflowStudioEditingCapabilityEvidence.test.ts)$' || true)"
          if [[ -n "$unexpected" ]]; then
            echo "Unexpected changed paths:"
            echo "$unexpected"
            exit 1
          fi

      - name: Publish formatted files
        shell: bash
        run: |
          git config user.name "flowcordia-studio-agent"
          git config user.email "flowcordia-studio-agent@users.noreply.github.com"
          git add \
            apps/webapp/app/features/flowcordia/workflows/studio/canvas-layout.test.ts \
            apps/webapp/test/flowcordia/workflowStudioEditingCapabilityEvidence.test.ts
          if git diff --cached --quiet; then
            echo "Studio layout files are already formatted."
            exit 0
          fi
          git commit -m "Format Studio automatic layout contracts"
          git push origin HEAD:${{ github.head_ref }}
