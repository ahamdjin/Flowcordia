name: Platform readiness formatter

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  format:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.head_ref == 'agent/self-host-platform-readiness'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ github.head_ref }}
          persist-credentials: true

      - name: Setup pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320
        with:
          version: 10.33.2

      - name: Setup Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: 20.20.2
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Format readiness files
        run: |
          pnpm exec oxfmt \
            apps/webapp/app/features/flowcordia/setup/platformReadiness.server.ts \
            apps/webapp/app/routes/setup/route.tsx \
            apps/webapp/test/platformReadiness.server.test.ts

      - name: Commit formatter output
        shell: bash
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "Flowcordia CI"
          git config user.email "flowcordia-ci@users.noreply.github.com"
          git add \
            apps/webapp/app/features/flowcordia/setup/platformReadiness.server.ts \
            apps/webapp/app/routes/setup/route.tsx \
            apps/webapp/test/platformReadiness.server.test.ts
          git commit -m "Format platform readiness checks"
          git push origin HEAD:${{ github.head_ref }}
