name: Flowcordia temporary Turbo compatibility repair

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/flowcordia-turbo-compatibility-repair.yml"

permissions: {}

jobs:
  repair:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write
    steps:
      - name: Checkout exact repair branch
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5.0.0
        with:
          version: 10.33.2

      - name: Setup Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 20.20.2
          cache: pnpm

      - name: Remove unsafe Turbo major overrides
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require("node:fs");
          const root = JSON.parse(fs.readFileSync("package.json", "utf8"));
          const overrides = root.pnpm?.overrides ?? {};
          const removed = [];
          for (const selector of Object.keys(overrides)) {
            if (selector === "turbo" || selector.startsWith("turbo@")) {
              removed.push(`${selector} -> ${overrides[selector]}`);
              delete overrides[selector];
            }
          }
          if (removed.length === 0) throw new Error("Expected at least one unsafe Turbo major override.");
          if (!/^\^?1\.\d+\.\d+$/.test(root.devDependencies?.turbo ?? "")) {
            throw new Error(`Expected a Turbo 1.x direct selection, found ${root.devDependencies?.turbo}`);
          }
          root.pnpm.overrides = overrides;
          fs.writeFileSync("package.json", JSON.stringify(root, null, 2) + "\n");
          console.log(`Removed ${removed.join(", ")}`);
          NODE
          pnpm install --lockfile-only --no-frozen-lockfile

      - name: Prove Turbo 1 configuration compatibility
        run: pnpm generate

      - name: Verify exception-aware lockfile
        id: scan
        continue-on-error: true
        uses: google/osv-scanner-action/osv-scanner-action@9a498708959aeaef5ef730655706c5a1df1edbc2 # v2.3.8
        with:
          scan-args: |-
            --config=osv-scanner.toml
            --format=json
            --output=osv-turbo-repair.json
            --lockfile=pnpm-lock.yaml

      - name: Refuse findings outside reviewed exceptions
        if: steps.scan.outcome != 'success'
        run: |
          echo "Removing the Turbo major override introduced an unreviewed OSV finding." >&2
          exit 1

      - name: Commit repair and remove diagnostics
        shell: bash
        env:
          HEAD_BRANCH: ${{ github.event.pull_request.head.ref }}
        run: |
          set -euo pipefail
          rm .github/workflows/flowcordia-turbo-compatibility-repair.yml
          rm -f .github/workflows/flowcordia-prisma-generation-diagnostic.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json pnpm-lock.yaml .github/workflows/flowcordia-turbo-compatibility-repair.yml .github/workflows/flowcordia-prisma-generation-diagnostic.yml
          git commit -m "Restore compatible Turbo 1 toolchain"
          git push origin "HEAD:${HEAD_BRANCH}"
