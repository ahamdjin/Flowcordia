name: GitHub onboarding repair

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  repair:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.head_ref == 'agent/self-host-github-onboarding'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout onboarding branch
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: agent/self-host-github-onboarding

      - name: Setup pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320
        with:
          version: 10.33.2

      - name: Setup Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: 20.20.2
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Apply and verify onboarding repairs
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path("apps/webapp/app/features/flowcordia/setup/githubOnboarding.server.ts")
          content = path.read_text()
          old_identity = '''    const response = await app.octokit.rest.apps.getAuthenticated();
              if (response.data.id !== configuration.appId || response.data.slug !== configuration.slug) {
                return "invalid";
              }
          '''
          new_identity = '''    const response = await app.octokit.rest.apps.getAuthenticated();
              const identity = response.data;
              if (!identity || identity.id !== configuration.appId || identity.slug !== configuration.slug) {
                return "invalid";
              }
          '''
          if old_identity not in content:
              raise SystemExit("GitHub identity probe pattern changed")
          content = content.replace(old_identity, new_identity, 1)

          old_readiness = "  if (connectedRepository) {\n    try {"
          new_readiness = "  if (connectedRepository?.productionBranch) {\n    try {"
          if old_readiness not in content:
              raise SystemExit("Repository readiness guard pattern changed")
          content = content.replace(old_readiness, new_readiness, 1)
          path.write_text(content)
          PY

          pnpm exec oxfmt --write \
            apps/webapp/app/features/flowcordia/setup/githubOnboarding.server.ts
          pnpm --filter webapp exec tsc --noEmit -p ./tsconfig.check.json

          git rm .github/workflows/github-onboarding-repair.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/webapp/app/features/flowcordia/setup/githubOnboarding.server.ts
          git commit -m "Repair GitHub onboarding readiness contracts"
          git push origin HEAD:agent/self-host-github-onboarding
