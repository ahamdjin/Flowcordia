name: Email schema repair

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  repair:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.head_ref == 'agent/self-host-email-configuration'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ github.head_ref }}
          persist-credentials: true

      - name: Setup pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320
        with:
          version: 10.33.2

      - name: Setup Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: 20.20.2
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Repair discriminated union validation
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path("apps/webapp/app/features/flowcordia/setup/emailConfiguration.server.ts")
          text = path.read_text()
          old = '''const SmtpConfigurationSchema = BaseEmailConfigurationSchema.extend({
            transport: z.literal("smtp"),
            host: NonEmptyString.max(255, "SMTP host is too long."),
            port: z.coerce.number().int().min(1).max(65535),
            secure: BooleanInputSchema,
            user: EmptyToUndefined.pipe(z.string().max(512, "SMTP username is too long.").optional()),
            password: EmptyToUndefined.pipe(z.string().max(4096, "SMTP password is too long.").optional()),
          }).superRefine((value, context) => {
            if (Boolean(value.user) !== Boolean(value.password)) {
              const path = value.user ? ["password"] : ["user"];
              context.addIssue({
                code: z.ZodIssueCode.custom,
                path,
                message: "SMTP username and password must be provided together.",
              });
            }
          });'''
          new = '''const SmtpConfigurationSchema = BaseEmailConfigurationSchema.extend({
            transport: z.literal("smtp"),
            host: NonEmptyString.max(255, "SMTP host is too long."),
            port: z.coerce.number().int().min(1).max(65535),
            secure: BooleanInputSchema,
            user: EmptyToUndefined.pipe(z.string().max(512, "SMTP username is too long.").optional()),
            password: EmptyToUndefined.pipe(z.string().max(4096, "SMTP password is too long.").optional()),
          });'''
          if old not in text:
              raise SystemExit("SMTP schema block not found")
          text = text.replace(old, new)

          old_union = '''export const FlowcordiaEmailConfigurationInputSchema = z.discriminatedUnion("transport", [
            SmtpConfigurationSchema,
            ResendConfigurationSchema,
            AwsSesConfigurationSchema,
          ]);'''
          new_union = '''export const FlowcordiaEmailConfigurationInputSchema = z
            .discriminatedUnion("transport", [
              SmtpConfigurationSchema,
              ResendConfigurationSchema,
              AwsSesConfigurationSchema,
            ])
            .superRefine((value, context) => {
              if (
                value.transport === "smtp" &&
                Boolean(value.user) !== Boolean(value.password)
              ) {
                context.addIssue({
                  code: z.ZodIssueCode.custom,
                  path: value.user ? ["password"] : ["user"],
                  message: "SMTP username and password must be provided together.",
                });
              }
            });'''
          if old_union not in text:
              raise SystemExit("Email discriminated union block not found")
          path.write_text(text.replace(old_union, new_union))
          PY

          pnpm exec oxfmt apps/webapp/app/features/flowcordia/setup/emailConfiguration.server.ts
          rm -f .agent/email-e2e-failure.md
          rm -f .github/workflows/email-e2e-log-tail.yml

      - name: Commit repair and cleanup
        shell: bash
        run: |
          git config user.name "Flowcordia CI"
          git config user.email "flowcordia-ci@users.noreply.github.com"
          git add -A \
            apps/webapp/app/features/flowcordia/setup/emailConfiguration.server.ts \
            .agent/email-e2e-failure.md \
            .github/workflows/email-e2e-log-tail.yml
          git commit -m "Fix email configuration schema construction"
          git push origin HEAD:${{ github.head_ref }}
