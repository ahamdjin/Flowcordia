name: Studio V2 PR 201 formatter

on:
  push:
    branches:
      - agent/studio-v2-activepieces-backend-adapters

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: agent/studio-v2-activepieces-backend-adapters
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320
        with:
          version: 10.33.2
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: 20.20.2
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Format owned files
        run: |
          pnpm exec oxfmt \
            apps/flowcordia-studio-activepieces/src/activepieces-api-backend.test.ts \
            apps/flowcordia-studio-activepieces/src/activepieces-api.ts \
            apps/webapp/app/features/flowcordia/workflows/studio-v2/activepieces-api.server.ts
      - name: Commit formatter output
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            apps/flowcordia-studio-activepieces/src/activepieces-api-backend.test.ts \
            apps/flowcordia-studio-activepieces/src/activepieces-api.ts \
            apps/webapp/app/features/flowcordia/workflows/studio-v2/activepieces-api.server.ts
          git commit -m "style(studio-v2): match repository formatter"
          git push origin HEAD:agent/studio-v2-activepieces-backend-adapters
