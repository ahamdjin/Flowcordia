name: Flowcordia connected campaign contract

on:
  pull_request:
    paths:
      - ".github/workflows/flowcordia-bundled-clean-install.yml"
      - ".github/workflows/flowcordia-bundled-self-host.yml"
      - ".github/workflows/flowcordia-connected-campaign-contract.yml"
      - ".github/workflows/flowcordia-connected-release-campaign.yml"
      - ".github/workflows/flowcordia-production-identity.yml"
      - "apps/webapp/app/features/flowcordia/acceptance/production-identity-contract.ts"
      - "apps/webapp/app/features/flowcordia/operations/bundled-release.ts"
      - "apps/webapp/app/features/flowcordia/operations/bundled-self-host-topology.ts"
      - "apps/webapp/test/flowcordia/bundledImmutableSource.test.ts"
      - "apps/webapp/test/flowcordia/bundledRelease.test.ts"
      - "apps/webapp/test/flowcordia/bundledSelfHostTopology.test.ts"
      - "apps/webapp/test/flowcordia/productionIdentityContract.test.ts"
      - "docker/flowcordia-bundled.env.example"
      - "docker/flowcordia-bundled-immutable.yml"
      - "docker/scripts/flowcordia-bundled.sh"
      - "playwright.flowcordia-production-identity.config.ts"
      - "scripts/flowcordia-bundled-release.ts"
      - "scripts/flowcordia-bundled-validate.ts"
      - "scripts/flowcordia-connected-release-campaign.mjs"
      - "scripts/flowcordia-connected-release-campaign.test.mjs"
      - "tests/flowcordia-connected/production-identity.connected.spec.ts"
  push:
    paths:
      - ".github/workflows/flowcordia-bundled-clean-install.yml"
      - ".github/workflows/flowcordia-connected-campaign-contract.yml"
      - ".github/workflows/flowcordia-connected-release-campaign.yml"
      - ".github/workflows/flowcordia-production-identity.yml"
      - "apps/webapp/app/features/flowcordia/acceptance/production-identity-contract.ts"
      - "apps/webapp/app/features/flowcordia/operations/bundled-release.ts"
      - "apps/webapp/test/flowcordia/bundledImmutableSource.test.ts"
      - "apps/webapp/test/flowcordia/bundledRelease.test.ts"
      - "apps/webapp/test/flowcordia/productionIdentityContract.test.ts"
      - "docker/flowcordia-bundled-immutable.yml"
      - "playwright.flowcordia-production-identity.config.ts"
      - "scripts/flowcordia-bundled-release.ts"
      - "scripts/flowcordia-connected-release-campaign.mjs"
      - "scripts/flowcordia-connected-release-campaign.test.mjs"
      - "tests/flowcordia-connected/production-identity.connected.spec.ts"

permissions: {}

concurrency:
  group: flowcordia-connected-campaign-contract-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    permissions:
      contents: read
    steps:
      - name: Checkout exact revision
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 1

      - name: Setup pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320
        with:
          version: 10.33.2

      - name: Setup Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: 20.20.2
          cache: pnpm

      - name: Install and generate
        run: |
          pnpm install --frozen-lockfile
          pnpm --filter @trigger.dev/database generate

      - name: Validate controller syntax and contract
        run: |
          node --check scripts/flowcordia-connected-release-campaign.mjs
          node --test scripts/flowcordia-connected-release-campaign.test.mjs

      - name: Validate focused TypeScript contracts
        run: |
          pnpm --filter webapp exec vitest run \
            test/flowcordia/bundledRelease.test.ts \
            test/flowcordia/bundledImmutableSource.test.ts \
            test/flowcordia/bundledSelfHostTopology.test.ts \
            test/flowcordia/productionIdentityContract.test.ts

      - name: Discover isolated browser proof
        run: pnpm exec playwright test --config=playwright.flowcordia-production-identity.config.ts --list

      - name: Check exact changed-source formatting
        run: |
          pnpm exec oxfmt --check \
            apps/webapp/app/features/flowcordia/acceptance/production-identity-contract.ts \
            apps/webapp/app/features/flowcordia/operations/bundled-release.ts \
            apps/webapp/test/flowcordia/bundledImmutableSource.test.ts \
            apps/webapp/test/flowcordia/bundledRelease.test.ts \
            apps/webapp/test/flowcordia/productionIdentityContract.test.ts \
            playwright.flowcordia-production-identity.config.ts \
            scripts/flowcordia-bundled-release.ts \
            scripts/flowcordia-connected-release-campaign.mjs \
            scripts/flowcordia-connected-release-campaign.test.mjs \
            tests/flowcordia-connected/production-identity.connected.spec.ts
