name: Diagnose Flowcordia Turbo 2 formatting

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/flowcordia-turbo2-format-diagnostic.yml"

permissions: {}

jobs:
  format:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Checkout exact pull request head
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5.0.0
        with:
          version: 10.33.2

      - name: Setup Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 20.20.2
          cache: pnpm

      - name: Install exact dependency graph
        run: pnpm install --frozen-lockfile

      - name: Capture exact formatter output
        id: check
        continue-on-error: true
        shell: bash
        run: pnpm exec oxfmt --check . 2>&1 | tee oxfmt-check.log

      - name: Format the reviewed PR file boundary
        shell: bash
        run: |
          set -euo pipefail
          pnpm exec oxfmt \
            package.json \
            turbo.json \
            osv-scanner.toml \
            pnpm-lock.yaml \
            flowcordia/security/dependency-remediation.md \
            .github/workflows/flowcordia-dependency-remediation-checks.yml
          git diff --name-only | sort | tee oxfmt-changed-files.log
          git diff --check

      - name: Stage formatted files
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p formatted/.github/workflows
          mkdir -p formatted/flowcordia/security
          cp package.json formatted/package.json
          cp turbo.json formatted/turbo.json
          cp osv-scanner.toml formatted/osv-scanner.toml
          cp pnpm-lock.yaml formatted/pnpm-lock.yaml
          cp flowcordia/security/dependency-remediation.md \
            formatted/flowcordia/security/dependency-remediation.md
          cp .github/workflows/flowcordia-dependency-remediation-checks.yml \
            formatted/.github/workflows/flowcordia-dependency-remediation-checks.yml
          cp oxfmt-check.log formatted/oxfmt-check.log
          cp oxfmt-changed-files.log formatted/oxfmt-changed-files.log

      - name: Preserve formatter result
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: flowcordia-turbo2-format-${{ github.run_id }}-${{ github.run_attempt }}
          path: formatted
          if-no-files-found: error
          retention-days: 7
          include-hidden-files: true

      - name: Enforce diagnostic detected a formatter mismatch
        env:
          CHECK_OUTCOME: ${{ steps.check.outcome }}
        run: test "$CHECK_OUTCOME" = "failure"
