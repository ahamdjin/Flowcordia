name: Temporary Flowcordia bundled fixture relocation

on:
  push:
    branches:
      - agent/flowcordia-beta-bundled-execution

permissions:
  contents: write

jobs:
  relocate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout branch
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: agent/flowcordia-beta-bundled-execution
          persist-credentials: true

      - name: Bind the fixture to the SDK workspace
        shell: bash
        run: |
          set -euo pipefail
          old='flowcordia/testing/beta-reference'
          new='packages/trigger-sdk/test/flowcordia-beta-reference'
          grep -q "$old" scripts/flowcordia-bundled-execution-run.sh
          grep -q "$old" .github/workflows/flowcordia-bundled-execution.yml
          sed -i "s#${old}#${new}#g" \
            scripts/flowcordia-bundled-execution-run.sh \
            .github/workflows/flowcordia-bundled-execution.yml
          ! grep -q "$old" scripts/flowcordia-bundled-execution-run.sh
          ! grep -q "$old" .github/workflows/flowcordia-bundled-execution.yml
          git config user.name flowcordia-ci
          git config user.email flowcordia-ci@users.noreply.github.com
          git add scripts/flowcordia-bundled-execution-run.sh .github/workflows/flowcordia-bundled-execution.yml
          git commit -m "Relocate bundled reference fixture"
          git push origin HEAD:agent/flowcordia-beta-bundled-execution
