name: Temporary Flowcordia approval escalation v4

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
    paths:
      - ".github/workflows/temporary-flowcordia-approval-escalation-v4.yml"
      - "scripts/flowcordia_prepare_approval_escalation_v4.py"
      - "scripts/flowcordia_apply_approval_escalation.b64part*"
      - "flowcordia/testing/approval-escalation-applied.marker"

permissions: {}

concurrency:
  group: temporary-flowcordia-approval-escalation-v4-${{ github.event.pull_request.head.sha }}
  cancel-in-progress: true

jobs:
  apply:
    if: github.head_ref == 'agent/flowcordia-approval-escalation'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write
    steps:
      - name: Checkout exact pull-request head
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: true
          fetch-depth: 1

      - name: Detect completed integration
        id: integration
        shell: bash
        run: |
          if [ -f flowcordia/testing/approval-escalation-applied.marker ]; then
            echo "needed=false" >> "$GITHUB_OUTPUT"
          else
            echo "needed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup pnpm
        if: steps.integration.outputs.needed == 'true'
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5.0.0
        with:
          version: 10.33.2

      - name: Setup Node
        if: steps.integration.outputs.needed == 'true'
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 20.20.2
          cache: pnpm

      - name: Install dependencies
        if: steps.integration.outputs.needed == 'true'
        run: pnpm install --frozen-lockfile

      - name: Apply exact current-main patch
        id: patch
        if: steps.integration.outputs.needed == 'true'
        continue-on-error: true
        shell: bash
        run: |
          set +e
          python3 scripts/flowcordia_prepare_approval_escalation_v4.py \
            > /tmp/flowcordia-approval-escalation-v4.log 2>&1
          status=$?
          mkdir -p flowcordia/testing
          tail -n 100 /tmp/flowcordia-approval-escalation-v4.log \
            > flowcordia/testing/approval-escalation-patch-diagnostic.txt
          exit "$status"

      - name: Upload bounded patch diagnostic
        if: steps.integration.outputs.needed == 'true' && steps.patch.outcome == 'failure'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v6.0.0
        with:
          name: flowcordia-approval-escalation-v4-diagnostic-${{ github.run_id }}
          path: flowcordia/testing/approval-escalation-patch-diagnostic.txt
          if-no-files-found: error
          retention-days: 1

      - name: Stop after patch failure
        if: steps.integration.outputs.needed == 'true' && steps.patch.outcome == 'failure'
        run: exit 1

      - name: Format exact changed sources
        if: steps.integration.outputs.needed == 'true'
        run: |
          pnpm exec oxfmt --write \
            packages/flowcordia-workflow/src/approval.ts \
            packages/flowcordia-workflow/src/catalog.ts \
            packages/flowcordia-workflow/test/approval.test.ts \
            packages/flowcordia-runtime/src/compiler.ts \
            packages/flowcordia-runtime/test/approval-runtime.test.ts \
            apps/webapp/app/features/flowcordia/workflows/studio/node-configuration.ts \
            apps/webapp/app/features/flowcordia/workflows/studio/WorkflowStudioNodeConfigurationEditor.tsx \
            apps/webapp/app/features/flowcordia/workflows/approval/contract.ts \
            apps/webapp/app/features/flowcordia/workflows/approval/repository.server.ts \
            apps/webapp/app/features/flowcordia/workflows/approval/WorkflowApprovalInboxPanel.tsx \
            apps/webapp/test/flowcordia/approvalInboxPresentation.test.ts \
            apps/webapp/test/flowcordia/workflowStudioApprovalEscalation.test.ts

      - name: Run focused approval contracts
        if: steps.integration.outputs.needed == 'true'
        run: |
          pnpm --filter @flowcordia/workflow exec vitest run test/approval.test.ts
          pnpm --filter @flowcordia/workflow build
          pnpm --filter @flowcordia/runtime exec vitest run test/approval-runtime.test.ts
          pnpm --filter webapp exec vitest run \
            test/flowcordia/approvalInboxPresentation.test.ts \
            test/flowcordia/workflowStudioApprovalEscalation.test.ts
          pnpm --filter @flowcordia/workflow typecheck
          pnpm --filter @flowcordia/runtime typecheck
          git diff --check

      - name: Commit tested permanent sources
        if: steps.integration.outputs.needed == 'true'
        shell: bash
        run: |
          set -euo pipefail
          rm -f flowcordia/testing/approval-escalation-patch-diagnostic.txt
          cat > flowcordia/testing/approval-escalation-applied.marker <<'EOF'
          focused-contracts=passed
          EOF
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            packages/flowcordia-workflow/src/approval.ts \
            packages/flowcordia-workflow/src/catalog.ts \
            packages/flowcordia-workflow/test/approval.test.ts \
            packages/flowcordia-runtime/src/compiler.ts \
            packages/flowcordia-runtime/test/approval-runtime.test.ts \
            apps/webapp/app/features/flowcordia/workflows/studio/node-configuration.ts \
            apps/webapp/app/features/flowcordia/workflows/studio/WorkflowStudioNodeConfigurationEditor.tsx \
            apps/webapp/app/features/flowcordia/workflows/approval/contract.ts \
            apps/webapp/app/features/flowcordia/workflows/approval/repository.server.ts \
            apps/webapp/app/features/flowcordia/workflows/approval/WorkflowApprovalInboxPanel.tsx \
            apps/webapp/test/flowcordia/approvalInboxPresentation.test.ts \
            apps/webapp/test/flowcordia/workflowStudioApprovalEscalation.test.ts \
            flowcordia/product/capability-matrix.md \
            flowcordia/testing/approval-reminder-escalation.md \
            flowcordia/testing/approval-escalation-applied.marker
          if git diff --cached --name-only | grep -Eq '^(\.github/workflows/|scripts/)'; then
            echo 'Temporary integration machinery entered the product commit.' >&2
            exit 1
          fi
          git diff --cached --check
          git commit -m "Add durable approval reminder and escalation state"
          git push origin HEAD:refs/heads/agent/flowcordia-approval-escalation
