name: Flowcordia dispatch RC2 publication

on:
  push:
    branches:
      - release/dispatch-rc2
    paths:
      - .github/workflows/flowcordia-dispatch-rc2.yml
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/flowcordia-dispatch-rc2.yml

permissions: {}

concurrency:
  group: flowcordia-dispatch-rc2-publication
  cancel-in-progress: false

jobs:
  dispatch:
    if: github.repository == 'ahamdjin/Flowcordia'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      actions: write
      contents: read
    env:
      GH_TOKEN: ${{ github.token }}
      EXPECTED_MAIN_SHA: 620c002b70370e3a0de1c4e8a75ce64f4e815ee0
      RELEASE_ID: flowcordia-0.1.0-rc.2
      RELEASE_VERSION: 0.1.0-rc.2
      FIRST_FLOWCORDIA_COMMIT: e9d87c27ddd74d72677d7fa68098d43319cf668d
      PUBLICATION_WORKFLOW: flowcordia-publish-self-host-image.yml
    steps:
      - name: Checkout dispatch branch
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Dispatch protected RC2 publisher
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main --no-tags
          main_sha="$(git rev-parse origin/main)"
          [[ "$main_sha" == "$EXPECTED_MAIN_SHA" ]] || {
            echo "Main moved from the reviewed RC2 candidate." >&2
            exit 1
          }
          upstream_sha="$(git rev-parse "$FIRST_FLOWCORDIA_COMMIT^")"
          [[ "$upstream_sha" =~ ^[0-9a-f]{40}$ ]] || exit 1
          existing_count="$(
            gh api \
              --method GET \
              "repos/$GITHUB_REPOSITORY/actions/workflows/$PUBLICATION_WORKFLOW/runs" \
              -f event=workflow_dispatch \
              -f branch=main \
              -f head_sha="$main_sha" \
              -f per_page=1 \
              --jq '.total_count'
          )"
          if (( existing_count > 0 )); then
            echo "An exact-main publication run already exists for $main_sha."
            exit 0
          fi
          gh api \
            --method POST \
            "repos/$GITHUB_REPOSITORY/actions/workflows/$PUBLICATION_WORKFLOW/dispatches" \
            -f ref=main \
            -f "inputs[release_id]=$RELEASE_ID" \
            -f "inputs[version]=$RELEASE_VERSION" \
            -f "inputs[upstream_commit_sha]=$upstream_sha"
          echo "Protected RC2 publication dispatched for $main_sha."
