name: Flowcordia dependency remediation checks

on:
  pull_request:
    branches: [main]
    paths:
      - "package.json"
      - "turbo.json"
      - "pnpm-lock.yaml"
      - "osv-scanner.toml"
      - "apps/webapp/package.json"
      - "apps/kubernetes-provider/package.json"
      - "apps/kubernetes-provider/src/**"
      - ".github/workflows/osv-scanner.yml"
      - ".github/workflows/unit-tests-webapp.yml"
      - ".github/workflows/flowcordia-dependency-remediation-checks.yml"
      - "flowcordia/security/dependency-remediation.md"
  push:
    branches: [main]
    paths:
      - "package.json"
      - "turbo.json"
      - "pnpm-lock.yaml"
      - "osv-scanner.toml"
      - "apps/webapp/package.json"
      - "apps/kubernetes-provider/package.json"
      - "apps/kubernetes-provider/src/**"
      - ".github/workflows/osv-scanner.yml"
      - ".github/workflows/unit-tests-webapp.yml"
      - ".github/workflows/flowcordia-dependency-remediation-checks.yml"
      - "flowcordia/security/dependency-remediation.md"

permissions: {}

jobs:
  policy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Checkout exact revision
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Validate bounded OSV exceptions and fixed selections
        shell: bash
        run: |
          set -euo pipefail
          python <<'PY'
          import datetime as dt
          import json
          import re
          import tomllib
          from pathlib import Path

          expected_ids = {
              "GHSA-866g-f22w-33x8",
              "GHSA-2j2x-hqr9-3h42",
              "GHSA-337j-9hxr-rhxg",
              "GHSA-9jcx-v3wj-wh4m",
              "GHSA-wrjc-x8rr-h8h6",
              "GHSA-8988-4f7v-96qf",
          }
          config = tomllib.loads(Path("osv-scanner.toml").read_text())
          if "PackageOverrides" in config:
              raise SystemExit("PackageOverrides are prohibited; exceptions must identify exact advisories.")
          entries = config.get("IgnoredVulns")
          if not isinstance(entries, list):
              raise SystemExit("osv-scanner.toml must contain [[IgnoredVulns]] entries.")
          ids = [entry.get("id") for entry in entries]
          if len(ids) != len(set(ids)):
              raise SystemExit("Duplicate OSV exception IDs are prohibited.")
          if set(ids) != expected_ids:
              raise SystemExit(f"Unexpected OSV exception set: {sorted(set(ids) ^ expected_ids)}")

          today = dt.datetime.now(dt.timezone.utc).date()
          for entry in entries:
              advisory = entry["id"]
              if not re.fullmatch(r"GHSA-[a-z0-9]{4}-[a-z0-9]{4}-[a-z0-9]{4}", advisory):
                  raise SystemExit(f"Invalid advisory ID: {advisory}")
              expiry = entry.get("ignoreUntil")
              if not isinstance(expiry, dt.date):
                  raise SystemExit(f"{advisory} must use a TOML date for ignoreUntil.")
              remaining = (expiry - today).days
              if remaining < 0:
                  raise SystemExit(f"{advisory} exception expired on {expiry}.")
              if remaining > 90:
                  raise SystemExit(f"{advisory} exception exceeds the 90-day maximum.")
              reason = entry.get("reason")
              if not isinstance(reason, str) or len(reason.strip()) < 80:
                  raise SystemExit(f"{advisory} requires a specific reason of at least 80 characters.")

          root = json.loads(Path("package.json").read_text())
          overrides = root.get("pnpm", {}).get("overrides", {})
          required_overrides = {
              "express@^4>body-parser": "1.20.6",
              "vite@>=4 <7": "6.4.3",
              "webpack@>=5 <6": "5.104.1",
              "file-type@>=13 <22": "21.3.2",
              "dompurify@>=3 <4": "3.4.13",
              "fast-uri@>=3 <4": "3.1.5",
              "@hono/node-server@>=1 <3": "2.0.10",
              "@fastify/static@>=8 <11": "10.1.2",
              "@remix-run/router@<1.23.2": "1.23.2",
              "brace-expansion@<1.1.18": "1.1.18",
              "brace-expansion@>=2 <2.1.4": "2.1.4",
              "brace-expansion@>=3 <5.0.9": "5.0.9",
              "hono@>=4 <5": "4.12.34",
              "ip-address@>=10 <11": "10.3.1",
              "js-yaml@>=3 <4": "3.15.1",
              "js-yaml@>=4 <5": "4.3.1",
              "mermaid@>=11 <12": "11.16.1",
              "nanoid@>=3 <4": "3.3.17",
              "nanoid@>=5 <6": "5.1.16",
              "postcss@>=8 <9": "8.5.23",
              "socket.io-parser@>=4 <5": "4.2.7",
              "undici@>=6 <7": "6.28.0",
              "undici@>=7 <8": "7.29.0",
          }
          for selector, version in required_overrides.items():
              if overrides.get(selector) != version:
                  raise SystemExit(f"Missing fixed override {selector} -> {version}")

          forbidden_turbo_overrides = [
              selector for selector in overrides if selector == "turbo" or selector.startswith("turbo@")
          ]
          if forbidden_turbo_overrides:
              raise SystemExit(
                  "Turbo overrides are prohibited; select the reviewed direct version instead: "
                  f"{forbidden_turbo_overrides}"
              )
          turbo_version = root.get("devDependencies", {}).get("turbo", "")
          if turbo_version != "2.10.6":
              raise SystemExit(f"Turbo must use the reviewed 2.10.6 release: {turbo_version}")

          turbo_config = json.loads(Path("turbo.json").read_text())
          if turbo_config.get("$schema") != "https://turbo.build/schema.json":
              raise SystemExit("turbo.json must use the Turbo 2 schema.")
          if "pipeline" in turbo_config:
              raise SystemExit("The removed Turbo 1 pipeline key is prohibited.")
          tasks = turbo_config.get("tasks")
          if not isinstance(tasks, dict):
              raise SystemExit("turbo.json must contain a Turbo 2 tasks object.")
          required_tasks = {"build", "generate", "test", "typecheck", "check-exports"}
          missing_tasks = sorted(required_tasks - set(tasks))
          if missing_tasks:
              raise SystemExit(f"Turbo 2 task graph is missing required tasks: {missing_tasks}")

          global_env = turbo_config.get("globalEnv")
          if not isinstance(global_env, list):
              raise SystemExit("turbo.json must contain a globalEnv list.")
          required_test_env = {
              "DATABASE_URL",
              "DIRECT_URL",
              "SESSION_SECRET",
              "MAGIC_LINK_SECRET",
              "ENCRYPTION_KEY",
              "DEPLOY_REGISTRY_HOST",
              "V4_DEPLOY_REGISTRY_HOST",
              "CLICKHOUSE_URL",
          }
          missing_test_env = sorted(required_test_env - set(global_env))
          if missing_test_env:
              raise SystemExit(
                  "Turbo 2 strict environment mode would drop required webapp test variables: "
                  f"{missing_test_env}"
              )

          webapp_unit_workflow = Path(".github/workflows/unit-tests-webapp.yml").read_text()
          required_unit_fixtures = {
              '          ENCRYPTION_KEY: "dummy-encryption-keeeey-32-bytes"',
              '          DEPLOY_REGISTRY_HOST: "docker.io"',
              '          V4_DEPLOY_REGISTRY_HOST: "docker.io"',
              '          CLICKHOUSE_URL: "http://default:password@localhost:8123"',
          }
          missing_unit_fixtures = sorted(
              fixture for fixture in required_unit_fixtures if fixture not in webapp_unit_workflow
          )
          if missing_unit_fixtures:
              raise SystemExit(
                  "The webapp unit-test workflow is missing required non-secret fixtures: "
                  f"{missing_unit_fixtures}"
              )

          forbidden_otel_overrides = [
              selector
              for selector in overrides
              if selector == "@opentelemetry/core" or selector.startswith("@opentelemetry/core@")
          ]
          if forbidden_otel_overrides:
              raise SystemExit(
                  "OpenTelemetry core major overrides are prohibited because stable package families must remain aligned: "
                  f"{forbidden_otel_overrides}"
              )

          webapp = json.loads(Path("apps/webapp/package.json").read_text())
          if webapp["dependencies"].get("dompurify") != "3.4.13":
              raise SystemExit("The webapp must select dompurify 3.4.13.")
          for section_name in ("dependencies", "devDependencies"):
              for name, version in webapp.get(section_name, {}).items():
                  if name.startswith("@remix-run/") and version == "2.17.4":
                      raise SystemExit(f"Stale Remix selection remains: {name}@{version}")

          kubernetes = json.loads(Path("apps/kubernetes-provider/package.json").read_text())
          if kubernetes["dependencies"].get("@kubernetes/client-node") != "1.4.0":
              raise SystemExit("The Kubernetes provider must use client-node 1.4.0.")
          PY
          git diff --check

  current-lockfile:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Checkout exact revision
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Scan current lockfile with reviewed exceptions
        id: scan
        continue-on-error: true
        uses: google/osv-scanner-action/osv-scanner-action@9a498708959aeaef5ef730655706c5a1df1edbc2 # v2.3.8
        with:
          scan-args: |-
            --config=osv-scanner.toml
            --format=json
            --output=osv-reviewed-results.json
            --lockfile=pnpm-lock.yaml

      - name: Create reviewed OSV report
        id: report
        continue-on-error: true
        uses: google/osv-scanner-action/osv-reporter-action@9a498708959aeaef5ef730655706c5a1df1edbc2 # v2.3.8
        with:
          scan-args: |-
            --output=osv-reviewed-results.sarif
            --new=osv-reviewed-results.json
            --gh-annotations=true
            --fail-on-vuln=true

      - name: Preserve reviewed OSV evidence
        if: always() && !cancelled()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: flowcordia-osv-reviewed-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            osv-reviewed-results.json
            osv-reviewed-results.sarif
          if-no-files-found: error
          retention-days: 14
          include-hidden-files: false

      - name: Enforce exception-aware scan
        if: always() && !cancelled()
        shell: bash
        env:
          SCAN_OUTCOME: ${{ steps.scan.outcome }}
          REPORT_OUTCOME: ${{ steps.report.outcome }}
        run: |
          if [ "$SCAN_OUTCOME" != "success" ] || [ "$REPORT_OUTCOME" != "success" ]; then
            echo "The lockfile contains vulnerabilities outside the reviewed, unexpired exceptions." >&2
            exit 1
          fi

  kubernetes-provider:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - name: Checkout exact revision
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5.0.0
        with:
          version: 10.33.2

      - name: Setup Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 20.20.2
          cache: pnpm

      - name: Install exact dependency graph
        run: pnpm install --frozen-lockfile

      - name: Build database types
        run: |
          pnpm --filter @trigger.dev/database generate
          pnpm --filter @trigger.dev/database build

      - name: Typecheck migrated Kubernetes provider
        run: pnpm --filter kubernetes-provider typecheck

  turbo2-compatibility:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - name: Checkout exact revision
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5.0.0
        with:
          version: 10.33.2

      - name: Setup Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 20.20.2
          cache: pnpm

      - name: Install exact Turbo 2 dependency graph
        run: pnpm install --frozen-lockfile

      - name: Validate Turbo 2 version and task graph
        shell: bash
        run: |
          set -euo pipefail
          test "$(pnpm exec turbo --version)" = "2.10.6"
          pnpm exec turbo run build --dry=json > /tmp/flowcordia-turbo2-build-graph.json
          test -s /tmp/flowcordia-turbo2-build-graph.json

      - name: Execute repository generation through Turbo 2
        run: pnpm generate
