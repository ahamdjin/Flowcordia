name: Studio V2 runtime parity source

on:
  pull_request:
    branches:
      - main
    types:
      - synchronize

permissions:
  contents: write

jobs:
  apply:
    if: github.event.pull_request.head.ref == 'agent/studio-v2-runtime-parity'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: agent/studio-v2-runtime-parity
          fetch-depth: 0
      - name: Apply durable Activepieces action semantics
        shell: python
        run: |
          from pathlib import Path

          activepieces = Path('packages/flowcordia-runtime/src/activepieces.ts')
          text = activepieces.read_text()
          old = '  serverPublicUrl?: string;\n  store?: FlowcordiaActivepiecesStoreService;'
          new = '  serverPublicUrl?: string;\n  executionType?: "BEGIN" | "RESUME";\n  resumePayload?: unknown;\n  awaitWaitpoint?(waitpointId: string): Promise<unknown>;\n  store?: FlowcordiaActivepiecesStoreService;'
          assert old in text
          text = text.replace(old, new, 1)
          marker = 'export interface FlowcordiaActivepiecesPropertyInteraction {'
          assert marker in text
          text = text.replace(marker, 'export class FlowcordiaActivepiecesWaitpointRequested extends Error {\n  constructor(readonly waitpointId: string) {\n    super(`Activepieces requested waitpoint ${waitpointId}.`);\n    this.name = "FlowcordiaActivepiecesWaitpointRequested";\n  }\n}\n\n' + marker, 1)
          old = '    waitForWaitpoint: (waitpointId: string) => {\n      if (!services.waitForWaitpoint) return unsupportedCapability("context.run.waitForWaitpoint");\n      return services.waitForWaitpoint(waitpointId);\n    },'
          new = '    waitForWaitpoint: (waitpointId: string) => {\n      if (services.waitForWaitpoint) return services.waitForWaitpoint(waitpointId);\n      throw new FlowcordiaActivepiecesWaitpointRequested(waitpointId);\n    },'
          assert old in text
          text = text.replace(old, new, 1)
          old = '}) {\n  return {\n    executionType: "BEGIN",\n    propsValue: input.propsValue,'
          new = '}) {\n  const executionType = input.services.executionType ?? "BEGIN";\n  return {\n    executionType,\n    ...(executionType === "RESUME" ? { resumePayload: input.services.resumePayload ?? {} } : {}),\n    propsValue: input.propsValue,'
          assert old in text
          activepieces.write_text(text.replace(old, new, 1))

          runtime = Path('packages/flowcordia-runtime/src/runtime.ts')
          text = runtime.read_text()
          old = 'import { executeFlowcordiaActivepiecesAction } from "./activepieces.js";'
          new = 'import {\n  FlowcordiaActivepiecesWaitpointRequested,\n  executeFlowcordiaActivepiecesAction,\n} from "./activepieces.js";'
          assert old in text
          text = text.replace(old, new, 1)
          start = text.index('      return executeFlowcordiaActivepiecesAction({', text.index('async activepieces('))
          end_marker = '      });\n    },\n    async subflow'
          end = text.index(end_marker, start)
          replacement = '''      let executionType = options.activepiecesRuntimeServices?.executionType ?? "BEGIN";
      let resumePayload = options.activepiecesRuntimeServices?.resumePayload;
      while (true) {
        try {
          return await executeFlowcordiaActivepiecesAction({
            node,
            configuration,
            workflowInput,
            outputs,
            services: {
              ...options.activepiecesRuntimeServices,
              loadPiece: options.loadActivepiecesPiece,
              resolveConnection: options.resolveActivepiecesConnection,
              formulaEvaluator: options.activepiecesFormulaEvaluator,
              projectId: options.activepiecesProjectId,
              projectExternalId: options.activepiecesProjectExternalId,
              runId: options.activepiecesRunId,
              serverApiUrl: options.activepiecesServerApiUrl,
              serverPublicUrl: options.activepiecesServerPublicUrl,
              executionType,
              resumePayload,
            },
          });
        } catch (error) {
          if (!(error instanceof FlowcordiaActivepiecesWaitpointRequested)) throw error;
          const awaitWaitpoint = options.activepiecesRuntimeServices?.awaitWaitpoint;
          if (!awaitWaitpoint) {
            throw new Error(
              `Activepieces requested waitpoint ${error.waitpointId}, but this Trigger.dev runtime has no durable waitpoint adapter.`
            );
          }
          resumePayload = await awaitWaitpoint(error.waitpointId);
          executionType = "RESUME";
        }
      }
    },
    async subflow'''
          runtime.write_text(text[:start] + replacement + text[end + len(end_marker):])
      - name: Verify patch
        run: git diff --check
      - name: Commit clean product tree
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/studio-v2-runtime-parity-patch.yml
          git rm .github/workflows/studio-v2-runtime-parity-run.yml
          git rm .github/workflows/studio-v2-runtime-parity-source.yml
          git rm -f .studio-v2-runtime-parity-kick || true
          git add packages/flowcordia-runtime/src/activepieces.ts packages/flowcordia-runtime/src/runtime.ts packages/flowcordia-runtime/src/types.ts packages/flowcordia-runtime/src/activepieces-runtime-parity.test.ts
          git commit -m "feat(studio-v2): add durable Activepieces action resume semantics"
          git push origin HEAD:agent/studio-v2-runtime-parity
