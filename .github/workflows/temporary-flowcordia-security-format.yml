name: Temporary Flowcordia security format artifact

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened

permissions:
  contents: read

jobs:
  format:
    if: github.head_ref == 'agent/flowcordia-production-auth-hardening'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact branch
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: agent/flowcordia-production-auth-hardening
          fetch-depth: 1
          persist-credentials: false
          show-progress: false

      - name: Setup pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320
        with:
          version: 10.33.2

      - name: Setup Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: 20.20.2
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Format security files
        shell: bash
        run: |
          set -euo pipefail
          pnpm exec oxfmt --write \
            .github/workflows/flowcordia-self-host-topology.yml \
            apps/webapp/app/env.server.ts \
            apps/webapp/app/features/flowcordia/operations/control-plane-secrets.ts \
            apps/webapp/app/features/flowcordia/operations/installation-preflight.ts \
            apps/webapp/app/models/orgIntegration.server.ts \
            apps/webapp/app/v3/services/worker/workerGroupTokenService.server.ts \
            apps/webapp/test/flowcordia/installationPreflight.test.ts \
            apps/webapp/test/flowcordia/productionControlPlaneSecurity.test.ts \
            apps/webapp/test/flowcordia/selfHostTopology.test.ts \
            flowcordia/runbooks/self-host-deployment.md \
            flowcordia/security/production-control-plane-authentication.md

      - name: Upload canonical files
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: flowcordia-security-formatted
          path: |
            .github/workflows/flowcordia-self-host-topology.yml
            apps/webapp/app/env.server.ts
            apps/webapp/app/features/flowcordia/operations/control-plane-secrets.ts
            apps/webapp/app/features/flowcordia/operations/installation-preflight.ts
            apps/webapp/app/models/orgIntegration.server.ts
            apps/webapp/app/v3/services/worker/workerGroupTokenService.server.ts
            apps/webapp/test/flowcordia/installationPreflight.test.ts
            apps/webapp/test/flowcordia/productionControlPlaneSecurity.test.ts
            apps/webapp/test/flowcordia/selfHostTopology.test.ts
            flowcordia/runbooks/self-host-deployment.md
            flowcordia/security/production-control-plane-authentication.md
          if-no-files-found: error
          retention-days: 1
