name: Studio V2 production upstream parity finalizer

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/studio-v2-production-upstream-parity-finalizer.yml

permissions:
  contents: write

jobs:
  patch:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: agent/studio-v2-activepieces-production-binding
      - name: Align lifecycle and scheduling with pinned upstream contracts
        shell: python
        run: |
          from pathlib import Path

          path = Path('apps/webapp/app/features/flowcordia/workflows/studio-v2/activepieces-production-binding.server.ts')
          text = path.read_text()

          old = '''function parseDescriptor(value: unknown): TriggerDescriptor {\n  if (\n    !isRecord(value) ||\n    typeof value.triggerType !== "string" ||\n    typeof value.testStrategy !== "string"\n  ) {\n    throw new Error("Activepieces returned an invalid trigger descriptor.");\n  }\n  return { triggerType: value.triggerType, testStrategy: value.testStrategy };\n}\n'''
          new = '''function parseDescriptor(value: unknown): TriggerDescriptor {\n  if (\n    !isRecord(value) ||\n    typeof value.triggerType !== "string" ||\n    !["MANUAL", "WEBHOOK", "POLLING", "APP_WEBHOOK"].includes(value.triggerType) ||\n    typeof value.testStrategy !== "string"\n  ) {\n    throw new Error("Activepieces returned an invalid trigger descriptor.");\n  }\n  return { triggerType: value.triggerType, testStrategy: value.testStrategy };\n}\n'''
          if old not in text:
              raise SystemExit('trigger descriptor anchor missing')
          text = text.replace(old, new, 1)

          start = text.index('function exactPollingCron(schedule: unknown): { cron: string; timezone: string } {')
          end = text.index('\nfunction exactRenewCron(', start)
          replacement = '''function exactPollingCron(schedule: unknown): { cron: string; timezone: string } {\n  if (!isRecord(schedule))\n    throw new Error("Activepieces polling trigger did not provide a schedule.");\n  if (typeof schedule.cronExpression === "string" && schedule.cronExpression.trim()) {\n    return {\n      cron: schedule.cronExpression.trim(),\n      timezone:\n        typeof schedule.timezone === "string" && schedule.timezone.trim()\n          ? schedule.timezone.trim()\n          : "UTC",\n    };\n  }\n  if (typeof schedule.intervalMs === "number") {\n    throw new Error(\n      "Activepieces interval polling cannot be represented exactly by Trigger.dev's cron-only schedule binding."\n    );\n  }\n  throw new Error(\n    "Activepieces polling schedule is not supported by the exact Trigger.dev schedule adapter."\n  );\n}\n'''
          text = text[:start] + replacement + text[end:]

          old = '''      "status" = 'PREPARING',\n      "failureMessage" = NULL,\n      "updatedAt" = EXCLUDED."updatedAt"\n'''
          new = '''      "status" = 'PREPARING',\n      "failureMessage" = NULL,\n      "createdByUserId" = EXCLUDED."createdByUserId",\n      "updatedAt" = EXCLUDED."updatedAt"\n'''
          if old not in text:
              raise SystemExit('binding reactivation actor anchor missing')
          text = text.replace(old, new, 1)

          start = text.index('async function disablePreviousBinding(previous: BindingRow): Promise<void> {')
          end = text.index('\nexport async function ensureStudioV2ActivepiecesProductionBinding(', start)
          replacement = '''async function disablePreviousBinding(previous: BindingRow): Promise<void> {\n  const previousWebhookUrl =\n    previous.triggerType === "APP_WEBHOOK" ? previous.appWebhookUrl : previous.webhookUrl;\n  await executeStudioV2ActivepiecesInteraction({\n    projectId: previous.projectId,\n    environmentId: previous.runtimeEnvironmentId,\n    actorId: previous.createdByUserId,\n    pieceName: previous.pieceName,\n    pieceVersion: previous.pieceVersion,\n    payload: {\n      kind: "trigger_disable",\n      interaction: {\n        pieceName: previous.pieceName,\n        triggerName: previous.triggerName,\n        flowId: previous.workflowId,\n        input: previous.input,\n        ...(previousWebhookUrl ? { webhookUrl: previousWebhookUrl } : {}),\n      },\n    },\n  }).catch(() => undefined);\n\n  if (previous.scheduleFriendlyId) {\n    await new DeleteTaskScheduleService().call({\n      projectId: previous.projectId,\n      userId: previous.createdByUserId,\n      friendlyId: previous.scheduleFriendlyId,\n    });\n  }\n  await prisma.$transaction(async (tx) => {\n    await tx.$executeRaw(Prisma.sql`\n      DELETE FROM "FlowcordiaActivepiecesProductionAppEventListener"\n      WHERE "releasePublicId" = ${previous.releasePublicId}\n    `);\n    await tx.$executeRaw(Prisma.sql`\n      UPDATE "FlowcordiaActivepiecesProductionBinding"\n      SET "status" = 'REPLACED', "updatedAt" = ${new Date()}\n      WHERE "releasePublicId" = ${previous.releasePublicId}\n    `);\n  });\n}\n'''
          text = text[:start] + replacement + text[end:]
          path.write_text(text)
      - name: Format production binding service
        shell: bash
        run: |
          npx --yes oxfmt@0.54.0 \
            apps/webapp/app/features/flowcordia/workflows/studio-v2/activepieces-production-binding.server.ts
          rm -f .github/workflows/studio-v2-production-upstream-parity-finalizer.yml
      - name: Commit upstream parity corrections
        shell: bash
        run: |
          git config user.name 'flowcordia-studio-v2-bot'
          git config user.email 'flowcordia-studio-v2-bot@users.noreply.github.com'
          git add -A
          git commit -m 'fix(studio-v2): match pinned Activepieces trigger lifecycle exactly'
          git push origin HEAD:agent/studio-v2-activepieces-production-binding
