name: Verify Studio V2 Activepieces bridge

on:
  push:
    branches:
      - agent/studio-v2-activepieces-frontend
    paths:
      - .github/workflows/studio-v2-activepieces-bridge-verify.yml

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/studio-v2-activepieces-frontend
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.2
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Verify bridge and genuine frontend
        shell: bash
        run: |
          set +e
          set -o pipefail
          {
            set -euo pipefail
            pnpm install --no-frozen-lockfile --config.minimum-release-age=0
            pnpm --filter @flowcordia/studio-activepieces typecheck
            pnpm --filter @flowcordia/studio-activepieces test
            pnpm --filter @flowcordia/studio-activepieces build
          } 2>&1 | tee /tmp/flowcordia-activepieces-bridge.log
          status=${PIPESTATUS[0]}

          git config user.name "Flowcordia Studio Agent"
          git config user.email "actions@users.noreply.github.com"
          mkdir -p .flowcordia/automation
          if [ "$status" -eq 0 ]; then
            printf 'status: passed\n' > .flowcordia/automation/studio-v2-activepieces-bridge.txt
            git add pnpm-lock.yaml .flowcordia/automation/studio-v2-activepieces-bridge.txt
            git commit -m "Verify Flowcordia Activepieces workflow bridge" || true
          else
            { printf 'status: failed\n\n'; tail -n 260 /tmp/flowcordia-activepieces-bridge.log; } > .flowcordia/automation/studio-v2-activepieces-bridge.txt
            git add .flowcordia/automation/studio-v2-activepieces-bridge.txt
            git commit -m "Record Flowcordia Activepieces bridge failure" || true
          fi
          git pull --rebase origin agent/studio-v2-activepieces-frontend
          git push origin HEAD:agent/studio-v2-activepieces-frontend
          exit "$status"
