name: Password auth diagnostic

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  diagnostic:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320
        with:
          version: 10.33.2

      - name: Setup Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: 20.20.2
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm run generate

      - name: Format and capture diagnostics
        shell: bash
        run: |
          set +e
          pnpm exec oxfmt \
            apps/webapp/app/services/passwordRateLimiter.server.ts \
            apps/webapp/test/passwordHash.server.test.ts

          mkdir -p formatted/apps/webapp/app/services formatted/apps/webapp/test
          cp apps/webapp/app/services/passwordRateLimiter.server.ts \
            formatted/apps/webapp/app/services/passwordRateLimiter.server.ts
          cp apps/webapp/test/passwordHash.server.test.ts \
            formatted/apps/webapp/test/passwordHash.server.test.ts

          pnpm exec oxfmt --check \
            apps/webapp/app/routes/account.security/route.tsx \
            apps/webapp/app/routes/login._index/route.tsx \
            apps/webapp/app/routes/login.password/route.tsx \
            apps/webapp/app/services/lastAuthMethod.server.ts \
            apps/webapp/app/services/passwordAuth.server.ts \
            apps/webapp/app/services/passwordHash.server.ts \
            apps/webapp/app/services/passwordRateLimiter.server.ts \
            apps/webapp/test/passwordHash.server.test.ts \
            > password-auth-format.log 2>&1
          echo "format_exit=$?" > password-auth-status.txt

          NODE_OPTIONS=--max-old-space-size=8192 pnpm --filter webapp typecheck \
            > password-auth-typecheck.log 2>&1
          echo "typecheck_exit=$?" >> password-auth-status.txt

          pnpm --filter webapp test -- --run test/passwordHash.server.test.ts \
            > password-auth-test.log 2>&1
          echo "test_exit=$?" >> password-auth-status.txt
          exit 0

      - name: Upload diagnostics
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: password-auth-diagnostics-formatted
          path: |
            formatted
            password-auth-format.log
            password-auth-typecheck.log
            password-auth-test.log
            password-auth-status.txt
          retention-days: 1
