name: Flowcordia temporary Kubernetes API diagnostic

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/flowcordia-kubernetes-api-diagnostic.yml"

permissions: {}

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Checkout exact branch
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 20.20.2

      - name: Extract official package signatures
        shell: bash
        run: |
          set -euo pipefail
          output="$RUNNER_TEMP/kubernetes-api"
          mkdir -p "$output/package"
          npm pack @kubernetes/client-node@1.4.0 --pack-destination "$output" > "$output/npm-pack.stdout"
          tarball="$(find "$output" -maxdepth 1 -name '*.tgz' -print -quit)"
          tar -xzf "$tarball" -C "$output/package"
          {
            grep -R -n -E "(createNamespacedPod|deleteNamespacedPod|readNamespacedPod|createNamespacedJob|createNamespacedDaemonSet|deleteCollectionNamespacedPod|deleteCollectionNamespacedDaemonSet|listNamespacedPod|readNamespacedPodLog)" "$output/package/package/dist" --include='*.d.ts' || true
            grep -R -n -E "(makeInformer|watch\()" "$output/package/package/dist" --include='*.d.ts' || true
          } > "$output/signatures.txt"

      - name: Upload API signatures
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: flowcordia-kubernetes-api-${{ github.run_id }}
          path: ${{ runner.temp }}/kubernetes-api
          if-no-files-found: error
          retention-days: 2
          include-hidden-files: false
