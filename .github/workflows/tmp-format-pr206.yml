name: Temporary format PR 206

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/studio-v2-activepieces-trigger-runtime
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.2
      - uses: actions/setup-node@v4
        with:
          node-version: 20.20.2
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec oxfmt packages/flowcordia-runtime/src/activepieces.ts packages/flowcordia-runtime/src/compiler.ts
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if ! git diff --quiet; then
            git add packages/flowcordia-runtime/src/activepieces.ts packages/flowcordia-runtime/src/compiler.ts
            git commit -m "style(runtime): format Activepieces execution adapter"
            git push
          fi
