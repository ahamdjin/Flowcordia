name: GitHub onboarding formatting

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  format:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.head_ref == 'agent/self-host-github-onboarding'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout onboarding branch
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: agent/self-host-github-onboarding

      - name: Setup pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320
        with:
          version: 10.33.2

      - name: Setup Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: 20.20.2
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Format and materialize onboarding sources
        run: |
          set -euo pipefail
          pnpm exec oxfmt --write \
            apps/webapp/app/features/flowcordia/setup/githubOnboarding.server.ts \
            apps/webapp/app/routes/setup.github/route.tsx \
            apps/webapp/test/githubOnboarding.server.test.ts
          git rm .github/workflows/github-onboarding-format.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            apps/webapp/app/features/flowcordia/setup/githubOnboarding.server.ts \
            apps/webapp/app/routes/setup.github/route.tsx \
            apps/webapp/test/githubOnboarding.server.test.ts
          git commit -m "Format GitHub onboarding sources"
          git push origin HEAD:agent/self-host-github-onboarding
