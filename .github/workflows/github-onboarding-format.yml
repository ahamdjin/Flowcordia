name: GitHub onboarding formatting

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  format:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.head_ref == 'agent/self-host-github-onboarding'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320
        with:
          version: 10.33.2

      - name: Setup Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: 20.20.2
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Format onboarding sources
        run: |
          pnpm exec oxfmt --write \
            apps/webapp/app/features/flowcordia/setup/githubOnboarding.server.ts \
            apps/webapp/app/routes/setup.github/route.tsx \
            apps/webapp/test/githubOnboarding.server.test.ts

      - name: Upload formatted sources
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: github-onboarding-formatted
          path: |
            apps/webapp/app/features/flowcordia/setup/githubOnboarding.server.ts
            apps/webapp/app/routes/setup.github/route.tsx
            apps/webapp/test/githubOnboarding.server.test.ts
          retention-days: 1
