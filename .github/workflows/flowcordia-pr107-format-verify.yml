name: Diagnose PR 107 E2E harness formatting

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened

permissions:
  contents: read

concurrency:
  group: flowcordia-pr107-format-verify
  cancel-in-progress: true

jobs:
  diagnose:
    if: github.head_ref == 'agent/flowcordia-production-auth-hardening'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout security branch
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: agent/flowcordia-production-auth-hardening
          fetch-depth: 1
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5.0.0
        with:
          version: 10.33.2

      - name: Setup Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 20.20.2
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Capture formatter output
        id: format
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          pnpm exec oxfmt --write \
            internal-packages/testcontainers/src/webapp.ts \
            apps/webapp/test/flowcordia/productionControlPlaneSecurity.test.ts \
            > "$RUNNER_TEMP/flowcordia-pr107-format.log" 2>&1

      - name: Upload formatter diagnostic
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: flowcordia-pr107-format-diagnostic
          path: ${{ runner.temp }}/flowcordia-pr107-format.log
          if-no-files-found: error
          retention-days: 1

      - name: Require formatter success
        if: steps.format.outcome != 'success'
        run: exit 1
