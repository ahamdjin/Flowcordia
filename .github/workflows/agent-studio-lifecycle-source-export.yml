name: Export Studio lifecycle redesign sources

on:
  push:
    branches:
      - agent/studio-uiui-lifecycle-workbench
    paths:
      - ".github/workflows/agent-studio-lifecycle-source-export.yml"
  pull_request:
    branches:
      - main
    paths:
      - ".github/workflows/agent-studio-lifecycle-source-export.yml"

permissions: {}

concurrency:
  group: agent-studio-lifecycle-source-export-${{ github.ref }}
  cancel-in-progress: true

jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Checkout exact Flowcordia revision
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
          fetch-depth: 1

      - name: Fetch UIUI reference repository read-only
        run: git clone --depth 1 https://github.com/ahamdjin/flowcordia-ui.git "$RUNNER_TEMP/flowcordia-ui"

      - name: Assemble bounded lifecycle source archive
        shell: bash
        run: |
          set -euo pipefail
          stage="$RUNNER_TEMP/studio-lifecycle-sources"
          mkdir -p "$stage/flowcordia/route" "$stage/flowcordia/studio" "$stage/flowcordia/tests" "$stage/uiui"
          cp 'apps/webapp/app/routes/_app.orgs.$organizationSlug.projects.$projectParam.env.$envParam.flowcordia.workflows/route.tsx' "$stage/flowcordia/route/route.tsx"
          cp apps/webapp/app/features/flowcordia/workflows/studio/WorkflowLifecycleRail.tsx "$stage/flowcordia/studio/"
          cp apps/webapp/app/features/flowcordia/workflows/studio/WorkflowStudioTestingPanel.tsx "$stage/flowcordia/studio/"
          cp apps/webapp/app/features/flowcordia/workflows/studio/WorkflowFunctionTestPanel.tsx "$stage/flowcordia/studio/"
          cp apps/webapp/app/features/flowcordia/workflows/studio/WorkflowSourceWorkspace.tsx "$stage/flowcordia/studio/"
          find apps/webapp/test/flowcordia -maxdepth 1 -type f \( -iname '*lifecycle*' -o -iname '*studio*' -o -iname '*workflow*' \) -print0 | xargs -0 -r cp -t "$stage/flowcordia/tests"
          cp apps/webapp/package.json "$stage/flowcordia/webapp-package.json"
          cp package.json "$stage/flowcordia/root-package.json"
          cp pnpm-lock.yaml "$stage/flowcordia/pnpm-lock.yaml"
          cp -R "$RUNNER_TEMP/flowcordia-ui/src" "$stage/uiui/src"
          cp "$RUNNER_TEMP/flowcordia-ui/package.json" "$stage/uiui/package.json"
          tar -C "$stage" -czf "$RUNNER_TEMP/studio-lifecycle-sources.tgz" .

      - name: Upload exact lifecycle redesign sources
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: studio-lifecycle-sources-${{ github.run_id }}
          path: ${{ runner.temp }}/studio-lifecycle-sources.tgz
          if-no-files-found: error
          retention-days: 1
          include-hidden-files: false
