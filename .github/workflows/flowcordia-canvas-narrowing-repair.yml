name: Flowcordia canvas temporary narrowing repair

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/flowcordia-canvas-narrowing-repair.yml"

permissions:
  contents: write

jobs:
  repair:
    if: github.event.pull_request.head.ref == 'agent/flowcordia-beta-canvas-evidence'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact branch
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: agent/flowcordia-beta-canvas-evidence
          fetch-depth: 1
          persist-credentials: true

      - name: Apply exact narrowing repair and remove helper
        shell: bash
        run: |
          set -euo pipefail
          python <<'PY'
          from pathlib import Path

          path = Path("apps/webapp/app/features/flowcordia/acceptance/canvas-manual-acceptance.ts")
          source = path.read_text()
          replacements = {
              '''  if (!Array.isArray(raw.sessions) || raw.sessions.length !== 3) {
              throw new Error("The required browser and assistive-technology matrix is incomplete.");
            }
            const sessions = Object.entries(SESSION_REQUIREMENTS).map(([id, requirement]) => {
              const matching = raw.sessions.find((entry) => object(entry, "Session").id === id);''': '''  const rawSessions = raw.sessions;
            if (!Array.isArray(rawSessions) || rawSessions.length !== 3) {
              throw new Error("The required browser and assistive-technology matrix is incomplete.");
            }
            const sessions = Object.entries(SESSION_REQUIREMENTS).map(([id, requirement]) => {
              const matching = rawSessions.find(
                (entry: unknown) => object(entry, "Session").id === id
              );''',
              '''  if (!Array.isArray(raw.viewports) || raw.viewports.length !== 4) {
              throw new Error("The required low-resolution and touch matrix is incomplete.");
            }
            const viewports = Object.entries(VIEWPORT_REQUIREMENTS).map(([id, requirement]) => {
              const matching = raw.viewports.find((entry) => object(entry, "Viewport").id === id);''': '''  const rawViewports = raw.viewports;
            if (!Array.isArray(rawViewports) || rawViewports.length !== 4) {
              throw new Error("The required low-resolution and touch matrix is incomplete.");
            }
            const viewports = Object.entries(VIEWPORT_REQUIREMENTS).map(([id, requirement]) => {
              const matching = rawViewports.find(
                (entry: unknown) => object(entry, "Viewport").id === id
              );''',
              '''  if (!Array.isArray(raw.measurements) || raw.measurements.length !== 2) {
              throw new Error("Both production and stress graph measurements are required.");
            }
            const measurements = (["production_70", "stress_300"] as const).map((graph) => {
              const matching = raw.measurements.find((entry) => object(entry, "Measurement").graph === graph);''': '''  const rawMeasurements = raw.measurements;
            if (!Array.isArray(rawMeasurements) || rawMeasurements.length !== 2) {
              throw new Error("Both production and stress graph measurements are required.");
            }
            const measurements = (["production_70", "stress_300"] as const).map((graph) => {
              const matching = rawMeasurements.find(
                (entry: unknown) => object(entry, "Measurement").graph === graph
              );''',
          }
          for old, new in replacements.items():
              if old not in source:
                  raise SystemExit("Expected narrowing source block is unavailable.")
              source = source.replace(old, new, 1)
          path.write_text(source)
          PY
          rm .github/workflows/flowcordia-canvas-narrowing-repair.yml
          git diff --check
          git config user.name "flowcordia-ci"
          git config user.email "flowcordia-ci@users.noreply.github.com"
          git add \
            apps/webapp/app/features/flowcordia/acceptance/canvas-manual-acceptance.ts \
            .github/workflows/flowcordia-canvas-narrowing-repair.yml
          git commit -m "Fix canvas manual evidence narrowing"
          git push origin HEAD:agent/flowcordia-beta-canvas-evidence
