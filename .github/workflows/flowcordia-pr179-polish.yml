name: Flowcordia PR 179 onboarding polish

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/flowcordia-pr179-polish.yml"
      - "apps/webapp/app/features/flowcordia/setup/firstOwner.server.ts"
      - "apps/webapp/app/routes/setup.owner/route.tsx"
      - "apps/webapp/app/routes/setup.first-run/route.tsx"
      - "apps/webapp/test/firstOwner.server.test.ts"
      - "apps/webapp/test/selfHostFirstRunSimplification.test.ts"
      - "docker/scripts/generate-flowcordia-bundled-secrets.sh"

permissions:
  contents: write

jobs:
  polish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout branch
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: agent/remove-owner-code-polish-onboarding

      - name: Setup pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5.0.0
        with:
          version: 10.33.2

      - name: Setup Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 20.20.2
          cache: pnpm

      - name: Apply bounded product changes
        run: |
          node <<'NODE'
          const fs = require("node:fs");

          function replaceExact(source, before, after, label) {
            if (!source.includes(before)) throw new Error(`Missing ${label}`);
            return source.replace(before, after);
          }

          const generatorPath = "docker/scripts/generate-flowcordia-bundled-secrets.sh";
          let generator = fs.readFileSync(generatorPath, "utf8");
          generator = replaceExact(generator, 'setup_token="$(random_hex 32)"\n', "", "setup token generation");
          generator = replaceExact(
            generator,
            "FLOWCORDIA_SETUP_TOKEN=$setup_token\n",
            "",
            "setup token output"
          );
          fs.writeFileSync(generatorPath, generator);

          const firstRunPath = "apps/webapp/app/routes/setup.first-run/route.tsx";
          let firstRun = fs.readFileSync(firstRunPath, "utf8");
          firstRun = replaceExact(
            firstRun,
            '    <main className="mx-auto flex min-h-screen w-full max-w-3xl flex-col gap-7 p-6 md:p-10">',
            '    <main className="min-h-screen bg-background-dimmed px-4 py-8 sm:px-6 md:py-12">\n      <div className="mx-auto flex w-full max-w-3xl flex-col gap-6 rounded-2xl border border-grid-bright bg-background-bright p-6 shadow-xl shadow-black/10 md:p-8">',
            "first-run shell"
          );
          firstRun = replaceExact(
            firstRun,
            `      <div>\n        <p className="text-sm font-medium uppercase tracking-wide text-indigo-300">\n          First-time setup\n        </p>\n        <Header1 className="mt-2">Get Flowcordia ready</Header1>\n        <Paragraph variant="base" className="mt-3 max-w-2xl">\n          Flowcordia created your workspace and project automatically. Finish the GitHub connection,\n          choose a repository, and continue directly to Studio.\n        </Paragraph>\n      </div>`,
            `      <div className="text-center">\n        <p className="text-xs font-medium uppercase tracking-[0.18em] text-indigo-300">\n          First-time setup\n        </p>\n        <Header1 className="mt-2">Connect Flowcordia to GitHub</Header1>\n        <Paragraph variant="base" className="mx-auto mt-3 max-w-xl">\n          Your workspace is ready. Connect GitHub, choose a repository, and Flowcordia will prepare\n          Studio automatically.\n        </Paragraph>\n      </div>`,
            "first-run heading"
          );
          firstRun = replaceExact(
            firstRun,
            '<section className="grid gap-3 sm:grid-cols-4">',
            '<section className="grid overflow-hidden rounded-xl border border-grid-bright bg-background-dimmed sm:grid-cols-4">',
            "progress shell"
          );
          firstRun = replaceExact(
            firstRun,
            'className="rounded-lg border border-grid-bright bg-background-bright p-4"',
            'className="border-b border-grid-bright bg-background-dimmed p-4 last:border-b-0 sm:border-b-0 sm:border-r sm:last:border-r-0"',
            "progress item"
          );
          firstRun = firstRun.replaceAll(
            'rounded-lg border border-grid-bright bg-background-bright p-5',
            'rounded-xl border border-grid-bright bg-background-dimmed p-5 shadow-sm'
          );
          firstRun = firstRun.replaceAll(
            'rounded-lg border border-amber-500/30 bg-amber-500/10 p-5',
            'rounded-xl border border-amber-500/30 bg-amber-500/10 p-5'
          );
          firstRun = firstRun.replaceAll(
            'rounded-lg border border-indigo-500/30 bg-indigo-500/10 p-5',
            'rounded-xl border border-indigo-500/30 bg-indigo-500/10 p-5'
          );
          firstRun = firstRun.replaceAll(
            'rounded-lg border border-red-500/30 bg-red-500/10 p-4',
            'rounded-xl border border-red-500/30 bg-red-500/10 p-4'
          );
          firstRun = replaceExact(
            firstRun,
            'className="mt-2 w-full rounded border border-grid-bright bg-background-dimmed px-3 py-2 text-sm text-text-bright"',
            'className="mt-2 h-11 w-full rounded-lg border border-grid-bright bg-background-bright px-3 text-sm text-text-bright focus-custom"',
            "repository selector"
          );
          const closing = "    </main>\n  );\n}";
          if (!firstRun.endsWith(closing)) throw new Error("Missing first-run closing shell");
          firstRun = firstRun.slice(0, -closing.length) + "      </div>\n    </main>\n  );\n}";
          fs.writeFileSync(firstRunPath, firstRun);
          NODE

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Format onboarding TypeScript
        run: |
          pnpm exec oxfmt \
            apps/webapp/app/features/flowcordia/setup/firstOwner.server.ts \
            apps/webapp/app/routes/setup.owner/route.tsx \
            apps/webapp/app/routes/setup.first-run/route.tsx \
            apps/webapp/test/firstOwner.server.test.ts \
            apps/webapp/test/selfHostFirstRunSimplification.test.ts

      - name: Validate bounded changes
        run: |
          bash -n docker/scripts/generate-flowcordia-bundled-secrets.sh
          pnpm --filter webapp exec vitest run \
            test/firstOwner.server.test.ts \
            test/selfHostFirstRunSimplification.test.ts

      - name: Commit exact output
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- \
            apps/webapp/app/features/flowcordia/setup/firstOwner.server.ts \
            apps/webapp/app/routes/setup.owner/route.tsx \
            apps/webapp/app/routes/setup.first-run/route.tsx \
            apps/webapp/test/firstOwner.server.test.ts \
            apps/webapp/test/selfHostFirstRunSimplification.test.ts \
            docker/scripts/generate-flowcordia-bundled-secrets.sh; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            apps/webapp/app/features/flowcordia/setup/firstOwner.server.ts \
            apps/webapp/app/routes/setup.owner/route.tsx \
            apps/webapp/app/routes/setup.first-run/route.tsx \
            apps/webapp/test/firstOwner.server.test.ts \
            apps/webapp/test/selfHostFirstRunSimplification.test.ts \
            docker/scripts/generate-flowcordia-bundled-secrets.sh
          git commit -m "Polish code-free self-host onboarding"
          git push origin HEAD:agent/remove-owner-code-polish-onboarding
